`.trim().split(/\s+/).filter(Boolean).map(w => w.toLowerCase()));

// Correções forçadas (palavra inteira, minúscula) — baseadas no XML real da página de teste
const OCR_FORCED = {
  // f/t
  'esfou': 'estou', 'fenho': 'tenho', 'femos': 'temos', 'fem': 'tem',
  'fempo': 'tempo', 'empo': 'tempo', 'firarei': 'tirarei', 'ferei': 'terei',
  'ferá': 'terá', 'fera': 'terá', 'fara': 'fará', 'parfir': 'partir',
  'mafando': 'matando', 'anfes': 'antes',
  // mut*
  'mufando': 'mutando', 'mufação': 'mutação', 'mufacao': 'mutação',
  'mufante': 'mutante', 'mufantes': 'mutantes',
  'murantes': 'mutantes', 'murante': 'mutante',
  // outros f/t / n/u
  'lufar': 'lutar', 'lufarei': 'lutarei', 'oufros': 'outros', 'oufra': 'outra',
  'outra.': 'outra.', 'forne': 'torne', 'permifa': 'permita', 'permila': 'permita',
  'desfa': 'desta', 'rne': 'me', 'lsso': 'isso', 'sso': 'isso',
  'propis': 'própria', 'especialisfa': 'especialista',
  'suporfar': 'suportar', 'aconfeceu': 'aconteceu',
  'rompera': 'romperá', 'cerebro': 'cérebro',
  'vitima': 'vítima', 'porfavor': 'por favor',
  // nomes / restos
  'enry': 'henry', 'mccoy': 'McCoy',
};

// Lixo típico de OCR em balões pequenos / SFX
const OCR_GARBAGE = /^(cYlowb?|Ohtnee|2|7s)$/i;

function ocrWordCandidates(word){
  const out = new Set([word]);
  for(let i = 0; i < word.length; i++){
    const ch = word[i];
    for(const [a,b] of OCR_CONFUSIONS){
      if(a.length === 1 && ch === a){
        out.add(word.slice(0,i) + b + word.slice(i+1));
      }
    }
  }
  if(word.toLowerCase().includes('rn')) out.add(word.replace(/rn/gi, 'm'));
  // padrões f→t em sufixos comuns de PT
  const low = word.toLowerCase();
  if(/fando$/.test(low)) out.add(word.slice(0,-5) + (word.slice(-5,-4) === word.slice(-5,-4).toUpperCase() ? 'Tando' : 'tando'));
  if(/fir/.test(low)) out.add(word.replace(/fir/gi, m => m[0] === 'F' ? 'Tir' : 'tir'));
  if(/muf/.test(low)) out.add(word.replace(/muf/gi, m => m[0] === 'M' ? 'Mut' : 'mut'));
  if(/murant/.test(low)) out.add(word.replace(/murant/gi, m => m[0] === 'M' ? 'Mutant' : 'mutant'));
  return [...out];
}

function scorePtWord(w){
  const lw = w.toLowerCase().normalize('NFC');
  if(!lw) return -1;
  if(OCR_GARBAGE.test(lw)) return -50;
  if(PT_BALLOON_WORDS.has(lw)) return 100;
  if(OCR_FORCED[lw]) return 90;
  if(/^[a-zà-ü]+$/i.test(lw) && lw.length >= 3) return 10;
  if(/^[a-zà-ü]+$/i.test(lw)) return 5;
  return 0;
}

function applyCaseLike(sample, replacement){
  if(!replacement) return replacement;
  if(!sample) return replacement;
  if(sample === sample.toUpperCase() && sample.length > 1) return replacement.toUpperCase();
  if(sample[0] === sample[0].toUpperCase()){
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement;
}

function correctOcrText(text){
  if(!text) return text;

  // 1) correções de frase inteira / padrões multi-palavra
  let t = text
    .replace(/\bEsfou\s+mufando\b/gi, 'Estou mutando')
    .replace(/\bE\s+isso\s+está\s+me\s+mafando\b/gi, 'E isso está me matando')
    .replace(/\bestá\s+rne\s+matando\b/gi, 'está me matando')
    .replace(/\brne\s+matando\b/gi, 'me matando')
    .replace(/\bDesfa\s+vez\b/gi, 'Desta vez')
    .replace(/\bMas\s+Desfa\s+vez\b/gi, 'Mas desta vez')
    .replace(/\bmais\s+na[_\s]+geração\b/gi, 'mais uma geração')
    .replace(/\bmufantes\b/gi, 'mutantes')
    .replace(/\bD\s+HENRY\b/gi, 'HENRY')
    .replace(/\bOutra\.MoeOPme\b/gi, 'Outra.')
    .replace(/\bSIM,\s*ORORO\.l\b/gi, 'SIM, ORORO.')
    .replace(/\bgeração\s+seguinte\s+de\s+murantes\b/gi, 'geração seguinte de mutantes')
    .replace(/\bNão\s+firarei\b/gi, 'Não tirarei')
    .replace(/\bantes\s+de\s+parfir\b/gi, 'antes de partir')
    .replace(/\bNão\s+tenho\s+muito\s+empo\b/gi, 'Não tenho muito tempo')
    .replace(/\bferei\s+que\s+lutar\b/gi, 'terei que lutar')
    .replace(/\bD\s*ENRY\.?/gi, 'HENRY.')
    .replace(/\bSIM,\s*ORORO\.?\s*(cYlowb?)?/gi, 'SIM, ORORO.')
    .replace(/\bESTOU\s+OUVINDO\.?\s*2\b/gi, 'ESTOU OUVINDO.')
    .replace(/\b7s\s+VOC\b/gi, 'VOCÊ')
    .replace(/\bVOC\s+VAI\b/gi, 'VOCÊ VAI')
    .replace(/\bOufra\.?\s*(Ohtnee)?/gi, 'Outra.')
    .replace(/\bsso\s+já\b/gi, 'Isso já')
    .replace(/\s+e\s*$/g, '') // sobra de OCR no fim
    .replace(/\s{2,}/g, ' ')
    .trim();

  // 2) palavra a palavra
  t = t.split(/(\s+)/).map(token => {
    if(/^\s+$/.test(token)) return token;
    const m = token.match(/^([^a-zA-Zà-üÀ-Ü]*)(.*?)([^a-zA-Zà-üÀ-Ü]*)$/);
    if(!m) return token;
    let [, pre, core, post] = m;
    if(!core || core.length < 2) return token;

    // remove lixo puro
    if(OCR_GARBAGE.test(core)) return pre + post;

    const low = core.toLowerCase();
    if(OCR_FORCED[low] !== undefined){
      return pre + applyCaseLike(core, OCR_FORCED[low]) + post;
    }

    const candidates = ocrWordCandidates(core);
    let best = core, bestScore = scorePtWord(core);
    for(const c of candidates){
      const s = scorePtWord(c);
      if(s > bestScore){ bestScore = s; best = c; }
    }

    // se ainda fraco, tenta trocar todos os f→t
    if(bestScore < 50){
      const tryT = core.replace(/f/g, 't').replace(/F/g, 'T');
      if(scorePtWord(tryT) > bestScore){ best = tryT; bestScore = scorePtWord(tryT); }
    }

    return pre + best + post;
  }).join('');

  return t.replace(/\s+/g, ' ').replace(/\s+([.,!?;:])/g, '$1').trim();
}

async function ocrBalloon(b){
  try{
    const needLoad = !ppocrSessionPromise;
    if(needLoad) toastProgress('Carregando modelo OCR (PP-OCRv5)…');
    const session = await getPpocrSession();
    toastProgress('Reconhecendo texto do balão…');
    await new Promise(r => setTimeout(r, 30));

    const img = $('#pageImg');
    if(!img || !img.naturalWidth){
      toast('Imagem da página ainda não carregou.', 4000);
      return null;
    }

    const area = (b.w || 0) * (b.h || 0);
    const inputName = session.inputNames[0];
    const outName = session.outputNames[0];

    function cropIsDark(ln){
      try{
        const c = document.createElement('canvas');
        const w = Math.min(80, Math.max(8, ln.w|0));
        const h = Math.min(80, Math.max(8, ln.h|0));
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.drawImage(ln.canvas, ln.x, ln.y, ln.w, ln.h, 0, 0, w, h);
        const d = cx.getImageData(0,0,w,h).data;
        let sum = 0, n = w*h;
        for(let i=0;i<d.length;i+=4) sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        return (sum/n) < 120;
      }catch(e){ return false; }
    }

    function scoreText(t){
      if(!t) return -100;
      const raw = t.replace(/\s+/g, ' ').trim();
      if(!raw) return -100;
      const words = raw.toLowerCase().normalize('NFC').split(/\s+/).filter(Boolean);
      let hits = 0, letters = 0, garbage = 0;
      for(const w of words){
        const clean = w.replace(/[^a-zà-ü]/gi,'');
        letters += clean.length;
        if(clean.length >= 3 && (PT_BALLOON_WORDS.has(clean) || OCR_FORCED[clean])) hits += 3;
        else if(clean.length >= 3 && /^[a-zà-ü]+$/i.test(clean)) hits += 0.8;
        else if(clean.length === 1) hits -= 0.3;
        if(/[0-9]{2,}/.test(w) || /cY|Ylow|Ohtnee|MoeOP|cYalow/i.test(w)) garbage += 4;
        if(/^[|/\\~^`<>[\]{}*_=]+$/.test(w)) garbage += 3;
        if(/[^a-zà-ü0-9.,!?;:'"\-—–()\s]/i.test(w)) garbage += 0.5;
      }
      const lenBonus = Math.min(raw.length, 80) * 0.35;
      const wordBonus = Math.min(words.length, 12) * 1.2;
      return hits * 2.5 + lenBonus + wordBonus - garbage * 5;
    }

    function stripPhantom(t){
      if(!t) return '';
      let s = t.replace(/\s+/g, ' ').trim();
      // prefixos tipicos de borda/rabo do balao
      s = s.replace(/^(cYalowb?l?|Ohtnee|MoeOPme)\s*/i, '');
      s = s.replace(/^[\s|/\\~^`<>[\]{}*_=\-]+/, '');
      s = s.replace(/^([ZYXVW0-9]|ys|zs|2\/|•2\/?|M\s*o,)\s+/i, '');
      s = s.replace(/^([ZYXVW])\s+/i, '');
      // tokens so de simbolos
      s = s.split(/\s+/).filter(w=>{
        const core = w.replace(/[^a-zà-ü0-9]/gi,'');
        if(!core && /^[|/\\~^`<>[\]{}*_=\-0-9]{1,3}$/.test(w)) return false;
        if(/^cY/i.test(w)) return false;
        return true;
      }).join(' ');
      s = s.replace(/\s+([.,!?;:])/g, '$1').trim();
      return s;
    }

    async function runOne(ln, mode, label){
      toastProgress(label);
      await new Promise(r => setTimeout(r, 6));
      // tenta com e sem tight — fica com o melhor na bestForCrop via score
      const tight = tightInkCrop(ln.canvas, ln.x, ln.y, ln.w, ln.h);
      const tensor = preprocessLineForPpocr(ln.canvas, tight.x, tight.y, tight.w, tight.h, mode);
      const results = await session.run({ [inputName]: tensor });
      const out = results[outName];
      const dims = out.dims ? Array.from(out.dims) : [];
      return stripPhantom(decodePpocrOutput(out.data, dims));
    }

    async function bestForCrop(ln, tag, forceAllModes){
      const dark = cropIsDark(ln);
      const modes = dark ? ['invert', 'normal', 'contrast'] : ['normal', 'contrast', 'invert'];
      let best = '', bestSc = -999;
      for(const mode of modes){
        const t = await runOne(ln, mode, tag + ' [' + mode + ']');
        const sc = scoreText(t);
        if(sc > bestSc){ bestSc = sc; best = t || ''; }
        if(!forceAllModes && bestSc >= 28 && (best || '').length >= 8) break;
      }
      return { text: best, score: bestSc };
    }

    async function ocrWithMargin(margin){
      const bx = Math.max(0, b.x + b.w * margin);
      const by = Math.max(0, b.y + b.h * margin);
      const bw = Math.max(0.01, b.w * (1 - 2 * margin));
      const bh = Math.max(0.01, b.h * (1 - 2 * margin));
      const { full, lines } = splitBalloonLines(img, bx, by, bw, bh);

      const lineParts = [];
      const maxLines = Math.min(lines.length, 10);
      for(let i = 0; i < maxLines; i++){
        const r = await bestForCrop(
          lines[i],
          `m${Math.round(margin*100)} L${i+1}/${maxLines}`,
          false
        );
        if(r.text && r.text.trim().length >= 1) lineParts.push(r.text.trim());
      }
      const linesJoined = stripPhantom(lineParts.join(' '));
      const linesJoinedScore = scoreText(linesJoined);

      // balão inteiro só se linhas fracas (PP-OCR é de linha; full costuma piorar)
      let fullText = '', fullScore = -100;
      if(linesJoinedScore < 12 || linesJoined.length < 6){
        const fullRes = await bestForCrop(full, `m${Math.round(margin*100)} full`, true);
        fullText = stripPhantom(fullRes.text || '');
        fullScore = scoreText(fullText);
      }

      const text = fullScore > linesJoinedScore ? fullText : (linesJoined || fullText);
      const score = Math.max(linesJoinedScore, fullScore);
      return { text, score, margin };
    }

    // Testa 3 margens (achado nos testes: 0–4% é a faixa útil)
    const margins = area < 0.003 ? [0, 0.02, 0.04] : [0.0, 0.02, 0.04];
    let best = { text: '', score: -999, margin: 0 };
    for(const m of margins){
      toastProgress('OCR margem ' + Math.round(m*100) + '%…');
      const r = await ocrWithMargin(m);
      console.log('OCR margin', m, r.score, r.text);
      if(r.score > best.score || (r.score === best.score && (r.text||'').length > (best.text||'').length)){
        best = r;
      }
      // se ja ficou muito bom, nao gasta as outras margens
      if(best.score >= 35 && (best.text||'').length >= 12) break;
    }

    toastEl.classList.remove('show');
    let text = stripPhantom((best.text || '').replace(/\s+/g, ' ').trim());
    if(!text){
      toast('OCR não leu texto (veja o Console F12). Ajuste o balão ou digite.', 5500);
      return null;
    }
    text = correctOcrText(text);
    text = stripPhantom(text);
    return text;
  }catch(e){
    console.error('OCR PP-OCR erro', e);
    const msg = (e && e.message) ? e.message : String(e);
    if(/cancelad|selecionado|Falha ao ler|create|wasm|Compile|memory|OOM/i.test(msg) || !ppocrModelBuffer){
      ppocrSessionPromise = null;
    }
    toast('OCR falhou: ' + msg, 7000);
    return null;
  }
}

/* ==================== TTS ==================== */
state.ttsAvailable = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');

function loadVoices(){
  if(!state.ttsAvailable) return;
  state.voices = speechSynthesis.getVoices();
  const sel = $('#voiceSelect'); if(!sel) return;
  sel.innerHTML='';
  const pt = state.voices.filter(v=>v.lang.toLowerCase().startsWith('pt'));
  const list = pt.length ? pt : state.voices;
  list.forEach((v,i)=>{
    const opt=document.createElement('option'); opt.value=v.name; opt.textContent=`${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
}
if(state.ttsAvailable){
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, onend){
  if(!state.ttsAvailable){
    if(!state._ttsWarned){ state._ttsWarned=true; toast('Este navegador não tem suporte a voz — mostrando só o texto.', 4000); }
    if(onend) onend();
    return;
  }
  if(!text){ if(onend) onend(); return; }

  let finished = false;
  const done = ()=>{ if(finished) return; finished=true; clearTimeout(safety); if(onend) onend(); };

  speechSynthesis.cancel();
  // correção conhecida: chamar speak() logo após cancel() falha silenciosamente
  // em vários navegadores Android antigos — um pequeno atraso resolve.
  setTimeout(()=>{
    const u = new SpeechSynthesisUtterance(text);
    const chosenName = localStorage_voice();
    const v = state.voices.find(v=>v.name===chosenName) || state.voices.find(v=>v.lang.toLowerCase().startsWith('pt-br')) || state.voices.find(v=>v.lang.toLowerCase().startsWith('pt'));
    if(v) u.voice=v;
    u.lang = v ? v.lang : 'pt-BR';
    const rateEl = $('#rateRange');
    u.rate = parseFloat(rateEl ? rateEl.value : '1');
    u.onend = done;
    u.onerror = function(ev){
      console.error('Erro de fala', ev);
      toast('Erro ao falar: ' + (ev && ev.error ? ev.error : 'desconhecido'), 4000);
      done();
    };
    try{
      speechSynthesis.speak(u);
    }catch(e){
      toast('Falha ao chamar a voz: ' + e.message, 4000);
      done();
      return;
    }
    // alguns navegadores Android antigos "pausam" a fila sozinhos — reforça o resume
    const resumer = setInterval(()=>{
      if(finished){ clearInterval(resumer); return; }
      if(speechSynthesis.paused) speechSynthesis.resume();
    }, 300);
  }, 120);

  // salvaguarda: se nada acontecer (nem onend nem onerror) em tempo razoável, avança mesmo assim
  const safety = setTimeout(done, Math.max(4000, text.length*180));
}
function localStorage_voice(){ return state._voiceName || null; }

/* ==================== PLAY MODE ==================== */
$('#btnPlay').addEventListener('click', ()=>{
  if(state.mode==='play'){ pausePlay(); return; }
  startPlay();
});
function startPlay(){
  const marks = currentMarks();
  if(!marks.length){ toast('Nenhum balão marcado nesta página.'); return; }
  setMode('play');
  state.playQueue = marks.slice();
  const startIdx = (state.playPauseIndex!=null && state.playPauseIndex < marks.length) ? state.playPauseIndex : 0;
  state.playPauseIndex = null;
  // notebook: começa com a página inteira visível
  if(window.innerWidth >= 700){
    resetZoom();
  }
  playNext(startIdx);
}
function playNext(i){
  if(state.mode!=='play') return;
  const marks = currentMarks();
  if(i>=marks.length){
    if(state.pageIndex < state.comic.pages.length-1){
      state.pageIndex++; renderPage();
      setTimeout(()=>{ setMode('play'); const m2=currentMarks(); if(m2.length) playNext(0); else stopPlay(); }, 450);
    } else { stopPlay(); toast('Fim do quadrinho.'); }
    return;
  }
  const b = marks[i];
  highlightBalloon(b);
  // Notebook/desktop: página inteira (todos os balões clicáveis).
  // Celular: zoom no balão + card, se a opção estiver ligada.
  const isNarrow = window.innerWidth < 700;
  if(isNarrow){
    if(state.readZoomOn) showBalloonCard(b);
    else zoomToBalloon(b, { reserveBottom: 0.15 });
  } else {
    hideBalloonCard();
    // mantém a página legível sem esconder os outros balões
    if(state.viewTransform && state.viewTransform.scale > 1.05){
      resetZoom();
      state.activeBalloon = b.id;
      drawBalloons();
    }
  }
  speak(b.text || '', ()=>{
    if(state.paused) return; // pausado pra edição — não avança sozinho
    state.playTimer = setTimeout(()=>playNext(i+1), 350);
  });
}
function pausePlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  const marks = currentMarks();
  const idx = marks.findIndex(x=>x.id===state.activeBalloon);
  state.playPauseIndex = idx>=0 ? idx : 0;
  setMode('read');
}
function stopPlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  state.playPauseIndex = null;
  if(state.mode==='play') setMode('read');
  hideBalloonCard();
}

/* ==================== SETTINGS ==================== */
$('#btnSettings').addEventListener('click', ()=>{
  $('#sheetTitle').textContent='Voz e leitura';
  const body=$('#sheetBody');
  if(!state.ttsAvailable){
    body.innerHTML = `
      <div class="empty-hint">Este navegador não tem suporte à leitura em voz alta (Web Speech API). Você ainda pode marcar balões e ler o texto normalmente na tela — só a parte de áudio fica indisponível aqui.</div>
      <div class="empty-hint">As marcações de balão ficam salvas por quadrinho. Para reabrir um livro, selecione o mesmo arquivo CBZ na biblioteca.</div>
    `;
    $('#sheet').classList.add('open');
    return;
  }
  body.innerHTML = `
    <div class="settings-row">
      <label>Voz em português</label>
      <select id="voiceSelect"></select>
    </div>
    <div class="settings-row">
      <label>Velocidade da fala</label>
      <input type="range" id="rateRange" min="0.6" max="1.6" step="0.1" value="1">
    </div>
    <div class="row">
      <button id="btnTestVoice">🔊 Testar voz agora</button>
    </div>
    <div class="empty-hint" id="voiceCount"></div>
    <div class="empty-hint">As marcações de balão ficam salvas por quadrinho. Para reabrir um livro, selecione o mesmo arquivo CBZ na biblioteca.</div>
  `;
  loadVoices();
  setTimeout(()=>{
    const n = state.voices.length;
    $('#voiceCount').textContent = n
      ? `${n} voz(es) encontrada(s) pelo navegador.`
      : 'Nenhuma voz encontrada pelo navegador (mesmo com um motor de TTS instalado no Android). Isso indica que o navegador não está enxergando as vozes do sistema.';
  }, 300);
  $('#voiceSelect').addEventListener('change', e=> state._voiceName = e.target.value);
  $('#btnTestVoice').addEventListener('click', ()=>{
    speak('Um, dois, três. Se você está ouvindo isso, a voz está funcionando.');
  });
  $('#sheet').classList.add('open');
});

/* ==================== INIT ==================== */
window.addEventListener('resize', ()=>{
  fitImageToStage();
  if(state.mode==='mark' && state.activeBalloon){
    const b=currentMarks().find(x=>x.id===state.activeBalloon); if(b) zoomToBalloon(b);
  } else {
    resetZoom();
  }
  drawBalloons();
  if(state.cardBalloonId){
    const b = currentMarks().find(x=>x.id===state.cardBalloonId);
    if(b) showBalloonCard(b); else hideBalloonCard();
  }
});
$('#stage').addEventListener('wheel', (e)=>{
  if(!state.comic) return;
  e.preventDefault();
  const stage = $('#stage').getBoundingClientRect();
  if(e.ctrlKey || e.metaKey){
    const factor = Math.exp(-e.deltaY*0.01);
    const newScale = Math.min(6, Math.max(0.5, state.viewTransform.scale*factor));
    const anchorX = (e.clientX - stage.left - state.viewTransform.tx)/state.viewTransform.scale;
    const anchorY = (e.clientY - stage.top - state.viewTransform.ty)/state.viewTransform.scale;
    state.viewTransform = {
      scale:newScale,
      tx:(e.clientX-stage.left) - anchorX*newScale,
      ty:(e.clientY-stage.top) - anchorY*newScale
    };
  } else {
    state.viewTransform.tx -= e.deltaX;
    state.viewTransform.ty -= e.deltaY;
  }
  applyViewTransform(false);
}, {passive:false});
refreshLibrary();
loadVoices();
checkStorageAvailable();
</script>
