async function sha256Hex(buffer){
  if(!window.crypto || !crypto.subtle) return null;
  const hash = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function fetchYoloModelBuffer(){
  for(const url of YOLO_MODEL_URLS){
    try{
      toastProgress('Baixando detector de balões (~50 MB)…');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok){
        console.warn('fetch YOLO status', res.status, url);
        continue;
      }
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 1_000_000){
        console.warn('arquivo YOLO muito pequeno', buf.byteLength);
        continue;
      }
      toastProgress('Verificando integridade do modelo…');
      const hex = await sha256Hex(buf);
      if(hex && hex !== YOLO_MODEL_SHA256){
        console.warn('SHA-256 não confere', hex);
        toast('Aviso: hash do detector diferente do esperado. Continuando mesmo assim…', 4000);
      }
      toastProgress('Detector baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      // CORS costuma cair aqui em alguns ambientes
      console.warn('fetch YOLO falhou', url, e);
    }
  }
  return null;
}

function getYoloSession(){
  if(yoloSessionPromise) return yoloSessionPromise;

  yoloSessionPromise = (async ()=>{
    try{
      setupOrtWasm();
      let buffer = yoloModelBuffer;
      if(!buffer){
        buffer = await fetchYoloModelBuffer();
      }
      if(!buffer){
        // Fallback: seletor de arquivo (precisa de clique do usuário)
        buffer = await pickModelFile();
      }
      yoloModelBuffer = buffer;
      toastProgress('Compilando detector de balões (pode levar uns segundos)…');
      await new Promise(r => setTimeout(r, 40));
      const session = await ort.InferenceSession.create(buffer, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'disabled'
      });
      toast('Detector de balões pronto ✓', 2500);
      return session;
    }catch(err){
      yoloSessionPromise = null;
      throw err;
    }
  })();

  return yoloSessionPromise;
}

function preprocessForYolo(img){
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const SZ = MODEL_INPUT_SIZE; // 1024 — tem que ser múltiplo de 32
  if(!W0 || !H0) throw new Error('Imagem da página sem dimensões (naturalWidth=0)');
  const scale = Math.min(SZ / W0, SZ / H0);
  const nw = Math.max(1, Math.round(W0 * scale));
  const nh = Math.max(1, Math.round(H0 * scale));
  const canvas = document.createElement('canvas');
  canvas.width = SZ;
  canvas.height = SZ;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  // letterbox cinza YOLOv8 padrão
  ctx.fillStyle = 'rgb(114,114,114)';
  ctx.fillRect(0, 0, SZ, SZ);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, W0, H0, 0, 0, nw, nh);
  const imgData = ctx.getImageData(0, 0, SZ, SZ).data;
  const plane = SZ * SZ;
  const chw = new Float32Array(3 * plane);
  for(let p = 0; p < plane; p++){
    chw[p]            = imgData[p * 4] / 255;
    chw[plane + p]    = imgData[p * 4 + 1] / 255;
    chw[2 * plane + p]= imgData[p * 4 + 2] / 255;
  }
  const tensor = new ort.Tensor('float32', chw, [1, 3, SZ, SZ]);
  return { tensor, scale };
}

function nmsBoxes(items, iouTh){
  items.sort((a,b)=> b.conf-a.conf);
  const keep = [];
  const used = new Array(items.length).fill(false);
  for(let i=0;i<items.length;i++){
    if(used[i]) continue;
    const a = items[i]; keep.push(a);
    for(let j=i+1;j<items.length;j++){
      if(used[j]) continue;
      const b = items[j];
      const xx0=Math.max(a.x0,b.x0), yy0=Math.max(a.y0,b.y0);
      const xx1=Math.min(a.x1,b.x1), yy1=Math.min(a.y1,b.y1);
      const inter = Math.max(0,xx1-xx0)*Math.max(0,yy1-yy0);
      const areaA=(a.x1-a.x0)*(a.y1-a.y0), areaB=(b.x1-b.x0)*(b.y1-b.y0);
      const iou = inter/(areaA+areaB-inter);
      if(iou > iouTh) used[j]=true;
    }
  }
  return keep;
}

/**
 * Ordena balões como em HQ (aproximando quadros).
 * 1) Procura faixa vazia horizontal (entre faixas de balões) → lê cima, depois baixo.
 * 2) Senão, faixa vazia vertical → lê esquerda, depois direita (ou RTL se rtl=true).
 * 3) Senão, ordena por linhas de leitura (y) e dentro da linha por x.
 */
function orderBalloonsLikeComics(cands, rtl){
  if(!cands || !cands.length) return [];
  if(cands.length === 1) return cands.slice();

  function bboxOf(items){
    let x0=1, y0=1, x1=0, y1=0;
    items.forEach(c=>{
      x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y);
      x1 = Math.max(x1, c.x + c.w); y1 = Math.max(y1, c.y + c.h);
    });
    return { x0, y0, x1, y1, w:x1-x0, h:y1-y0 };
  }

  // Maior "buraco" no eixo: projeta intervalos e acha gap entre eles
  function largestGap(items, axis){
    // axis 'y' → gaps horizontais (separando faixas de cima/baixo)
    // axis 'x' → gaps verticais (separando colunas esq/dir)
    const intervals = items.map(c=>{
      if(axis === 'y') return [c.y, c.y + c.h];
      return [c.x, c.x + c.w];
    }).sort((a,b)=> a[0]-b[0]);

    // merge overlapping
    const merged = [intervals[0].slice()];
    for(let i=1;i<intervals.length;i++){
      const last = merged[merged.length-1];
      if(intervals[i][0] <= last[1] + 0.002){
        last[1] = Math.max(last[1], intervals[i][1]);
      } else {
        merged.push(intervals[i].slice());
      }
    }
    if(merged.length < 2) return null;

    let best = null;
    for(let i=0;i<merged.length-1;i++){
      const gap0 = merged[i][1];
      const gap1 = merged[i+1][0];
      const gap = gap1 - gap0;
      if(gap <= 0.008) continue; // gap mínimo ~0.8% da página
      if(!best || gap > best.gap){
        best = { gap, cut: (gap0 + gap1) / 2, beforeEnd: gap0, afterStart: gap1 };
      }
    }
    return best;
  }

  function splitByCut(items, axis, cut){
    const a = [], b = [];
    items.forEach(c=>{
      const mid = axis === 'y' ? (c.y + c.h/2) : (c.x + c.w/2);
      (mid < cut ? a : b).push(c);
    });
    // exige que os dois lados tenham algo
    if(!a.length || !b.length) return null;
    return [a, b];
  }

  function rowOrder(items){
    // linhas por sobreposição em Y, depois X (ou RTL)
    const sorted = items.slice().sort((a,b)=> a.y - b.y);
    const rows = [];
    sorted.forEach(c=>{
      let placed = false;
      const cy0 = c.y, cy1 = c.y + c.h;
      for(const row of rows){
        const overlap = Math.min(row.y1, cy1) - Math.max(row.y0, cy0);
        const minH = Math.min(c.h, row.y1 - row.y0);
        if(minH > 0 && overlap > minH * 0.25){
          row.items.push(c);
          row.y0 = Math.min(row.y0, cy0);
          row.y1 = Math.max(row.y1, cy1);
          placed = true;
          break;
        }
      }
      if(!placed) rows.push({ y0: cy0, y1: cy1, items: [c] });
    });
    rows.sort((a,b)=> (a.y0+a.y1) - (b.y0+b.y1));
    const out = [];
    rows.forEach(row=>{
      row.items.sort((a,b)=> rtl ? (b.xc - a.xc) : (a.xc - b.xc));
      row.items.forEach(it=> out.push(it));
    });
    return out;
  }

  function recurse(items, depth){
    if(items.length <= 1) return items.slice();
    if(depth > 8) return rowOrder(items);

    const bb = bboxOf(items);
    // preferir corte horizontal (faixas de quadros empilhados) se o gap for significativo
    const gapY = largestGap(items, 'y');
    const gapX = largestGap(items, 'x');

    // gap relativo à altura/largura do grupo
    const scoreY = gapY ? gapY.gap / Math.max(bb.h, 0.05) : 0;
    const scoreX = gapX ? gapX.gap / Math.max(bb.w, 0.05) : 0;

    // limiar: gap precisa ser razoável em relação ao grupo
    const MIN_REL = 0.04;

    if(scoreY >= MIN_REL && scoreY >= scoreX && gapY){
      const parts = splitByCut(items, 'y', gapY.cut);
      if(parts){
        return recurse(parts[0], depth+1).concat(recurse(parts[1], depth+1));
      }
    }
    if(scoreX >= MIN_REL && gapX){
      const parts = splitByCut(items, 'x', gapX.cut);
      if(parts){
        // LTR: esquerda depois direita; RTL: invertido
        const first = rtl ? parts[1] : parts[0];
        const second = rtl ? parts[0] : parts[1];
        return recurse(first, depth+1).concat(recurse(second, depth+1));
      }
    }
    return rowOrder(items);
  }

  return recurse(cands, 0);
}

async function detectBalloons(){
  if(!state.comic) return;
  const btn = $('#btnDetect');
  btn.disabled = true; const oldTxt = btn.textContent; btn.textContent='⏳';
  try{
    if(!yoloSessionPromise && !yoloModelBuffer){ toast('Carregando detector de balões…', 3000); }
    toastProgress('Carregando modelo de detecção de balões (só na primeira vez nesta sessão)…');
    const session = await getYoloSession();
    toastProgress('Detectando balões na página…');
    await new Promise(r=>setTimeout(r, 50)); // garante que a mensagem pinte na tela antes do cálculo pesado

    const img = $('#pageImg');
    const {tensor, scale} = preprocessForYolo(img);
    const inputName = session.inputNames[0] || 'images';
    console.log('YOLO input', inputName, tensor.dims, 'outputs', session.outputNames);
    let results;
    try{
      results = await session.run({ [inputName]: tensor });
    }catch(runErr){
      console.error('YOLO run failed', runErr);
      // se o modelo baixado estiver corrompido/otimizado demais, permite tentar de novo via arquivo local
      yoloSessionPromise = null;
      yoloModelBuffer = null;
      throw new Error('Falha na detecção (Concat/shape). Tente de novo — se repetir, use o .onnx local. Detalhe: ' + (runErr && runErr.message ? runErr.message : runErr));
    }
    const outputName = session.outputNames[0];
    const out = results[outputName]; // dims: [1,6,N]
    const dims = out.dims; // [1, 6, N]
    const numAttrs = dims[1], numAnchors = dims[2];
    const data = out.data;

    const CONF_TH = 0.25;
    const candidates = [];
    for(let i=0;i<numAnchors;i++){
      const cx = data[0*numAnchors+i];
      const cy = data[1*numAnchors+i];
      const w_ = data[2*numAnchors+i];
      const h_ = data[3*numAnchors+i];
      let bestCls=0, bestScore=-1;
      for(let c=4;c<numAttrs;c++){
        const s = data[c*numAnchors+i];
        if(s>bestScore){ bestScore=s; bestCls=c-4; }
      }
      if(bestScore < CONF_TH) continue;
      candidates.push({
        x0:(cx-w_/2), y0:(cy-h_/2), x1:(cx+w_/2), y1:(cy+h_/2),
        conf:bestScore, cls:bestCls
      });
    }
    const kept = nmsBoxes(candidates, 0.45);

    const W = img.naturalWidth, H = img.naturalHeight;
    const SHRINK = 0.06; // encolhe a caixa pra dentro, evitando pegar a borda/rabinho do balão
    const cands = kept.map(b=>{
      // volta da escala do modelo (1024, com letterbox) pra fração normalizada da página
      let x0 = Math.max(0, b.x0/scale), y0 = Math.max(0, b.y0/scale);
      let x1 = Math.min(W, b.x1/scale), y1 = Math.min(H, b.y1/scale);
      const insetX = (x1-x0)*SHRINK, insetY = (y1-y0)*SHRINK;
      x0 += insetX; y0 += insetY; x1 -= insetX; y1 -= insetY;
      return {
        x:x0/W, y:y0/H, w:(x1-x0)/W, h:(y1-y0)/H,
        y0:y0/H, y1:y1/H, yc:(y0+y1)/2/H, xc:(x0+x1)/2/W
      };
    });

    if(!cands.length){
      toast('O modelo não encontrou nenhum balão nesta página.', 5000);
      return;
    }

    // Ordem de leitura estilo HQ: partição espacial (cortes por "calhas" entre grupos).
    // Aproxima a ordem por quadros sem modelo de painéis: divide a página onde há
    // faixa vazia grande (horizontal = cima/baixo; vertical = esq/dir), depois LTR nas folhas.
    const ordered = orderBalloonsLikeComics(cands, false);

    const arr = state.marks[state.pageIndex] || (state.marks[state.pageIndex]=[]);
    let order = arr.length ? Math.max.apply(null, arr.map(x=>x.order)) : 0;
    ordered.forEach(c=>{
      order++;
      arr.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6), x:c.x, y:c.y, w:c.w, h:c.h, order, text:''});
    });
    await saveMarks();
    drawBalloons();
    state.lastDetectDiag = null;
    state._yoloRetried = false;
    toast(`${ordered.length} balão(ões) detectado(s) pelo modelo — revise na lista (☰).`, 5500);
    openSheetList();
  }catch(e){
    console.error('detect error', e);
    const msg = (e && e.message) ? e.message : String(e);
    // retry automático 1x (modelo baixado às vezes falha no 1º run no WASM)
    if(!state._yoloRetried && /Concat|shape|26388560|OrtRun/i.test(msg)){
      state._yoloRetried = true;
      yoloSessionPromise = null;
      // mantém yoloModelBuffer se já baixou — só recompila sessão
      toast('Detectando de novo…', 2500);
      btn.disabled = false; btn.textContent = oldTxt;
      setTimeout(()=> detectBalloons(), 400);
      return;
    }
    state._yoloRetried = false;
    toast('Erro ao detectar: '+msg, 6000);
  }finally{
    btn.disabled=false; btn.textContent=oldTxt;
  }
}

function onBalloonTap(b){
  if(state.mode==='mark'){ startAdjustBalloon(b); return; }
  // Já está editando: troca o balão alvo (salva o texto atual antes)
  if(state.paused && state.pausedBalloon){
    if(state.pausedBalloon.id === b.id) return;
    applyLiteEditTextAndOrder(state.pausedBalloon);
    saveMarks();
    pauseAndEditWhileReading(b);
    return;
  }
  // Durante a leitura (play): editar qualquer balão
  if(state.mode==='play'){
    pauseAndEditWhileReading(b);

  }
  highlightBalloon(b);
  if(state.readZoomOn) showBalloonCard(b);

}

  if(state.draft) return;

}

async function reorderPageBalloons(){
  const arr = state.marks[state.pageIndex] || [];

    _ref:b
  }));

async function bulkOcr(marks){
  const pending = marks.filter(b=>!b.text);
  if(!pending.length){ toast('Todos os balões desta página já têm texto.'); return; }
  const btn = $('#btnBulkOcr');
  for(let i=0;i<pending.length;i++){
    if(btn) btn.textContent = `Transcrevendo ${i+1}/${pending.length}…`;
    const text = await ocrBalloon(pending[i]);
    if(text){ pending[i].text = text; await saveMarks(); }
  }

  openSheetList();
}
async function setOrder(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder)){ openSheetList(); return; }
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks(); drawBalloons(); openSheetList();
}
async function setOrderQuick(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder) || newOrder===b.order) return;
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks();
  drawBalloons();
  toast(`Balão movido pra posição ${newOrder}`, 1500);
}

}

const PPOCR_SPACE_IDX = PPOCR_DICT.length + 1; // 503
const PPOCR_REC_H = 48;
const PPOCR_MAX_W = 560; // mais largura = melhor em textos longos

let ppocrSessionPromise = null;
let ppocrModelBuffer = null;
let ppocrLoading = false;

// Caminhos relativos (mesmo diretório do HTML no GitHub Pages) e nomes comuns
const PPOCR_MODEL_CANDIDATES = [
  'latin_PP-OCRv5_rec_mobile_web.onnx',
  './latin_PP-OCRv5_rec_mobile_web.onnx',
  'models/latin_PP-OCRv5_rec_mobile_web.onnx',
  'latin_PP-OCRv5_rec_mobile.onnx',
  './latin_PP-OCRv5_rec_mobile.onnx',
  'models/latin_PP-OCRv5_rec_mobile.onnx'
];

function setupOrtWasm(){
  if(typeof ort === 'undefined' || !ort.env || !ort.env.wasm) return;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  try { ort.env.wasm.numThreads = 1; } catch(e){}
  try { ort.env.wasm.proxy = false; } catch(e){}
  try { ort.env.wasm.simd = true; } catch(e){}
}

function pickOnnxFile(hint){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    if(hint) toast(hint, 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    // NÃO usar focus/cancel — isso rejeitava a Promise no meio da leitura
    input.click();
  });
}

async function fetchPpocrModelBuffer(){
  for(const url of PPOCR_MODEL_CANDIDATES){
    try{
      toastProgress('Baixando modelo OCR: ' + url + ' …');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 100000) continue; // muito pequeno, não é o modelo
      toastProgress('Modelo baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      console.warn('fetch modelo falhou', url, e);
    }
  }
  return null;
}

async function createPpocrSessionFromBuffer(buffer){
  setupOrtWasm();
  toastProgress('Compilando modelo OCR no WASM (15–60s na 1ª vez, aguarde)…');
  await new Promise(r => setTimeout(r, 50));
  try{
    const session = await ort.InferenceSession.create(buffer, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'basic'
    });
    return session;
  }catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    console.error('InferenceSession.create falhou', e);
    throw new Error('Falha ao compilar modelo ONNX: ' + msg + ' — use o arquivo latin_PP-OCRv5_rec_mobile_web.onnx');
  }
}

function getPpocrSession(){
  if(ppocrSessionPromise) return ppocrSessionPromise;

  ppocrSessionPromise = (async ()=>{
    try{
      let buffer = ppocrModelBuffer;
      if(!buffer){
        buffer = await fetchPpocrModelBuffer();
      }
      if(!buffer){
        // fallback: file picker (só funciona com clique do usuário)
        buffer = await pickOnnxFile('Modelo não encontrado no site. Selecione latin_PP-OCRv5_rec_mobile_web.onnx');
      }
      ppocrModelBuffer = buffer;
      const session = await createPpocrSessionFromBuffer(buffer);
      toast('Modelo OCR pronto ✓', 2500);
      return session;
    }catch(err){
      ppocrSessionPromise = null;
      throw err;
    }
  })();

  return ppocrSessionPromise;
}

async function preloadPpocrModel(){
  if(ppocrLoading){
    toast('Já está carregando o modelo… aguarde.', 3000);
    return false;
  }
  if(ppocrSessionPromise){
    try{
      await ppocrSessionPromise;
      toast('Modelo OCR já está pronto ✓', 2000);
      return true;
    }catch(e){
      ppocrSessionPromise = null;
    }
  }
  ppocrLoading = true;
  try{
    await getPpocrSession();
    return true;
  }catch(e){
    console.error('preload OCR', e);
    const msg = (e && e.message) ? e.message : String(e);
    toast('Não carregou o modelo: ' + msg, 8000);
    return false;
  }finally{
    ppocrLoading = false;
  }
}

/** Preprocess single text-line crop → CHW float32 [-1,1], height=48
 *  mode: 'normal' | 'invert' | 'contrast'
 */
function preprocessLineForPpocr(canvasSrc, sx, sy, sw, sh, mode){
  mode = mode || 'normal';
  const H = PPOCR_REC_H;
  let targetW = Math.round(sw * (H / Math.max(1, sh)));
  if(targetW < 16) targetW = 16;
  if(targetW > PPOCR_MAX_W) targetW = PPOCR_MAX_W;
  const padW = Math.ceil(targetW / 8) * 8;

  const canvas = document.createElement('canvas');
  canvas.width = padW;
  canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, padW, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvasSrc, sx, sy, sw, sh, 0, 0, targetW, H);

  const imgData = ctx.getImageData(0, 0, padW, H);
  const d = imgData.data;
  for(let i = 0; i < d.length; i += 4){
    let r = d[i], g = d[i+1], b = d[i+2];
    let gray = 0.299*r + 0.587*g + 0.114*b;
    if(mode === 'invert'){
      gray = 255 - gray;
    } else if(mode === 'contrast'){
      // estica contraste + leve binarização suave
      gray = gray < 128 ? gray * 0.55 : Math.min(255, gray * 1.25 + 20);
    }
    d[i] = d[i+1] = d[i+2] = gray;
  }
  ctx.putImageData(imgData, 0, 0);

  const out = ctx.getImageData(0, 0, padW, H).data;
  const chw = new Float32Array(3 * H * padW);
  const plane = H * padW;
  for(let p = 0; p < plane; p++){
    const v = out[p*4] / 255;
    const n = (v - 0.5) / 0.5;
    chw[p] = n;
    chw[plane + p] = n;
    chw[2*plane + p] = n;
  }
  return new ort.Tensor('float32', chw, [1, 3, H, padW]);
}

/** CTC greedy decode — blank=0, chars=1..len(dict), space=len+1 */
function decodePpocrOutput(data, dims){
  // Aceita [1,T,C] ou [1,C,T]
  let T, C, layout;
  if(dims.length === 3){
    if(dims[2] === 504 || dims[2] === PPOCR_DICT.length + 2){
      T = dims[1]; C = dims[2]; layout = 'btc';
    } else if(dims[1] === 504 || dims[1] === PPOCR_DICT.length + 2){
      C = dims[1]; T = dims[2]; layout = 'bct';
    } else {
      T = dims[1]; C = dims[2]; layout = 'btc';
    }
  } else {
    console.warn('OCR dims inesperados', dims);
    return '';
  }

  const chars = [];
  let prev = -1;
  const topIdx = [];
  for(let t = 0; t < T; t++){
    let bestIdx = 0, bestVal = -Infinity;
    for(let c = 0; c < C; c++){
      const v = layout === 'btc' ? data[t * C + c] : data[c * T + t];
      if(v > bestVal){ bestVal = v; bestIdx = c; }
    }
    if(t < 12) topIdx.push(bestIdx);
    if(bestIdx === prev) continue;
    if(bestIdx === PPOCR_BLANK){ prev = bestIdx; continue; }
    if(bestIdx === PPOCR_SPACE_IDX){
      chars.push(' ');
    } else if(bestIdx >= 1 && bestIdx <= PPOCR_DICT.length){
      chars.push(PPOCR_DICT[bestIdx - 1]);
    }
    prev = bestIdx;
  }
  const text = chars.join('').replace(/\s+/g, ' ').trim();
  if(!text){
    console.warn('OCR vazio. dims=', dims, 'layout=', layout, 'topIdx=', topIdx);
  } else {
    console.log('OCR ok:', text, 'dims=', dims);
  }
  return text;
}

/** Divide o recorte do balão em linhas de texto (projeção horizontal) */
/** Aperta o recorte na tinta real (ajuda balões redondos). */
function tightInkCrop(canvas, x, y, w, h){
  try{
    x = Math.max(0, Math.floor(x));
    y = Math.max(0, Math.floor(y));
    w = Math.max(1, Math.floor(w));
    h = Math.max(1, Math.floor(h));
    if(x + w > canvas.width) w = canvas.width - x;
    if(y + h > canvas.height) h = canvas.height - y;
    if(w < 8 || h < 8) return { x, y, w, h };

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(x, y, w, h);
    const d = id.data;
    let sum = 0, n = w * h;
    for(let i = 0; i < d.length; i += 4){
      sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    }
    const mean = sum / n;
    const darkInk = mean >= 130;
    const thr = darkInk ? (mean - 25) : (mean + 25);

    let minX = w, minY = h, maxX = 0, maxY = 0, count = 0;
    for(let row = 0; row < h; row++){
      for(let col = 0; col < w; col++){
        const i = (row * w + col) * 4;
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        const isInk = darkInk ? (g < thr) : (g > thr);
        if(isInk){
          count++;
          if(col < minX) minX = col;
          if(col > maxX) maxX = col;
          if(row < minY) minY = row;
          if(row > maxY) maxY = row;
        }
      }
    }
    if(count < n * 0.005) return { x, y, w, h };

    const padX = Math.max(2, Math.floor((maxX - minX) * 0.05));
    const padY = Math.max(2, Math.floor((maxY - minY) * 0.05));
    let nx = Math.max(0, minX - padX);
    let ny = Math.max(0, minY - padY);
    let nx2 = Math.min(w - 1, maxX + padX);
    let ny2 = Math.min(h - 1, maxY + padY);
    let nw = nx2 - nx + 1;
    let nh = ny2 - ny + 1;
    const areaRatio = (nw * nh) / (w * h);
    if(areaRatio < 0.15){
      // muito agressivo: usa pelo menos 50% do centro
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      nw = Math.max(nw, Math.floor(w * 0.5));
      nh = Math.max(nh, Math.floor(h * 0.5));
      nx = Math.max(0, Math.floor(cx - nw / 2));
      ny = Math.max(0, Math.floor(cy - nh / 2));
      nw = Math.min(w - nx, nw);
      nh = Math.min(h - ny, nh);
    }
    if(nw < 6 || nh < 6) return { x, y, w, h };
    return { x: x + nx, y: y + ny, w: nw, h: nh };
  }catch(e){
    return { x, y, w, h };
  }
}

function splitBalloonLines(imgEl, bx, by, bw, bh){
  const nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
  const sx = Math.max(0, Math.round(bx * nw));
  const sy = Math.max(0, Math.round(by * nh));
  const sw = Math.max(1, Math.round(bw * nw));
  const sh = Math.max(1, Math.round(bh * nh));

  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  tctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
  const idata = tctx.getImageData(0, 0, sw, sh);
  const d = idata.data;

  const proj = new Float32Array(sh);
  for(let y = 0; y < sh; y++){
    let dark = 0;
    for(let x = 0; x < sw; x++){
      const i = (y * sw + x) * 4;
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(gray < 180) dark++;
    }
    proj[y] = dark / sw;
  }
  let maxP = 0;
  for(let y = 0; y < sh; y++) if(proj[y] > maxP) maxP = proj[y];
  const th = Math.max(0.015, maxP * 0.12);

  const ranges = [];
  let start = -1;
  for(let y = 0; y < sh; y++){
    if(proj[y] > th){
      if(start < 0) start = y;
    } else if(start >= 0){
      if(y - start >= 2) ranges.push([start, y]);
      start = -1;
    }
  }
  if(start >= 0 && sh - start >= 2) ranges.push([start, sh]);

  const merged = [];
  for(let i = 0; i < ranges.length; i++){
    if(!merged.length){ merged.push(ranges[i]); continue; }
    const last = merged[merged.length - 1];
    if(ranges[i][0] - last[1] < 5) last[1] = ranges[i][1];
    else merged.push(ranges[i]);
  }

  // sempre inclui o crop inteiro como fallback no final da lista de tentativas
  const lineCrops = merged.map(([a, b])=>{
    const pa = Math.max(0, a - 2);
    const pb = Math.min(sh, b + 2);
    return { canvas: tmp, x: 0, y: pa, w: sw, h: Math.max(1, pb - pa) };
  }).filter(r => r.h >= 4);

  return {
    full: { canvas: tmp, x: 0, y: 0, w: sw, h: sh },
    lines: lineCrops.length ? lineCrops : [{ canvas: tmp, x: 0, y: 0, w: sw, h: sh }]
  };
}

/* ==================== Pós-correção PT (confusões típicas de HQ) ==================== */
const OCR_CONFUSIONS = [
  ['f', 't'], ['t', 'f'],
  ['F', 'T'], ['T', 'F'],
  ['n', 'u'], ['u', 'n'],
  ['rn', 'm'], ['m', 'rn'],
  ['cl', 'd'], ['vv', 'w'],
  ['0', 'o'], ['1', 'l'], ['1', 'i'],
];

const PT_BALLOON_WORDS = new Set(`
a o as os um uma uns umas de da do das dos em na no nas nos por para com sem

lutar lutarei sozinho sozinha outros demais
permita torne melhor mutantes mutante mutação fisiologia especialista líder lider
aconteceu comigo capaz suportar romperá receio
estou mutando matando tirarei terei partir outra isso henry
vítima vitima geração seguinte diário dias finais
própria propria vida empo resto restando digno

`.trim().split(/\s+/).filter(Boolean).map(w => w.toLowerCase()));

// Correções forçadas (palavra inteira, minúscula) — baseadas no XML real da página de teste
const OCR_FORCED = {
  // f/t
  'esfou': 'estou', 'fenho': 'tenho', 'femos': 'temos', 'fem': 'tem',
  'fempo': 'tempo', 'empo': 'tempo', 'firarei': 'tirarei', 'ferei': 'terei',
  'ferá': 'terá', 'fera': 'terá', 'fara': 'fará', 'parfir': 'partir',
  'mafando': 'matando', 'anfes': 'antes',
  // mut*
  'mufando': 'mutando', 'mufação': 'mutação', 'mufacao': 'mutação',
  'mufante': 'mutante', 'mufantes': 'mutantes',
  'murantes': 'mutantes', 'murante': 'mutante',
  // outros f/t / n/u
  'lufar': 'lutar', 'lufarei': 'lutarei', 'oufros': 'outros', 'oufra': 'outra',
  'outra.': 'outra.', 'forne': 'torne', 'permifa': 'permita', 'permila': 'permita',
  'desfa': 'desta', 'rne': 'me', 'lsso': 'isso', 'sso': 'isso',
  'propis': 'própria', 'especialisfa': 'especialista',
  'suporfar': 'suportar', 'aconfeceu': 'aconteceu',
  'rompera': 'romperá', 'cerebro': 'cérebro',
  'vitima': 'vítima', 'porfavor': 'por favor',
  // nomes / restos
  'enry': 'henry', 'mccoy': 'McCoy',
};

// Lixo típico de OCR em balões pequenos / SFX
const OCR_GARBAGE = /^(cYlowb?|Ohtnee|2|7s)$/i;

function ocrWordCandidates(word){
  const out = new Set([word]);
  for(let i = 0; i < word.length; i++){
    const ch = word[i];
    for(const [a,b] of OCR_CONFUSIONS){
      if(a.length === 1 && ch === a){
        out.add(word.slice(0,i) + b + word.slice(i+1));
      }
    }
  }
  if(word.toLowerCase().includes('rn')) out.add(word.replace(/rn/gi, 'm'));
  // padrões f→t em sufixos comuns de PT
  const low = word.toLowerCase();
  if(/fando$/.test(low)) out.add(word.slice(0,-5) + (word.slice(-5,-4) === word.slice(-5,-4).toUpperCase() ? 'Tando' : 'tando'));
  if(/fir/.test(low)) out.add(word.replace(/fir/gi, m => m[0] === 'F' ? 'Tir' : 'tir'));
  if(/muf/.test(low)) out.add(word.replace(/muf/gi, m => m[0] === 'M' ? 'Mut' : 'mut'));
  if(/murant/.test(low)) out.add(word.replace(/murant/gi, m => m[0] === 'M' ? 'Mutant' : 'mutant'));
  return [...out];
}

function scorePtWord(w){
  const lw = w.toLowerCase().normalize('NFC');
  if(!lw) return -1;
  if(OCR_GARBAGE.test(lw)) return -50;
  if(PT_BALLOON_WORDS.has(lw)) return 100;
  if(OCR_FORCED[lw]) return 90;
  if(/^[a-zà-ü]+$/i.test(lw) && lw.length >= 3) return 10;
  if(/^[a-zà-ü]+$/i.test(lw)) return 5;
  return 0;
}

function applyCaseLike(sample, replacement){
  if(!replacement) return replacement;
  if(!sample) return replacement;
  if(sample === sample.toUpperCase() && sample.length > 1) return replacement.toUpperCase();
  if(sample[0] === sample[0].toUpperCase()){
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement;
}

function correctOcrText(text){
  if(!text) return text;

  // 1) correções de frase inteira / padrões multi-palavra
  let t = text
    .replace(/\bEsfou\s+mufando\b/gi, 'Estou mutando')
    .replace(/\bE\s+isso\s+está\s+me\s+mafando\b/gi, 'E isso está me matando')
    .replace(/\bestá\s+rne\s+matando\b/gi, 'está me matando')
    .replace(/\brne\s+matando\b/gi, 'me matando')
    .replace(/\bDesfa\s+vez\b/gi, 'Desta vez')
    .replace(/\bMas\s+Desfa\s+vez\b/gi, 'Mas desta vez')
    .replace(/\bmais\s+na[_\s]+geração\b/gi, 'mais uma geração')
    .replace(/\bmufantes\b/gi, 'mutantes')
    .replace(/\bD\s+HENRY\b/gi, 'HENRY')
    .replace(/\bOutra\.MoeOPme\b/gi, 'Outra.')
    .replace(/\bSIM,\s*ORORO\.l\b/gi, 'SIM, ORORO.')
    .replace(/\bgeração\s+seguinte\s+de\s+murantes\b/gi, 'geração seguinte de mutantes')
    .replace(/\bNão\s+firarei\b/gi, 'Não tirarei')
    .replace(/\bantes\s+de\s+parfir\b/gi, 'antes de partir')
    .replace(/\bNão\s+tenho\s+muito\s+empo\b/gi, 'Não tenho muito tempo')
    .replace(/\bferei\s+que\s+lutar\b/gi, 'terei que lutar')
    .replace(/\bD\s*ENRY\.?/gi, 'HENRY.')
    .replace(/\bSIM,\s*ORORO\.?\s*(cYlowb?)?/gi, 'SIM, ORORO.')
    .replace(/\bESTOU\s+OUVINDO\.?\s*2\b/gi, 'ESTOU OUVINDO.')
    .replace(/\b7s\s+VOC\b/gi, 'VOCÊ')
    .replace(/\bVOC\s+VAI\b/gi, 'VOCÊ VAI')
    .replace(/\bOufra\.?\s*(Ohtnee)?/gi, 'Outra.')
    .replace(/\bsso\s+já\b/gi, 'Isso já')
    .replace(/\s+e\s*$/g, '') // sobra de OCR no fim
    .replace(/\s{2,}/g, ' ')
    .trim();

  // 2) palavra a palavra
  t = t.split(/(\s+)/).map(token => {
    if(/^\s+$/.test(token)) return token;
    const m = token.match(/^([^a-zA-Zà-üÀ-Ü]*)(.*?)([^a-zA-Zà-üÀ-Ü]*)$/);
    if(!m) return token;
    let [, pre, core, post] = m;
    if(!core || core.length < 2) return token;

    // remove lixo puro
    if(OCR_GARBAGE.test(core)) return pre + post;

    const low = core.toLowerCase();
    if(OCR_FORCED[low] !== undefined){
      return pre + applyCaseLike(core, OCR_FORCED[low]) + post;
    }

    const candidates = ocrWordCandidates(core);
    let best = core, bestScore = scorePtWord(core);
    for(const c of candidates){
      const s = scorePtWord(c);
      if(s > bestScore){ bestScore = s; best = c; }
    }

    // se ainda fraco, tenta trocar todos os f→t
    if(bestScore < 50){
      const tryT = core.replace(/f/g, 't').replace(/F/g, 'T');
      if(scorePtWord(tryT) > bestScore){ best = tryT; bestScore = scorePtWord(tryT); }
    }

    return pre + best + post;
  }).join('');

  return t.replace(/\s+/g, ' ').replace(/\s+([.,!?;:])/g, '$1').trim();
}

async function ocrBalloon(b){
  try{
    const needLoad = !ppocrSessionPromise;
    if(needLoad) toastProgress('Carregando modelo OCR (PP-OCRv5)…');
    const session = await getPpocrSession();
    toastProgress('Reconhecendo texto do balão…');
    await new Promise(r => setTimeout(r, 30));

    const img = $('#pageImg');
    if(!img || !img.naturalWidth){
      toast('Imagem da página ainda não carregou.', 4000);
      return null;
    }

    const area = (b.w || 0) * (b.h || 0);
    const inputName = session.inputNames[0];
    const outName = session.outputNames[0];

    function cropIsDark(ln){
      try{
        const c = document.createElement('canvas');
        const w = Math.min(80, Math.max(8, ln.w|0));
        const h = Math.min(80, Math.max(8, ln.h|0));
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.drawImage(ln.canvas, ln.x, ln.y, ln.w, ln.h, 0, 0, w, h);
        const d = cx.getImageData(0,0,w,h).data;
        let sum = 0, n = w*h;
        for(let i=0;i<d.length;i+=4) sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        return (sum/n) < 120;
      }catch(e){ return false; }
    }

    function scoreText(t){
      if(!t) return -100;
      const raw = t.replace(/\s+/g, ' ').trim();
      if(!raw) return -100;
      const words = raw.toLowerCase().normalize('NFC').split(/\s+/).filter(Boolean);
      let hits = 0, letters = 0, garbage = 0;
      for(const w of words){
        const clean = w.replace(/[^a-zà-ü]/gi,'');
        letters += clean.length;
        if(clean.length >= 3 && (PT_BALLOON_WORDS.has(clean) || OCR_FORCED[clean])) hits += 3;
        else if(clean.length >= 3 && /^[a-zà-ü]+$/i.test(clean)) hits += 0.8;
        else if(clean.length === 1) hits -= 0.3;
        if(/[0-9]{2,}/.test(w) || /cY|Ylow|Ohtnee|MoeOP|cYalow/i.test(w)) garbage += 4;
        if(/^[|/\\~^`<>[\]{}*_=]+$/.test(w)) garbage += 3;
        if(/[^a-zà-ü0-9.,!?;:'"\-—–()\s]/i.test(w)) garbage += 0.5;
      }
      const lenBonus = Math.min(raw.length, 80) * 0.35;
      const wordBonus = Math.min(words.length, 12) * 1.2;
      return hits * 2.5 + lenBonus + wordBonus - garbage * 5;
    }

    function stripPhantom(t){
      if(!t) return '';
      let s = t.replace(/\s+/g, ' ').trim();
      // prefixos tipicos de borda/rabo do balao
      s = s.replace(/^(cYalowb?l?|Ohtnee|MoeOPme)\s*/i, '');
      s = s.replace(/^[\s|/\\~^`<>[\]{}*_=\-]+/, '');
      s = s.replace(/^([ZYXVW0-9]|ys|zs|2\/|•2\/?|M\s*o,)\s+/i, '');
      s = s.replace(/^([ZYXVW])\s+/i, '');
      // tokens so de simbolos
      s = s.split(/\s+/).filter(w=>{
        const core = w.replace(/[^a-zà-ü0-9]/gi,'');
        if(!core && /^[|/\\~^`<>[\]{}*_=\-0-9]{1,3}$/.test(w)) return false;
        if(/^cY/i.test(w)) return false;
        return true;
      }).join(' ');
      s = s.replace(/\s+([.,!?;:])/g, '$1').trim();
      return s;
    }

    async function runOne(ln, mode, label){
      toastProgress(label);
      await new Promise(r => setTimeout(r, 6));
      // tenta com e sem tight — fica com o melhor na bestForCrop via score
      const tight = tightInkCrop(ln.canvas, ln.x, ln.y, ln.w, ln.h);
      const tensor = preprocessLineForPpocr(ln.canvas, tight.x, tight.y, tight.w, tight.h, mode);
      const results = await session.run({ [inputName]: tensor });
      const out = results[outName];
      const dims = out.dims ? Array.from(out.dims) : [];
      return stripPhantom(decodePpocrOutput(out.data, dims));
    }

    async function bestForCrop(ln, tag, forceAllModes){
      const dark = cropIsDark(ln);
      const modes = dark ? ['invert', 'normal', 'contrast'] : ['normal', 'contrast', 'invert'];
      let best = '', bestSc = -999;
      for(const mode of modes){
        const t = await runOne(ln, mode, tag + ' [' + mode + ']');
        const sc = scoreText(t);
        if(sc > bestSc){ bestSc = sc; best = t || ''; }
        if(!forceAllModes && bestSc >= 28 && (best || '').length >= 8) break;
      }
      return { text: best, score: bestSc };
    }

    async function ocrWithMargin(margin){
      const bx = Math.max(0, b.x + b.w * margin);
      const by = Math.max(0, b.y + b.h * margin);
      const bw = Math.max(0.01, b.w * (1 - 2 * margin));
      const bh = Math.max(0.01, b.h * (1 - 2 * margin));
      const { full, lines } = splitBalloonLines(img, bx, by, bw, bh);

      const lineParts = [];
      const maxLines = Math.min(lines.length, 10);
      for(let i = 0; i < maxLines; i++){
        const r = await bestForCrop(
          lines[i],
          `m${Math.round(margin*100)} L${i+1}/${maxLines}`,
          false
        );
        if(r.text && r.text.trim().length >= 1) lineParts.push(r.text.trim());
      }
      const linesJoined = stripPhantom(lineParts.join(' '));
      const linesJoinedScore = scoreText(linesJoined);

      // balão inteiro só se linhas fracas (PP-OCR é de linha; full costuma piorar)
      let fullText = '', fullScore = -100;
      if(linesJoinedScore < 12 || linesJoined.length < 6){
        const fullRes = await bestForCrop(full, `m${Math.round(margin*100)} full`, true);
        fullText = stripPhantom(fullRes.text || '');
        fullScore = scoreText(fullText);
      }

      const text = fullScore > linesJoinedScore ? fullText : (linesJoined || fullText);
      const score = Math.max(linesJoinedScore, fullScore);
      return { text, score, margin };
    }

    // Testa 3 margens (achado nos testes: 0–4% é a faixa útil)
    const margins = area < 0.003 ? [0, 0.02, 0.04] : [0.0, 0.02, 0.04];
    let best = { text: '', score: -999, margin: 0 };
    for(const m of margins){
      toastProgress('OCR margem ' + Math.round(m*100) + '%…');
      const r = await ocrWithMargin(m);
      console.log('OCR margin', m, r.score, r.text);
      if(r.score > best.score || (r.score === best.score && (r.text||'').length > (best.text||'').length)){
        best = r;
      }
      // se ja ficou muito bom, nao gasta as outras margens
      if(best.score >= 35 && (best.text||'').length >= 12) break;
    }

    toastEl.classList.remove('show');
    let text = stripPhantom((best.text || '').replace(/\s+/g, ' ').trim());
    if(!text){
      toast('OCR não leu texto (veja o Console F12). Ajuste o balão ou digite.', 5500);
      return null;
    }
    text = correctOcrText(text);
    text = stripPhantom(text);
    return text;
  }catch(e){
    console.error('OCR PP-OCR erro', e);
    const msg = (e && e.message) ? e.message : String(e);
    if(/cancelad|selecionado|Falha ao ler|create|wasm|Compile|memory|OOM/i.test(msg) || !ppocrModelBuffer){
      ppocrSessionPromise = null;
    }
    toast('OCR falhou: ' + msg, 7000);
    return null;
  }
}

    // fallback localStorage (só se for pequeno)
    try{
      const s = JSON.stringify(data);
      if(s.length < 2_000_000) await storeSet(catalogStoreKey(), data);
      else toast('Catálogo grande: salvo só nesta sessão (falha no armazenamento)', 5000);
    }catch(e){
      console.warn(e);
      toast('Não consegui gravar o catálogo no aparelho', 4000);
    }
  }
  return ok;
}

async function catalogLoadLocal(){
  const rec = await idbGetCatalog();
  if(rec && rec.data && (rec.data.series || rec.data.publishers)){
    await catalogApplyOverrides(rec.data);
    state.jsonCatalog = rec.data;
    return rec.data;
  }
  // fallback localStorage antigo
  const data = await storeGet(catalogStoreKey());
  if(data && (data.series || data.publishers)){
    await catalogApplyOverrides(data);
    state.jsonCatalog = data;
    // migra pra IDB
    try{ await idbPutCatalog(data, null); }catch(_){}
    return data;
  }
  return null;
}


function catalogApplyFilter(q){
  const data = state.jsonCatalog;
  if(!data || !data.series) return [];
  q = (q || '').trim().toLowerCase();
  if(!q) return data.series;
  return data.series.filter(s=>{
    if((s.name || '').toLowerCase().indexOf(q) >= 0) return true;
    return (s.books || []).some(b=>{
      const t = ((b.title||'') + ' ' + (b.filename||'') + ' ' + (b.number||'')).toLowerCase();
      return t.indexOf(q) >= 0;
    });
  });
}



function catalogBack(){
  const n = state.catalogNav || { level: 'publishers' };
  if(n.level === 'bookDetail'){
    // volta para lista anterior
    if(n.mode === 'saga' || n.saga){
      n.level = 'sagaBooks';
      n.book = null;
    } else if(n.series){
      n.level = 'books';
      n.mode = 'series';
      n.book = null;
    } else {
      n.level = 'publishers';
      n.book = null;
    }
  } else if(n.level === 'books' || n.level === 'sagaBooks'){
    if(n.mode === 'saga' || n.saga){ n.level = 'sagas'; n.saga = null; n.books = null; n.series = null; }
    else { n.level = 'series'; n.series = null; n.books = null; }
  } else if(n.level === 'sagas' || n.level === 'series'){
    n.level = 'publishers'; n.pub = null; n.mode = 'series';
  } else {
    n.level = 'publishers';
  }

}

function catalogSortBooks(list, orderLabel){
  const arr = (list || []).slice();
  const key = (b) => {
    if(orderLabel === 'AlternateNumber'){
      const a = parseFloat(String(b.alternate_number||'').replace(',','.'));
      if(!isNaN(a)) return a;
    }
    const n = parseFloat(String(b.number||'').replace(',','.'));
    if(!isNaN(n)) return n;
    return 99999;
  };
  arr.sort((a,b)=>{
    const ka = key(a), kb = key(b);
    if(ka !== kb) return ka - kb;
    return String(a.title||a.filename||'').localeCompare(String(b.title||b.filename||''));
  });
  return arr;
}
function catalogBookDateKey(b){
  if(!b) return 99999999;
  const y = parseInt(b.year, 10);
  if(!y || isNaN(y)) return 99999999;
  let m = parseInt(b.month, 10);
  if(isNaN(m) || m < 1 || m > 12) m = 1;
  let d = parseInt(b.day, 10);
  if(isNaN(d) || d < 1 || d > 31) d = 1;
  return y * 10000 + m * 100 + d;
}
function catalogFirstDateKey(list){
  const arr = list || [];
  let best = 99999999;
  arr.forEach(b => {
    const k = catalogBookDateKey(b);
    if(k < best) best = k;
  });
  return best;
}
function catalogFirstBook(list, orderLabel){
  const sorted = catalogSortBooks(list, orderLabel || 'Number');
  return sorted[0] || null;
}
function catalogCoverSrc(book){
  if(!book) return null;
  if(book.thumb) return book.thumb;
  return null;
}
function catalogCleanTitle(book, opts){
  opts = opts || {};
  const series = String(book.series || '').trim();
  let title = String(book.title || '').trim();
  const num = String(book.number || book.alternate_number || '').trim();
  const filename = String(book.filename || book.file || book.stem || '').trim();

  // se título vazio, tenta extrair do filename
  if(!title && filename){
    title = filename.replace(/\.(cbz|zip|cbr)$/i,'').trim();
  }

  // remove extensão se veio no title
  title = title.replace(/\.(cbz|zip|cbr)$/i,'').trim();

  // se o título é basicamente o nome da série (+ número), não ajuda
  const norm = (s) => String(s||'').toLowerCase().replace(/[^a-z0-9]+/gi,' ').trim();
  const nt = norm(title);
  const ns = norm(series);
  if(ns && (nt === ns || nt.indexOf(ns) === 0)){
    // tenta tirar série e tokens de volume/número do início
    let t = title;
    if(series){
      const re = new RegExp('^'+series.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i');
      t = t.replace(re,'').trim();
    }
    t = t.replace(/^v(ol(?:ume)?\.?)?\s*\d+\s*/i,'').trim();
    t = t.replace(/^#?\s*\d+\s*/i,'').trim();
    t = t.replace(/^\(of\s*\d+\)\s*/i,'').trim();
    t = t.replace(/^\(\d{4}\)\s*/i,'').trim();
    t = t.replace(/^[-–—:·.]\s*/,'').trim();
    // se sobrou algo útil e não parece "V2013 #1 (of 41) (2013)"
    if(t && !/^v?\d+\s*#?\d*/i.test(t) && !/^\(?of\s*\d+/i.test(t)){
      title = t;
    }
  }

  // se ainda parece filename técnico (muitos # e (of N) e ano no fim), simplifica
  if(/\bv\d+\s*#\d+/i.test(title) || /\(of\s*\d+\)/i.test(title)){
    // remove padrões comuns de nome de arquivo de HQ
    let t = title;
    if(series) t = t.replace(new RegExp(series.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), '').trim();
    t = t.replace(/\bv(?:ol(?:ume)?\.?)?\s*\d+/ig,'');
    t = t.replace(/#\s*\d+/g,'');
    t = t.replace(/\(of\s*\d+\)/ig,'');
    t = t.replace(/\(\d{4}\)/g,'');
    t = t.replace(/\b\d{4}\b/g,'');
    t = t.replace(/[-–—_:·]+/g,' ').replace(/\s+/g,' ').trim();
    if(t.length >= 3) title = t;
  }

  // se ficou vazio ou igual ao número, usa fallback curto
  if(!title || norm(title) === norm(num) || norm(title) === ns){
    if(opts.preferSeries && series) title = series;
    else title = '';
  }
  return title;
}
function catalogFormatDate(book){
  if(!book) return '';
  const y = book.year != null && book.year !== '' ? String(book.year) : '';
  let m = book.month != null && book.month !== '' ? String(book.month) : '';
  let d = book.day != null && book.day !== '' ? String(book.day) : '';
  // publish_date / date fields
  const raw = String(book.date || book.publish_date || book.publication_date || book.releasedate || '').trim();
  if(raw){
    // already formatted?
    if(/^\d{4}/.test(raw) || /^\d{1,2}\/\d{1,2}/.test(raw) || /^\d{1,2}\/\d{4}/.test(raw)) return raw;
  }
  if(m && m.length === 1) m = '0' + m;
  if(d && d.length === 1) d = '0' + d;
  if(y && m && d) return d + '/' + m + '/' + y;
  if(y && m) return m + '/' + y;
  if(y) return y;
  return raw || '';
}
function catalogFormatLine1(book, opts){
  opts = opts || {};
  const num = opts.useAlt
    ? (book.alternate_number || book.number || '')
    : (book.number || book.alternate_number || '');
  const title = catalogCleanTitle(book, opts);
  const parts = [];
  if(num) parts.push('#' + num);
  // dentro da série não repete o nome da série
  if(opts.insideSeries){
    if(title) parts.push(title);
  } else {
    // lista de saga / genérica: série · título (se diferente)
    if(book.series) parts.push(book.series);
    if(title && title.toLowerCase() !== String(book.series||'').toLowerCase()) parts.push(title);
  }
  return parts.length ? parts.join(' · ') : (book.filename || '(sem título)');
}
function catalogFormatLine2(book, opts){
  opts = opts || {};
  const parts = [];
  if(book.volume) parts.push('Vol. ' + book.volume);
  const dt = catalogFormatDate(book);
  if(dt) parts.push(dt);
  if(book.story_arc && !opts.hideArc) parts.push(book.story_arc);
  if(opts.useAlt && book.number && String(book.number) !== String(book.alternate_number||'')){
    parts.push('ed. ' + book.number);
  }
  return parts.join(' · ') || '—';
}
function catalogOpenBookDetail(book, orderLabel){
  state.catalogNav = Object.assign({}, state.catalogNav || {}, {
    level: 'bookDetail', book: book, order: orderLabel || (state.catalogNav && state.catalogNav.order) || 'Number'
  });
  renderJsonCatalog();
}
async function catalogSaveBookOverride(book, fields){
  // salva override local por id
  const key = 'catalog-overrides';
  const all = (await storeGet(key)) || {};
  const id = book.id || book.filename || book.stem;
  all[id] = Object.assign({}, all[id] || {}, fields, { savedAt: Date.now() });
  await storeSet(key, all);
  // aplica no objeto em memória
  Object.keys(fields).forEach(k=>{ book[k] = fields[k]; });
  toast('Metadados salvos neste aparelho ✓', 2500);
}
async function catalogApplyOverrides(data){
  if(!data) return data;
  const all = (await storeGet('catalog-overrides')) || {};
  const apply = (b)=>{
    if(!b) return;
    const id = b.id || b.filename || b.stem;
    if(all[id]) Object.assign(b, all[id]);
  };
  (data.series || []).forEach(s => (s.books||[]).forEach(apply));
  (data.publishers || []).forEach(p => {
    (p.series || []).forEach(s => (s.books||[]).forEach(apply));
    (p.sagas || []).forEach(sg => (sg.books||[]).forEach(apply));
  });
  return data;
}
function catalogFindBookByFilename(name){
  const data = state.jsonCatalog;
  if(!data || !name) return null;
  const base = String(name).toLowerCase();
  const stem = base.replace(/\.cbz$/i,'').replace(/\.zip$/i,'');
  let found = null;
  const visit = (b)=>{
    if(found || !b) return;
    const fn = String(b.filename||'').toLowerCase();
    const st = String(b.stem||'').toLowerCase();
    const file = String(b.file||'').toLowerCase();
    if(fn === base || st === stem || file.endsWith(base) || fn === stem + '.cbz') found = b;
  };
  (data.series||[]).forEach(s => (s.books||[]).forEach(visit));
  if(!found) (data.publishers||[]).forEach(p => (p.series||[]).forEach(s => (s.books||[]).forEach(visit)));
  return found;
}

      const emoji = document.createElement('span');

      emoji.textContent = icon || '📚';

      if(coverSrc){

        // icons/ e urls absolutas: tenta <img>

          const img = document.createElement('img');
          img.alt = '';

          img.src = src;
          img.onload = function(){

      b.type = 'button';
      b.textContent = label;
      const on = (nav.mode === mode) || (nav.level === mode);
      b.style.cssText = 'flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;font-family:inherit;cursor:pointer;' +
        (on ? 'background:var(--accent);color:#fff;' : 'background:var(--panel-2);color:var(--text);border:1px solid var(--border);');
      b.onclick = () => {
        state.catalogNav = { level: mode, pub: pub, series: null, saga: null, mode: mode };
        renderJsonCatalog();
      };
      tog.appendChild(b);
    });
    grid.appendChild(tog);

    if(nav.mode === 'sagas' || nav.level === 'sagas'){
      let sagas = pub.sagas || [];
      if(q) sagas = sagas.filter(s => (s.name||'').toLowerCase().indexOf(q)>=0);
      if(countEl) countEl.textContent = sagas.length + ' sagas';
      if(!sagas.length){
        const empty = document.createElement('div');
        empty.style.cssText = 'grid-column:1/-1;padding:12px;color:var(--text-dim);';
        empty.textContent = 'Nenhuma saga (SeriesGroup) nos metadados desta editora.';
        grid.appendChild(empty);
        return;
      }
      sagas = sagas.slice().sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'pt', {sensitivity:'base'}));
      sagas.forEach(sg => {
        const first = catalogFirstBook(sg.books || [], 'AlternateNumber');
        const cover = catalogCoverSrc(first);
        const y = first && first.year ? (' · ' + first.year) : '';
        addCard(sg.name, (sg.count||0) + ' eds' + y, () => {
          state.catalogNav = { level: 'sagaBooks', pub: pub, saga: sg, mode: 'saga', order: 'AlternateNumber' };
          renderJsonCatalog();
        }, '📖', cover);
      });
      return;
    }

    // SERIES list — highlight arcs in subtitle
    let series = pub.series || [];
    if(q){
      series = series.filter(s => {
        if((s.name||'').toLowerCase().indexOf(q)>=0) return true;
        if((s.arcs||[]).some(a => (a.name||'').toLowerCase().indexOf(q)>=0)) return true;
        return (s.books||[]).some(b => ((b.title||'')+' '+(b.filename||'')).toLowerCase().indexOf(q)>=0);
      });
    }
    if(countEl) countEl.textContent = series.length + ' séries';
    // ordem alfabética pelo nome da série
    series = series.slice().sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'pt', {sensitivity:'base'}));
    series.forEach(s => {
      const arcs = s.arcs || [];
      let sub = (s.count||0) + ' vols';
      const first = catalogFirstBook(s.books || [], 'Number');
      if(first && first.year) sub += ' · desde ' + first.year;
      if(arcs.length) sub += ' · ' + arcs.length + ' arco(s)';
      const cover = catalogCoverSrc(first);
      addCard(s.name, sub, () => {
        state.catalogNav = { level: 'books', pub: pub, series: s, mode: 'series', order: 'Number' };
        renderJsonCatalog();
      }, '📚', cover);
    });
    return;
  }

  // --- books of a series: ordem Number; grupos consecutivos (arco ou sem arco) ---
  if(nav.level === 'books' && nav.mode === 'series' && nav.series){
    const s = nav.series;
    if(countEl) countEl.textContent = (s.count||0) + ' vols' + ((s.arcs||[]).length ? (' · ' + (s.arcs||[]).length + ' arcos') : '');

    const host = document.createElement('div');
    host.style.cssText = 'grid-column:1/-1;display:flex;flex-direction:column;gap:12px;padding-bottom:24px;';

    const makeBookRow = (b) => {
      const row = document.createElement('div');
      row.className = 'catalog-book-row';
      const sagaName = String(b.series_group || b.seriesGroup || '').trim();
      if(sagaName) row.classList.add('in-saga');
      const num = b.number || b.alternate_number || '';
      const cover = document.createElement('div');
      cover.className = 'catalog-book-cover';
      cover.textContent = num ? String(num) : 'HQ';
      if(b.thumb) catalogLoadThumb(b.thumb, cover, num);
      const body = document.createElement('div');
      body.className = 'catalog-book-body';
      const line1 = document.createElement('div');
      line1.className = 'catalog-book-line1';
      line1.textContent = catalogFormatLine1(b, { insideSeries: true });
      const line2 = document.createElement('div');
      line2.className = 'catalog-book-line2';
      // dentro do grupo de arco, não repete o nome do arco na linha 2
      line2.textContent = catalogFormatLine2(b, { hideArc: true });
      body.appendChild(line1);
      body.appendChild(line2);
      // destaque se também participa de saga/evento (SeriesGroup)
      if(sagaName){
        const badge = document.createElement('div');
        badge.className = 'catalog-saga-badge';
        badge.textContent = 'SAGA · ' + sagaName;
        badge.title = 'Também faz parte da saga/evento: ' + sagaName;
        body.appendChild(badge);
      }
      row.appendChild(cover);
      row.appendChild(body);
      row.style.cursor = 'pointer';
      row.onclick = () => catalogOpenBookDetail(b, 'Number');
      return row;
    };

    const arcKey = (b) => String(b.story_arc || '').trim();

    // 1) todas as eds em ordem de Number
    const ordered = catalogSortBooks(s.books || [], 'Number');

    // 2) agrupa só trechos consecutivos com o mesmo arco (ou sem arco)
    const segments = [];
    ordered.forEach(b => {
      const key = arcKey(b);
      const last = segments[segments.length - 1];
      if(last && last.key === key){
        last.books.push(b);
      } else {
        segments.push({ key: key, books: [b] });
      }
    });

    segments.forEach(seg => {
      const hasArc = !!seg.key;
      // com arco: caixa maior; sem arco: se várias consecutivas, uma caixa "sem arco";
      // se só 1 edição sem arco, ainda assim caixa (mantém padrão visual)
      const group = document.createElement('div');
      group.className = 'catalog-arc-group' + (hasArc ? '' : ' no-arc');
      const head = document.createElement('div');
      head.className = 'catalog-arc-head';
      head.innerHTML = '<span class="arc-badge"></span><span class="arc-title"></span><span class="arc-count"></span>';
      head.querySelector('.arc-badge').textContent = hasArc ? 'ARCO' : '—';
      head.querySelector('.arc-title').textContent = hasArc ? seg.key : 'Sem arco';
      head.querySelector('.arc-count').textContent = seg.books.length + ' eds';
      const body = document.createElement('div');
      body.className = 'catalog-arc-body';
      seg.books.forEach(b => body.appendChild(makeBookRow(b)));
      group.appendChild(head);
      group.appendChild(body);
      host.appendChild(group);
    });

    if(!ordered.length){
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:12px;color:var(--text-dim);';
      empty.textContent = 'Nenhuma edição nesta série.';
      host.appendChild(empty);
    }

    grid.appendChild(host);
    return;
  }

  if(nav.level === 'books'){
    showBookList(nav.books || [], nav.order || 'Number');
    return;
  }

  if(nav.level === 'sagaBooks' && nav.saga){
    const sg = nav.saga;
    const order = nav.order || 'AlternateNumber';
    if(countEl) countEl.textContent = (sg.count||0) + ' eds na saga';
    const tog = document.createElement('div');
    tog.className = 'catalog-order-tog';
    [['AlternateNumber','Ordem de leitura'],['Number','Ordem de edição']].forEach(([ord, label])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if(order === ord) b.className = 'on';
      b.onclick = ()=>{
        state.catalogNav = Object.assign({}, nav, { order: ord });
        renderJsonCatalog();
      };
      tog.appendChild(b);
    });
    grid.appendChild(tog);
    const list = catalogSortBooks(sg.books || [], order);
    showBookList(list, order);
    return;
  }

  if(nav.level === 'bookDetail' && nav.book){
    showBookDetail(nav.book, nav.order || 'Number');
    return;
  }

  state.catalogNav.level = 'publishers';
  renderJsonCatalog();
}

  state.catalogNav = { level: 'books', pub: pub, series: s, mode: 'series', order: 'Number' };

/* Cache de thumbs do catálogo (blob URLs) */
state.catalogThumbCache = state.catalogThumbCache || {};
state.driveThumbsFolderId = state.driveThumbsFolderId || null;

async function driveEnsureThumbsFolder(){
  if(state.driveThumbsFolderId) return state.driveThumbsFolderId;
  try{
    const saved = await storeGet('drive-thumbs-folder');
    if(saved && saved.id){
      state.driveThumbsFolderId = saved.id;
      return state.driveThumbsFolderId;
    }
  }catch(_){}
  const parent = await driveEnsureFolder();
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='thumbs' and '" + parent + "' in parents and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'erro pasta thumbs');
  if(data.files && data.files.length){
    state.driveThumbsFolderId = data.files[0].id;
    try{ await storeSet('drive-thumbs-folder', { id: state.driveThumbsFolderId }); }catch(_){}
    return state.driveThumbsFolderId;
  }
  const cr = await driveFetch('/drive/v3/files?fields=id,name', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: 'thumbs',
      mimeType: 'application/vnd.google-apps.folder',
      parents: [parent]
    })
  });
  const created = await cr.json();
  if(!cr.ok) throw new Error((created.error && created.error.message) || 'criar pasta thumbs');
  state.driveThumbsFolderId = created.id;
  try{ await storeSet('drive-thumbs-folder', { id: state.driveThumbsFolderId }); }catch(_){}
  return state.driveThumbsFolderId;
}

/** Upload multipart com Blob (melhor no navegador; evita CORS do resumable) */
async function driveUploadSimpleFile(folderId, fileName, blob, mime){
  mime = mime || 'image/jpeg';
  if(!blob || !(blob.size > 0)) throw new Error('arquivo vazio: ' + fileName);

  const q = encodeURIComponent("name='" + fileName.replace(/'/g, "\\'") + "' and '" + folderId + "' in parents and trashed=false");
  const listRes = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id)&pageSize=3');
  const list = await listRes.json();
  if(!listRes.ok) throw new Error((list.error && list.error.message) || 'listar');
  const existing = list.files && list.files[0];

  const metadata = existing
    ? { name: fileName, mimeType: mime }
    : { name: fileName, mimeType: mime, parents: [folderId] };

  const boundary = 'balao_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  const metaStr = JSON.stringify(metadata);
  const body = new Blob([
    '--' + boundary + '\r\n' +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    metaStr + '\r\n' +
    '--' + boundary + '\r\n' +
    'Content-Type: ' + mime + '\r\n\r\n',
    blob,
    '\r\n--' + boundary + '--'
  ], { type: 'multipart/related; boundary=' + boundary });

  const url = existing
    ? ('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart&fields=id,name,size')
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size';
  const up = await fetch(url, {
    method: existing ? 'PATCH' : 'POST',
    headers: { 'Authorization': 'Bearer ' + state.drive.token },
    body: body
  });
  let created = null;
  try{ created = await up.json(); }catch(_){}
  if(!up.ok){
    const msg = (created && created.error && created.error.message) || ('upload HTTP ' + up.status + ' ' + fileName);
    throw new Error(msg);
  }
  if(!created || !created.id) throw new Error('upload sem id: ' + fileName);
  return created;
}

async function driveCountThumbsInFolder(folderId){
  const q = encodeURIComponent("'" + folderId + "' in parents and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id)&pageSize=1000');
  const data = await res.json();
  if(!res.ok) return -1;
  return (data.files && data.files.length) || 0;
}

function idbOpenThumbs(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('balao-thumbs', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutThumb(name, blob){
  try{
    const db = await idbOpenThumbs();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('thumbs', 'readwrite');
      tx.objectStore('thumbs').put(blob, name);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn('idb put thumb', name, e); }
}
async function idbGetThumb(name){
  try{
    const db = await idbOpenThumbs();
    const blob = await new Promise((resolve, reject)=>{
      const tx = db.transaction('thumbs', 'readonly');
      const r = tx.objectStore('thumbs').get(name);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    return blob || null;
  }catch(e){ return null; }
}

function catalogXferShow(title, sub, done, total){
  const box = $('#catalogXfer');
  if(!box) return;
  box.classList.add('on');

  const pct = $('#catalogXferPct');

  if(s) s.textContent = sub || '';
  const p = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
  if(fill) fill.style.width = p + '%';

  if(!box) return;
  setTimeout(()=>{
    box.classList.remove('on');
    const fill = $('#catalogXferFill');
    if(fill) fill.style.width = '0%';
  }, delayMs || 0);
}

async function catalogUploadThumbs(fileList){
  const files = Array.from(fileList || []);
  if(!files.length){
    toast('Nenhuma imagem selecionada', 2500);
    return false;
  }
  // Drive: tenta; se não estiver logado, ainda salva no aparelho
  const driveOk = !!(state.drive && state.drive.token);
  if(!driveOk){
    toast('Google desconectado: vou guardar as capas só neste aparelho', 4500);
  }
  try{
    catalogXferShow('Preparando thumbs…', files.length + ' arquivo(s) selecionado(s)', 0, 1);
    toastProgress('Preparando thumbs…');
    let folderId = null;
    if(driveOk){
      try{
        folderId = await driveEnsureThumbsFolder();
      }catch(e){
        console.warn('pasta thumbs', e);
        toast('Não criou pasta no Drive: ' + (e.message||e) + ' — salvando só no aparelho', 7000);
      }
    }
    // Expande .zip se necessário
    const toUpload = [];
    for(let fi = 0; fi < files.length; fi++){
      const f = files[fi];
      const name = (f.name || '').toLowerCase();
      catalogXferShow('Lendo arquivos…', f.name || '', fi, files.length);
      if(name.endsWith('.zip')){
        const zip = await JSZip.loadAsync(f);
        const entries = Object.keys(zip.files).filter(n => {
          const base = n.split('/').pop().toLowerCase();
          return !zip.files[n].dir && /\.(jpe?g|png|webp)$/i.test(base);
        });
        for(const entry of entries){
          const base = entry.split('/').pop();
          const blob = await zip.files[entry].async('blob');
          const mime = base.toLowerCase().endsWith('.png') ? 'image/png'
            : base.toLowerCase().endsWith('.webp') ? 'image/webp' : 'image/jpeg';
          toUpload.push({ name: base, blob, mime });
        }
      } else {
        const base = (f.name || 'thumb.jpg').split(/[/\\]/).pop();
        const mime = f.type || (base.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg');
        toUpload.push({ name: base, blob: f, mime });
      }
    }
    if(!toUpload.length){
      catalogXferHide();
      toast('Nenhuma imagem encontrada nos arquivos', 3500);
      return false;
    }
    let ok = 0, fail = 0;
    const total = toUpload.length;
    for(let i = 0; i < total; i++){
      const item = toUpload[i];
      catalogXferShow('Enviando thumbs ao Drive', item.name, i, total);
      toastProgress('Enviando ' + (i+1) + '/' + total + ' — ' + item.name);
      // sempre guarda no aparelho (aparece mesmo se Drive falhar)
      try{
        await idbPutThumb(item.name, item.blob);
        const url = URL.createObjectURL(item.blob);
        state.catalogThumbCache['thumbs/' + item.name] = url;
        state.catalogThumbCache[item.name] = url;
      }catch(_){}
      if(folderId){
        try{
          await driveUploadSimpleFile(folderId, item.name, item.blob, item.mime);
          ok++;
        }catch(e){
          console.warn('thumb upload', item.name, e);
          fail++;
          if(!window._lastThumbErr) window._lastThumbErr = (e && e.message) ? e.message : String(e);
        }
      } else {
        // só local
        ok++;
      }
      catalogXferShow('Enviando thumbs ao Drive', item.name, i + 1, total);
    }
    let inFolder = -1;
    try{ inFolder = await driveCountThumbsInFolder(folderId); }catch(_){}
    const summary = ok + ' ok' + (fail ? ' · ' + fail + ' falha(s)' : '') +
      (inFolder >= 0 ? (' · pasta thumbs: ' + inFolder + ' arquivo(s)') : '');
    catalogXferShow(
      fail ? 'Envio concluído com falhas' : 'Envio concluído',
      summary,
      total, total
    );
    toast('Thumbs: ' + summary, 6000);
    if(fail){
      const err = window._lastThumbErr || 'erro desconhecido';
      window._lastThumbErr = null;
      toast('Drive falhou em algumas: ' + err, 8000);
    }
    // capas já estão no aparelho via IDB/cache — atualiza lista

    catalogXferHide(4000);
    if(state.screen === 'catalog') renderJsonCatalog();
    return ok > 0;
  }catch(e){
    console.error(e);
    catalogXferHide();
    toast('Thumbs: ' + (e.message || e), 6000);
    return false;
  }
}

async function catalogLoadThumb(thumbPath, coverEl, fallbackNum, onDone){
  if(!thumbPath || !coverEl) return;
  const baseName = String(thumbPath).split('/').pop();
  const finish = (ok) => { if(typeof onDone === 'function') try{ onDone(baseName || thumbPath); }catch(_){} };
  const applyBlob = (blob) => {
    if(!blob || !coverEl.isConnected) return false;
    const url = URL.createObjectURL(blob);
    state.catalogThumbCache[thumbPath] = url;
    state.catalogThumbCache[baseName] = url;
    const img = document.createElement('img');
    img.alt = '';
    img.src = url;
    coverEl.textContent = '';
    coverEl.appendChild(img);
    return true;
  };
  try{
    if(/^https?:\/\//i.test(thumbPath) || thumbPath.indexOf('blob:') === 0 || thumbPath.indexOf('data:') === 0){
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = thumbPath;
      img.onload = ()=>{ coverEl.textContent = ''; coverEl.appendChild(img); };
      return;
    }
    if(state.catalogThumbCache[thumbPath] || state.catalogThumbCache[baseName]){
      const img = document.createElement('img');
      img.alt = '';
      img.src = state.catalogThumbCache[thumbPath] || state.catalogThumbCache[baseName];
      coverEl.textContent = '';
      coverEl.appendChild(img);
      return;
    }
    // cache local (IndexedDB) — aparelho que enviou as thumbs
    const local = await idbGetThumb(baseName);
    if(local && applyBlob(local)){ return; }
    if(!state.drive || !state.drive.token){ finish(false); return; }
    if(!baseName){ finish(false); return; }
    let fileId = null;
    try{
      const thumbsId = await driveEnsureThumbsFolder();
      const q1 = encodeURIComponent("name='" + baseName.replace(/'/g, "\\'") + "' and '" + thumbsId + "' in parents and trashed=false");
      const r1 = await driveFetch('/drive/v3/files?q=' + q1 + '&fields=files(id)&pageSize=2');
      const d1 = await r1.json();
      if(r1.ok && d1.files && d1.files[0]) fileId = d1.files[0].id;
    }catch(_){}
    if(!fileId){
      const q = encodeURIComponent("name='" + baseName.replace(/'/g, "\\'") + "' and trashed=false");
      const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=3');
      const data = await res.json();
      if(res.ok && data.files && data.files[0]) fileId = data.files[0].id;
    }
    if(!fileId){ finish(false); return; }
    const dl = await driveFetch('/drive/v3/files/' + fileId + '?alt=media');
    if(!dl.ok){ finish(false); return; }
    const blob = await dl.blob();
    const url = URL.createObjectURL(blob);
    state.catalogThumbCache[thumbPath] = url;
    state.catalogThumbCache[baseName] = url;
    if(coverEl.isConnected){
      const img = document.createElement('img');
      img.alt = '';
      img.src = url;
      coverEl.textContent = '';
      coverEl.appendChild(img);
    }
    finish(true);
  }catch(e){
    console.warn('thumb', thumbPath, e);
    if(coverEl && fallbackNum != null && fallbackNum !== '') coverEl.textContent = String(fallbackNum);
    finish(false);
  }
}

async function catalogImportFile(file){
  const text = await file.text();
  const data = JSON.parse(text);
  if(!data.series || !Array.isArray(data.series)){
    throw new Error('JSON inválido: falta series[]');
  }
  await catalogApplyOverrides(data);
  await catalogSaveLocal(data);
  state.catalogNav = { level: 'publishers', pub: null, series: null, saga: null, mode: 'series' };
  renderJsonCatalog();
  toast('Catálogo importado: ' + (data.totalBooks || 0) + ' volumes', 3000);
  // Se o Drive estiver conectado, sobe automaticamente (único jeito confiável de outros aparelhos baixarem)
  if(state.drive && state.drive.token){
    try{
      const ok = await catalogPushToDrive();
      if(ok) toast('Também enviado ao Drive ✓ — outros aparelhos podem baixar', 4000);
    }catch(e){ console.warn('auto push catalog', e); }
  } else {
    toast('Dica: entre no Google e toque em “Enviar ao Drive” para sincronizar entre aparelhos', 5500);
  }
}

async function catalogPullFromDrive(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  if(!state.drive || !state.drive.token){
    if(!silent) toast('Entre no Google Drive primeiro (aba Biblioteca)', 4000);
    return false;
  }
  try{
    if(!silent) toastProgress('Buscando catalogo.json no Drive…');
    const folderId = await driveEnsureFolder();
    const q = encodeURIComponent("name='catalogo.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=10');
    const data = await res.json();
    if(!res.ok) throw new Error((data.error && data.error.message) || 'erro Drive');
    const f = data.files && data.files[0];
    if(!f){
      if(!silent){
        toast('Nenhum catalogo.json visível no Drive do app. O Google só permite ver arquivos enviados pelo próprio Balão — importe o JSON e toque em “Enviar ao Drive” (não basta subir manualmente pela web).', 8000);
      }
      return false;
    }
    const prevMeta = await storeGet('catalogo-json-meta');
    const local = state.jsonCatalog || (await catalogLoadLocal());
    if(local && prevMeta && prevMeta.modifiedTime === f.modifiedTime && prevMeta.id === f.id){
      state.jsonCatalog = local;
      if(!silent) toast('Catálogo já sincronizado', 2000);
      return true;
    }
    const dl = await driveFetch('/drive/v3/files/' + f.id + '?alt=media');
    if(!dl.ok) throw new Error('Falha ao baixar catalogo.json');
    const json = await dl.json();
    if(!json.series && !json.publishers) throw new Error('JSON inválido');
    await storeSet('catalogo-json-meta', { id: f.id, modifiedTime: f.modifiedTime, name: f.name });
    await catalogSaveLocal(json);
    state.catalogNav = { level: 'publishers', pub: null, series: null, saga: null, mode: 'series' };
    if(state.screen === 'catalog') renderJsonCatalog();
    if(!silent) toast('Catálogo do Drive atualizado ✓', 3000);
    return true;
  }catch(e){
    console.error(e);
    if(!silent) toast('Drive: ' + (e.message || e), 5000);
    return false;
  }
}

async function catalogPushToDrive(){
  if(!state.jsonCatalog){
    toast('Importe um catalogo.json antes', 3000);
    return false;
  }
  if(!state.drive || !state.drive.token){
    toast('Entre no Google Drive primeiro', 4000);
    return false;
  }
  try{
    toastProgress('Enviando catalogo.json ao Drive…');
    const folderId = await driveEnsureFolder();
    const content = JSON.stringify(state.jsonCatalog);
    const q = encodeURIComponent("name='catalogo.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
    const list = await res.json();
    if(!res.ok) throw new Error((list.error && list.error.message) || 'erro listar');
    const existing = list.files && list.files[0];

    const meta = { name: 'catalogo.json', mimeType: 'application/json' };
    if(!existing) meta.parents = [folderId];
    const boundary = 'balao_boundary_' + Date.now();
    const metaPart = JSON.stringify(meta);
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      metaPart + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      content + '\r\n' +
      '--' + boundary + '--';

    const url = existing
      ? ('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart&fields=id,name,modifiedTime')
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime';
    const up = await fetch(url, {
      method: existing ? 'PATCH' : 'POST',
      headers: {
        'Authorization': 'Bearer ' + state.drive.token,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    });
    const created = await up.json();
    if(!up.ok) throw new Error((created.error && created.error.message) || 'upload falhou');
    await storeSet('catalogo-json-meta', { id: created.id, modifiedTime: created.modifiedTime, name: created.name });
    toast('catalogo.json no Drive ✓', 3500);
    return true;
  }catch(e){
    console.error(e);
    toast('Upload: ' + (e.message || e), 5000);
    return false;
  }
}

async function catalogAutoSync(){
  try{
    if(!state.jsonCatalog) await catalogLoadLocal();
    if(state.jsonCatalog && state.screen === 'catalog') renderJsonCatalog();
    if(!state.drive || !state.drive.token) return;
    await catalogPullFromDrive({ silent: true });
  }catch(e){ console.warn('catalog auto sync', e); }
}

async function komgaSaveCfg(){
  state.komga.url = (($('#komgaUrl') && $('#komgaUrl').value) || '').trim().replace(/\/$/, '');
  state.komga.user = (($('#komgaUser') && $('#komgaUser').value) || '').trim();
  state.komga.pass = (($('#komgaPass') && $('#komgaPass').value) || '');
  state.komga.key = (($('#komgaKey') && $('#komgaKey').value) || '').trim();
  await storeSet('komga-cfg', {

    pass: state.komga.pass,
    key: state.komga.key
  });
  state.komga.page = 0;
  await komgaLoadSeries(true);
