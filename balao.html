function setupOrtWasm(){
  if(typeof ort === 'undefined' || !ort.env || !ort.env.wasm) return;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  try { ort.env.wasm.numThreads = 1; } catch(e){}
  try { ort.env.wasm.proxy = false; } catch(e){}
  try { ort.env.wasm.simd = true; } catch(e){}
}

function pickOnnxFile(hint){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    if(hint) toast(hint, 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    // NÃO usar focus/cancel — isso rejeitava a Promise no meio da leitura
    input.click();
  });
}

async function fetchPpocrModelBuffer(){
  for(const url of PPOCR_MODEL_CANDIDATES){
    try{
      toastProgress('Baixando modelo OCR: ' + url + ' …');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 100000) continue; // muito pequeno, não é o modelo
      toastProgress('Modelo baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      console.warn('fetch modelo falhou', url, e);
    }
  }
  return null;
}

async function createPpocrSessionFromBuffer(buffer){
  setupOrtWasm();
  toastProgress('Compilando modelo OCR no WASM (15–60s na 1ª vez, aguarde)…');
  await new Promise(r => setTimeout(r, 50));
  try{
    const session = await ort.InferenceSession.create(buffer, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'basic'
    });
    return session;
  }catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    console.error('InferenceSession.create falhou', e);
    throw new Error('Falha ao compilar modelo ONNX: ' + msg + ' — use o arquivo latin_PP-OCRv5_rec_mobile_web.onnx');
  }
}

function getPpocrSession(){
  if(ppocrSessionPromise) return ppocrSessionPromise;

  ppocrSessionPromise = (async ()=>{
    try{
      let buffer = ppocrModelBuffer;
      if(!buffer){
        buffer = await fetchPpocrModelBuffer();
      }
      if(!buffer){
        // fallback: file picker (só funciona com clique do usuário)
        buffer = await pickOnnxFile('Modelo não encontrado no site. Selecione latin_PP-OCRv5_rec_mobile_web.onnx');
      }
      ppocrModelBuffer = buffer;
      const session = await createPpocrSessionFromBuffer(buffer);
      toast('Modelo OCR pronto ✓', 2500);
      return session;
    }catch(err){
      ppocrSessionPromise = null;
      throw err;
    }
  })();

  return ppocrSessionPromise;
}

async function preloadPpocrModel(){
  if(ppocrLoading){
    toast('Já está carregando o modelo… aguarde.', 3000);
    return false;
  }
  if(ppocrSessionPromise){
    try{
      await ppocrSessionPromise;
      toast('Modelo OCR já está pronto ✓', 2000);
      return true;
    }catch(e){
      ppocrSessionPromise = null;
    }
  }
  ppocrLoading = true;
  try{
    await getPpocrSession();
    return true;
  }catch(e){
    console.error('preload OCR', e);
    const msg = (e && e.message) ? e.message : String(e);
    toast('Não carregou o modelo: ' + msg, 8000);
    return false;
  }finally{
    ppocrLoading = false;
  }
}

/** Preprocess single text-line crop → CHW float32 [-1,1], height=48
 *  mode: 'normal' | 'invert' | 'contrast'
 */
function preprocessLineForPpocr(canvasSrc, sx, sy, sw, sh, mode){
  mode = mode || 'normal';
  const H = PPOCR_REC_H;
  let targetW = Math.round(sw * (H / Math.max(1, sh)));
  if(targetW < 16) targetW = 16;
  if(targetW > PPOCR_MAX_W) targetW = PPOCR_MAX_W;
  const padW = Math.ceil(targetW / 8) * 8;

  const canvas = document.createElement('canvas');
  canvas.width = padW;
  canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, padW, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvasSrc, sx, sy, sw, sh, 0, 0, targetW, H);

  const imgData = ctx.getImageData(0, 0, padW, H);
  const d = imgData.data;
  for(let i = 0; i < d.length; i += 4){
    let r = d[i], g = d[i+1], b = d[i+2];
    let gray = 0.299*r + 0.587*g + 0.114*b;
    if(mode === 'invert'){
      gray = 255 - gray;
    } else if(mode === 'contrast'){
      // estica contraste + leve binarização suave
      gray = gray < 128 ? gray * 0.55 : Math.min(255, gray * 1.25 + 20);
    }
    d[i] = d[i+1] = d[i+2] = gray;
  }
  ctx.putImageData(imgData, 0, 0);

  const out = ctx.getImageData(0, 0, padW, H).data;
  const chw = new Float32Array(3 * H * padW);
  const plane = H * padW;
  for(let p = 0; p < plane; p++){
    const v = out[p*4] / 255;
    const n = (v - 0.5) / 0.5;
    chw[p] = n;
    chw[plane + p] = n;
    chw[2*plane + p] = n;
  }
  return new ort.Tensor('float32', chw, [1, 3, H, padW]);
}

/** CTC greedy decode — blank=0, chars=1..len(dict), space=len+1 */
function decodePpocrOutput(data, dims){
  // Aceita [1,T,C] ou [1,C,T]
  let T, C, layout;
  if(dims.length === 3){
    if(dims[2] === 504 || dims[2] === PPOCR_DICT.length + 2){
      T = dims[1]; C = dims[2]; layout = 'btc';
    } else if(dims[1] === 504 || dims[1] === PPOCR_DICT.length + 2){
      C = dims[1]; T = dims[2]; layout = 'bct';
    } else {
      T = dims[1]; C = dims[2]; layout = 'btc';
    }
  } else {
    console.warn('OCR dims inesperados', dims);
    return '';
  }

  const chars = [];
  let prev = -1;
  const topIdx = [];
  for(let t = 0; t < T; t++){
    let bestIdx = 0, bestVal = -Infinity;
    for(let c = 0; c < C; c++){
      const v = layout === 'btc' ? data[t * C + c] : data[c * T + t];
      if(v > bestVal){ bestVal = v; bestIdx = c; }
    }
    if(t < 12) topIdx.push(bestIdx);
    if(bestIdx === prev) continue;
    if(bestIdx === PPOCR_BLANK){ prev = bestIdx; continue; }
    if(bestIdx === PPOCR_SPACE_IDX){
      chars.push(' ');
    } else if(bestIdx >= 1 && bestIdx <= PPOCR_DICT.length){
      chars.push(PPOCR_DICT[bestIdx - 1]);
    }
    prev = bestIdx;
  }
  const text = chars.join('').replace(/\s+/g, ' ').trim();
  if(!text){
    console.warn('OCR vazio. dims=', dims, 'layout=', layout, 'topIdx=', topIdx);
  } else {
    console.log('OCR ok:', text, 'dims=', dims);
  }
  return text;
}

/** Divide o recorte do balão em linhas de texto (projeção horizontal) */
/** Aperta o recorte na tinta real (ajuda balões redondos). */
function tightInkCrop(canvas, x, y, w, h){
  try{
    x = Math.max(0, Math.floor(x));
    y = Math.max(0, Math.floor(y));
    w = Math.max(1, Math.floor(w));
    h = Math.max(1, Math.floor(h));
    if(x + w > canvas.width) w = canvas.width - x;
    if(y + h > canvas.height) h = canvas.height - y;
    if(w < 8 || h < 8) return { x, y, w, h };

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(x, y, w, h);
    const d = id.data;
    let sum = 0, n = w * h;
    for(let i = 0; i < d.length; i += 4){
      sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    }
    const mean = sum / n;
    const darkInk = mean >= 130;
    const thr = darkInk ? (mean - 25) : (mean + 25);

    let minX = w, minY = h, maxX = 0, maxY = 0, count = 0;
    for(let row = 0; row < h; row++){
      for(let col = 0; col < w; col++){
        const i = (row * w + col) * 4;
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        const isInk = darkInk ? (g < thr) : (g > thr);
        if(isInk){
          count++;
          if(col < minX) minX = col;
          if(col > maxX) maxX = col;
          if(row < minY) minY = row;
          if(row > maxY) maxY = row;
        }
      }
    }
    if(count < n * 0.005) return { x, y, w, h };

    const padX = Math.max(2, Math.floor((maxX - minX) * 0.05));
    const padY = Math.max(2, Math.floor((maxY - minY) * 0.05));
    let nx = Math.max(0, minX - padX);
    let ny = Math.max(0, minY - padY);
    let nx2 = Math.min(w - 1, maxX + padX);
    let ny2 = Math.min(h - 1, maxY + padY);
    let nw = nx2 - nx + 1;
    let nh = ny2 - ny + 1;
    const areaRatio = (nw * nh) / (w * h);
    if(areaRatio < 0.15){
      // muito agressivo: usa pelo menos 50% do centro
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      nw = Math.max(nw, Math.floor(w * 0.5));
      nh = Math.max(nh, Math.floor(h * 0.5));
      nx = Math.max(0, Math.floor(cx - nw / 2));
      ny = Math.max(0, Math.floor(cy - nh / 2));
      nw = Math.min(w - nx, nw);
      nh = Math.min(h - ny, nh);
    }
    if(nw < 6 || nh < 6) return { x, y, w, h };
    return { x: x + nx, y: y + ny, w: nw, h: nh };
  }catch(e){
    return { x, y, w, h };
  }
}

function splitBalloonLines(imgEl, bx, by, bw, bh){
  const nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
  const sx = Math.max(0, Math.round(bx * nw));
  const sy = Math.max(0, Math.round(by * nh));
  const sw = Math.max(1, Math.round(bw * nw));
  const sh = Math.max(1, Math.round(bh * nh));

  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  tctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
  const idata = tctx.getImageData(0, 0, sw, sh);
  const d = idata.data;

  const proj = new Float32Array(sh);
  for(let y = 0; y < sh; y++){
    let dark = 0;
    for(let x = 0; x < sw; x++){
      const i = (y * sw + x) * 4;
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(gray < 180) dark++;
    }
    proj[y] = dark / sw;
  }
  let maxP = 0;
  for(let y = 0; y < sh; y++) if(proj[y] > maxP) maxP = proj[y];
  const th = Math.max(0.015, maxP * 0.12);

  const ranges = [];
  let start = -1;
  for(let y = 0; y < sh; y++){
    if(proj[y] > th){
      if(start < 0) start = y;
    } else if(start >= 0){
      if(y - start >= 2) ranges.push([start, y]);
      start = -1;
    }
  }
  if(start >= 0 && sh - start >= 2) ranges.push([start, sh]);

  const merged = [];
  for(let i = 0; i < ranges.length; i++){
    if(!merged.length){ merged.push(ranges[i]); continue; }
    const last = merged[merged.length - 1];
    if(ranges[i][0] - last[1] < 5) last[1] = ranges[i][1];
    else merged.push(ranges[i]);
  }

  // sempre inclui o crop inteiro como fallback no final da lista de tentativas
  const lineCrops = merged.map(([a, b])=>{
    const pa = Math.max(0, a - 2);
    const pb = Math.min(sh, b + 2);
    return { canvas: tmp, x: 0, y: pa, w: sw, h: Math.max(1, pb - pa) };
  }).filter(r => r.h >= 4);

  return {
    full: { canvas: tmp, x: 0, y: 0, w: sw, h: sh },
    lines: lineCrops.length ? lineCrops : [{ canvas: tmp, x: 0, y: 0, w: sw, h: sh }]
  };
}

  'enry': 'henry', 'mccoy': 'McCoy',
};

// Lixo típico de OCR em balões pequenos / SFX
const OCR_GARBAGE = /^(cYlowb?|Ohtnee|2|7s)$/i;

function ocrWordCandidates(word){
  const out = new Set([word]);
  for(let i = 0; i < word.length; i++){
    const ch = word[i];
    for(const [a,b] of OCR_CONFUSIONS){
      if(a.length === 1 && ch === a){
        out.add(word.slice(0,i) + b + word.slice(i+1));
      }
    }
  }
  if(word.toLowerCase().includes('rn')) out.add(word.replace(/rn/gi, 'm'));
  // padrões f→t em sufixos comuns de PT
  const low = word.toLowerCase();
  if(/fando$/.test(low)) out.add(word.slice(0,-5) + (word.slice(-5,-4) === word.slice(-5,-4).toUpperCase() ? 'Tando' : 'tando'));
  if(/fir/.test(low)) out.add(word.replace(/fir/gi, m => m[0] === 'F' ? 'Tir' : 'tir'));
  if(/muf/.test(low)) out.add(word.replace(/muf/gi, m => m[0] === 'M' ? 'Mut' : 'mut'));
  if(/murant/.test(low)) out.add(word.replace(/murant/gi, m => m[0] === 'M' ? 'Mutant' : 'mutant'));
  return [...out];
}

function scorePtWord(w){
  const lw = w.toLowerCase().normalize('NFC');
  if(!lw) return -1;
  if(OCR_GARBAGE.test(lw)) return -50;
  if(PT_BALLOON_WORDS.has(lw)) return 100;
  if(OCR_FORCED[lw]) return 90;
  if(/^[a-zà-ü]+$/i.test(lw) && lw.length >= 3) return 10;
  if(/^[a-zà-ü]+$/i.test(lw)) return 5;
  return 0;
}

function applyCaseLike(sample, replacement){
  if(!replacement) return replacement;
  if(!sample) return replacement;
  if(sample === sample.toUpperCase() && sample.length > 1) return replacement.toUpperCase();
  if(sample[0] === sample[0].toUpperCase()){
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement;
}

function correctOcrText(text){
  if(!text) return text;

  // 1) correções de frase inteira / padrões multi-palavra
  let t = text
    .replace(/\bEsfou\s+mufando\b/gi, 'Estou mutando')
    .replace(/\bE\s+isso\s+está\s+me\s+mafando\b/gi, 'E isso está me matando')
    .replace(/\bestá\s+rne\s+matando\b/gi, 'está me matando')
    .replace(/\brne\s+matando\b/gi, 'me matando')
    .replace(/\bDesfa\s+vez\b/gi, 'Desta vez')
    .replace(/\bMas\s+Desfa\s+vez\b/gi, 'Mas desta vez')
    .replace(/\bmais\s+na[_\s]+geração\b/gi, 'mais uma geração')
    .replace(/\bmufantes\b/gi, 'mutantes')
    .replace(/\bD\s+HENRY\b/gi, 'HENRY')
    .replace(/\bOutra\.MoeOPme\b/gi, 'Outra.')
    .replace(/\bSIM,\s*ORORO\.l\b/gi, 'SIM, ORORO.')
    .replace(/\bgeração\s+seguinte\s+de\s+murantes\b/gi, 'geração seguinte de mutantes')
    .replace(/\bNão\s+firarei\b/gi, 'Não tirarei')
    .replace(/\bantes\s+de\s+parfir\b/gi, 'antes de partir')
    .replace(/\bNão\s+tenho\s+muito\s+empo\b/gi, 'Não tenho muito tempo')
    .replace(/\bferei\s+que\s+lutar\b/gi, 'terei que lutar')
    .replace(/\bD\s*ENRY\.?/gi, 'HENRY.')
    .replace(/\bSIM,\s*ORORO\.?\s*(cYlowb?)?/gi, 'SIM, ORORO.')
    .replace(/\bESTOU\s+OUVINDO\.?\s*2\b/gi, 'ESTOU OUVINDO.')
    .replace(/\b7s\s+VOC\b/gi, 'VOCÊ')
    .replace(/\bVOC\s+VAI\b/gi, 'VOCÊ VAI')
    .replace(/\bOufra\.?\s*(Ohtnee)?/gi, 'Outra.')
    .replace(/\bsso\s+já\b/gi, 'Isso já')
    .replace(/\s+e\s*$/g, '') // sobra de OCR no fim
    .replace(/\s{2,}/g, ' ')
    .trim();

  // 2) palavra a palavra
  t = t.split(/(\s+)/).map(token => {
    if(/^\s+$/.test(token)) return token;
    const m = token.match(/^([^a-zA-Zà-üÀ-Ü]*)(.*?)([^a-zA-Zà-üÀ-Ü]*)$/);
    if(!m) return token;
    let [, pre, core, post] = m;
    if(!core || core.length < 2) return token;

    // remove lixo puro
    if(OCR_GARBAGE.test(core)) return pre + post;

    const low = core.toLowerCase();
    if(OCR_FORCED[low] !== undefined){
      return pre + applyCaseLike(core, OCR_FORCED[low]) + post;
    }

    const candidates = ocrWordCandidates(core);
    let best = core, bestScore = scorePtWord(core);
    for(const c of candidates){
      const s = scorePtWord(c);
      if(s > bestScore){ bestScore = s; best = c; }
    }

    // se ainda fraco, tenta trocar todos os f→t
    if(bestScore < 50){
      const tryT = core.replace(/f/g, 't').replace(/F/g, 'T');
      if(scorePtWord(tryT) > bestScore){ best = tryT; bestScore = scorePtWord(tryT); }
    }

    return pre + best + post;
  }).join('');

  return t.replace(/\s+/g, ' ').replace(/\s+([.,!?;:])/g, '$1').trim();
}

async function ocrBalloon(b){
  try{
    const needLoad = !ppocrSessionPromise;
    if(needLoad) toastProgress('Carregando modelo OCR (PP-OCRv5)…');
    const session = await getPpocrSession();
    toastProgress('Reconhecendo texto do balão…');
    await new Promise(r => setTimeout(r, 30));

    const img = $('#pageImg');
    if(!img || !img.naturalWidth){
      toast('Imagem da página ainda não carregou.', 4000);
      return null;
    }

    const area = (b.w || 0) * (b.h || 0);
    const inputName = session.inputNames[0];
    const outName = session.outputNames[0];

    function cropIsDark(ln){
      try{
        const c = document.createElement('canvas');
        const w = Math.min(80, Math.max(8, ln.w|0));
        const h = Math.min(80, Math.max(8, ln.h|0));
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.drawImage(ln.canvas, ln.x, ln.y, ln.w, ln.h, 0, 0, w, h);
        const d = cx.getImageData(0,0,w,h).data;
        let sum = 0, n = w*h;
        for(let i=0;i<d.length;i+=4) sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        return (sum/n) < 120;
      }catch(e){ return false; }
    }

    function scoreText(t){
      if(!t) return -100;
      const raw = t.replace(/\s+/g, ' ').trim();
      if(!raw) return -100;
      const words = raw.toLowerCase().normalize('NFC').split(/\s+/).filter(Boolean);
      let hits = 0, letters = 0, garbage = 0;
      for(const w of words){
        const clean = w.replace(/[^a-zà-ü]/gi,'');
        letters += clean.length;
        if(clean.length >= 3 && (PT_BALLOON_WORDS.has(clean) || OCR_FORCED[clean])) hits += 3;
        else if(clean.length >= 3 && /^[a-zà-ü]+$/i.test(clean)) hits += 0.8;
        else if(clean.length === 1) hits -= 0.3;
        if(/[0-9]{2,}/.test(w) || /cY|Ylow|Ohtnee|MoeOP|cYalow/i.test(w)) garbage += 4;
        if(/^[|/\\~^`<>[\]{}*_=]+$/.test(w)) garbage += 3;
        if(/[^a-zà-ü0-9.,!?;:'"\-—–()\s]/i.test(w)) garbage += 0.5;
      }
      const lenBonus = Math.min(raw.length, 80) * 0.35;
      const wordBonus = Math.min(words.length, 12) * 1.2;
      return hits * 2.5 + lenBonus + wordBonus - garbage * 5;
    }

    function stripPhantom(t){
      if(!t) return '';
      let s = t.replace(/\s+/g, ' ').trim();
      // prefixos tipicos de borda/rabo do balao
      s = s.replace(/^(cYalowb?l?|Ohtnee|MoeOPme)\s*/i, '');
      s = s.replace(/^[\s|/\\~^`<>[\]{}*_=\-]+/, '');
      s = s.replace(/^([ZYXVW0-9]|ys|zs|2\/|•2\/?|M\s*o,)\s+/i, '');
      s = s.replace(/^([ZYXVW])\s+/i, '');
      // tokens so de simbolos
      s = s.split(/\s+/).filter(w=>{
        const core = w.replace(/[^a-zà-ü0-9]/gi,'');
        if(!core && /^[|/\\~^`<>[\]{}*_=\-0-9]{1,3}$/.test(w)) return false;
        if(/^cY/i.test(w)) return false;
        return true;
      }).join(' ');
      s = s.replace(/\s+([.,!?;:])/g, '$1').trim();
      return s;
    }

    async function runOne(ln, mode, label){
      toastProgress(label);
      await new Promise(r => setTimeout(r, 6));
      // tenta com e sem tight — fica com o melhor na bestForCrop via score
      const tight = tightInkCrop(ln.canvas, ln.x, ln.y, ln.w, ln.h);
      const tensor = preprocessLineForPpocr(ln.canvas, tight.x, tight.y, tight.w, tight.h, mode);
      const results = await session.run({ [inputName]: tensor });
      const out = results[outName];
      const dims = out.dims ? Array.from(out.dims) : [];
      return stripPhantom(decodePpocrOutput(out.data, dims));
    }

    async function bestForCrop(ln, tag, forceAllModes){
      const dark = cropIsDark(ln);
      const modes = dark ? ['invert', 'normal', 'contrast'] : ['normal', 'contrast', 'invert'];
      let best = '', bestSc = -999;
      for(const mode of modes){
        const t = await runOne(ln, mode, tag + ' [' + mode + ']');
        const sc = scoreText(t);
        if(sc > bestSc){ bestSc = sc; best = t || ''; }
        if(!forceAllModes && bestSc >= 28 && (best || '').length >= 8) break;
      }
      return { text: best, score: bestSc };
    }

    async function ocrWithMargin(margin){
      const bx = Math.max(0, b.x + b.w * margin);
      const by = Math.max(0, b.y + b.h * margin);
      const bw = Math.max(0.01, b.w * (1 - 2 * margin));
      const bh = Math.max(0.01, b.h * (1 - 2 * margin));
      const { full, lines } = splitBalloonLines(img, bx, by, bw, bh);

      const lineParts = [];
      const maxLines = Math.min(lines.length, 10);
      for(let i = 0; i < maxLines; i++){
        const r = await bestForCrop(
          lines[i],
          `m${Math.round(margin*100)} L${i+1}/${maxLines}`,
          false
        );
        if(r.text && r.text.trim().length >= 1) lineParts.push(r.text.trim());
      }
      const linesJoined = stripPhantom(lineParts.join(' '));
      const linesJoinedScore = scoreText(linesJoined);

      // balão inteiro só se linhas fracas (PP-OCR é de linha; full costuma piorar)
      let fullText = '', fullScore = -100;
      if(linesJoinedScore < 12 || linesJoined.length < 6){
        const fullRes = await bestForCrop(full, `m${Math.round(margin*100)} full`, true);
        fullText = stripPhantom(fullRes.text || '');
        fullScore = scoreText(fullText);
      }

      const text = fullScore > linesJoinedScore ? fullText : (linesJoined || fullText);
      const score = Math.max(linesJoinedScore, fullScore);
      return { text, score, margin };
    }

    // Testa 3 margens (achado nos testes: 0–4% é a faixa útil)
    const margins = area < 0.003 ? [0, 0.02, 0.04] : [0.0, 0.02, 0.04];
    let best = { text: '', score: -999, margin: 0 };
    for(const m of margins){
      toastProgress('OCR margem ' + Math.round(m*100) + '%…');
      const r = await ocrWithMargin(m);
      console.log('OCR margin', m, r.score, r.text);
      if(r.score > best.score || (r.score === best.score && (r.text||'').length > (best.text||'').length)){
        best = r;
      }
      // se ja ficou muito bom, nao gasta as outras margens
      if(best.score >= 35 && (best.text||'').length >= 12) break;
    }

    toastEl.classList.remove('show');
    let text = stripPhantom((best.text || '').replace(/\s+/g, ' ').trim());
    if(!text){
      toast('OCR não leu texto (veja o Console F12). Ajuste o balão ou digite.', 5500);
      return null;
    }
    text = correctOcrText(text);
    text = stripPhantom(text);
    return text;
  }catch(e){
    console.error('OCR PP-OCR erro', e);
    const msg = (e && e.message) ? e.message : String(e);
    if(/cancelad|selecionado|Falha ao ler|create|wasm|Compile|memory|OOM/i.test(msg) || !ppocrModelBuffer){
      ppocrSessionPromise = null;
    }
    toast('OCR falhou: ' + msg, 7000);
    return null;
  }
}

state.jsonCatalog = null;
state.catalogNav = { level: 'publishers', pub: null, series: null, saga: null, mode: 'series' };
/* ordens CBRO (saga-order-*.json): chave = nome normalizado do evento */
state.sagaOrders = state.sagaOrders || {};
state.sagaOrdersMeta = state.sagaOrdersMeta || {};

function catalogStoreKey(){ return 'catalogo-json'; }
function sagaOrdersStoreKey(){ return 'saga-orders-map'; }

function normSagaName(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function normSeriesKey(s){
  let t = normSagaName(s);
  t = t.replace(/^the\s+/, '');
  t = t.replace(/\bvol(?:ume)?\s*\d+\b/g, ' ');
  t = t.replace(/\bv\d+\b/g, ' ');
  return t.replace(/\s+/g, ' ').trim();
}


async function sagaOrdersLoadLocal(){
  try{
    const data = await storeGet(sagaOrdersStoreKey());
    if(data && typeof data === 'object'){
      state.sagaOrders = data.orders || data || {};
      state.sagaOrdersMeta = data.meta || {};
    }
  }catch(_){}
}

async function sagaOrdersSaveLocal(){
  try{
    await storeSet(sagaOrdersStoreKey(), { orders: state.sagaOrders, meta: state.sagaOrdersMeta });
  }catch(e){ console.warn(e); }
}

function sagaOrdersImportFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        // aceita saga-order-*.json (sagaOrderFull) ou report com sagaOrderFull
        let order = data;
        if(data.sagaOrderFull) order = data.sagaOrderFull;
        if(!order || !order.event || !Array.isArray(order.issues)){
          throw new Error('JSON inválido: precisa de event + issues (saga-order-*.json)');
        }
        const key = normSagaName(order.event);
        state.sagaOrders[key] = order;
        state.sagaOrdersMeta[key] = {
          event: order.event,
          importedAt: Date.now(),
          issueCount: order.issueCount || (order.issues||[]).length,
          ownedCount: (order.ownedCount != null ? order.ownedCount : 0),
          missingCount: (order.missingCount != null ? order.missingCount : 0),
          fileName: (file && file.name) ? file.name : ''
        };
        await sagaOrdersSaveLocal();
        try{ await storeSet('saga-orders-savedAt', Date.now()); }catch(_){}
        let fbOk = false;
        try{
          if(state.fb && state.fb.user){
            fbOk = await fbSaveSagaOrders();
          }
        }catch(e){
          console.warn(e);
          try{ alert('Ordem importada localmente, mas FALHOU ao enviar ao Firebase:\n' + (e.message||e) + '\n\nEntre no Firebase e use “Enviar ordens ao Firebase”.'); }catch(_){}
        }
        // Aplica no catalogo.json em memória + overrides + Drive
        let applied = 0;
        try{
          applied = await catalogApplySagaOrderToCatalog(order);
        }catch(e){ console.warn('apply saga to catalog', e); }
        // contagem found vs missing na UI
        let foundN = 0, missN = 0;
        try{
          if(state.jsonCatalog){
            const pubs = state.jsonCatalog.publishers || [];
            let sg = null;
            pubs.forEach(p => (p.sagas||[]).forEach(s => {
              if(normSagaName(s.name) === key) sg = s;
            }));
            if(sg){
              const list = catalogBuildSagaList(sg, 'AlternateNumber');
              foundN = list.filter(b => !b._isPlaceholder).length;
              missN = list.filter(b => b._isPlaceholder).length;
            }
          }
        }catch(_){}
        let msg = 'Ordem: ' + order.event + ' · ' + (order.issues||[]).length + ' na lista';
        if(applied) msg += ' · ' + applied + ' gravadas no catálogo';
        if(foundN || missN) msg += ' · ' + foundN + ' encontradas · ' + missN + ' faltando';
        if(fbOk) msg += ' · Firebase ✓';
        else if(!(state.fb && state.fb.user)) msg += ' · Firebase NÃO conectado (não enviou)';
        else msg += ' · Firebase falhou ao enviar';
        toast(msg, 8000);
        if(!fbOk){
          try{ alert(msg + '\n\nPara o celular receber: entre no Firebase neste PC e toque em “Enviar ordens ao Firebase”.'); }catch(_){}
        }
        if(typeof renderJsonCatalog === 'function') renderJsonCatalog();
        resolve(order);
      }catch(e){ reject(e); }
    };
    reader.onerror = () => reject(reader.error || new Error('leitura'));
    reader.readAsText(file);
  });
}

/**
 * Grava series_group + alternate_number nas edições encontradas do catálogo
 * e envia catalogo.json ao Drive (se conectado).
 */
async function catalogApplySagaOrderToCatalog(order, opts){
  opts = opts || {};
  if(!order || !order.event || !Array.isArray(order.issues)) return 0;
  if(!state.jsonCatalog){
    try{ await catalogLoadLocal(); }catch(_){}
  }
  if(!state.jsonCatalog){
    if(!opts.silent) toast('Catálogo não carregado — importe o catalogo.json antes da ordem', 5000);
    return 0;
  }
  const eventName = order.event;
  const allBooks = (typeof catalogAllBooks === 'function') ? catalogAllBooks(state.jsonCatalog) : [];
  if(!allBooks.length){
    toast('Catálogo sem edições', 3000);
    return 0;
  }
  const { byId, byKey } = catalogIndexBooksForOrder(allBooks);

  const overridesAll = (await storeGet('catalog-overrides')) || {};
  const now = Date.now();
  let applied = 0;
  const touched = [];

  order.issues.forEach(iss => {
    if(!iss) return;
    // SEMPRE tenta match por series+# / id — não depende de owned
    let book = catalogMatchIssueToBook(iss, byId, byKey);
    if(!book) return;

    const id = (typeof catalogBookOverrideId === 'function') ? catalogBookOverrideId(book) : (book.id || book.filename);
    if(!id) return;

    // series_group: acrescenta o evento se já houver outros
    let groups = String(book.series_group || book.seriesGroup || '').split(',').map(s => s.trim()).filter(Boolean);
    const has = groups.some(g => normSagaName(g) === normSagaName(eventName));
    if(!has) groups.push(eventName);
    // remove typos óbvios do mesmo evento? não — só garante o nome correto
    const series_group = groups.join(', ');
    const alternate_number = String(iss.order != null ? iss.order : (book.alternate_number || ''));

    book.series_group = series_group;
    book.alternate_number = alternate_number;
    book.eventOrders = book.eventOrders || {};
    book.eventOrders[eventName] = iss.order != null ? iss.order : alternate_number;

    const fields = {
      series_group: series_group,
      alternate_number: alternate_number,
      eventOrders: book.eventOrders,
      savedAt: now
    };
    overridesAll[id] = Object.assign({}, overridesAll[id] || {}, fields);
    touched.push({ id, fields });
    applied++;
  });

  if(!applied){
    toast('Ordem importada, mas nenhuma edição do catálogo bateu com a lista (rode o script R no PC ou confira nomes).', 6000);
    return 0;
  }

  await storeSet('catalog-overrides', overridesAll);
  try{ if(typeof catalogRebuildSagas === 'function') catalogRebuildSagas(state.jsonCatalog); }catch(_){}
  try{ await catalogSaveLocal(state.jsonCatalog); }catch(e){ console.warn(e); }

  // Firebase overrides
  if(state.fb && state.fb.user && typeof fbSaveOverridesBatch === 'function'){
    try{
      const slice = {};
      touched.forEach(t => { slice[t.id] = overridesAll[t.id]; });
      await fbSaveOverridesBatch(slice);
    }catch(e){ console.warn('fb saga apply', e); }
  }

  // Drive: sobe catalogo.json atualizado (exceto quando vem do pull Firebase)
  if(!opts.skipDrive){
    if(state.drive && state.drive.token && typeof catalogPushToDrive === 'function'){
      try{
        if(!opts.silent) toastProgress('Enviando catálogo atualizado ao Drive…');
        await catalogPushToDrive();
      }catch(e){
        console.warn(e);
        if(!opts.silent) toast('Catálogo atualizado localmente; Drive falhou: ' + (e.message||e), 5000);
      }
    } else if(!opts.silent){
      toast('Catálogo atualizado neste aparelho. Conecte o Drive e use “Enviar catálogo” para os outros.', 5000);
    }
  } else {
    try{ await catalogSaveLocal(state.jsonCatalog); }catch(_){}
  }
  return applied;
}

/** Normaliza número de edição para match (#01 = #1 = 1) */
function catalogNormNum(n){
  let s = String(n == null ? '' : n).trim().toLowerCase();
  s = s.replace(/^#/, '').replace(/,/g, '.').trim();
  // "0" especial (Blackest Night #0)
  if(s === '0' || s === '00') return '0';
  // tira zeros à esquerda, mas preserva decimais
  if(/^\d+(\.\d+)?$/.test(s)){
    const f = parseFloat(s);
    if(!isNaN(f)) return String(f);
  }
  return s.replace(/^0+/, '') || '0';
}
function catalogIssueKeys(series, number){
  const keys = [];
  const sn = normSagaName(series || '');
  const sk = (typeof normSeriesKey === 'function') ? normSeriesKey(series || '') : sn;
  const num = catalogNormNum(number);
  if(sn) keys.push(sn + '|' + num);
  if(sk && sk !== sn) keys.push(sk + '|' + num);
  return keys;
}
function catalogIsTpbBook(b){
  if(!b) return false;
  const fn = String(b.filename || b.stem || '');
  const title = String(b.title || '');
  const series = String(b.series || '');
  const format = String(b.format || b.binding || '');
  const blob = (fn + ' ' + title + ' ' + format + ' ' + series).toLowerCase();
  if(/\btpb\b/.test(blob)) return true;
  if(/trade\s*paperback/.test(blob)) return true;
  if(/\bomnibus\b/.test(blob)) return true;
  if(/\bhc\b/.test(blob) || /\bhardcover\b/.test(blob)) return true;
  if(/encadernad[oa]/.test(blob)) return true;
  if(/capa\s*dura/.test(blob)) return true;
  if(/edi[cç][aã]o\s*definitiva/.test(blob)) return true;
  if(/\babsolute\b/.test(blob)) return true;
  if(/\bcompendium\b/.test(blob)) return true;
  // filename sem #N mas série é evento (TPB “Blackest Night (2010).cbz”)
  const hasIssueNum = /#\s*\d+/.test(fn) || /#\s*\d+/.test(title);
  const looksLikeEventCollected = /blackest\s*night|brightest\s*day|infinite\s*crisis|civil\s*war|secret\s*invasion|final\s*crisis|flashpoint/i.test(fn + ' ' + title);
  if(looksLikeEventCollected && !hasIssueNum){
    // número de edição 1 genérico em TPB é comum no ComicRack
    const n = catalogNormNum(b.number);
    if(!n || n === '1' || n === '0') return true;
  }
  const pc = parseInt(b.pageCount || b.pages || b.page_count, 10);
  if(pc && pc >= 100 && !hasIssueNum) return true;
  if(pc && pc >= 150) return true;
  return false;
}
function catalogPreferBook(a, b){
  // retorna o melhor entre a e b (não-TPB > com # no nome > com thumb)
  if(!a) return b;
  if(!b) return a;
  const score = (x) => {
    let s = 0;
    if(!catalogIsTpbBook(x)) s += 20;
    const fn = String(x.filename||x.stem||'');
    if(/#\s*\d+/.test(fn)) s += 8;
    if(x.thumb) s += 2;
    if(x.filename) s += 1;
    const pc = parseInt(x.pageCount || x.pages || 0, 10);
    if(pc && pc > 0 && pc < 80) s += 3; // edição avulsa típica
    if(pc && pc >= 100) s -= 5;
    return s;
  };
  return score(a) >= score(b) ? a : b;
}
function catalogMatchIssueToBook(iss, byId, byKey){
  if(!iss) return null;
  let found = null;
  if(iss.bookId && byId[iss.bookId]) found = byId[iss.bookId];
  if(!found && iss.matched_to){
    const m = iss.matched_to;
    if(m.bookId && byId[m.bookId]) found = byId[m.bookId];
    else if(m.id && byId[m.id]) found = byId[m.id];
  }
  const candidates = [];
  catalogIssueKeys(iss.series, iss.number).forEach(k => candidates.push(k));
  if(iss.series_name) catalogIssueKeys(iss.series_name, iss.number).forEach(k => candidates.push(k));
  const disp = String(iss.display || iss.raw || '');
  if(disp){
    let mt = disp.match(/^(.+?)\s+#\s*(\d+(?:\.\d+)?)\b/);
    if(!mt) mt = disp.match(/^(.+?)\s+#?(\d+(?:\.\d+)?)\s*(?:\(|$)/);
    if(mt) catalogIssueKeys(mt[1], mt[2]).forEach(k => candidates.push(k));
  }
  for(let i=0;i<candidates.length;i++){
    if(byKey[candidates[i]]) found = catalogPreferBook(found, byKey[candidates[i]]);
  }
  // fuzzy
  const num = catalogNormNum(iss.number != null ? iss.number : (disp.match(/#\s*(\d+)/)||[])[1]);
  const skeys = [normSeriesKey(iss.series||''), normSeriesKey(iss.series_name||''), normSeriesKey(disp.split('#')[0]||'')].filter(Boolean);
  if(num && skeys.length){
    for(const k in byKey){
      if(!k || k.indexOf('|') < 0 || k.indexOf('file:') === 0) continue;
      const sp = k.lastIndexOf('|');
      const bs = k.slice(0, sp);
      const bn = k.slice(sp+1);
      if(bn !== String(num)) continue;
      for(let j=0;j<skeys.length;j++){
        const sk = skeys[j];
        if(!sk || sk.length < 4) continue;
        if(bs === sk || bs.indexOf(sk) >= 0 || sk.indexOf(bs) >= 0){
          found = catalogPreferBook(found, byKey[k]);
        }
      }
    }
  }
  // se só achou TPB, tenta achar avulsa com mesmo series|#
  if(found && catalogIsTpbBook(found)){
    let better = null;
    candidates.forEach(k => {
      // byKey guarda o preferido, mas varremos byId values
    });
    Object.keys(byId).forEach(id => {
      const b = byId[id];
      if(!b || catalogIsTpbBook(b)) return;
      const keys = catalogIssueKeys(b.series, b.number);
      const hit = candidates.some(c => keys.indexOf(c) >= 0);
      if(hit) better = catalogPreferBook(better, b);
      // fuzzy series
      if(num && skeys.some(sk => {
        const bs = normSeriesKey(b.series||'');
        return bs && sk && (bs === sk || bs.indexOf(sk)>=0 || sk.indexOf(bs)>=0) && catalogNormNum(b.number) === String(num);
      })) better = catalogPreferBook(better, b);
    });
    if(better) found = better;
  }
  // Nunca usar TPB para item numerado da ordem (ex. Blackest Night #1)
  if(found && catalogIsTpbBook(found) && iss.number != null && String(iss.number).trim() !== ''){
    // só aceita TPB se o próprio display da ordem indicar collected/tpb
    const dlow = disp.toLowerCase();
    if(!/\btpb\b/.test(dlow) && !/omnibus/.test(dlow) && !/encadernad/.test(dlow)){
      return null; // melhor “faltando” do que TPB no lugar errado
    }
  }
  return found;
}
function catalogIndexBooksForOrder(books){
  const byId = {};
  const byKey = {};
  (books || []).forEach(b => {
    if(!b || b._isPlaceholder) return;
    const id = (typeof catalogBookOverrideId === 'function')
      ? catalogBookOverrideId(b) : (b.id || b.filename || b.stem);
    if(id) byId[id] = b;
    if(b.id) byId[b.id] = b;
    const put = (k) => {
      if(!k) return;
      byKey[k] = catalogPreferBook(byKey[k], b);
    };
    catalogIssueKeys(b.series, b.number).forEach(put);
    if(b.title) catalogIssueKeys(b.title, b.number).forEach(put);
    const fn = String(b.filename || b.stem || '').replace(/\.cbz$/i,'');
    if(fn){
      put('file:' + normSagaName(fn));
      const mt = fn.match(/^(.+?)\s+#(\d+)/) || fn.match(/^(.+?)\s+(\d{1,4})\s*(?:\(|$)/);
      if(mt) catalogIssueKeys(mt[1], mt[2]).forEach(put);
    }
  });
  return { byId, byKey };
}

function catalogBuildSagaList(sg, orderMode){
  const books = (sg && sg.books) || [];
  const eventName = (sg && sg.name) || '';
  const key = normSagaName(eventName);
  const order = state.sagaOrders[key];
  if(!order || !Array.isArray(order.issues) || !order.issues.length){
    // sem ordem CBRO: deduplica por série+# e esconde TPB se já existir a edição avulsa
    const { byKey } = catalogIndexBooksForOrder(books);
    const seen = new Set();
    const deduped = [];
    catalogSortBooks(books, orderMode || 'AlternateNumber').forEach(b => {
      if(!b || b._isPlaceholder) return;
      const k = (normSeriesKey(b.series||'') || normSagaName(b.series||'')) + '|' + catalogNormNum(b.number);
      if(seen.has(k)) return;
      // se é TPB e já temos outra chave da mesma saga com número, pode pular
      if(catalogIsTpbBook(b) && books.some(x => x !== b && !catalogIsTpbBook(x) && normSagaName(x.series) === normSagaName(b.series))){
        return;
      }
      seen.add(k);
      deduped.push(b);
    });
    return deduped.length ? deduped : catalogSortBooks(books, orderMode || 'AlternateNumber');
  }

  // pool: saga + catálogo, mas 1 livro por série+#
  let pool = books.slice();
  try{
    if(typeof catalogAllBooks === 'function' && state.jsonCatalog){
      const all = catalogAllBooks(state.jsonCatalog);
      const seenId = new Set(pool.map(b => (b && (b.id||b.filename||b.stem)) || ''));
      all.forEach(b => {
        const id = (b && (b.id||b.filename||b.stem)) || '';
        if(id && !seenId.has(id)){ seenId.add(id); pool.push(b); }
      });
    }
  }catch(_){}

  // dedupe pool: prefere não-TPB, com thumb, com filename
  const bestByKey = {};
  pool.forEach(b => {
    if(!b || b._isPlaceholder) return;
    const k = (normSeriesKey(b.series||'') || normSagaName(b.series||'')) + '|' + catalogNormNum(b.number);
    if(!k || k === '|0' && !b.number && !b.series) return;
    const prev = bestByKey[k];
    if(!prev){ bestByKey[k] = b; return; }
    const score = (x) => {
      let s = 0;
      if(!catalogIsTpbBook(x)) s += 5;
      if(x.thumb) s += 2;
      if(x.filename) s += 1;
      if(x.id) s += 1;
      return s;
    };
    if(score(b) > score(prev)) bestByKey[k] = b;
  });
  pool = Object.keys(bestByKey).map(k => bestByKey[k]);

  const { byId, byKey } = catalogIndexBooksForOrder(pool);
  const out = [];
  const used = new Set();
  order.issues.forEach(iss => {
    let book = catalogMatchIssueToBook(iss, byId, byKey);
    // se casou com TPB e o issue parece edição avulsa (#n), tenta achar não-TPB
    if(book && catalogIsTpbBook(book) && iss.number != null && String(iss.number) !== ''){
      const want = catalogIssueKeys(iss.series, iss.number);
      for(let i=0;i<want.length;i++){
        const alt = byKey[want[i]];
        if(alt && !catalogIsTpbBook(alt)){ book = alt; break; }
      }
    }
    if(book){
      const bid = book.id || book.filename || book.stem || '';
      if(bid && used.has(bid)){
        // já usado — não duplica; mantém slot? pula slot vazio não — usa o mesmo só uma vez, marca missing se re-match
        out.push({
          id: 'dup:' + key + ':' + (iss.order || ''),
          title: iss.display || iss.raw || ((iss.series||'') + ' #' + (iss.number||'')),
          series: iss.series || '',
          number: iss.number || '',
          alternate_number: String(iss.order != null ? iss.order : ''),
          series_group: eventName,
          _sagaOrderStatus: 'missing',
          _sagaDisplay: iss.display || iss.raw,
          _isPlaceholder: true
        });
        return;
      }
      if(bid) used.add(bid);
      const copy = Object.assign({}, book);
      copy.alternate_number = String(iss.order != null ? iss.order : (book.alternate_number || ''));
      copy._sagaOrderStatus = 'found';
      copy._sagaDisplay = iss.display || iss.raw;
      out.push(copy);
    } else {
      out.push({
        id: 'missing:' + key + ':' + (iss.order || iss.raw),
        title: iss.display || iss.raw || ((iss.series||'') + ' #' + (iss.number||'')),
        series: iss.series || '',
        number: iss.number || '',
        volume: iss.volume || '',
        year: iss.year || '',
        alternate_number: String(iss.order != null ? iss.order : ''),
        series_group: eventName,
        filename: '',
        thumb: null,
        _sagaOrderStatus: iss.status === 'ambiguous' ? 'ambiguous' : 'missing',
        _sagaDisplay: iss.display || iss.raw,
        _isPlaceholder: true
      });
    }
  });
  // NÃO acrescenta "extras" no fim — isso repetia números (1, 46, 47…) e inflava 80 → 85+
  if(orderMode === 'Number'){
    return catalogSortBooks(out, 'Number');
  }
  return out;
}

async function catalogSaveLocal(data){
  state.jsonCatalog = data;
  // catalogo pode ser grande demais pro localStorage → IndexedDB
  const ok = await idbPutCatalog(data, await storeGet('catalogo-json-meta'));
  if(!ok){
    // fallback localStorage (só se for pequeno)
    try{
      const s = JSON.stringify(data);
      if(s.length < 2_000_000) await storeSet(catalogStoreKey(), data);
      else toast('Catálogo grande: salvo só nesta sessão (falha no armazenamento)', 5000);
    }catch(e){
      console.warn(e);
      toast('Não consegui gravar o catálogo no aparelho', 4000);
    }
  }
  return ok;
}

async function catalogLoadLocal(){
  const rec = await idbGetCatalog();
  if(rec && rec.data && (rec.data.series || rec.data.publishers)){
    await catalogApplyOverrides(rec.data);
    state.jsonCatalog = rec.data;
    return rec.data;
  }
  // fallback localStorage antigo
  const data = await storeGet(catalogStoreKey());
  if(data && (data.series || data.publishers)){
    await catalogApplyOverrides(data);
    state.jsonCatalog = data;
    // migra pra IDB
    try{ await idbPutCatalog(data, null); }catch(_){}
    return data;
  }
  return null;
}


function catalogApplyFilter(q){
  const data = state.jsonCatalog;
  if(!data || !data.series) return [];
  q = (q || '').trim().toLowerCase();
  if(!q) return data.series;
  return data.series.filter(s=>{
    if((s.name || '').toLowerCase().indexOf(q) >= 0) return true;
    return (s.books || []).some(b=>{
      const t = ((b.title||'') + ' ' + (b.filename||'') + ' ' + (b.number||'')).toLowerCase();
      return t.indexOf(q) >= 0;
    });
  });
}

function catalogSortBooks(list, orderLabel){
  const arr = (list || []).slice();
  const numOf = (b) => {
    if(orderLabel === 'AlternateNumber'){
      const a = parseFloat(String(b.alternate_number||'').replace(',','.'));
      if(!isNaN(a)) return a;
    }
    const n = parseFloat(String(b.number||'').replace(',','.'));
    if(!isNaN(n)) return n;
    return 99999;
  };
  const volOf = (b) => {
    const v = String(b.volume||'').trim();
    if(!v) return 0; // sem volume vai primeiro dentro do grupo "sem vol"
    const n = parseFloat(v.replace(',','.'));
    if(!isNaN(n)) return n;
    // volume tipo "2013" ou texto
    const m = v.match(/\d+/);
    return m ? parseFloat(m[0]) : 99999;
  };
  arr.sort((a,b)=>{
    // em série: Volume depois Number; em saga: AlternateNumber (sem forçar volume)
    if(orderLabel !== 'AlternateNumber'){
      const va = volOf(a), vb = volOf(b);
      if(va !== vb) return va - vb;
    }
    const ka = numOf(a), kb = numOf(b);
    if(ka !== kb) return ka - kb;
    // desempate: year
    const ya = parseInt(a.year,10)||0, yb = parseInt(b.year,10)||0;
    if(ya !== yb) return ya - yb;
    return String(a.title||a.filename||'').localeCompare(String(b.title||b.filename||''), 'pt');
  });
  return arr;
}
function catalogBookDateKey(b){
  if(!b) return 99999999;
  // 1) campos Year/Month/Day
  let y = parseInt(b.year, 10);
  let m = parseInt(b.month, 10);
  let d = parseInt(b.day, 10);
  // 2) campo date já montado (dd/mm/aaaa ou mm/aaaa ou aaaa)
  const raw = String(b.date || b.publish_date || b.publication_date || b.releasedate || '').trim();
  if(raw){
    let ry, rm, rd;
    let mt;
    if((mt = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){
      rd = parseInt(mt[1],10); rm = parseInt(mt[2],10); ry = parseInt(mt[3],10);
    } else if((mt = raw.match(/^(\d{1,2})\/(\d{4})$/))){
      rm = parseInt(mt[1],10); ry = parseInt(mt[2],10); rd = 1;
    } else if((mt = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){
      ry = parseInt(mt[1],10); rm = parseInt(mt[2],10); rd = parseInt(mt[3],10);
    } else if((mt = raw.match(/^(\d{4})$/))){
      ry = parseInt(mt[1],10);
    }
    if(ry && (!y || isNaN(y))) y = ry;
    if(rm && (!m || isNaN(m))) m = rm;
    if(rd && (!d || isNaN(d))) d = rd;
  }
  // 3) volume tipo "2009"
  if(!y || isNaN(y)){
    const vv = parseInt(b.volume, 10);
    if(vv >= 1900 && vv <= 2100) y = vv;
  }
  // 4) fallback: ano no filename / stem / title  (ex.: "... (2013).cbz")
  if(!y || isNaN(y)){
    const blob = String(b.filename || b.file || b.stem || b.title || '');
    let mt = blob.match(/\(((?:19|20)\d{2})\)/) || blob.match(/(?:^|[^0-9])((?:19|20)\d{2})(?:[^0-9]|$)/);
    if(mt){
      const yy = parseInt(mt[1], 10);
      if(yy >= 1900 && yy <= 2100) y = yy;
    }
  }
  if(!y || isNaN(y)) return 99999999;
  if(isNaN(m) || m < 1 || m > 12) m = 1;
  if(isNaN(d) || d < 1 || d > 31) d = 1;
  return y * 10000 + m * 100 + d;
}
function catalogFirstDateKey(list){
  const arr = list || [];
  let best = 99999999;
  let found = false;
  arr.forEach(b => {
    if(!b || b._isPlaceholder) return;
    const k = catalogBookDateKey(b);
    if(k < 99999999){ found = true; if(k < best) best = k; }
  });
  return found ? best : 99999999;
}
/** Data de um card de série/saga/coleção (sempre recalcula; ignora firstDate velho). */
function catalogItemSortDate(item){
  if(!item) return 99999999;
  const books = item.books || [];
  let d = catalogFirstDateKey(books);
  // se saga tem ordem CBRO, usa a 1ª issue com year quando possível
  try{
    const k = normSagaName(item.name || '');
    const ord = state.sagaOrders && state.sagaOrders[k];
    if(ord && Array.isArray(ord.issues)){
      for(let i=0;i<ord.issues.length;i++){
        const iss = ord.issues[i];
        const y = parseInt(iss.year, 10);
        if(y && y > 1900 && y < 2100){
          const kd = y * 10000 + 101;
          if(kd < d) d = kd;
          break; // 1ª da ordem com year
        }
      }
    }
  }catch(_){}
  // fallback: year no próprio nome (Civil War 2006, etc.)
  if(d >= 99999999){
    const mt = String(item.name||'').match(/\b(19|20)\d{2}\b/);
    if(mt) d = parseInt(mt[0],10) * 10000 + 101;
  }
  return d;
}
/** Ordena séries / sagas / coleções pela data da 1ª edição (mais antiga primeiro). */
function catalogSortByFirstDate(items, nameKey){
  nameKey = nameKey || 'name';
  return (items || []).slice().sort((a,b)=>{
    const da = catalogItemSortDate(a);
    const db = catalogItemSortDate(b);
    if(da !== db) return da - db;
    return String(a[nameKey]||'').localeCompare(String(b[nameKey]||''), 'pt', {sensitivity:'base'});
  });
}
/** Heurística: é coleção (Salvat, Oficial, Definitiva…) e não evento crossover */
function catalogIsCollectionName(name){
  const s = String(name||'').toLowerCase();
  if(!s) return false;
  if(/cole[cç][aã]o/.test(s)) return true;
  if(/edi[cç][aã]o\s*definitiva/.test(s)) return true;
  if(/salvat/.test(s)) return true;
  if(/her[oó]is\s+mais\s+poderosos/.test(s)) return true;
  if(/graphic\s*novels\s*marvel/.test(s)) return true;
  if(/a\s+saga\s+dos\s+x-?men/.test(s)) return true;
  if(/os\s+fabulosos\s+x-?men/.test(s)) return true;
  if(/essential/.test(s) && /marvel|x-men|avengers/.test(s)) return true;
  if(/omnibus\s+collection/.test(s)) return true;
  return false;
}
function catalogBookCollectionName(b){
  if(!b) return '';
  // campo dedicado (futuro / script)
  if(b.collection) return String(b.collection).trim();
  if(b.Collection) return String(b.Collection).trim();
  // tags: collection:Nome ou coleção:Nome
  const tags = b.tags || b.Tags || b.tag || '';
  const tagStr = Array.isArray(tags) ? tags.join(',') : String(tags);
  let mt = tagStr.match(/(?:^|[,;])\s*(?:collection|cole[cç][aã]o)\s*[:=]\s*([^,;]+)/i);
  if(mt) return mt[1].trim();
  // series_group se for nome de coleção
  const sg = String(b.series_group || b.seriesGroup || '');
  for(const part of sg.split(',')){
    const p = part.trim();
    if(p && catalogIsCollectionName(p)) return p;
  }
  // série em si é coleção
  if(catalogIsCollectionName(b.series)) return String(b.series).trim();
  return '';
}
function catalogFirstBook(list, orderLabel){
  const sorted = catalogSortBooks(list, orderLabel || 'Number');
  return sorted[0] || null;
}
function catalogCoverSrc(book){

function catalogCleanTitle(book, opts){
  opts = opts || {};
  const series = String(book.series || '').trim();
  let title = String(book.title || '').trim();
  const num = String(book.number || book.alternate_number || '').trim();
  const filename = String(book.filename || book.file || book.stem || '').trim();

  // se título vazio, tenta extrair do filename
  if(!title && filename){
    title = filename.replace(/\.(cbz|zip|cbr)$/i,'').trim();
  }

  // remove extensão se veio no title
  title = title.replace(/\.(cbz|zip|cbr)$/i,'').trim();

  // se o título é basicamente o nome da série (+ número), não ajuda
  const norm = (s) => String(s||'').toLowerCase().replace(/[^a-z0-9]+/gi,' ').trim();
  const nt = norm(title);
  const ns = norm(series);
  if(ns && (nt === ns || nt.indexOf(ns) === 0)){
    // tenta tirar série e tokens de volume/número do início
    let t = title;
    if(series){
      const re = new RegExp('^'+series.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i');
      t = t.replace(re,'').trim();
    }
    t = t.replace(/^v(ol(?:ume)?\.?)?\s*\d+\s*/i,'').trim();
    t = t.replace(/^#?\s*\d+\s*/i,'').trim();
    t = t.replace(/^\(of\s*\d+\)\s*/i,'').trim();
    t = t.replace(/^\(\d{4}\)\s*/i,'').trim();
    t = t.replace(/^[-–—:·.]\s*/,'').trim();
    // se sobrou algo útil e não parece "V2013 #1 (of 41) (2013)"
    if(t && !/^v?\d+\s*#?\d*/i.test(t) && !/^\(?of\s*\d+/i.test(t)){
      title = t;
    }
  }

  // se ainda parece filename técnico (muitos # e (of N) e ano no fim), simplifica
  if(/\bv\d+\s*#\d+/i.test(title) || /\(of\s*\d+\)/i.test(title)){
    // remove padrões comuns de nome de arquivo de HQ
    let t = title;
    if(series) t = t.replace(new RegExp(series.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), '').trim();
    t = t.replace(/\bv(?:ol(?:ume)?\.?)?\s*\d+/ig,'');
    t = t.replace(/#\s*\d+/g,'');
    t = t.replace(/\(of\s*\d+\)/ig,'');
    t = t.replace(/\(\d{4}\)/g,'');
    t = t.replace(/\b\d{4}\b/g,'');
    t = t.replace(/[-–—_:·]+/g,' ').replace(/\s+/g,' ').trim();
    if(t.length >= 3) title = t;
  }

  // se ficou vazio ou igual ao número, usa fallback curto
  if(!title || norm(title) === norm(num) || norm(title) === ns){
    if(opts.preferSeries && series) title = series;
    else title = '';
  }
  return title;
}
function catalogFormatDate(book){
  if(!book) return '';
  // campo já montado pelo script do catálogo
  const pref = String(book.date || '').trim();
  if(pref && /\d/.test(pref)) return pref;
  const y = book.year != null && book.year !== '' ? String(book.year) : '';
  let m = book.month != null && book.month !== '' ? String(book.month) : '';
  let d = book.day != null && book.day !== '' ? String(book.day) : '';
  const raw = String(book.publish_date || book.publication_date || book.releasedate || '').trim();
  if(raw && /\d/.test(raw)) return raw;
  if(m && m.length === 1) m = '0' + m;
  if(d && d.length === 1) d = '0' + d;
  if(y && m && d) return d + '/' + m + '/' + y;
  if(y && m) return m + '/' + y;
  if(y) return y;
  return '';
}
function catalogFormatLine1(book, opts){
  opts = opts || {};
  const num = opts.useAlt
    ? (book.alternate_number || book.number || '')
    : (book.number || book.alternate_number || '');
  let title = catalogCleanTitle(book, opts);
  // se ainda parece nome de arquivo técnico, descarta
  if(title && (/\(of\s*\d+\)/i.test(title) || /\bv\d+\s*#\d+/i.test(title) || /\(\d{4}\)\s*$/.test(title))){
    title = '';
  }
  // título igual à série → não repete
  if(title && book.series && title.toLowerCase() === String(book.series).toLowerCase()){
    title = '';
  }
  const parts = [];
  if(num) parts.push('#' + num);
  // série sempre (quando existir)
  if(book.series) parts.push(book.series);
  // título só se for limpo e diferente da série
  if(title) parts.push(title);
  return parts.length ? parts.join(' · ') : '(sem título)';
}
function catalogFormatLine2(book, opts){
  opts = opts || {};
  const parts = [];
  if(book.volume) parts.push('Vol. ' + book.volume);
  const dt = catalogFormatDate(book);
  if(dt) parts.push(dt);
  const pages = book.page_count || book.pageCount || book.pages || '';
  if(pages) parts.push(pages + (String(pages)==='1' ? ' pág' : ' págs'));
  if(book.story_arc && !opts.hideArc) parts.push(book.story_arc);
  if(opts.useAlt && book.number && String(book.number) !== String(book.alternate_number||'')){
    parts.push('ed. ' + book.number);
  }
  return parts.join(' · ') || '—';
}

async function catalogBulkFindReplace(books, field, findStr, replaceStr, opts){

async function catalogApplyOverrides(data){
  if(!data) return data;

  const apply = (b)=>{
    if(!b) return;
    const id = catalogBookOverrideId(b);
    if(id && all[id]){

      delete o.savedAt;
      Object.assign(b, o);
    }
  };
  (data.series || []).forEach(s => (s.books||[]).forEach(apply));
  (data.publishers || []).forEach(p => {
    (p.series || []).forEach(s => (s.books||[]).forEach(apply));
    (p.sagas || []).forEach(sg => (sg.books||[]).forEach(apply));
  });
  catalogRebuildSagas(data);
  return data;
}
/** Remonta a lista de sagas a partir do series_group atual dos livros (após overrides / correções). */
function catalogRebuildSagas(data){
  if(!data) return data;
  const byPub = {}; // publisher -> map sagaName -> books[]
  const idSeen = {}; // per saga: avoid dup books

  const addBook = (pubName, book) => {
    if(!book || book._isPlaceholder) return;
    const raw = String(book.series_group || book.seriesGroup || '').trim();
    if(!raw) return;
    const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
    const pub = pubName || book.publisher || book.publisherGroup || 'Outras';
    if(!byPub[pub]) byPub[pub] = {};
    parts.forEach(name => {
      if(!byPub[pub][name]) byPub[pub][name] = [];
      const id = catalogBookOverrideId(book) || (book.filename + '|' + name);
      const key = pub + '||' + name;
      if(!idSeen[key]) idSeen[key] = new Set();
      if(idSeen[key].has(id)) return;
      idSeen[key].add(id);
      byPub[pub][name].push(book);
    });
  };

  (data.series || []).forEach(s => {
    const pub = s.publisherGroup || s.publisher || 'Outras';
    (s.books || []).forEach(b => addBook(pub, b));
  });
  (data.publishers || []).forEach(p => {
    const pub = p.name || 'Outras';
    (p.series || []).forEach(s => (s.books || []).forEach(b => addBook(pub, b)));
    // também livros que só estavam na lista antiga de sagas
    (p.sagas || []).forEach(sg => (sg.books || []).forEach(b => addBook(pub, b)));
  });

  // se não tem publishers[], monta a partir de byPub + series
  if(!data.publishers || !data.publishers.length){
    if(Object.keys(byPub).length){
      data.publishers = Object.keys(byPub).sort().map(name => ({
        name: name,
        series: (data.series || []).filter(s => (s.publisherGroup || s.publisher || 'Outras') === name),
        sagas: [],
        seriesCount: 0,
        bookCount: 0,
        sagaCount: 0
      }));
      data.publishers.forEach(p => {
        p.seriesCount = (p.series || []).length;
        p.bookCount = (p.series || []).reduce((n,s)=> n + ((s.books||[]).length), 0);
      });
    }
  }

  (data.publishers || []).forEach(p => {
    const pub = p.name || 'Outras';
    const map = byPub[pub] || {};
    // também coleções a partir de campo collection / tags / series
    const colMap = {};
    const collectBooks = [];
    (p.series || []).forEach(s => (s.books||[]).forEach(b => collectBooks.push(b)));
    Object.keys(map).forEach(name => (map[name]||[]).forEach(b => collectBooks.push(b)));
    collectBooks.forEach(b => {
      const cn = catalogBookCollectionName(b);
      if(!cn) return;
      if(!colMap[cn]) colMap[cn] = [];
      colMap[cn].push(b);
    });
    // sagas = series_group que NÃO são coleção
    const sagas = Object.keys(map).filter(name => !catalogIsCollectionName(name)).map(name => {
      const books = map[name];
      return {
        name: name,
        count: books.length,
        books: books,
        firstDate: catalogItemSortDate({ name: name, books: books })
      };
    });
    const collections = Object.keys(colMap).map(name => {
      const books = colMap[name];
      return {
        name: name,
        count: books.length,
        books: books,
        firstDate: catalogItemSortDate({ name: name, books: books }),
        _isCollection: true
      };
    });
    p.sagas = catalogSortByFirstDate(sagas, 'name');
    p.collections = catalogSortByFirstDate(collections, 'name');
    p.sagaCount = p.sagas.length;
    p.collectionCount = p.collections.length;
  });

  // sincroniza state.catalogNav.pub se estiver apontando para publisher antigo
  try{
    if(state.catalogNav && state.catalogNav.pub && state.catalogNav.pub.name){
      const fresh = (data.publishers || []).find(x => x.name === state.catalogNav.pub.name);
      if(fresh){
        const oldSaga = state.catalogNav.saga;
        state.catalogNav.pub = fresh;
        if(oldSaga && oldSaga.name){
          const sg = (fresh.sagas || []).find(s => s.name === oldSaga.name);
          state.catalogNav.saga = sg || null;
          if(!sg && state.catalogNav.level === 'sagaBooks'){
            state.catalogNav.level = 'sagas';
            state.catalogNav.mode = 'sagas';
          }
        }
      }
    }
  }catch(_){}
  return data;
}

function catalogAllBooks(data){
  data = data || state.jsonCatalog;
  const out = [];
  if(!data) return out;
  const seen = new Set();
  const add = (b)=>{
    if(!b) return;
    const id = catalogBookOverrideId(b);
    if(id && seen.has(id)) return;
    if(id) seen.add(id);
    out.push(b);
  };

  (data.publishers || []).forEach(p => {
    (p.series || []).forEach(s => (s.books||[]).forEach(add));
    (p.sagas || []).forEach(sg => (sg.books||[]).forEach(add));
  });
  return out;
}
async function catalogPushOverridesToDrive(opts){
  opts = opts || {};
  if(!state.drive || !state.drive.token){
    if(!opts.silent) toast('Entre no Google Drive para sincronizar metadados', 4000);
    return false;
  }
  try{
    const all = (await storeGet('catalog-overrides')) || {};
    const folderId = await driveEnsureFolder();
    const content = JSON.stringify({ version: 1, updatedAt: new Date().toISOString(), overrides: all });
    const q = encodeURIComponent("name='catalog-overrides.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
    const list = await res.json();
    if(!res.ok) throw new Error((list.error && list.error.message) || 'erro listar');
    const existing = list.files && list.files[0];
    const meta = { name: 'catalog-overrides.json', mimeType: 'application/json' };
    if(!existing) meta.parents = [folderId];
    const boundary = 'balao_ov_' + Date.now();
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      content + '\r\n' +
      '--' + boundary + '--';
    const url = existing
      ? ('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart&fields=id,name,modifiedTime')
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime';
    const up = await fetch(url, {
      method: existing ? 'PATCH' : 'POST',
      headers: {
        'Authorization': 'Bearer ' + state.drive.token,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    });
    const created = await up.json();
    if(!up.ok) throw new Error((created.error && created.error.message) || 'upload falhou');
    if(!opts.silent) toast('Metadados no Drive ✓', 2500);
    return true;
  }catch(e){
    console.error(e);
    if(!opts.silent) toast('Drive overrides: ' + (e.message || e), 4500);
    return false;
  }
}
async function catalogPullOverridesFromDrive(opts){
  opts = opts || {};
  if(!state.drive || !state.drive.token) return false;
  try{
    const folderId = await driveEnsureFolder();
    const q = encodeURIComponent("name='catalog-overrides.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=5');
    const data = await res.json();
    if(!res.ok) return false;
    const f = data.files && data.files[0];
    if(!f) return false;
    const dl = await driveFetch('/drive/v3/files/' + f.id + '?alt=media');
    if(!dl.ok) return false;
    const json = await dl.json();
    const remote = (json && json.overrides) ? json.overrides : (json || {});
    const local = (await storeGet('catalog-overrides')) || {};
    // merge: remote ganha se savedAt mais novo
    const merged = Object.assign({}, local);
    Object.keys(remote).forEach(id => {
      const r = remote[id] || {};
      const l = local[id] || {};
      if(!l.savedAt || (r.savedAt && r.savedAt >= l.savedAt)) merged[id] = Object.assign({}, l, r);
      else merged[id] = Object.assign({}, r, l);
    });
    await storeSet('catalog-overrides', merged);
    if(state.jsonCatalog) await catalogApplyOverrides(state.jsonCatalog);
    if(!opts.silent) toast('Metadados do Drive aplicados ✓', 2500);
    return true;
  }catch(e){
    console.warn(e);
    return false;
  }
}

function catalogGetProgressForBook(book){
  const map = state.readingProgress || {};
  for(const k of catalogProgressKeysForBook(book)){
    if(k && map[k]) return map[k];
  }
  return null;
}

function catalogReadingStatus(book, prog){
  if(!prog) return 'unread';
  const pages = parseInt(prog.pageCount || book.page_count || book.pageCount || 0, 10) || 0;
  const idx = typeof prog.pageIndex === 'number' ? prog.pageIndex : 0;
  if(prog.finished) return 'read';
  if(pages > 1 && idx >= pages - 1) return 'read';
  if(idx > 0) return 'reading';
  // tem marcas/texto → pelo menos abriu
  try{
    if(typeof marksTextCount === 'function' && marksTextCount(prog.marks) > 0) return 'reading';
  }catch(_){}
  return 'unread';
}

function catalogProgressLabel(book, prog, status){
  if(status === 'read') return 'Lido';
  if(status === 'reading'){
    const pages = parseInt(prog.pageCount || book.page_count || 0, 10) || 0;
    const idx = (typeof prog.pageIndex === 'number' ? prog.pageIndex : 0) + 1;
    if(pages > 0) return 'Lendo ' + idx + '/' + pages;
    return 'Lendo';
  }
  return '';
}

async function catalogLoadReadingProgressIndex(){
  if(!state.drive || !state.drive.token) return;
  if(state._progressIndexAt && Date.now() - state._progressIndexAt < 60000) return;
  const map = Object.create(null);
  const ingest = (obj, fileName) => {
    if(!obj) return;
    const entry = {
      pageIndex: typeof obj.pageIndex === 'number' ? obj.pageIndex : 0,
      pageCount: obj.pageCount || 0,
      finished: !!obj.finished,
      comicName: obj.comicName || '',
      comicId: obj.comicId || '',
      marks: obj.marks,
      savedAt: obj.savedAt || 0
    };
    const keys = [];
    if(obj.comicId) keys.push(obj.comicId);
    if(obj.comicName){
      keys.push(obj.comicName);
      keys.push(String(obj.comicName).toLowerCase());
      try{ keys.push(slugify(obj.comicName)); }catch(_){}
      const stem = String(obj.comicName).replace(/\.(cbz|cbr|zip)$/i,'');
      keys.push(stem); keys.push(stem.toLowerCase());
    }
    if(fileName){
      const base = fileName.replace(/\.balao\.json$/i,'');
      keys.push(base); keys.push(base.toLowerCase());
    }
    keys.forEach(k => { if(k) map[k] = entry; });
  };
  const listFolder = async (folderId) => {
    let pageToken = null;
    const files = [];
    do {
      let url = '/drive/v3/files?q=' + encodeURIComponent("'" + folderId + "' in parents and trashed=false and name contains '.balao.json'")
        + '&fields=nextPageToken,files(id,name)&pageSize=200';
      if(pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
      const res = await driveFetch(url);
      const data = await res.json();
      if(!res.ok) break;
      (data.files || []).forEach(f => files.push(f));
      pageToken = data.nextPageToken || null;
    } while(pageToken);
    return files;
  };
  try{
    // pasta progress
    try{
      const pid = await driveEnsureProgressFolder();
      const files = await listFolder(pid);
      for(const f of files){
        try{
          const r = await driveFetch('/drive/v3/files/' + f.id + '?alt=media');
          if(!r.ok) continue;
          const obj = await r.json();
          ingest(obj, f.name);
        }catch(_){}
      }
    }catch(e){ console.warn('progress index folder', e); }
    // legado raiz Balao HQ (só nomes *.balao.json)
    try{
      const rootId = await driveEnsureFolder();
      const files = await listFolder(rootId);
      for(const f of files){
        if(!/\.balao\.json$/i.test(f.name||'')) continue;
        try{
          const r = await driveFetch('/drive/v3/files/' + f.id + '?alt=media');
          if(!r.ok) continue;
          const obj = await r.json();
          ingest(obj, f.name);
        }catch(_){}
      }
    }catch(_){}
    state.readingProgress = map;
    state._progressIndexAt = Date.now();
    console.log('[progress] index entries', Object.keys(map).length);
  }catch(e){
    console.warn('progress index', e);
  }
}

function catalogFindBookByFilename(name){
  const data = state.jsonCatalog;
  if(!data || !name) return null;
  const base = String(name).toLowerCase();
  const stem = base.replace(/\.cbz$/i,'').replace(/\.zip$/i,'');
  let found = null;
  const visit = (b)=>{
    if(found || !b) return;
    const fn = String(b.filename||'').toLowerCase();
    const st = String(b.stem||'').toLowerCase();
    const file = String(b.file||'').toLowerCase();
    if(fn === base || st === stem || file.endsWith(base) || fn === stem + '.cbz') found = b;
  };
  (data.series||[]).forEach(s => (s.books||[]).forEach(visit));
  if(!found) (data.publishers||[]).forEach(p => (p.series||[]).forEach(s => (s.books||[]).forEach(visit)));
  return found;
}

  try{ catalogThumbCancelAll(); }catch(_){}
  // progresso de leitura (async; 2ª render aplica badges)
  if(state.drive && state.drive.token && !state._progressIndexLoading){
    if(!state._progressIndexAt || Date.now() - state._progressIndexAt > 60000){
      state._progressIndexLoading = true;
      catalogLoadReadingProgressIndex().finally(()=>{
        state._progressIndexLoading = false;
        if(state.screen === 'catalog') {
          try{ renderJsonCatalog(); }catch(_){}
        }
      });
    }
  }
  grid.innerHTML = '';

  function addCard(title, sub, onClick, icon, coverSrc, pubStyle){
    const el = document.createElement('div');
    el.className = 'catalog-card';
    const cover = document.createElement('div');
    cover.className = 'catalog-cover';
    if(pubStyle){
      cover.style.background = pubStyle.bg || '#12141a';
      const lab = document.createElement('div');
      lab.className = 'catalog-pub-cover';
      if(pubStyle.img){
        lab.classList.add('has-img');
        lab.style.backgroundImage = 'url(' + pubStyle.img + ')';
        lab.textContent = pubStyle.text || title; // acessibilidade / fallback
      } else {
        lab.style.color = pubStyle.color || '#fff';
        lab.textContent = pubStyle.text || title;
      }
      cover.appendChild(lab);
    } else {
      const emoji = document.createElement('span');
      emoji.className = 'cat-emoji';
      emoji.textContent = icon || '📚';
      cover.appendChild(emoji);
      if(coverSrc){
        const src = String(coverSrc);
        // icons/ e urls absolutas: tenta <img>
        if(/^(https?:|blob:|data:|icons\/)/i.test(src)){
          const img = document.createElement('img');
          img.alt = '';
          img.loading = 'lazy';
          img.src = src;
          img.onload = function(){
            try{ cover.textContent = ''; cover.appendChild(img); }catch(_){}
          };
        } else {
          // thumbs/... → catalogLoadThumb (Drive / IDB)
          catalogLoadThumb(src, cover, icon || '');
        }
      }
    }
    const info = document.createElement('div');
    info.className = 'catalog-info';
    const t = document.createElement('div');
    t.className = 'catalog-title';
    t.textContent = title;
    const s = document.createElement('div');
    s.className = 'catalog-sub';
    s.textContent = sub || '';
    info.appendChild(t);
    info.appendChild(s);
    el.appendChild(cover);
    el.appendChild(info);
    el.onclick = onClick;
    grid.appendChild(el);
    return el;
  }


  function showBookList(list, orderLabel){
    if(countEl) countEl.textContent = (list||[]).length + ' edições' + (orderLabel ? ' · ' + orderLabel : '');
    // Sem rolagem interna — só a tela do catálogo rola
    const host = document.createElement('div');
    host.style.cssText = 'grid-column:1/-1;display:flex;flex-direction:column;gap:12px;padding-bottom:24px;';
    const useAlt = (orderLabel === 'AlternateNumber');
    // progresso de download das capas (só as que ainda não estão em cache)
    const needFetch = (list||[]).filter(b => {
      if(!b.thumb) return false;
      if(state.catalogThumbCache[b.thumb]) return false;
      if(state.catalogThumbCache[String(b.thumb).split('/').pop()]) return false;
      return !!(state.drive && state.drive.token);
    });
    let dlDone = 0;
    const dlTotal = needFetch.length;
    // progresso só quando alguma capa realmente começar (lazy); não trava em 0/N
    if(false && dlTotal > 3){
      catalogXferShow('Baixando capas do Drive', '0 / ' + dlTotal, 0, dlTotal);
    }
    const onThumbDone = (name) => {
      if(dlTotal <= 0) return;
      dlDone++;
      catalogXferShow('Baixando capas do Drive', name || '', dlDone, dlTotal);
      if(dlDone >= dlTotal){
        catalogXferShow('Capas prontas', dlTotal + ' carregada(s)', dlTotal, dlTotal);
        catalogXferHide(1200);
      }
    };
    (list||[]).forEach(b => {
      const row = document.createElement('div');
      row.className = 'catalog-book-row';
      const isMissing = !!(b._isPlaceholder || b._sagaOrderStatus === 'missing');
      const isAmb = b._sagaOrderStatus === 'ambiguous';
      if(isMissing) row.classList.add('is-missing');
      const sagaName = String(b.series_group || b.seriesGroup || '').trim();
      if(sagaName && !isMissing) row.classList.add('in-saga');

      // Número principal: em série = Number; em saga = AlternateNumber (fallback Number)
      const num = useAlt
        ? (b.alternate_number || b.number || '')
        : (b.number || b.alternate_number || '');
      const cover = document.createElement('div');
      cover.className = 'catalog-book-cover';
      if(isMissing) cover.textContent = '∅';
      else cover.textContent = num ? String(num) : 'HQ';
      if(b.thumb && !isMissing) catalogLoadThumb(b.thumb, cover, num, onThumbDone);

      const body = document.createElement('div');
      body.className = 'catalog-book-body';

      // Linha 1: # · título limpo (em saga inclui série)
      const line1 = document.createElement('div');
      line1.className = 'catalog-book-line1';
      if(isMissing && b._sagaDisplay){
        line1.textContent = (num ? ('#' + num + ' · ') : '') + b._sagaDisplay;
      } else {
        line1.textContent = catalogFormatLine1(b, { useAlt: useAlt, insideSeries: false });
      }

      // Linha 2: Vol. · data completa · arco
      const line2 = document.createElement('div');
      line2.className = 'catalog-book-line2';
      if(isMissing){
        const bits = [];
        if(b.series) bits.push(b.series);
        if(b.number) bits.push('#' + b.number);
        if(b.year) bits.push(String(b.year));
        line2.textContent = bits.join(' · ') || 'Não tenho esta edição';
      } else {
        line2.textContent = catalogFormatLine2(b, { useAlt: useAlt });
      }

      body.appendChild(line1);
      body.appendChild(line2);
      if(isMissing){
        const mb = document.createElement('div');
        mb.className = 'catalog-missing-badge';
        mb.textContent = isAmb ? 'AMBÍGUA · conferir' : 'NÃO TENHO';
        body.appendChild(mb);
      } else {
        const prog = catalogGetProgressForBook(b);
        const st = catalogReadingStatus(b, prog);
        if(st === 'reading') row.classList.add('is-reading');
        if(st === 'read') row.classList.add('is-read');
        if(st !== 'unread'){
          const rb = document.createElement('div');
          rb.className = 'catalog-read-badge ' + st;
          rb.textContent = catalogProgressLabel(b, prog, st);
          body.appendChild(rb);

          body.appendChild(badge);

      row.appendChild(cover);
      row.appendChild(body);
      if(isMissing){
        row.style.cursor = 'default';
        row.title = 'Edição da ordem de leitura que não está no catálogo';
      } else {
        row.style.cursor = 'pointer';
        row.onclick = () => catalogOpenBookDetail(b, orderLabel);
      }

    });
