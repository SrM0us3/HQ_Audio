<!DOCTYPE html>

<head>
<script>
// Detector de erro visível — escrito em JS bem antigo (ES5) de propósito,
// pra funcionar mesmo em navegadores muito antigos/incomuns e mostrar
// na tela qualquer erro que trave o app, em vez de falhar em silêncio.
window.onerror = function(msg, url, line, col, err) {
  try {
    var el = document.getElementById('js-error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'js-error-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#c0392b;color:#fff;font-family:monospace;font-size:12px;' +
        'padding:10px;white-space:pre-wrap;word-break:break-word;';
      document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
    }
    el.textContent = 'ERRO DE JAVASCRIPT (linha ' + line + '): ' + msg;
  } catch (e) {}
  return false;
};
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#15171c;
    --panel:#1f222a;
    --panel-2:#262a33;
    --page-bg:#e8e3d6;
    --accent:#e4402c;
    --accent-dim:#7a2a20;
    --gold:#d9a94a;
    --text:#edeae2;
    --text-dim:#8a8f9c;
    --border:#2b2f38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;
  }
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--border);
    background:var(--panel);flex-shrink:0;z-index:20;
  }
  .brand{
    font-family:'Bangers',cursive;letter-spacing:1px;
    font-size:26px;color:var(--accent);
    text-shadow:2px 2px 0 var(--accent-dim);
  }
  .topbar .sub{color:var(--text-dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .iconbtn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;border-radius:9px;font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{background:var(--accent);border-color:var(--accent);}
  .iconbtn:disabled{opacity:.4;pointer-events:none;}
  .iconbtn.warn{position:relative;}
  .iconbtn.warn::after{
    content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Library screen ---------- */
  #screen-library{flex:1;overflow-y:auto;padding:18px;display:none;}
  #screen-library.active{display:block;}
  .drop{
    border:2px dashed var(--border);border-radius:16px;padding:34px 18px;
    text-align:center;color:var(--text-dim);margin-bottom:22px;
  }
  .drop b{color:var(--text);}
  .btn-primary{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;
  }
  .btn-primary:active{transform:scale(.97);}
  .lib-item{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);margin-bottom:10px;
  }
  .lib-thumb{
    width:44px;height:58px;border-radius:4px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Bangers';
    color:#2b2205;font-size:18px;flex-shrink:0;
  }
  .lib-meta{flex:1;overflow:hidden;}
  .lib-meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-meta .stat{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .lib-del{color:var(--text-dim);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:18px 0 8px;}

  /* ---------- Reader screen ---------- */
  #screen-reader{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;}
  #screen-reader.active{display:flex;}
  #stage{
    flex:1;position:relative;overflow:hidden;background:#0c0d10;
    touch-action:none;
  }
  #pageWrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1);}
  #pageImg{display:block;background:var(--page-bg);user-select:none;-webkit-user-drag:none;touch-action:none;}
  #overlay{position:absolute;inset:0;touch-action:none;}
  .balloon{
    position:absolute;border:2px solid var(--gold);border-radius:10px;
    background:rgba(217,169,74,.14);
  }
  .balloon.active{border-color:var(--accent);background:rgba(228,64,44,.18);}
  .balloon .tag{
    position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#2b2205;font-family:'Bangers';font-size:13px;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .balloon.active .tag{background:var(--accent);color:#fff;}

  .draft-box{
    position:absolute;border:2px solid var(--accent);border-radius:6px;
    background:rgba(228,64,44,.15);touch-action:none;cursor:move;
  }
  .draft-handle{
    position:absolute;width:32px;height:32px;margin:-16px;
    background:transparent;touch-action:none;

  .draft-handle::after{

  .draft-handle.nw{left:0;top:0;} .draft-handle.ne{left:100%;top:0;}

  #balloonCard{
    position:absolute;z-index:22;border-radius:14px;overflow:hidden;

  /* ---------- Bottom controls ---------- */
  .ctrlbar{

  }

  .mode-pill.playing{background:var(--accent);color:#fff;}

  /* ---------- Balloon sheet ---------- */
  #sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    border-top:1px solid var(--border);border-radius:16px 16px 0 0;
    max-height:60%;transform:translateY(105%);transition:transform .25s ease;
    z-index:30;display:flex;flex-direction:column;

  #sheet.open{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .sheet-head b{flex:1;}
  .sheet-body{padding:14px 16px;overflow-y:auto;}
  .balloon-item{
    display:flex;align-items:center;gap:8px;background:var(--panel-2);

    font-family:'Bangers';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;
    border:none;text-align:center;padding:0;-moz-appearance:textfield;

  .balloon-item .num-input::-webkit-outer-spin-button,

  .balloon-item .txt{flex:1;font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .balloon-item button{background:none;border:none;color:var(--text-dim);font-size:15px;padding:4px;cursor:pointer;}
  textarea.edit-text{

  }
  .row{display:flex;gap:8px;margin-top:10px;}
  .row button{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);font-weight:600;font-size:13px;cursor:pointer;

  .row button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .row button.ocr{background:var(--gold);border-color:var(--gold);color:#2b2205;}
  .row button:disabled{opacity:.5;pointer-events:none;}
  .empty-hint{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 6px;}

  select, input[type=range]{width:100%;}
  .settings-row{margin-bottom:16px;}
  .settings-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:10px;font-size:14px;

  .toast{

    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:12px;z-index:50;opacity:0;transition:opacity .25s;

  }
  .toast.show{opacity:1;}
  #fileInput{display:none;}
</style>

<script>
/* ==================== STATE ==================== */
const state = {
  screen:'library',
  comic:null,          // {id,name,pages:[{name,url,el}]}
  pageIndex:0,
  marks:{},            // {pageIndex:[{id,x,y,w,h,order,text}]}
  mode:'read',          // read | mark | play
  activeBalloon:null,
  playQueue:[],
  playTimer:null,
  playPauseIndex:null,
  drawing:null,
  voices:[],
  viewTransform:{scale:1,tx:0,ty:0},
  draft:null,
  walk:null,
  storageOk:null,
  readZoomOn:false,
  paused:false,
  pausedBalloon:null,
  lastDetectDiag:null,
};

const $ = s => document.querySelector(s);
const toastEl = $('#toast');
function toast(msg,ms=2000){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
function toastProgress(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
}

/* ==================== STORAGE HELPERS ==================== */
// Usa window.storage quando disponível (dentro do Claude); fora daqui, usa localStorage do navegador normalmente.
async function storeGet(key){
  if(window.storage){
    try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem('balao:'+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  if(window.storage){
    try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
    catch(e){ console.error('storage set fail',e); return false; }
  }
  try{ localStorage.setItem('balao:'+key, JSON.stringify(val)); return true; }
  catch(e){ console.error('localStorage set fail',e); return false; }
}
async function checkStorageAvailable(){
  try{
    const ok = await storeSet('balao-teste-storage', {ok:true, t:Date.now()});
    const back = await storeGet('balao-teste-storage');
    state.storageOk = !!(ok && back && back.ok===true);
  }catch(e){
    state.storageOk = false;
    console.warn('Salvamento automático indisponível:', e);
  }
  updateStorageBadge();
  if(!state.storageOk){
    toast('⚠ Salvamento automático indisponível nesta sessão. Depois de marcar, toque em ⬇ pra baixar o CBZ — senão as marcações se perdem ao fechar.', 8000);
  }
}
function updateStorageBadge(){
  const b = $('#btnDownload');
  if(!b) return;
  b.classList.toggle('warn', state.storageOk===false);
}
function slugify(name){
  return name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'comic';
}

/* ==================== LIBRARY ==================== */
async function refreshLibrary(){
  const list = (await storeGet('comics-list')) || [];
  const el = $('#libList'); el.innerHTML='';
  if(!list.length){ el.innerHTML = '<div class="empty-hint">Nenhum quadrinho ainda. Abra um CBZ para começar — as marcações de balão ficam salvas mesmo depois de fechar o app.</div>'; return; }
  list.slice().reverse().forEach(c=>{
    const div = document.createElement('div'); div.className='lib-item';
    div.innerHTML = `<div class="lib-thumb">${c.pages}p</div>
      <div class="lib-meta"><div class="name">${c.name}</div><div class="stat">${c.balloons||0} balões marcados</div></div>
      <button class="lib-del" data-id="${c.id}">🗑</button>`;
    div.addEventListener('click',(e)=>{
      if(e.target.closest('.lib-del')) return;
      toast('Selecione o mesmo arquivo CBZ para reabrir — as marcações serão restauradas.');
      $('#fileInput').dataset.resumeId = c.id;
      $('#fileInput').click();
    });
    div.querySelector('.lib-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      const nl = list.filter(x=>x.id!==id);
      await storeSet('comics-list', nl);
      await storeSet('marks:'+id, null);
      refreshLibrary();
    });
    el.appendChild(div);
  });
}

async function registerComic(id,name,pages){
  const list = (await storeGet('comics-list')) || [];
  const existing = list.find(c=>c.id===id);
  const balloons = Object.values(state.marks).reduce((a,arr)=>a+arr.length,0);
  if(existing){ existing.name=name; existing.pages=pages; existing.balloons=balloons; }
  else list.push({id,name,pages,balloons});
  await storeSet('comics-list', list);
}

/* ==================== OPEN CBZ ==================== */
$('#btnOpen').addEventListener('click', ()=>{ delete $('#fileInput').dataset.resumeId; $('#fileInput').click(); });
$('#fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  await openCbz(file);
  e.target.value='';
});

const MARKS_ENTRY = 'balao-marks.xml';

function xmlFromMarks(marks){
  const doc = document.implementation.createDocument('', '', null);
  const root = doc.createElement('BalaoData'); root.setAttribute('version','1');
  Object.keys(marks).forEach(pageIdx=>{
    const arr = marks[pageIdx]||[];
    if(!arr.length) return;
    const pageEl = doc.createElement('Page'); pageEl.setAttribute('index', pageIdx);
    arr.forEach(b=>{
      const bEl = doc.createElement('Balloon');
      bEl.setAttribute('id', b.id); bEl.setAttribute('order', b.order);
      bEl.setAttribute('x', b.x); bEl.setAttribute('y', b.y);
      bEl.setAttribute('w', b.w); bEl.setAttribute('h', b.h);
      const textEl = doc.createElement('Text'); textEl.textContent = b.text||'';
      bEl.appendChild(textEl);
      pageEl.appendChild(bEl);
    });
    root.appendChild(pageEl);
  });
  doc.appendChild(root);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(doc);
}
function marksFromXml(xmlText){
  const marks={};
  try{
    const doc = new DOMParser().parseFromString(xmlText,'application/xml');
    if(doc.querySelector('parsererror')) return marks;
    doc.querySelectorAll('Page').forEach(pageEl=>{
      const idx = pageEl.getAttribute('index');
      const arr=[];
      pageEl.querySelectorAll('Balloon').forEach(bEl=>{
        arr.push({
          id: bEl.getAttribute('id') || ('b'+Math.random().toString(36).slice(2)),
          order: parseInt(bEl.getAttribute('order'),10)||1,
          x: parseFloat(bEl.getAttribute('x')), y: parseFloat(bEl.getAttribute('y')),
          w: parseFloat(bEl.getAttribute('w')), h: parseFloat(bEl.getAttribute('h')),
          text: (function(){ var te = bEl.querySelector('Text'); return te ? te.textContent : ''; })()
        });
      });
      marks[idx]=arr;
    });
  }catch(e){ console.error('parse marks xml failed', e); }
  return marks;
}
function updateZipXml(){
  if(state.comic && state.comic.zip){
    state.comic.zip.file(MARKS_ENTRY, xmlFromMarks(state.marks));
  }
}

async function openCbz(file){
  toast('Abrindo quadrinho…', 4000);
  try{
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files)
      .filter(f=>!f.dir && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
    if(!entries.length){ toast('Nenhuma imagem encontrada no arquivo.'); return; }
    const pages=[];
    for(let i=0;i<entries.length;i++){
      const entry = entries[i];
      toastProgress(`Extraindo página ${i+1}/${entries.length}`);
      const blob = await entry.async('blob');
      pages.push({name:entry.name, url:URL.createObjectURL(blob)});
    }
    const id = slugify(file.name);
    state.comic = {id, name:file.name, pages, zip};
    const embedded = zip.file(MARKS_ENTRY);
    if(embedded){
      const xmlText = await embedded.async('string');
      state.marks = marksFromXml(xmlText);
      toast('Marcações encontradas dentro do arquivo ✓');
    } else {
      state.marks = (await storeGet('marks:'+id)) || {};
      if(Object.keys(state.marks).length) toast('Marcações restauradas da nuvem do app.');
    }
    state.pageIndex = 0;
    state.readZoomOn = !!(await storeGet('readzoom:'+id));
    await registerComic(id, file.name, pages.length);
    goReader();
  }catch(err){
    console.error(err);
    toast('Erro ao abrir: ' + (err && err.message ? err.message : err), 6000);
  }
}

async function downloadUpdatedCbz(){
  if(!state.comic || !state.comic.zip){ toast('Abra um quadrinho primeiro.'); return; }
  const btn = $('#btnDownload');
  if(btn.disabled) return;
  btn.disabled = true;
  updateZipXml();
  toastProgress('Gerando arquivo… 0%');
  try{
    const blob = await state.comic.zip.generateAsync(
      {type:'blob', compression:'DEFLATE', compressionOptions:{level:4}},
      (metadata)=>{ toastProgress(`Gerando arquivo… ${Math.round(metadata.percent)}%`); }
    );
    const baseName = state.comic.name.replace(/\.(cbz|zip)$/i,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = baseName + '-balao.cbz';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CBZ com marcações baixado ✓');
  }catch(e){
    console.error(e); toast('Erro ao gerar: ' + (e && e.message ? e.message : e), 6000);
  }finally{
    btn.disabled = false;
  }
}

/* ==================== PAGE RENDER ==================== */
function currentMarks(){
  const arr = state.marks[state.pageIndex] || [];
  return arr.slice().sort((a,b)=>a.order-b.order);
}
function fitImageToStage(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  if(!img.naturalWidth || !stage.width || !stage.height) return;
  const scale = Math.min(stage.width/img.naturalWidth, stage.height/img.naturalHeight);
  img.style.width = Math.round(img.naturalWidth*scale)+'px';
  img.style.height = Math.round(img.naturalHeight*scale)+'px';
}
function renderPage(){
  clearDraft();
  hideBalloonCard();
  closeLiteEdit(false);
  const p = state.comic.pages[state.pageIndex];
  const img = $('#pageImg');
  img.onload = ()=>{ fitImageToStage(); resetZoom(); drawBalloons(); };
  img.src = p.url;
  $('#pagePos').textContent = `${state.pageIndex+1}/${state.comic.pages.length}`;
  setMode(state.mode==='play' ? state.mode : 'read');
  $('#btnReadZoom').classList.toggle('on', state.readZoomOn);
  closeSheet();
}
function drawBalloons(){
  const overlay = $('#overlay');
  overlay.innerHTML='';
  const marks = currentMarks();
  const svgNS='http://www.w3.org/2000/svg';
  if(marks.length>1 && state.mode!=='play'){
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
    svg.style.position='absolute'; svg.style.inset='0'; svg.style.pointerEvents='none';
    let d='';
    marks.forEach((b,i)=>{
      const cx=((b.x+b.w/2)*100).toFixed(2), cy=((b.y+b.h/2)*100).toFixed(2);
      d += (i===0?'M':'L') + cx + '%,' + cy + '% ';
    });
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d',d); path.setAttribute('class','path-line');
    svg.appendChild(path); overlay.appendChild(svg);
  }
  marks.forEach(b=>{
    if(state.draft && state.draft.editingId===b.id) return;
    if(state.mode==='play' && state.activeBalloon!==b.id) return; // no play, só mostra o balão ativo
    const div = document.createElement('div');
    div.className='balloon'+(state.activeBalloon===b.id?' active':'');
    div.style.left=(b.x*100)+'%'; div.style.top=(b.y*100)+'%';
    div.style.width=(b.w*100)+'%'; div.style.height=(b.h*100)+'%';
    div.innerHTML = `<div class="tag">${b.order}</div>`;
    div.addEventListener('click',(ev)=>{ ev.stopPropagation(); onBalloonTap(b); });
    overlay.appendChild(div);
  });
  if(state.draft) renderDraft();
}

/* ==================== ZOOM ==================== */
function applyViewTransform(animated){
  const wrap = $('#pageWrap');
  wrap.style.transition = animated ? '' : 'none';
  wrap.style.transformOrigin='0 0';
  const {scale,tx,ty} = state.viewTransform;
  wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
function resetZoom(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const w = img.offsetWidth||0, h = img.offsetHeight||0;
  const tx = Math.max(0, (stage.width-w)/2);
  const ty = Math.max(0, (stage.height-h)/2);
  state.viewTransform = {scale:1, tx, ty};
  applyViewTransform(true);
  state.activeBalloon=null;
}
function zoomToBalloon(b, opts){
  opts = opts || {};
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const dispW = img.offsetWidth, dispH = img.offsetHeight;
  const px=(b.x+b.w/2)*dispW, py=(b.y+b.h/2)*dispH;
  const reserve = opts.reserveBottom || 0;
  const visibleH = stage.height*(1-reserve);
  const scale = Math.min(4, Math.max(1.3, Math.min((stage.width*0.86)/(b.w*dispW), (visibleH*0.8)/(b.h*dispH))));
  const tx = stage.width/2 - px*scale;
  const ty = visibleH/2 - py*scale;
  state.viewTransform = {scale,tx,ty};
  applyViewTransform(true);
  state.activeBalloon=b.id;
  drawBalloons();
}
function highlightBalloon(b){
  state.activeBalloon = b.id;
  drawBalloons();
}

/* ==================== CARD AMPLIADO (zoom ao ler) ==================== */
function showBalloonCard(b){
  if(!state.readZoomOn || !state.comic) return;
  const img = $('#pageImg');
  const stage = $('#stage').getBoundingClientRect();
  const rect = img.getBoundingClientRect();

  // recorte em boa resolução a partir da imagem original (nao da tela pequena)
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = b.w*nw, bh = b.h*nh;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(bw));
  canvas.height = Math.max(1,Math.round(bh));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);

  // posicao/tamanho na tela: centralizado sobre o proprio balao, ampliado
  const screenX = rect.left - stage.left + b.x*rect.width;
  const screenY = rect.top - stage.top + b.y*rect.height;
  const screenW = b.w*rect.width;
  const screenH = b.h*rect.height;
  // valores anteriores (caso precise voltar): scale 1.6–2.3, alvo 190, largura 0.72, altura 0.46
  const scale = Math.min(1.7, Math.max(1.0, 143/Math.max(1,screenH)));
  let cardW = screenW*scale, cardH = screenH*scale;
  cardW = Math.min(cardW, stage.width*0.54);
  cardH = Math.min(cardH, stage.height*0.35);
  let cx = screenX + screenW/2, cy = screenY + screenH/2;
  let left = cx - cardW/2, top = cy - cardH/2;
  // mantem dentro da area visivel do stage
  left = Math.max(6, Math.min(left, stage.width - cardW - 6));
  top = Math.max(6, Math.min(top, stage.height - cardH - 6));

  const card = $('#balloonCard');
  card.style.left = left+'px';
  card.style.top = top+'px';
  card.style.width = cardW+'px';
  card.style.height = cardH+'px';
  card.innerHTML = '';
  const outImg = document.createElement('img');
  outImg.src = canvas.toDataURL('image/png');
  card.appendChild(outImg);
  card.style.display = 'block';
  card.onclick = ()=> pauseAndEditWhileReading(b);
  state.cardBalloonId = b.id;
}
function hideBalloonCard(){
  const card = $('#balloonCard');
  if(card){ card.style.display='none'; card.onclick=null; }
  state.cardBalloonId = null;
}

/* ==================== EDIÇÃO RÁPIDA DURANTE A LEITURA ==================== */
function pauseAndEditWhileReading(b){
  if(state.ttsAvailable) speechSynthesis.cancel();
  clearTimeout(state.playTimer);
  state.paused = true;
  state.pausedBalloon = b;
  $('#liteEditText').value = b.text || '';
  $('#liteEditBar').style.display = 'flex';
  $('#liteEditText').focus();
}
async function closeLiteEdit(resume){
  const bar = $('#liteEditBar');
  if(bar) bar.style.display = 'none';
  if(!state.paused) return;
  const b = state.pausedBalloon;
  state.paused = false;
  state.pausedBalloon = null;
  if(!b) return;
  if(resume===false) return; // fechado por troca de pagina/tela, nao retoma leitura
  b.text = $('#liteEditText').value;
  await saveMarks();
  drawBalloons();
  if(state.mode==='play'){
    const marks = currentMarks();
    const idx = marks.findIndex(x=>x.id===b.id);
    setMode('play');
    if(idx>=0) playNext(idx);
  } else {
    highlightBalloon(b);
    if(state.readZoomOn) showBalloonCard(b);
    speak(b.text);
  }
}
$('#liteEditClose').addEventListener('click', ()=> closeLiteEdit(true));

function clearHighlight(){
  state.activeBalloon = null;
  hideBalloonCard();
  drawBalloons();
}

}
function setMode(m){

$('#btnReadZoom').addEventListener('click', async ()=>{

$('#btnPrev').addEventListener('click', ()=>{ stopPlay(); if(state.pageIndex>0){ state.pageIndex--; renderPage(); }});

/* ==================== DRAWING NEW BALLOON + PINCH ZOOM/PAN ==================== */
const overlayEl = $('#overlay');
const pointers = new Map();
let pinchStart = null;
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

function normFromEvent(e){
  const rect = $('#pageImg').getBoundingClientRect();
  return { x: Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width)),
           y: Math.min(1,Math.max(0,(e.clientY-rect.top)/rect.height)) };
}

overlayEl.addEventListener('pointerdown', (e)=>{
  overlayEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStart = { dist:dist(pts[0],pts[1]), mid:mid(pts[0],pts[1]),
      scale:state.viewTransform.scale, tx:state.viewTransform.tx, ty:state.viewTransform.ty };
    return;
  }
  if(pointers.size!==1) return;
  if(state.mode!=='mark'){ if(state.activeBalloon){ clearHighlight(); } return; }
  if(e.target.closest('.balloon') || e.target.closest('.draft-box')) return;
  if(state.draft || state.walk) return;
  const p = normFromEvent(e);
  const w=0.18, h=0.09;
  const x = Math.min(Math.max(0,p.x-w/2),1-w), y = Math.min(Math.max(0,p.y-h/2),1-h);
  placeBalloonInstant(x,y,w,h);
});
overlayEl.addEventListener('pointermove', (e)=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinchStart){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const m = mid(pts[0],pts[1]);
    const stage = $('#stage').getBoundingClientRect();
    const newScale = Math.min(6, Math.max(0.8, pinchStart.scale * (d/pinchStart.dist)));
    const anchorX = (pinchStart.mid.x - stage.left - pinchStart.tx) / pinchStart.scale;
    const anchorY = (pinchStart.mid.y - stage.top - pinchStart.ty) / pinchStart.scale;
    state.viewTransform = {
      scale: newScale,
      tx: (m.x - stage.left) - anchorX*newScale,
      ty: (m.y - stage.top) - anchorY*newScale
    };
    applyViewTransform(false);
  }
});
overlayEl.addEventListener('pointerup', (e)=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=null; });
overlayEl.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStart=null; });

/* ---- draft box: create, resize via handles, move ---- */
function renderDraft(){
  let box = document.getElementById('draftBox');
  if(!box){
    box = document.createElement('div');
    box.id='draftBox'; box.className='draft-box';
    ['nw','ne','sw','se'].forEach(corner=>{
      const h=document.createElement('div');
      h.className='draft-handle '+corner;
      attachHandleDrag(h,corner);
      box.appendChild(h);
    });
    attachBoxMove(box);
    overlayEl.appendChild(box);
  }
  positionDraftBox();
  showDraftToolbar(true);
  if(state.walk){
    updateWalkToolbar();
  } else {
    $('#btnDraftOk').textContent = state.draft.editingId ? '✓ Salvar posição' : '✓ Usar este balão';
    $('#btnDraftText').style.display = state.draft.editingId ? 'inline-block' : 'none';
    $('#btnDraftCancel').textContent = '✕ Cancelar';
    $('#draftPos').textContent = '';
    const orderInput = $('#draftOrderInput');
    if(state.draft.editingId){
      const marks = currentMarks();
      const b = marks.find(x=>x.id===state.draft.editingId);
      orderInput.style.display = 'inline-block';
      orderInput.min = 1; orderInput.max = marks.length;
      if(document.activeElement !== orderInput){
        orderInput.value = b ? b.order : '';
      }
    } else {
      orderInput.style.display = 'none';
    }
  }
}
function positionDraftBox(){
  const box = document.getElementById('draftBox'); if(!box || !state.draft) return;
  const d = state.draft;
  box.style.left=(d.x*100)+'%'; box.style.top=(d.y*100)+'%';
  box.style.width=(d.w*100)+'%'; box.style.height=(d.h*100)+'%';
}
function attachHandleDrag(handle, corner){
  handle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const editingId = state.draft.editingId;
    const fixed = {
      x: corner.includes('w') ? state.draft.x+state.draft.w : state.draft.x,
      y: corner.includes('n') ? state.draft.y+state.draft.h : state.draft.y
    };
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const nx=Math.min(p.x,fixed.x), fx=Math.max(p.x,fixed.x);
      const ny=Math.min(p.y,fixed.y), fy=Math.max(p.y,fixed.y);
      state.draft = { x:nx, y:ny, w:Math.max(0.02,fx-nx), h:Math.max(0.02,fy-ny), editingId };
      positionDraftBox();
    };
    const onUp = ()=>{
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
}
function attachBoxMove(box){
  box.addEventListener('pointerdown', (e)=>{
    if(e.target!==box) return;
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    const start = normFromEvent(e);
    const orig = Object.assign({}, state.draft);
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const dx=p.x-start.x, dy=p.y-start.y;
      state.draft = {
        x: Math.min(Math.max(0, orig.x+dx), 1-orig.w),
        y: Math.min(Math.max(0, orig.y+dy), 1-orig.h),
        w: orig.w, h: orig.h, editingId: orig.editingId
      };
      positionDraftBox();
    };
    const onUp = ()=>{
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      box.removeEventListener('pointercancel', onUp);
    };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
    box.addEventListener('pointercancel', onUp);
  });
}
function showDraftToolbar(show){ $('#draftToolbar').style.display = show?'flex':'none'; }
function clearDraft(){
  state.draft=null;
  state.walk=null;
  const box=document.getElementById('draftBox'); if(box) box.remove();
  showDraftToolbar(false);
}
async function commitDraft(){
  if(!state.draft) return;
  const d = state.draft;
  if(d.editingId){
    const arr = state.marks[state.pageIndex] || [];
    const existing = arr.find(b=>b.id===d.editingId);
    if(existing){ existing.x=d.x; existing.y=d.y; existing.w=d.w; existing.h=d.h; }
    clearDraft();
    await saveMarks();
    drawBalloons();
    toast('Posição do balão atualizada ✓');
    return;
  }
  const arr = state.marks[state.pageIndex] || (state.marks[state.pageIndex]=[]);
  const order = arr.length ? Math.max(...arr.map(b=>b.order))+1 : 1;
  const balloon = {id:'b'+Date.now(), x:d.x,y:d.y,w:d.w,h:d.h, order, text:''};
  arr.push(balloon);
  clearDraft();
  await saveMarks();
  drawBalloons();
  openBalloonEditor(balloon, true);
}

/* ---- ajuste em sequência (walkthrough) ---- */
function startWalkAdjust(){
  const marks = currentMarks();
  if(!marks.length){ toast('Nenhum balão marcado nesta página ainda. Toque na página pra criar alguns primeiro.'); return; }
  state.walk = {index:0};
  enterWalkBalloon(0);
}
function enterWalkBalloon(i){
  const marks = currentMarks();
  if(i >= marks.length){ finishWalk(); return; }
  if(i < 0) i = 0;
  state.walk.index = i;
  const b = marks[i];
  state.draft = {x:b.x, y:b.y, w:b.w, h:b.h, editingId:b.id};
  zoomToBalloon(b, {reserveBottom:0});
  drawBalloons();
}
function updateWalkToolbar(){
  const marks = currentMarks();
  const i = state.walk.index;
  $('#draftPos').textContent = `${i+1}/${marks.length}`;
  $('#btnDraftText').style.display = 'none';
  $('#btnDraftOk').textContent = (i >= marks.length-1) ? '✓ Concluir' : 'Próximo ›';
  $('#btnDraftCancel').textContent = i>0 ? '‹ Anterior' : '✕ Sair';
}
function commitWalkCurrent(){
  if(!state.draft || !state.draft.editingId) return;
  const d = state.draft;
  const arr = state.marks[state.pageIndex] || [];
  const existing = arr.find(x=>x.id===d.editingId);
  if(existing){ existing.x=d.x; existing.y=d.y; existing.w=d.w; existing.h=d.h; }
}
async function walkNext(){
  commitWalkCurrent();
  await saveMarks();
  enterWalkBalloon(state.walk.index+1);
}
async function walkBack(){
  commitWalkCurrent();
  await saveMarks();
  if(state.walk.index>0) enterWalkBalloon(state.walk.index-1);

async function saveMarks(){
  if(!state.comic) return;
  updateZipXml();

  const list = (await storeGet('comics-list'))||[];

const MODEL_INPUT_SIZE = 1024;
let yoloSessionPromise = null;
function pickModelFile(){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx';
    input.onchange = ()=>{
      const file = input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    input.click();
  });
}
function getYoloSession(){
  if(!yoloSessionPromise){
    setupOrtWasm();
    yoloSessionPromise = pickModelFile()
      .then(buffer => ort.InferenceSession.create(buffer, {
        executionProviders:['wasm'],
        graphOptimizationLevel: 'all'
      }))
      .catch(err=>{ yoloSessionPromise=null; throw err; });
  }
  return yoloSessionPromise;
}

function preprocessForYolo(img){
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const SZ = MODEL_INPUT_SIZE;
  const scale = Math.min(SZ/W0, SZ/H0);
  const nw = Math.round(W0*scale), nh = Math.round(H0*scale);
  const canvas = document.createElement('canvas');
  canvas.width = SZ; canvas.height = SZ;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(114,114,114)';
  ctx.fillRect(0,0,SZ,SZ);
  ctx.drawImage(img, 0,0,W0,H0, 0,0,nw,nh);
  const imgData = ctx.getImageData(0,0,SZ,SZ).data;
  const chw = new Float32Array(3*SZ*SZ);
  const plane = SZ*SZ;
  for(let p=0; p<plane; p++){
    chw[p] = imgData[p*4]/255;
    chw[plane+p] = imgData[p*4+1]/255;
    chw[2*plane+p] = imgData[p*4+2]/255;
  }
  return {tensor: new ort.Tensor('float32', chw, [1,3,SZ,SZ]), scale};
}

function nmsBoxes(items, iouTh){
  items.sort((a,b)=> b.conf-a.conf);
  const keep = [];
  const used = new Array(items.length).fill(false);
  for(let i=0;i<items.length;i++){
    if(used[i]) continue;
    const a = items[i]; keep.push(a);
    for(let j=i+1;j<items.length;j++){
      if(used[j]) continue;
      const b = items[j];
      const xx0=Math.max(a.x0,b.x0), yy0=Math.max(a.y0,b.y0);
      const xx1=Math.min(a.x1,b.x1), yy1=Math.min(a.y1,b.y1);
      const inter = Math.max(0,xx1-xx0)*Math.max(0,yy1-yy0);
      const areaA=(a.x1-a.x0)*(a.y1-a.y0), areaB=(b.x1-b.x0)*(b.y1-b.y0);
      const iou = inter/(areaA+areaB-inter);
      if(iou > iouTh) used[j]=true;
    }
  }
  return keep;
}

async function detectBalloons(){
  if(!state.comic) return;
  const btn = $('#btnDetect');
  btn.disabled = true; const oldTxt = btn.textContent; btn.textContent='⏳';
  try{
    if(!yoloSessionPromise){ toast('Selecione o arquivo comic-speech-bubble-detector.onnx na janela que vai abrir…', 4000); }
    toastProgress('Carregando modelo de detecção de balões (só na primeira vez nesta sessão)…');
    const session = await getYoloSession();
    toastProgress('Detectando balões na página…');
    await new Promise(r=>setTimeout(r, 50)); // garante que a mensagem pinte na tela antes do cálculo pesado

    const img = $('#pageImg');
    const {tensor, scale} = preprocessForYolo(img);
    const inputName = session.inputNames[0];
    const results = await session.run({[inputName]: tensor});
    const outputName = session.outputNames[0];
    const out = results[outputName]; // dims: [1,6,21504]
    const dims = out.dims; // [1, 6, N]
    const numAttrs = dims[1], numAnchors = dims[2];
    const data = out.data;

    const CONF_TH = 0.25;
    const candidates = [];
    for(let i=0;i<numAnchors;i++){
      const cx = data[0*numAnchors+i];
      const cy = data[1*numAnchors+i];
      const w_ = data[2*numAnchors+i];
      const h_ = data[3*numAnchors+i];
      let bestCls=0, bestScore=-1;
      for(let c=4;c<numAttrs;c++){
        const s = data[c*numAnchors+i];
        if(s>bestScore){ bestScore=s; bestCls=c-4; }
      }
      if(bestScore < CONF_TH) continue;
      candidates.push({
        x0:(cx-w_/2), y0:(cy-h_/2), x1:(cx+w_/2), y1:(cy+h_/2),
        conf:bestScore, cls:bestCls
      });
    }
    const kept = nmsBoxes(candidates, 0.45);

    const W = img.naturalWidth, H = img.naturalHeight;
    const SHRINK = 0.06; // encolhe a caixa pra dentro, evitando pegar a borda/rabinho do balão
    const cands = kept.map(b=>{
      // volta da escala do modelo (1024, com letterbox) pra fração normalizada da página
      let x0 = Math.max(0, b.x0/scale), y0 = Math.max(0, b.y0/scale);
      let x1 = Math.min(W, b.x1/scale), y1 = Math.min(H, b.y1/scale);
      const insetX = (x1-x0)*SHRINK, insetY = (y1-y0)*SHRINK;
      x0 += insetX; y0 += insetY; x1 -= insetX; y1 -= insetY;
      return {
        x:x0/W, y:y0/H, w:(x1-x0)/W, h:(y1-y0)/H,
        y0:y0/H, y1:y1/H, yc:(y0+y1)/2/H, xc:(x0+x1)/2/W
      };
    });

    if(!cands.length){
      toast('O modelo não encontrou nenhum balão nesta página.', 5000);
      return;
    }

    // ordem de leitura: agrupa balões que se sobrepõem verticalmente numa mesma "linha de leitura"
    // (mais confiável que uma tolerância fixa, já que não sabe onde os quadros começam/terminam)
    cands.sort((a,b)=>a.y0-b.y0);
    const rows = [];
    cands.forEach(c=>{
      let placed=false;
      for(let i=0;i<rows.length;i++){
        const row = rows[i];
        const overlap = Math.min(row.y1,c.y1) - Math.max(row.y0,c.y0);
        const minH = Math.min(c.y1-c.y0, row.y1-row.y0);
        if(overlap > minH*0.3){
          row.items.push(c);
          row.y0 = Math.min(row.y0, c.y0); row.y1 = Math.max(row.y1, c.y1);
          placed=true; break;
        }
      }
      if(!placed) rows.push({y0:c.y0, y1:c.y1, items:[c]});
    });
    rows.sort((a,b)=> (a.y0+a.y1) - (b.y0+b.y1));
    const ordered = [];
    rows.forEach(row=>{ row.items.sort((a,b)=>a.xc-b.xc); row.items.forEach(it=>ordered.push(it)); });

    const arr = state.marks[state.pageIndex] || (state.marks[state.pageIndex]=[]);
    let order = arr.length ? Math.max.apply(null, arr.map(x=>x.order)) : 0;
    ordered.forEach(c=>{
      order++;
      arr.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6), x:c.x, y:c.y, w:c.w, h:c.h, order, text:''});
    });
    await saveMarks();
    drawBalloons();
    state.lastDetectDiag = null;
    toast(`${ordered.length} balão(ões) detectado(s) pelo modelo — revise na lista (☰).`, 5500);
    openSheetList();
  }catch(e){
    console.error('detect error', e);
    toast('Erro ao detectar: '+e.message, 6000);
  }finally{
    btn.disabled=false; btn.textContent=oldTxt;
  }
}

async function clearPageBalloons(){
  const marks = currentMarks();
  if(!marks.length) return;
  if(!confirm(`Apagar todos os ${marks.length} balões marcados nesta página? Essa ação não pode ser desfeita.`)) return;

async function bulkOcr(marks){
  const pending = marks.filter(b=>!b.text);
  if(!pending.length){ toast('Todos os balões desta página já têm texto.'); return; }
  const btn = $('#btnBulkOcr');
  for(let i=0;i<pending.length;i++){
    if(btn) btn.textContent = `Transcrevendo ${i+1}/${pending.length}…`;
    const text = await ocrBalloon(pending[i]);
    if(text){ pending[i].text = text; await saveMarks(); }
  }
  toast('OCR em lote concluído — revise os textos abaixo.', 4500);
  openSheetList();
}
async function setOrder(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder)){ openSheetList(); return; }
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks(); drawBalloons(); openSheetList();
}
async function setOrderQuick(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder) || newOrder===b.order) return;
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks();
  drawBalloons();
  toast(`Balão movido pra posição ${newOrder}`, 1500);
}
async function deleteBalloon(b){
  state.marks[state.pageIndex] = (state.marks[state.pageIndex]||[]).filter(x=>x.id!==b.id);
  await saveMarks(); resetZoom(); drawBalloons(); openSheetList();
}

const PPOCR_BLANK = 0;
const PPOCR_SPACE_IDX = PPOCR_DICT.length + 1; // 503
const PPOCR_REC_H = 48;
const PPOCR_MAX_W = 320; // menor = mais rápido no WASM

let ppocrSessionPromise = null;
let ppocrModelBuffer = null;
let ppocrLoading = false;

// Caminhos relativos (mesmo diretório do HTML no GitHub Pages) e nomes comuns
const PPOCR_MODEL_CANDIDATES = [
  'latin_PP-OCRv5_rec_mobile.onnx',
  './latin_PP-OCRv5_rec_mobile.onnx',
  'models/latin_PP-OCRv5_rec_mobile.onnx',
  './models/latin_PP-OCRv5_rec_mobile.onnx'
];

function setupOrtWasm(){
  if(typeof ort === 'undefined' || !ort.env || !ort.env.wasm) return;
  ort.env.wasm.wasmPaths = 'https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.1/';
  try { ort.env.wasm.numThreads = 1; } catch(e){}
  try { ort.env.wasm.proxy = false; } catch(e){}
}

function pickOnnxFile(hint){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    if(hint) toast(hint, 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    // NÃO usar focus/cancel — isso rejeitava a Promise no meio da leitura
    input.click();
  });
}

async function fetchPpocrModelBuffer(){
  for(const url of PPOCR_MODEL_CANDIDATES){
    try{
      toastProgress('Baixando modelo OCR: ' + url + ' …');
      const res = await fetch(url, { cache: 'force-cache' });
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 100000) continue; // muito pequeno, não é o modelo
      toastProgress('Modelo baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      console.warn('fetch modelo falhou', url, e);
    }
  }
  return null;
}

async function createPpocrSessionFromBuffer(buffer){
  setupOrtWasm();
  toastProgress('Compilando modelo OCR no WASM (15–60s na 1ª vez, aguarde)…');
  await new Promise(r => setTimeout(r, 50));
  try{
    const session = await ort.InferenceSession.create(buffer, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'basic'
    });
    return session;
  }catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    console.error('InferenceSession.create falhou', e);
    throw new Error('Falha ao compilar modelo ONNX: ' + msg);
  }
}

function getPpocrSession(){
  if(ppocrSessionPromise) return ppocrSessionPromise;

  ppocrSessionPromise = (async ()=>{
    try{
      let buffer = ppocrModelBuffer;
      if(!buffer){
        buffer = await fetchPpocrModelBuffer();
      }
      if(!buffer){
        // fallback: file picker (só funciona com clique do usuário)
        buffer = await pickOnnxFile('Modelo não encontrado no site. Selecione latin_PP-OCRv5_rec_mobile.onnx');
      }
      ppocrModelBuffer = buffer;
      const session = await createPpocrSessionFromBuffer(buffer);
      toast('Modelo OCR pronto ✓', 2500);
      return session;
    }catch(err){
      ppocrSessionPromise = null;
      throw err;
    }
  })();

  return ppocrSessionPromise;
}

async function preloadPpocrModel(){
  if(ppocrLoading){
    toast('Já está carregando o modelo… aguarde.', 3000);
    return false;
  }
  if(ppocrSessionPromise){
    try{
      await ppocrSessionPromise;
      toast('Modelo OCR já está pronto ✓', 2000);
      return true;
    }catch(e){
      ppocrSessionPromise = null;
    }
  }
  ppocrLoading = true;
  try{
    await getPpocrSession();
    return true;
  }catch(e){
    console.error('preload OCR', e);
    const msg = (e && e.message) ? e.message : String(e);
    toast('Não carregou o modelo: ' + msg, 8000);
    return false;
  }finally{
    ppocrLoading = false;
  }
}

/** Preprocess single text-line crop → CHW float32 [-1,1], height=48 */
function preprocessLineForPpocr(canvasSrc, sx, sy, sw, sh){
  const H = PPOCR_REC_H;
  let targetW = Math.round(sw * (H / Math.max(1, sh)));
  if(targetW < 16) targetW = 16;
  if(targetW > PPOCR_MAX_W) targetW = PPOCR_MAX_W;
  const padW = Math.ceil(targetW / 8) * 8;

  const canvas = document.createElement('canvas');
  canvas.width = padW;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, padW, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvasSrc, sx, sy, sw, sh, 0, 0, targetW, H);

  const imgData = ctx.getImageData(0, 0, padW, H).data;
  const chw = new Float32Array(3 * H * padW);
  const plane = H * padW;
  for(let p = 0; p < plane; p++){
    const r = imgData[p*4] / 255;
    const g = imgData[p*4+1] / 255;
    const b = imgData[p*4+2] / 255;
    chw[p]           = (r - 0.5) / 0.5;
    chw[plane + p]   = (g - 0.5) / 0.5;
    chw[2*plane + p] = (b - 0.5) / 0.5;
  }
  return new ort.Tensor('float32', chw, [1, 3, H, padW]);
}

/** CTC greedy decode — blank=0, chars=1..502, space=503 */
function decodePpocrOutput(data, dims){
  const T = dims[1];
  const C = dims[2];
  const chars = [];
  let prev = -1;
  for(let t = 0; t < T; t++){
    let bestIdx = 0, bestVal = -Infinity;
    const base = t * C;
    for(let c = 0; c < C; c++){
      const v = data[base + c];
      if(v > bestVal){ bestVal = v; bestIdx = c; }
    }
    if(bestIdx === prev) continue;
    if(bestIdx === PPOCR_BLANK){ prev = bestIdx; continue; }
    if(bestIdx === PPOCR_SPACE_IDX){
      chars.push(' ');
    } else if(bestIdx >= 1 && bestIdx <= PPOCR_DICT.length){
      chars.push(PPOCR_DICT[bestIdx - 1]);
    }
    prev = bestIdx;
  }
  return chars.join('').replace(/\s+/g, ' ').trim();
}

/** Divide o recorte do balão em linhas de texto (projeção horizontal) */
function splitBalloonLines(imgEl, bx, by, bw, bh){
  const nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
  const sx = Math.max(0, Math.round(bx * nw));
  const sy = Math.max(0, Math.round(by * nh));
  const sw = Math.max(1, Math.round(bw * nw));
  const sh = Math.max(1, Math.round(bh * nh));

  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
  const idata = tctx.getImageData(0, 0, sw, sh);
  const d = idata.data;

  // projeção: média de pixels escuros por linha
  const proj = new Float32Array(sh);
  for(let y = 0; y < sh; y++){
    let dark = 0;
    for(let x = 0; x < sw; x++){
      const i = (y * sw + x) * 4;
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(gray < 180) dark++;
    }
    proj[y] = dark / sw;
  }
  let maxP = 0;
  for(let y = 0; y < sh; y++) if(proj[y] > maxP) maxP = proj[y];
  const th = Math.max(0.02, maxP * 0.15);

  const ranges = [];
  let start = -1;
  for(let y = 0; y < sh; y++){
    if(proj[y] > th){
      if(start < 0) start = y;
    } else if(start >= 0){
      if(y - start >= 3) ranges.push([start, y]);
      start = -1;
    }
  }
  if(start >= 0 && sh - start >= 3) ranges.push([start, sh]);

  // funde linhas muito próximas
  const merged = [];
  for(let i = 0; i < ranges.length; i++){
    if(!merged.length){ merged.push(ranges[i]); continue; }
    const last = merged[merged.length - 1];
    if(ranges[i][0] - last[1] < 4) last[1] = ranges[i][1];
    else merged.push(ranges[i]);
  }

  if(!merged.length){
    return [{ canvas: tmp, x: 0, y: 0, w: sw, h: sh }];
  }
  return merged.map(([a, b])=>{
    const pa = Math.max(0, a - 2);
    const pb = Math.min(sh, b + 2);
    return { canvas: tmp, x: 0, y: pa, w: sw, h: pb - pa };
  }).filter(r => r.h >= 6);
}

async function ocrBalloon(b){
  try{
    const needLoad = !ppocrSessionPromise;
    if(needLoad) toastProgress('Carregando modelo OCR (PP-OCRv5)…');
    const session = await getPpocrSession();
    toastProgress('Reconhecendo texto do balão…');
    // deixa a UI pintar antes do trabalho pesado
    await new Promise(r => setTimeout(r, 30));

    const img = $('#pageImg');
    const margin = 0.05;
    const bx = b.x + b.w * margin;
    const by = b.y + b.h * margin;
    const bw = b.w * (1 - 2 * margin);
    const bh = b.h * (1 - 2 * margin);

    let lines = splitBalloonLines(img, bx, by, bw, bh);
    // no máximo 6 linhas por balão (evita travar em projeção ruim)
    if(lines.length > 6) lines = lines.slice(0, 6);

    const inputName = session.inputNames[0];
    const parts = [];
    for(let i = 0; i < lines.length; i++){
      const ln = lines[i];
      toastProgress(lines.length > 1
        ? `OCR linha ${i+1}/${lines.length}…`
        : 'Reconhecendo texto…');
      // cede o thread pra UI (e pro proxy worker)
      await new Promise(r => setTimeout(r, 20));

      const tensor = preprocessLineForPpocr(ln.canvas, ln.x, ln.y, ln.w, ln.h);
      const results = await session.run({[inputName]: tensor});
      const out = results[session.outputNames[0]];
      const text = decodePpocrOutput(out.data, out.dims);
      if(text) parts.push(text);
    }

    toastEl.classList.remove('show');
    const text = parts.join(' ').replace(/\s+/g, ' ').trim();
    if(!text){
      toast('Não consegui ler texto nesse recorte. Tente ajustar o balão ou digitar manualmente.', 4500);
      return null;
    }
    return text;
  }catch(e){
    console.error('OCR PP-OCR erro', e);
    const msg = (e && e.message) ? e.message : String(e);
    // se falhou ao criar sessão, limpa pra poder tentar de novo no próximo clique
    if(/cancelad|selecionado|Falha ao ler|create|wasm|Compile|memory|OOM/i.test(msg) || !ppocrModelBuffer){
      ppocrSessionPromise = null;
    }
    toast('OCR falhou: ' + msg + '. Tente de novo ou digite manualmente.', 7000);
    return null;
  }
}

/* ==================== TTS ==================== */
state.ttsAvailable = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');

function loadVoices(){
  if(!state.ttsAvailable) return;
  state.voices = speechSynthesis.getVoices();
  const sel = $('#voiceSelect'); if(!sel) return;
  sel.innerHTML='';
  const pt = state.voices.filter(v=>v.lang.toLowerCase().startsWith('pt'));
  const list = pt.length ? pt : state.voices;
  list.forEach((v,i)=>{
    const opt=document.createElement('option'); opt.value=v.name; opt.textContent=`${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
}
if(state.ttsAvailable){
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, onend){
  if(!state.ttsAvailable){
    if(!state._ttsWarned){ state._ttsWarned=true; toast('Este navegador não tem suporte a voz — mostrando só o texto.', 4000); }
    if(onend) onend();
    return;
  }
  if(!text){ if(onend) onend(); return; }

  let finished = false;
  const done = ()=>{ if(finished) return; finished=true; clearTimeout(safety); if(onend) onend(); };

  speechSynthesis.cancel();
  // correção conhecida: chamar speak() logo após cancel() falha silenciosamente
  // em vários navegadores Android antigos — um pequeno atraso resolve.
  setTimeout(()=>{
    const u = new SpeechSynthesisUtterance(text);
    const chosenName = localStorage_voice();
    const v = state.voices.find(v=>v.name===chosenName) || state.voices.find(v=>v.lang.toLowerCase().startsWith('pt-br')) || state.voices.find(v=>v.lang.toLowerCase().startsWith('pt'));
    if(v) u.voice=v;
    u.lang = v ? v.lang : 'pt-BR';
    const rateEl = $('#rateRange');
    u.rate = parseFloat(rateEl ? rateEl.value : '1');
    u.onend = done;
    u.onerror = function(ev){
      console.error('Erro de fala', ev);
      toast('Erro ao falar: ' + (ev && ev.error ? ev.error : 'desconhecido'), 4000);
      done();
    };
    try{
      speechSynthesis.speak(u);
    }catch(e){
      toast('Falha ao chamar a voz: ' + e.message, 4000);
      done();
      return;
    }
    // alguns navegadores Android antigos "pausam" a fila sozinhos — reforça o resume
    const resumer = setInterval(()=>{
      if(finished){ clearInterval(resumer); return; }
      if(speechSynthesis.paused) speechSynthesis.resume();
    }, 300);
  }, 120);

  // salvaguarda: se nada acontecer (nem onend nem onerror) em tempo razoável, avança mesmo assim
  const safety = setTimeout(done, Math.max(4000, text.length*180));
}
function localStorage_voice(){ return state._voiceName || null; }

/* ==================== PLAY MODE ==================== */
$('#btnPlay').addEventListener('click', ()=>{
  if(state.mode==='play'){ pausePlay(); return; }
  startPlay();
});
function startPlay(){
  const marks = currentMarks();
  if(!marks.length){ toast('Nenhum balão marcado nesta página.'); return; }
  setMode('play');
  state.playQueue = marks.slice();
  const startIdx = (state.playPauseIndex!=null && state.playPauseIndex < marks.length) ? state.playPauseIndex : 0;
  state.playPauseIndex = null;
  playNext(startIdx);
}
function playNext(i){
  if(state.mode!=='play') return;
  const marks = currentMarks();
  if(i>=marks.length){
    if(state.pageIndex < state.comic.pages.length-1){
      state.pageIndex++; renderPage();
      setTimeout(()=>{ setMode('play'); const m2=currentMarks(); if(m2.length) playNext(0); else stopPlay(); }, 450);
    } else { stopPlay(); toast('Fim do quadrinho.'); }
    return;
  }
  const b = marks[i];
  highlightBalloon(b);
  if(state.readZoomOn) showBalloonCard(b);
  speak(b.text || '', ()=>{
    if(state.paused) return; // pausado pra edição — não avança sozinho
    state.playTimer = setTimeout(()=>playNext(i+1), 350);
  });
}
function pausePlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  const marks = currentMarks();
  const idx = marks.findIndex(x=>x.id===state.activeBalloon);
  state.playPauseIndex = idx>=0 ? idx : 0;
  setMode('read');
}
function stopPlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  state.playPauseIndex = null;
  if(state.mode==='play') setMode('read');
  hideBalloonCard();
}

    const b=currentMarks().find(x=>x.id===state.activeBalloon); if(b) zoomToBalloon(b);
  } else {
    resetZoom();
  }
  drawBalloons();
  if(state.cardBalloonId){
    const b = currentMarks().find(x=>x.id===state.cardBalloonId);
    if(b) showBalloonCard(b); else hideBalloonCard();
  }
});
$('#stage').addEventListener('wheel', (e)=>{
  if(!state.comic) return;
  e.preventDefault();
  const stage = $('#stage').getBoundingClientRect();
  if(e.ctrlKey || e.metaKey){
    const factor = Math.exp(-e.deltaY*0.01);
    const newScale = Math.min(6, Math.max(0.5, state.viewTransform.scale*factor));
    const anchorX = (e.clientX - stage.left - state.viewTransform.tx)/state.viewTransform.scale;
    const anchorY = (e.clientY - stage.top - state.viewTransform.ty)/state.viewTransform.scale;
    state.viewTransform = {
      scale:newScale,
      tx:(e.clientX-stage.left) - anchorX*newScale,
      ty:(e.clientY-stage.top) - anchorY*newScale
    };
  } else {
    state.viewTransform.tx -= e.deltaX;
    state.viewTransform.ty -= e.deltaY;
  }
  applyViewTransform(false);
}, {passive:false});
refreshLibrary();
loadVoices();
checkStorageAvailable();
</script>
</body>
