<script>
// Detector de erro visível — escrito em JS bem antigo (ES5) de propósito,
// pra funcionar mesmo em navegadores muito antigos/incomuns e mostrar
// na tela qualquer erro que trave o app, em vez de falhar em silêncio.
window.onerror = function(msg, url, line, col, err) {
  try {
    var el = document.getElementById('js-error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'js-error-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#c0392b;color:#fff;font-family:monospace;font-size:12px;' +
        'padding:10px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;';
      document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
    }
    var extra = '';
    try {
      if (err && err.stack) extra = '\n' + String(err.stack).slice(0, 500);
      else if (url) extra = '\n' + String(url) + ' :' + line + ':' + (col||'');
    } catch (e2) {}
    el.textContent = 'ERRO DE JAVASCRIPT (linha ' + line + '): ' + msg + extra;
  } catch (e) {}
  return false;
};
window.addEventListener('unhandledrejection', function(ev){
  try {
    var msg = (ev.reason && (ev.reason.message || ev.reason)) || 'Promise rejeitada';
    window.onerror(String(msg), '', 0, 0, ev.reason);
  } catch (e) {}
});
</script>

<style>
  :root{
    --bg:#15171c;
    --panel:#1f222a;
    --panel-2:#262a33;
    --page-bg:#e8e3d6;
    --accent:#e4402c;
    --accent-dim:#7a2a20;
    --gold:#d9a94a;
    --text:#edeae2;
    --text-dim:#8a8f9c;

  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;
  }
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */

    display:flex;flex-direction:column;gap:6px;
    padding:8px 10px;border-bottom:1px solid var(--border);
    background:var(--panel);flex-shrink:0;z-index:20;
  }

  }
  .topbar-row2{display:none;}
  .topbar-row2.visible{display:flex;}
  .brand{
    font-family:'Bangers',cursive;letter-spacing:1px;
    font-size:22px;color:var(--accent);
    text-shadow:2px 2px 0 var(--accent-dim);
    flex-shrink:0;
  }
  .topbar .sub{color:var(--text-dim);font-size:12px;flex:1;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .top-tabs{display:flex;gap:4px;flex-shrink:0;flex:1;min-width:0;}
  .top-tabs button{
    flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-family:inherit;
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .top-tabs button.on{background:var(--accent);color:#fff;border-color:transparent;}
  .top-search{
    flex:1;min-width:0;
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;
  }
  .topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;}
  #btnNavBack{
    flex-shrink:0;padding:7px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-family:inherit;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;

    background:var(--accent);border:2px solid var(--panel);animation:pulse 1.6s infinite;

  /* ---------- Library screen ---------- */

  .drive-bar{

    border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45;

  .catalog-info{padding:10px 11px 12px;}

  .catalog-xfer-pct{font-size:12px;color:var(--text-dim);margin-top:6px;text-align:right;}
  .catalog-book-detail{

  .catalog-book-detail-cover{

  .catalog-book-detail input,.catalog-book-detail textarea{

  }
  .catalog-book-detail textarea{min-height:110px;resize:vertical;}
  .catalog-order-tog{grid-column:1/-1;display:flex;gap:8px;margin-bottom:10px;}

  }
  .catalog-order-tog button.on{background:var(--accent);color:#fff;border-color:transparent;}
  .catalog-arc-group{
    border:1px solid rgba(201,164,74,.5);

    display:flex;align-items:center;gap:8px;padding:4px 6px 8px;

  }
  .catalog-arc-group.no-arc .catalog-arc-head{

  }
  .catalog-arc-head .arc-badge{
    flex-shrink:0;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    background:var(--gold);color:#2b2205;letter-spacing:.3px;

  .catalog-arc-body{display:flex;flex-direction:column;gap:8px;}
  .catalog-pub-cover{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Bangers', Impact, sans-serif;font-size:22px;letter-spacing:1px;
    text-align:center;padding:6px;box-sizing:border-box;
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }
  .catalog-pub-cover.has-img{text-indent:-9999px;overflow:hidden;padding:0;}




  .drop{
    border:2px dashed var(--border);border-radius:16px;padding:34px 18px;
    text-align:center;color:var(--text-dim);margin-bottom:22px;
  }
  .drop b{color:var(--text);}
  .btn-primary{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;
  }
  .btn-primary:active{transform:scale(.97);}
  .lib-item{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);margin-bottom:10px;
  }
  .lib-thumb{
    width:52px;height:72px;border-radius:6px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-family:'Bangers';
    color:var(--gold);font-size:14px;flex-shrink:0;
    overflow:hidden;border:1px solid var(--border);
  }
  .lib-thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .lib-meta{flex:1;overflow:hidden;}
  .lib-meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-meta .stat{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .lib-del{color:var(--text-dim);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:18px 0 8px;}

  /* ---------- Reader screen ---------- */
  #screen-reader{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;}
  #screen-reader.active{display:flex;}
  #stage{
    flex:1;position:relative;overflow:hidden;background:#0c0d10;
    touch-action:none;
  }
  #pageWrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1);}
  #pageImg{display:block;background:var(--page-bg);user-select:none;-webkit-user-drag:none;touch-action:none;}
  #overlay{position:absolute;inset:0;touch-action:none;}
  .balloon{
    position:absolute;border:1px solid var(--gold);border-radius:8px;
    background:rgba(217,169,74,.10);
    cursor:pointer;z-index:5;pointer-events:auto;
  }
  .balloon.active{border-color:var(--accent);border-width:1.5px;background:rgba(228,64,44,.14);z-index:6;}
  .balloon.dim{opacity:0.5;}
  .balloon .tag{
    position:absolute;top:-7px;left:-7px;width:15px;height:15px;border-radius:50%;
    background:var(--gold);color:#2b2205;font-family:'Bangers';font-size:9px;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .balloon.active .tag{background:var(--accent);color:#fff;}

  .draft-box{
    position:absolute;border:1.5px solid var(--accent);border-radius:6px;
    background:rgba(228,64,44,.12);touch-action:none;cursor:move;
  }
  .draft-handle{
    position:absolute;width:22px;height:22px;margin:-11px;
    background:transparent;touch-action:none;
    display:flex;align-items:center;justify-content:center;
  }
  .draft-handle::after{
    content:'';width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  .draft-handle.nw{left:0;top:0;} .draft-handle.ne{left:100%;top:0;}
  .draft-handle.sw{left:0;top:100%;} .draft-handle.se{left:100%;top:100%;}

  #draftToolbar{
    position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
    display:none;gap:10px;z-index:25;align-items:center;
  }
  #draftToolbar button{
    padding:11px 18px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;

  }

    background:rgba(0,0,0,.55);color:var(--text);font-size:12px;padding:6px 10px;border-radius:999px;

  #draftToolbar #btnDraftCancel{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}

    position:absolute;z-index:22;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.55);border:3px solid var(--gold);
    cursor:pointer;background:var(--page-bg);

(function(){
  function ensureModal(){
    var modal = document.getElementById('settingsModal');

    modal = document.createElement('div');
    modal.id = 'settingsModal';
    modal.setAttribute('style',
      'display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483646;' +
      'background:rgba(0,0,0,0.72);align-items:flex-end;justify-content:center;'

    modal.innerHTML =
      '<div id="settingsPanel" style="width:100%;max-width:560px;max-height:88vh;overflow:auto;' +
      'background:#1a1c22;color:#f2f2f2;border-radius:16px 16px 0 0;border:1px solid #333;padding:0 0 24px;">' +
      '<div style="display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #333;' +
      'position:sticky;top:0;background:#1a1c22;z-index:1;">' +
      '<b style="flex:1;font-size:16px;">Configurações</b>' +
      '<button type="button" id="settingsCloseBtn" style="border:none;background:transparent;color:#f2f2f2;font-size:22px;cursor:pointer;padding:6px 10px;">✕</button>' +
      '</div><div id="settingsBody" style="padding:14px 16px;"></div></div>';
    document.body.appendChild(modal);
    return modal;
  }

  window.__closeSettings = function(){
    var modal = document.getElementById('settingsModal');
    if(modal) modal.style.display = 'none';
  };

  window.__openSettings = function(){
    try{
      var modal = ensureModal();

        alert('settingsBody ausente');
        return;
      }

        html += '<div style="margin-bottom:14px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:6px">Voz em português</label>';
        html += '<select id="voiceSelect" style="width:100%;padding:10px;border-radius:8px;background:#12141a;color:#f2f2f2;border:1px solid #333"></select></div>';
        html += '<div style="margin-bottom:14px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:6px">Velocidade da fala</label>';
        html += '<input type="range" id="rateRange" min="0.6" max="1.6" step="0.1" value="1" style="width:100%"></div>';

        html += '<div id="voiceCount" style="font-size:12px;color:#888;margin-bottom:10px"></div>';
      } else {
        html += '<div style="font-size:13px;color:#aaa;margin-bottom:12px">Este navegador não tem suporte a voz (Web Speech API).</div>';
      }
      html += '<hr style="border:none;border-top:1px solid #333;margin:16px 0">';
      html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">Catálogo (JSON + Drive)</div>';
      html += '<div style="font-size:12px;color:#888;margin-bottom:10px">Sincronize o catálogo e as capas entre aparelhos.</div>';
      html += '<div style="display:flex;flex-direction:column;gap:8px">';
      html += '<button type="button" id="setCatImport" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Importar catalogo.json</button>';
      html += '<button type="button" id="setSagaOrderImport" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Importar ordem de saga (saga-order-*.json)</button>';
      const nOrd = Object.keys(state.sagaOrders || {}).length;
      if(nOrd){
        html += '<div style="font-size:12px;color:#9aa;margin-top:4px">' + nOrd + ' ordem(ns) CBRO carregada(s): ' +
          Object.keys(state.sagaOrdersMeta||{}).map(k => (state.sagaOrdersMeta[k].event||k)).join(', ') + '</div>';
      }
      html += '<button type="button" id="setCatPush" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Enviar catálogo ao Drive</button>';
      html += '<button type="button" id="setCatPull" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Baixar catálogo do Drive</button>';
      html += '<button type="button" id="setThumbsUp" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Enviar thumbs ao Drive</button>';
      html += '<button type="button" id="setCatClear" style="padding:12px;border-radius:10px;border:1px solid #444;background:transparent;color:#aaa">Limpar catálogo local</button>';
      html += '</div>';
      html += '<div style="margin-top:16px;font-size:13px;font-weight:600">Firebase (sync rápido entre aparelhos)</div>';
      html += '<div style="font-size:12px;color:#888;margin:6px 0 8px">Progresso de leitura e correções de metadados.</div>';
      html += '<div id="setFbStatus" style="font-size:12px;color:#888;margin:8px 0">…</div>';
      html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">';
      html += '<button type="button" id="setFbLogin" style="padding:12px;border-radius:10px;border:none;background:#e4402c;color:#fff;font-weight:600">Entrar no Firebase (Google)</button>';
      html += '<button type="button" id="setFbLogout" style="padding:12px;border-radius:10px;border:1px solid #444;background:transparent;color:#aaa;display:none">Sair do Firebase</button>';
      html += '<button type="button" id="setFbRefresh" style="padding:10px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Atualizar status Firebase</button>';
      html += '<button type="button" id="setFbPushOrders" onclick="try{window.__fbPushOrders&&window.__fbPushOrders()}catch(e){alert(e)}" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2;font-weight:600">Enviar ordens deste aparelho ao Firebase</button>';

  }

}

async function fbLogin(){

  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');

  console.log('[fbLogin] origin=', location.origin);

  // 1) POPUP primeiro (no celular o redirect costuma "entrar" e perder a sessão)
  try{

  // 2) Fallback: Google Identity Services (token) → credential Firebase
  //    Funciona melhor em vários Androids quando o popup do Firebase falha
  try{
    const ok = await fbLoginWithGis();
    if(ok) return;
  }catch(e){

  }
}

/** Login via Google Identity Services (GSI) + Firebase credential */
function fbLoginWithGis(){
  return new Promise(function(resolve, reject){
    // Client ID do projeto Firebase (OAuth Web) — mesmo número do messagingSenderId/app
    // Formato padrão: PROJECT_NUMBER-....apps.googleusercontent.com
    // Se não estiver definido, tenta descobrir via meta ou config
    var clientId = (state.fb && state.fb.gisClientId) || window.__FB_GIS_CLIENT_ID || '';
    if(!clientId){
      // Fallback: muitos projetos Firebase usam o client gerado automaticamente;
      // o usuário pode colar em Configurações depois. Sem clientId, aborta GIS.
      console.warn('[fb] GIS clientId não configurado');
      resolve(false);
      return;
    }
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
      resolve(false);
      return;
    }
    try{
      var client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'openid email profile',
        callback: async function(tokenResponse){
          try{
            if(!tokenResponse || tokenResponse.error){
              resolve(false);
              return;
            }
            // Com access token não dá para criar credential Firebase direto;
            // precisa de id_token. Usa init code / id services:
            resolve(false);
          }catch(err){ reject(err); }
        }
      });
      // Preferir ID token:
      if(google.accounts.id){
        google.accounts.id.initialize({
          client_id: clientId,
          callback: async function(response){
            try{
              if(!response || !response.credential){
                resolve(false);
                return;
              }
              var credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
              var result = await state.fb.auth.signInWithCredential(credential);
              if(result && result.user){
                state.fb.user = result.user;
                fbUpdateUi();
                toast('Firebase conectado ✓ ' + (result.user.email || ''), 3500);
                resolve(true);
              } else resolve(false);
            }catch(err){
              console.error(err);
              reject(err);
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true
        });
        // prompt One Tap pode falhar; usa botão virtual
        google.accounts.id.prompt(function(notification){
          if(notification && (notification.isNotDisplayed() || notification.isSkippedMoment())){
            // fallback: oauth2 token não serve sozinho — reporta false
            resolve(false);
          }
        });
        return;
      }
      resolve(false);
    }catch(e){ reject(e); }
  });
}
async function fbLogout(){

function fbUserPath(){
  const u = state.fb && state.fb.user;
  if(!u) return null;
  return state.fb.db.collection('users').doc(u.uid);
}
async function fbSaveProgress(payload){
  const root = fbUserPath();
  if(!root || !payload || !payload.comicId) return false;
  const id = fbSafeId(payload.comicId);
  const data = {
    comicId: payload.comicId,
    comicName: payload.comicName || '',
    pageIndex: payload.pageIndex || 0,
    pageCount: payload.pageCount || 0,
    finished: !!payload.finished,
    savedAt: payload.savedAt || Date.now(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  // marks podem ser grandes — só salva page progress no FB; marks continuam no Drive/local
  await root.collection('progress').doc(id).set(data, { merge: true });
  try{
    state.readingProgress = state.readingProgress || {};
    const keys = [payload.comicId, payload.comicName, slugify(payload.comicName||'')];
    keys.forEach(k => {
      if(!k) return;
      state.readingProgress[k] = {
        pageIndex: data.pageIndex,
        pageCount: data.pageCount,
        finished: data.finished,
        comicName: data.comicName,
        comicId: data.comicId,
        savedAt: data.savedAt
      };
    });
    state._progressIndexAt = Date.now();
  }catch(_){}
  return true;
}
async function fbLoadProgress(comicId){
  const root = fbUserPath();
  if(!root || !comicId) return null;
  const snap = await root.collection('progress').doc(fbSafeId(comicId)).get();
  if(!snap.exists) return null;
  return snap.data();
}
async function fbPullProgressIndex(){
  const root = fbUserPath();
  if(!root) return;
  const snap = await root.collection('progress').limit(500).get();
  state.readingProgress = state.readingProgress || {};
  snap.forEach(doc => {
    const d = doc.data() || {};
    const keys = [d.comicId, d.comicName, slugify(d.comicName||''), doc.id];
    keys.forEach(k => {
      if(!k) return;
      const prev = state.readingProgress[k];
      if(prev && prev.savedAt && d.savedAt && prev.savedAt > d.savedAt) return;
      state.readingProgress[k] = {
        pageIndex: d.pageIndex || 0,
        pageCount: d.pageCount || 0,
        finished: !!d.finished,
        comicName: d.comicName || '',
        comicId: d.comicId || doc.id,
        savedAt: d.savedAt || Date.now()
      };
    });
  });
  state._progressIndexAt = Date.now();
}
async function fbSaveOverride(bookId, fields){
  const root = fbUserPath();
  if(!root || !bookId) return false;
  const clean = Object.assign({}, fields);
  delete clean.savedAt;
  clean.savedAt = Date.now();
  clean.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  await root.collection('overrides').doc(fbSafeId(bookId)).set(clean, { merge: true });
  return true;
}
async function fbSaveOverridesBatch(mapObj){
  const root = fbUserPath();
  if(!root || !mapObj) return 0;
  const entries = Object.keys(mapObj);
  let n = 0;
  // batches de 400
  for(let i=0; i<entries.length; i+=400){
    const batch = state.fb.db.batch();
    const slice = entries.slice(i, i+400);
    slice.forEach(id => {
      const data = Object.assign({}, mapObj[id]);
      data.savedAt = data.savedAt || Date.now();
      batch.set(root.collection('overrides').doc(fbSafeId(id)), data, { merge: true });
      n++;
    });
    await batch.commit();
  }
  return n;
}
async function fbPullAllOverrides(){
  const root = fbUserPath();
  if(!root) return;
  const snap = await root.collection('overrides').limit(5000).get();
  const local = (await storeGet('catalog-overrides')) || {};
  let changed = false;
  snap.forEach(doc => {
    const d = doc.data() || {};
    const id = doc.id;
    const l = local[id] || {};
    if(!l.savedAt || (d.savedAt && d.savedAt >= l.savedAt)){
      local[id] = Object.assign({}, l, d);
      changed = true;
    }
  });
  if(changed){
    await storeSet('catalog-overrides', local);
    if(state.jsonCatalog && typeof catalogApplyOverrides === 'function'){

/** Remove undefined/NaN de objetos aninhados (Firestore não aceita undefined) */
function fbSanitize(value){
  if(value === undefined) return undefined; // signal omit
  if(value === null) return null;
  if(typeof value === 'number' && isNaN(value)) return null;
  if(Array.isArray(value)){
    return value.map(fbSanitize).filter(function(v){ return v !== undefined; });
  }
  if(value && typeof value === 'object' && value.constructor === Object){
    const out = {};
    Object.keys(value).forEach(function(k){
      const v = fbSanitize(value[k]);
      if(v !== undefined) out[k] = v;
    });
    return out;
  }
  // Date, string, bool, number ok
  return value;
}
async function fbSaveSagaOrders(){

  payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

async function fbPullSagaOrders(opts){
  opts = opts || {};
  const root = fbUserPath();
  if(!root) return false;
  const snap = await root.collection('meta').doc('sagaOrders').get();
  if(!snap.exists){
    if(opts.verbose){
      const nLocal = Object.keys(state.sagaOrders || {}).length;
      toast('Firebase sem ordens ainda. Neste aparelho: ' + nLocal + '. Importe no PC com Firebase ligado.', 5000);
    }
    return false;
  }
  const d = snap.data() || {};
  const remoteAt = d.savedAt || 0;
  const remoteOrders = d.orders || {};
  const remoteMeta = d.meta || {};
  const remoteCount = Object.keys(remoteOrders).length;

  // NÃO sobrescrever local com remoto VAZIO
  if(remoteCount === 0){
    if(opts.verbose) toast('Firebase tem documento de ordens, mas está vazio. Reimporte no PC.', 5000);
    return false;
  }

  const localSaved = (await storeGet('saga-orders-savedAt')) || 0;
  if(!opts.force && remoteAt && localSaved && remoteAt <= localSaved && Object.keys(state.sagaOrders||{}).length){
    if(opts.verbose) toast('Ordens de saga já sincronizadas (' + remoteCount + ')', 2500);
    return false;
  }

  // mescla: remoto ganha por chave; não apaga chaves locais se remoto não tiver
  Object.keys(remoteOrders).forEach(k => {
    state.sagaOrders[k] = remoteOrders[k];
    state.sagaOrdersMeta[k] = remoteMeta[k] || state.sagaOrdersMeta[k] || { event: k, importedAt: remoteAt };
  });
  await sagaOrdersSaveLocal();
  try{ await storeSet('saga-orders-savedAt', remoteAt || Date.now()); }catch(_){}

  let totalApplied = 0;
  const names = [];
  if(state.jsonCatalog && typeof catalogApplySagaOrderToCatalog === 'function'){
    for(const k of Object.keys(remoteOrders)){
      const order = remoteOrders[k];
      if(!order || !order.event) continue;
      try{
        const n = await catalogApplySagaOrderToCatalog(order, { skipDrive: true, silent: true });
        totalApplied += (n || 0);
        names.push(order.event);
      }catch(e){ console.warn('reapply order', e); }
    }
  }
  if(typeof renderJsonCatalog === 'function' && state.screen === 'catalog'){
    try{ renderJsonCatalog(); }catch(_){}
  }
  if(opts.verbose || totalApplied || names.length){
    toast('Ordens Firebase: ' + names.join(', ') +
      (totalApplied ? (' · ' + totalApplied + ' eds no catálogo') : ''), 5000);
  }
  return true;
}

async function driveFetch(path, options){
  if(!state.drive.token || Date.now() >= state.drive.tokenExp - 5000){
    throw new Error('Drive não conectado');
  }
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {}, {
    Authorization: 'Bearer ' + state.drive.token
  });
  const res = await fetch('https://www.googleapis.com' + path, opts);
  if(res.status === 401){
    state.drive.token = null;
    driveUpdateUi();
    throw new Error('Sessão Drive expirou — entre de novo');
  }
  return res;
}

async function driveEnsureFolder(){
  if(state.drive.folderId) return state.drive.folderId;
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + DRIVE_FOLDER_NAME + "' and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'erro ao buscar pasta');
  if(data.files && data.files.length){
    state.drive.folderId = data.files[0].id;
  } else {
    const meta = { name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' };
    const cr = await driveFetch('/drive/v3/files?fields=id,name', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(meta)
    });
    const created = await cr.json();
    if(!cr.ok) throw new Error((created.error && created.error.message) || 'erro ao criar pasta');
    state.drive.folderId = created.id;
  }
  const t = await storeGet(DRIVE_TOKEN_KEY);
  if(t){ t.folderId = state.drive.folderId; await storeSet(DRIVE_TOKEN_KEY, t); }
  return state.drive.folderId;
}

async function driveEnsureProgressFolder(){
  if(state.driveProgressFolderId) return state.driveProgressFolderId;
  try{
    const cached = await storeGet('drive-progress-folder');
    if(cached && cached.id){ state.driveProgressFolderId = cached.id; return cached.id; }
  }catch(_){}
  const parentId = await driveEnsureFolder();
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='progress' and '" + parentId + "' in parents and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'listar pasta progress');
  if(data.files && data.files[0]){
    state.driveProgressFolderId = data.files[0].id;
  } else {
    const meta = { name: 'progress', mimeType: 'application/vnd.google-apps.folder', parents: [parentId] };
    const created = await driveFetch('/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(meta)
    }).then(r => r.json());
    if(!created.id) throw new Error((created.error && created.error.message) || 'criar pasta progress');
    state.driveProgressFolderId = created.id;
  }
  try{ await storeSet('drive-progress-folder', { id: state.driveProgressFolderId }); }catch(_){}
  return state.driveProgressFolderId;
}

async function driveFindProgressFile(comicId){
  const name = driveProgressFileName(comicId);
  // 1) pasta progress (novo)
  try{
    const progressId = await driveEnsureProgressFolder();
    const q = encodeURIComponent("name='" + name.replace(/'/g,"\\'") + "' and '" + progressId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=5');
    const data = await res.json();
    if(res.ok && data.files && data.files[0]) return data.files[0];
  }catch(e){ console.warn('find progress folder', e); }
  // 2) legado: raiz de Balao HQ
  try{
    const folderId = await driveEnsureFolder();
    const q = encodeURIComponent("name='" + name.replace(/'/g,"\\'") + "' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=5');
    const data = await res.json();
    if(res.ok && data.files && data.files[0]) return data.files[0];
  }catch(_){}
  return null;
}

async function driveUploadProgress(comicId, payload){
  const folderId = await driveEnsureProgressFolder();
  const name = driveProgressFileName(comicId);
  const existing = await driveFindProgressFile(comicId);
  const body = JSON.stringify(payload);
  if(existing){
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=media', {
      method: 'PATCH',
      headers: {
        Authorization: 'Bearer ' + state.drive.token,
        'Content-Type': 'application/json'
      },
      body
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error((err.error && err.error.message) || 'falha ao atualizar Drive');
    }
    return existing.id;
  }
  const metadata = {
    name,
    parents: [folderId],
    mimeType: 'application/json'
  };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([body], { type: 'application/json' }));
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.drive.token },
    body: form
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'falha ao criar no Drive');
  return data.id;
}

async function driveDownloadProgress(comicId){
  const existing = await driveFindProgressFile(comicId);
  if(!existing) return null;
  const res = await driveFetch('/drive/v3/files/' + existing.id + '?alt=media');
  if(!res.ok) return null;
  return await res.json();
}

function marksTextCount(marks){
  let n = 0;
  Object.keys(marks || {}).forEach(k=>{
    (marks[k]||[]).forEach(b=>{ if((b.text||'').trim()) n++; });
  });
  return n;
}

async function pullDriveProgressForComic(comicId){
  if(!state.drive.token || Date.now() >= state.drive.tokenExp - 5000) return null;
  try{
    const remote = await driveDownloadProgress(comicId);
    if(!remote || !remote.marks) return null;
    const localMeta = (await storeGet('marks-meta:'+comicId)) || {};
    const remoteAt = remote.savedAt || 0;
    const localAt = localMeta.savedAt || 0;
    const remoteTexts = marksTextCount(remote.marks);
    const localTexts = marksTextCount(state.marks);
    // usa remoto se for mais novo, ou se local vazio e remoto tem texto
    if(remoteAt >= localAt || (localTexts === 0 && remoteTexts > 0)){
      state.marks = remote.marks;
      if(typeof remote.pageIndex === 'number'){
        state.pageIndex = remote.pageIndex;
      }
      await storeSet('marks:'+comicId, state.marks);
      await storeSet('page:'+comicId, state.pageIndex);
      await storeSet('marks-meta:'+comicId, { savedAt: remoteAt || Date.now(), page: state.pageIndex, from: 'drive' });
      return remote;
    }
  }catch(e){
    console.warn('pullDriveProgress', e);
  }
  return null;
}

          finished: payload.finished,
          comicName: payload.comicName,

  }

function slugify(name){
  return name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'comic';
}

/* ==================== IDB arquivos CBZ ==================== */
const IDB_NAME = 'balao-cbz-files';
const IDB_STORE = 'files';
const IDB_CATALOG = 'catalog';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_CATALOG)) db.createObjectStore(IDB_CATALOG);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function idbPutCatalog(data, meta){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readwrite');
      tx.objectStore(IDB_CATALOG).put({ data: data, meta: meta || null, savedAt: Date.now() }, 'catalogo');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){
    console.warn('IDB put catalog fail', e);
    return false;
  }
}

async function idbGetCatalog(){
  try{
    const db = await idbOpen();
    const rec = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readonly');
      const r = tx.objectStore(IDB_CATALOG).get('catalogo');
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    return rec;
  }catch(e){
    console.warn('IDB get catalog fail', e);
    return null;
  }
}

async function idbDelCatalog(){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readwrite');
      tx.objectStore(IDB_CATALOG).delete('catalogo');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){}
}

async function idbPutComic(id, file){
  try{
    const buf = await file.arrayBuffer();
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({
        name: file.name,
        type: file.type || 'application/vnd.comicbook+zip',
        buf,
        savedAt: Date.now()
      }, id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){
    console.warn('IDB put comic fail', e);
    return false;
  }
}

async function idbGetComic(id){
  try{
    const db = await idbOpen();
    const rec = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(id);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    if(!rec || !rec.buf) return null;
    return new File([rec.buf], rec.name || (id+'.cbz'), {
      type: rec.type || 'application/vnd.comicbook+zip'
    });
  }catch(e){
    console.warn('IDB get comic fail', e);
    return null;
  }
}

async function idbDelComic(id){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn('IDB del comic fail', e); }
}

async function refreshLibrary(){
  const list = (await storeGet('comics-list')) || [];
  const el = $('#libList');
  if(!el) return;
  el.innerHTML='';
  if(!list.length){ el.innerHTML = '<div class="empty-hint">Nenhum quadrinho ainda. Abra um CBZ para começar — as marcações de balão ficam salvas mesmo depois de fechar o app.</div>'; return; }
  list.slice().reverse().forEach(c=>{
    const div = document.createElement('div'); div.className='lib-item';
    const meta = (typeof catalogFindBookByFilename === 'function') ? catalogFindBookByFilename(c.name) : null;
    let sub = (c.balloons||0) + ' balões marcados';
    if(meta){
      const bits = [];
      if(meta.series) bits.push(meta.series);
      if(meta.number) bits.push('#' + meta.number);
      if(meta.year) bits.push(String(meta.year));
      if(meta.title && meta.title !== c.name) bits.push(meta.title);
      if(bits.length) sub = bits.join(' · ') + ' · ' + sub;
    }
    const thumbHtml = (meta && meta.thumb)
      ? `<div class="lib-thumb" data-thumb="${meta.thumb.replace(/"/g,'')}">${c.pages}p</div>`
      : `<div class="lib-thumb">${c.pages}p</div>`;
    div.innerHTML = thumbHtml +
      `<div class="lib-meta"><div class="name">${meta && meta.title ? meta.title : c.name}</div><div class="stat">${sub}</div></div>
      <button class="lib-del" data-id="${c.id}">🗑</button>`;
    const th = div.querySelector('.lib-thumb');
    if(th && meta && meta.thumb && typeof catalogLoadThumb === 'function'){
      catalogLoadThumb(meta.thumb, th, meta.number || '');
    }
    div.addEventListener('click', async (e)=>{
      if(e.target.closest('.lib-del')) return;
      toastProgress('Abrindo '+c.name+'…');
      const file = await idbGetComic(c.id);
      if(file){
        await openCbz(file);
        return;
      }
      // fallback: arquivo nao estava no IndexedDB (sessao antiga)
      toast('Arquivo nao encontrado na biblioteca local. Selecione o CBZ de novo (so desta vez).', 5000);
      $('#fileInput').dataset.resumeId = c.id;
      $('#fileInput').click();
    });
    div.querySelector('.lib-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      const nl = list.filter(x=>x.id!==id);
      await storeSet('comics-list', nl);
      await storeSet('marks:'+id, null);
      await idbDelComic(id);
      refreshLibrary();
    });
    el.appendChild(div);
  });
}

async function registerComic(id,name,pages){
  const list = (await storeGet('comics-list')) || [];
  const existing = list.find(c=>c.id===id);
  const balloons = Object.values(state.marks).reduce((a,arr)=>a+arr.length,0);

function marksFileNameForComic(comicName){
  // Ex.: "Blackest Night #1.cbz" -> "Blackest Night #1.xml" (mesmo nome da HQ)
  const base = (comicName || 'hq').replace(/\.(cbz|zip|cbr)$/i, '');
  const safe = base.replace(/[\\/:*?"<>|]/g, '_').trim() || 'hq';
  return safe + '.xml';
}
function findMarksEntry(zip, comicName){
  const preferred = marksFileNameForComic(comicName);
  if(zip.file(preferred)) return preferred;
  // legado
  if(zip.file('balao-marks.xml')) return 'balao-marks.xml';
  const keys = Object.keys(zip.files).filter(n => {
    if(zip.files[n].dir) return false;
    const base = n.replace(/^.*\//,'').toLowerCase();
    return base.endsWith('-marks.xml') || (base.endsWith('.xml') && base !== 'comicinfo.xml');
  });
  if(keys.length){
    keys.sort((a,b)=>a.length-b.length);
    return keys[0];
  }
  return preferred;
}

function xmlFromMarks(marks){
  const doc = document.implementation.createDocument('', '', null);
  const root = doc.createElement('BalaoData'); root.setAttribute('version','1');
  Object.keys(marks).forEach(pageIdx=>{
    const arr = marks[pageIdx]||[];
    if(!arr.length) return;
    const pageEl = doc.createElement('Page'); pageEl.setAttribute('index', pageIdx);
    arr.forEach(b=>{
      const bEl = doc.createElement('Balloon');
      bEl.setAttribute('id', b.id); bEl.setAttribute('order', b.order);
      bEl.setAttribute('x', b.x); bEl.setAttribute('y', b.y);
      bEl.setAttribute('w', b.w); bEl.setAttribute('h', b.h);
      const textEl = doc.createElement('Text'); textEl.textContent = b.text||'';
      bEl.appendChild(textEl);
      pageEl.appendChild(bEl);
    });
    root.appendChild(pageEl);
  });
  doc.appendChild(root);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(doc);
}
function marksFromXml(xmlText){
  const marks={};
  try{
    const doc = new DOMParser().parseFromString(xmlText,'application/xml');
    if(doc.querySelector('parsererror')) return marks;
    doc.querySelectorAll('Page').forEach(pageEl=>{
      const idx = pageEl.getAttribute('index');
      const arr=[];
      pageEl.querySelectorAll('Balloon').forEach(bEl=>{
        arr.push({
          id: bEl.getAttribute('id') || ('b'+Math.random().toString(36).slice(2)),
          order: parseInt(bEl.getAttribute('order'),10)||1,
          x: parseFloat(bEl.getAttribute('x')), y: parseFloat(bEl.getAttribute('y')),
          w: parseFloat(bEl.getAttribute('w')), h: parseFloat(bEl.getAttribute('h')),
          text: (function(){ var te = bEl.querySelector('Text'); return te ? te.textContent : ''; })()
        });
      });
      marks[idx]=arr;
    });
  }catch(e){ console.error('parse marks xml failed', e); }
  return marks;
}
function updateZipXml(){
  if(state.comic && state.comic.zip){
    const name = state.comic.marksEntry || marksFileNameForComic(state.comic.name);
    state.comic.marksEntry = name;
    state.comic.zip.file(name, xmlFromMarks(state.marks));
    // remove legado se gravamos com nome da HQ (evita dois XMLs divergentes)
    if(name !== 'balao-marks.xml' && state.comic.zip.file('balao-marks.xml')){
      state.comic.zip.remove('balao-marks.xml');
    }
  }
}

async function openCbz(file){
  toast('Abrindo quadrinho…', 4000);
  try{
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files)
      .filter(f=>!f.dir && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
    if(!entries.length){ toast('Nenhuma imagem encontrada no arquivo.'); return; }
    const pages=[];
    for(let i=0;i<entries.length;i++){
      const entry = entries[i];
      toastProgress(`Extraindo página ${i+1}/${entries.length}`);
      const blob = await entry.async('blob');
      pages.push({name:entry.name, url:URL.createObjectURL(blob)});
    }
    const id = slugify(file.name);
    const marksEntry = findMarksEntry(zip, file.name);
    state.comic = {id, name:file.name, pages, zip, marksEntry};
    const embedded = zip.file(marksEntry);
    let fileMarks = {};
    if(embedded){
      const xmlText = await embedded.async('string');
      fileMarks = marksFromXml(xmlText);
    }
    const localMarks = (await storeGet('marks:'+id)) || null;
    // Preferir progresso local (correções no aparelho) para nao perder edição
    if(localMarks && Object.keys(localMarks).length){
      state.marks = localMarks;
      toast(fileMarks && Object.keys(fileMarks).length
        ? 'Progresso local restaurado (correções deste aparelho)'
        : 'Marcações restauradas deste aparelho');
    } else if(Object.keys(fileMarks).length){
      state.marks = fileMarks;
      toast('Marcações: ' + marksEntry);
    } else {
      state.marks = {};
    }
    const savedPage = await storeGet('page:'+id);
    state.pageIndex = Math.max(0, Math.min(
      pages.length - 1,
      (typeof savedPage === 'number' ? savedPage : parseInt(savedPage, 10) || 0)
    ));
    state.readZoomOn = !!(await storeGet('readzoom:'+id));
    state.fileHandle = state.fileHandle || null;
    // Nuvem: Firebase (prioridade) + Drive
    let cloudPage = null;
    let cloudSrc = '';
    if(state.fb && state.fb.user){
      try{
        toastProgress('Sincronizando progresso (Firebase)…');
        const remoteFb = await fbLoadProgress(id);
        if(remoteFb && typeof remoteFb.pageIndex === 'number'){
          cloudPage = remoteFb.pageIndex;
          cloudSrc = 'Firebase';
        }
      }catch(e){ console.warn(e); }
    }
    if(state.drive && state.drive.token){
      try{
        toastProgress('Sincronizando com Drive…');
        const remote = await pullDriveProgressForComic(id);
        if(remote && typeof remote.pageIndex === 'number'){
          // se Firebase não trouxe, ou Drive mais recente
          if(cloudPage == null){ cloudPage = remote.pageIndex; cloudSrc = 'Drive'; }
        }
      }catch(e){ console.warn(e); }
    }
    if(cloudPage != null){
      state.pageIndex = Math.max(0, Math.min(pages.length - 1, cloudPage));
      toast('Progresso do ' + cloudSrc + ' aplicado ✓', 2500);
    }
    await registerComic(id, file.name, pages.length);
    await idbPutComic(id, file);
    goReader();
  }catch(err){
    console.error(err);
    toast('Erro ao abrir: ' + (err && err.message ? err.message : err), 6000);
  }
}

async function downloadUpdatedCbz(){
  if(!state.comic || !state.comic.zip){ toast('Abra um quadrinho primeiro.'); return; }
  const btn = $('#btnDownload');
  if(btn.disabled) return;
  btn.disabled = true;
  updateZipXml();
  toastProgress('Gerando arquivo… 0%');
  try{
    const blob = await state.comic.zip.generateAsync(
      {type:'blob', compression:'DEFLATE', compressionOptions:{level:4}},
      (metadata)=>{ toastProgress(`Gerando arquivo… ${Math.round(metadata.percent)}%`); }
    );
    const baseName = state.comic.name.replace(/\.(cbz|zip)$/i,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = state.comic.name.endsWith('.cbz') ? state.comic.name : (baseName + '.cbz');
    document.body.appendChild(a); a.click(); a.remove();
    toast('CBZ com marcações baixado ✓');
  }catch(e){
    console.error(e); toast('Erro ao gerar: ' + (e && e.message ? e.message : e), 6000);
  }finally{
    btn.disabled = false;
  }
}

/* ==================== PAGE RENDER ==================== */
function currentMarks(){
  const arr = state.marks[state.pageIndex] || [];
  return arr.slice().sort((a,b)=>a.order-b.order);
}
function updateReadProgress(){
  const el = $('#readProgress');
  if(!el || !state.comic || !state.comic.pages.length) return;
  const pct = ((state.pageIndex + 1) / state.comic.pages.length) * 100;
  el.style.width = pct.toFixed(2) + '%';
}
function fitImageToStage(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  if(!img.naturalWidth || !stage.width || !stage.height) return;
  const scale = Math.min(stage.width/img.naturalWidth, stage.height/img.naturalHeight);
  img.style.width = Math.round(img.naturalWidth*scale)+'px';
  img.style.height = Math.round(img.naturalHeight*scale)+'px';
}
function renderPage(){
  clearDraft();
  hideBalloonCard();
  closeLiteEdit(false);
  const p = state.comic.pages[state.pageIndex];
  const img = $('#pageImg');
  img.onload = ()=>{ fitImageToStage(); resetZoom(); drawBalloons(); };
  img.src = p.url;
  $('#pagePos').textContent = `${state.pageIndex+1}/${state.comic.pages.length}`;
  updateReadProgress();
  if(state.comic) storeSet('page:'+state.comic.id, state.pageIndex);
  setMode(state.mode==='play' ? state.mode : 'read');
  $('#btnReadZoom').classList.toggle('on', state.readZoomOn);
  closeSheet();
}
function drawBalloons(){
  const overlay = $('#overlay');
  overlay.innerHTML='';
  const marks = currentMarks();
  const svgNS='http://www.w3.org/2000/svg';
  if(marks.length>1 && state.mode!=='play'){
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
    svg.style.position='absolute'; svg.style.inset='0'; svg.style.pointerEvents='none';
    let d='';
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    marks.forEach((b,i)=>{
      const cx=((b.x+b.w/2)*100).toFixed(2), cy=((b.y+b.h/2)*100).toFixed(2);
      d += (i===0?'M':'L') + cx + ' ' + cy + ' ';
    });
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d',d); path.setAttribute('class','path-line');
    path.setAttribute('vector-effect','non-scaling-stroke');
    svg.appendChild(path); overlay.appendChild(svg);
  }
  marks.forEach(b=>{
    if(state.draft && state.draft.editingId===b.id) return;
    const div = document.createElement('div');
    const isActive = state.activeBalloon===b.id;
    div.className='balloon'+(isActive?' active':'')+((state.mode==='play'||state.paused)&&!isActive?' dim':'');
    div.style.left=(b.x*100)+'%'; div.style.top=(b.y*100)+'%';
    div.style.width=(b.w*100)+'%'; div.style.height=(b.h*100)+'%';
    div.innerHTML = `<div class="tag">${b.order}</div>`;
    const tap = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); onBalloonTap(b); };
    div.addEventListener('click', tap);
    // pointerup ajuda no desktop quando o overlay competia pelo evento
    div.addEventListener('pointerup', (ev)=>{
      if(ev.button!==undefined && ev.button!==0) return;
      if(state.mode==='mark') return; // no mark, arraste/criação usa outros handlers
      // evita double-fire com click
      if(div._tapLock) return;
      div._tapLock = true;
      setTimeout(()=>{ div._tapLock = false; }, 350);
      tap(ev);
    });
    overlay.appendChild(div);
  });
  if(state.draft) renderDraft();
}

/* ==================== ZOOM ==================== */
function applyViewTransform(animated){
  const wrap = $('#pageWrap');
  wrap.style.transition = animated ? '' : 'none';
  wrap.style.transformOrigin='0 0';
  const {scale,tx,ty} = state.viewTransform;
  wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
function resetZoom(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const w = img.offsetWidth||0, h = img.offsetHeight||0;
  const tx = Math.max(0, (stage.width-w)/2);
  const ty = Math.max(0, (stage.height-h)/2);
  state.viewTransform = {scale:1, tx, ty};
  applyViewTransform(true);
  state.activeBalloon=null;
}
function zoomToBalloon(b, opts){
  opts = opts || {};
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const dispW = img.offsetWidth, dispH = img.offsetHeight;
  const px=(b.x+b.w/2)*dispW, py=(b.y+b.h/2)*dispH;
  const reserve = opts.reserveBottom || 0;
  const visibleH = stage.height*(1-reserve);
  const scale = Math.min(4, Math.max(1.3, Math.min((stage.width*0.86)/(b.w*dispW), (visibleH*0.8)/(b.h*dispH))));
  const tx = stage.width/2 - px*scale;
  const ty = visibleH/2 - py*scale;
  state.viewTransform = {scale,tx,ty};
  applyViewTransform(true);
  state.activeBalloon=b.id;
  drawBalloons();
}
function highlightBalloon(b){
  state.activeBalloon = b.id;
  drawBalloons();
}

/* ==================== CARD AMPLIADO (zoom ao ler) ==================== */
function showBalloonCard(b){
  if(!state.readZoomOn || !state.comic) return;
  const img = $('#pageImg');
  const stage = $('#stage').getBoundingClientRect();
  const rect = img.getBoundingClientRect();

  // recorte em boa resolução a partir da imagem original (nao da tela pequena)
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = b.w*nw, bh = b.h*nh;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(bw));
  canvas.height = Math.max(1,Math.round(bh));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);

  // posicao/tamanho na tela: centralizado sobre o proprio balao, ampliado
  const screenX = rect.left - stage.left + b.x*rect.width;
  const screenY = rect.top - stage.top + b.y*rect.height;
  const screenW = b.w*rect.width;
  const screenH = b.h*rect.height;
  // valores anteriores (caso precise voltar): scale 1.6–2.3, alvo 190, largura 0.72, altura 0.46
  const scale = Math.min(1.7, Math.max(1.0, 143/Math.max(1,screenH)));
  let cardW = screenW*scale, cardH = screenH*scale;
  cardW = Math.min(cardW, stage.width*0.54);
  cardH = Math.min(cardH, stage.height*0.35);
  let cx = screenX + screenW/2, cy = screenY + screenH/2;
  let left = cx - cardW/2, top = cy - cardH/2;
  // mantem dentro da area visivel do stage
  left = Math.max(6, Math.min(left, stage.width - cardW - 6));
  top = Math.max(6, Math.min(top, stage.height - cardH - 6));

  const card = $('#balloonCard');
  card.style.left = left+'px';
  card.style.top = top+'px';
  card.style.width = cardW+'px';
  card.style.height = cardH+'px';
  card.innerHTML = '';
  const outImg = document.createElement('img');

function cropBalloonToDataUrl(b){
  const img = $('#pageImg');
  if(!img || !img.naturalWidth) return '';
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = Math.max(1,b.w*nw), bh = Math.max(1,b.h*nh);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bw); canvas.height = Math.round(bh);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}
function isMobileEditLayout(){
  return window.innerWidth < 700;
}
function positionLiteEditBar(){
  const bar = $('#liteEditBar');
  if(!bar || bar.style.display==='none') return;
  const vv = window.visualViewport;
  const mobile = isMobileEditLayout();
  if(vv){
    // altura visivel real (acima do teclado)
    const visibleBottom = vv.height + vv.offsetTop;
    const fromBottom = Math.max(0, window.innerHeight - visibleBottom);
    if(mobile){
      bar.style.bottom = fromBottom + 'px';
      // limita altura da barra ao viewport visivel
      const maxH = Math.max(200, vv.height - 8);
      bar.style.maxHeight = maxH + 'px';
    } else {

      bar.style.maxHeight = '';
    }

}
function applyLiteEditTextAndOrder(b){
  if(!b) return;
  b.text = $('#liteEditText').value;
  const orderInput = $('#liteEditOrder');
  if(orderInput){
    let newOrder = parseInt(orderInput.value, 10);
    if(!isNaN(newOrder) && newOrder !== b.order){
      const arr = state.marks[state.pageIndex] || [];
      const others = arr.filter(x=>x.id!==b.id).sort((a,c)=>a.order-c.order);
      newOrder = Math.max(1, Math.min(newOrder, others.length+1));
      others.splice(newOrder-1, 0, b);
      others.forEach((x,i)=>{ x.order = i+1; });
    }
  }
}
function pauseAndEditWhileReading(b){
  if(state.ttsAvailable) speechSynthesis.cancel();
  clearTimeout(state.playTimer);
  state.paused = true;
  state.pausedBalloon = b;
  if(state.mode==='play'){
    const marks = currentMarks();
    const playingId = state.activeBalloon;
    const playingIdx = marks.findIndex(x=>x.id===playingId);
    if(state.playPauseIndex==null){
      state.playPauseIndex = playingIdx>=0 ? playingIdx : marks.findIndex(x=>x.id===b.id);

  $('#liteEditText').value = b.text || '';

async function closeLiteEdit(resume, opts){
  opts = opts || {};
  const bar = $('#liteEditBar');
  if(bar) bar.style.display = 'none';
  document.body.classList.remove('mobile-editing');
  if(bar){ bar.style.bottom = ''; bar.style.maxHeight = ''; }
  if(!state.paused) return;
  const b = state.pausedBalloon;
  state.paused = false;
  state.pausedBalloon = null;
  if(!b) return;
  if(resume===false) return;
  applyLiteEditTextAndOrder(b);
  await saveMarks();
  drawBalloons();
  if(opts.next){
    const marks = currentMarks().slice().sort((a,c)=>a.order-c.order);
    const idx = marks.findIndex(x=>x.id===b.id);
    const next = marks[idx+1];
    if(next){
      // permanece em pausa de play se estava em play
      if(state.mode==='play' && state.playPauseIndex!=null){
        state.playPauseIndex = idx+1;
      }
      pauseAndEditWhileReading(next);
      return;
    }
  }
  if(state.mode==='play'){
    const marks = currentMarks();
    let idx = state.playPauseIndex;
    if(idx==null || idx<0) idx = marks.findIndex(x=>x.id===b.id);
    if(idx<0) idx = 0;
    state.playPauseIndex = null;
    setMode('play');
    playNext(idx);
  } else {
    highlightBalloon(b);
    if(state.readZoomOn) showBalloonCard(b);
    speak(b.text);
  }
}

/* ==================== DRAWING NEW BALLOON + PINCH ZOOM/PAN ==================== */
const overlayEl = $('#overlay');
const pointers = new Map();
let pinchStart = null;
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

function normFromEvent(e){
  const rect = $('#pageImg').getBoundingClientRect();
  return { x: Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width)),
           y: Math.min(1,Math.max(0,(e.clientY-rect.top)/rect.height)) };
}

overlayEl.addEventListener('pointerdown', (e)=>{
  // Clique em balão / caixa de ajuste: NÃO capturar o ponteiro.
  // No desktop o setPointerCapture no overlay impedia o click do balão (edição no play quebrava).
  if(e.target.closest('.balloon') || e.target.closest('.draft-box') || e.target.closest('#draftBox')){
    return;
  }
  overlayEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStart = { dist:dist(pts[0],pts[1]), mid:mid(pts[0],pts[1]),
      scale:state.viewTransform.scale, tx:state.viewTransform.tx, ty:state.viewTransform.ty };
    return;
  }
  if(pointers.size!==1) return;
  // Fora de balão, em read/play: só limpa destaque se não estiver editando
  if(state.mode!=='mark'){
    if(state.paused) return;
    if(state.activeBalloon){ clearHighlight(); }
    return;
  }
  if(state.draft || state.walk) return;
  const p = normFromEvent(e);
  const w=0.18, h=0.09;
  const x = Math.min(Math.max(0,p.x-w/2),1-w), y = Math.min(Math.max(0,p.y-h/2),1-h);
  placeBalloonInstant(x,y,w,h);
});
overlayEl.addEventListener('pointermove', (e)=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinchStart){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const m = mid(pts[0],pts[1]);
    const stage = $('#stage').getBoundingClientRect();
    const newScale = Math.min(6, Math.max(0.8, pinchStart.scale * (d/pinchStart.dist)));
    const anchorX = (pinchStart.mid.x - stage.left - pinchStart.tx) / pinchStart.scale;
    const anchorY = (pinchStart.mid.y - stage.top - pinchStart.ty) / pinchStart.scale;
    state.viewTransform = {
      scale: newScale,
      tx: (m.x - stage.left) - anchorX*newScale,
      ty: (m.y - stage.top) - anchorY*newScale
    };
    applyViewTransform(false);
  }
});
overlayEl.addEventListener('pointerup', (e)=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=null; });
overlayEl.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStart=null; });

function positionDraftBox(){
  const box = document.getElementById('draftBox'); if(!box || !state.draft) return;
  const d = state.draft;
  box.style.left=(d.x*100)+'%'; box.style.top=(d.y*100)+'%';
  box.style.width=(d.w*100)+'%'; box.style.height=(d.h*100)+'%';
}
function attachHandleDrag(handle, corner){
  handle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const editingId = state.draft.editingId;
    const fixed = {
      x: corner.includes('w') ? state.draft.x+state.draft.w : state.draft.x,
      y: corner.includes('n') ? state.draft.y+state.draft.h : state.draft.y
    };
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const nx=Math.min(p.x,fixed.x), fx=Math.max(p.x,fixed.x);
      const ny=Math.min(p.y,fixed.y), fy=Math.max(p.y,fixed.y);
      state.draft = { x:nx, y:ny, w:Math.max(0.02,fx-nx), h:Math.max(0.02,fy-ny), editingId };
      positionDraftBox();
    };
    const onUp = ()=>{
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
}
function attachBoxMove(box){
  box.addEventListener('pointerdown', (e)=>{
    if(e.target!==box) return;
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    const start = normFromEvent(e);
    const orig = Object.assign({}, state.draft);
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const dx=p.x-start.x, dy=p.y-start.y;
      state.draft = {
        x: Math.min(Math.max(0, orig.x+dx), 1-orig.w),
        y: Math.min(Math.max(0, orig.y+dy), 1-orig.h),
        w: orig.w, h: orig.h, editingId: orig.editingId
      };
      positionDraftBox();
    };
    const onUp = ()=>{
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      box.removeEventListener('pointercancel', onUp);
    };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
    box.addEventListener('pointercancel', onUp);
  });
}

/* ==================== DETECÇÃO AUTOMÁTICA DE BALÕES ==================== */
async function saveMarks(){
  if(!state.comic) return;
  updateZipXml();
  await storeSet('marks:'+state.comic.id, state.marks);
  await storeSet('page:'+state.comic.id, state.pageIndex);
  await storeSet('marks-meta:'+state.comic.id, { savedAt: Date.now(), page: state.pageIndex });
  const list = (await storeGet('comics-list'))||[];
  const c = list.find(x=>x.id===state.comic.id);
  if(c){
    c.balloons = Object.values(state.marks).reduce((a,arr)=>a+arr.length,0);
    c.page = state.pageIndex;
    await storeSet('comics-list', list);
  }
  schedulePersistCbz();
  scheduleDrivePush();
}
let _persistTimer = null;
function schedulePersistCbz(){
  // grava no arquivo original (se o navegador tiver handle) com debounce
  clearTimeout(_persistTimer);
  _persistTimer = setTimeout(()=>{ persistCbzToDisk().catch(()=>{}); }, 2500);
}
async function persistCbzToDisk(){
  if(!state.comic || !state.comic.zip) return;
  if(!state.fileHandle || typeof state.fileHandle.createWritable !== 'function') return;
  try{
    updateZipXml();
    const blob = await state.comic.zip.generateAsync(
      {type:'blob', compression:'DEFLATE', compressionOptions:{level:1}}
    );
    const writable = await state.fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    // atualiza copia no IndexedDB
    try{
      const file = new File([blob], state.comic.name, { type: 'application/vnd.comicbook+zip' });
      await idbPutComic(state.comic.id, file);
    }catch(_){}
    toast('CBZ atualizado no disco ✓', 1800);
  }catch(e){
    console.warn('persistCbzToDisk', e);
  }
}
const MODEL_INPUT_SIZE = 1024;
let yoloSessionPromise = null;
let yoloModelBuffer = null;

// Release no GitHub (arquivo ~50 MB — não cabe no repo normal)
const YOLO_MODEL_URLS = [
  'https://github.com/SrM0us3/HQ_Audio/releases/download/v1/comic-speech-bubble-detector.onnx',
];
const YOLO_MODEL_SHA256 = '36b452f54f341fc8cc99b45717c4df76da45fadba60da89e4536895433c7d96a';

function pickModelFile(){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    toast('Selecione comic-speech-bubble-detector.onnx no seu PC…', 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo detector (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    input.click();
  });
}

async function sha256Hex(buffer){
  if(!window.crypto || !crypto.subtle) return null;
  const hash = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function fetchYoloModelBuffer(){
  for(const url of YOLO_MODEL_URLS){
    try{
      toastProgress('Baixando detector de balões (~50 MB)…');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok){
        console.warn('fetch YOLO status', res.status, url);
        continue;
      }
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 1_000_000){
        console.warn('arquivo YOLO muito pequeno', buf.byteLength);
        continue;
      }
      toastProgress('Verificando integridade do modelo…');
      const hex = await sha256Hex(buf);
      if(hex && hex !== YOLO_MODEL_SHA256){
        console.warn('SHA-256 não confere', hex);
        toast('Aviso: hash do detector diferente do esperado. Continuando mesmo assim…', 4000);
      }
      toastProgress('Detector baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      // CORS costuma cair aqui em alguns ambientes
      console.warn('fetch YOLO falhou', url, e);
    }
  }
  return null;
}

function getYoloSession(){
  if(yoloSessionPromise) return yoloSessionPromise;

  yoloSessionPromise = (async ()=>{
    try{
      setupOrtWasm();
      let buffer = yoloModelBuffer;
      if(!buffer){
        buffer = await fetchYoloModelBuffer();
      }
      if(!buffer){
        // Fallback: seletor de arquivo (precisa de clique do usuário)
        buffer = await pickModelFile();
      }
      yoloModelBuffer = buffer;
      toastProgress('Compilando detector de balões (pode levar uns segundos)…');
      await new Promise(r => setTimeout(r, 40));
      const session = await ort.InferenceSession.create(buffer, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'disabled'
      });
      toast('Detector de balões pronto ✓', 2500);
      return session;
    }catch(err){
      yoloSessionPromise = null;
      throw err;
    }
  })();

  return yoloSessionPromise;
}

function preprocessForYolo(img){
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const SZ = MODEL_INPUT_SIZE; // 1024 — tem que ser múltiplo de 32
  if(!W0 || !H0) throw new Error('Imagem da página sem dimensões (naturalWidth=0)');
  const scale = Math.min(SZ / W0, SZ / H0);
  const nw = Math.max(1, Math.round(W0 * scale));
  const nh = Math.max(1, Math.round(H0 * scale));
  const canvas = document.createElement('canvas');
  canvas.width = SZ;
  canvas.height = SZ;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  // letterbox cinza YOLOv8 padrão
  ctx.fillStyle = 'rgb(114,114,114)';
  ctx.fillRect(0, 0, SZ, SZ);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, W0, H0, 0, 0, nw, nh);
  const imgData = ctx.getImageData(0, 0, SZ, SZ).data;
  const plane = SZ * SZ;
  const chw = new Float32Array(3 * plane);
  for(let p = 0; p < plane; p++){
    chw[p]            = imgData[p * 4] / 255;
    chw[plane + p]    = imgData[p * 4 + 1] / 255;
    chw[2 * plane + p]= imgData[p * 4 + 2] / 255;
  }
  const tensor = new ort.Tensor('float32', chw, [1, 3, SZ, SZ]);
  return { tensor, scale };
}

function nmsBoxes(items, iouTh){
  items.sort((a,b)=> b.conf-a.conf);
  const keep = [];
  const used = new Array(items.length).fill(false);
  for(let i=0;i<items.length;i++){
    if(used[i]) continue;
    const a = items[i]; keep.push(a);
    for(let j=i+1;j<items.length;j++){
      if(used[j]) continue;
      const b = items[j];
      const xx0=Math.max(a.x0,b.x0), yy0=Math.max(a.y0,b.y0);
      const xx1=Math.min(a.x1,b.x1), yy1=Math.min(a.y1,b.y1);
      const inter = Math.max(0,xx1-xx0)*Math.max(0,yy1-yy0);
      const areaA=(a.x1-a.x0)*(a.y1-a.y0), areaB=(b.x1-b.x0)*(b.y1-b.y0);
      const iou = inter/(areaA+areaB-inter);
      if(iou > iouTh) used[j]=true;
    }
  }
  return keep;
}

/**
 * Ordena balões como em HQ (aproximando quadros).
 * 1) Procura faixa vazia horizontal (entre faixas de balões) → lê cima, depois baixo.
 * 2) Senão, faixa vazia vertical → lê esquerda, depois direita (ou RTL se rtl=true).
 * 3) Senão, ordena por linhas de leitura (y) e dentro da linha por x.
 */
function orderBalloonsLikeComics(cands, rtl){
  if(!cands || !cands.length) return [];
  if(cands.length === 1) return cands.slice();

  function bboxOf(items){
    let x0=1, y0=1, x1=0, y1=0;
    items.forEach(c=>{
      x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y);
      x1 = Math.max(x1, c.x + c.w); y1 = Math.max(y1, c.y + c.h);
    });
    return { x0, y0, x1, y1, w:x1-x0, h:y1-y0 };
  }

  // Maior "buraco" no eixo: projeta intervalos e acha gap entre eles
  function largestGap(items, axis){
    // axis 'y' → gaps horizontais (separando faixas de cima/baixo)
    // axis 'x' → gaps verticais (separando colunas esq/dir)
    const intervals = items.map(c=>{
      if(axis === 'y') return [c.y, c.y + c.h];
      return [c.x, c.x + c.w];
    }).sort((a,b)=> a[0]-b[0]);

    // merge overlapping
    const merged = [intervals[0].slice()];
    for(let i=1;i<intervals.length;i++){
      const last = merged[merged.length-1];
      if(intervals[i][0] <= last[1] + 0.002){
        last[1] = Math.max(last[1], intervals[i][1]);
      } else {
        merged.push(intervals[i].slice());
      }
    }
    if(merged.length < 2) return null;

    let best = null;
    for(let i=0;i<merged.length-1;i++){
      const gap0 = merged[i][1];
      const gap1 = merged[i+1][0];
      const gap = gap1 - gap0;
      if(gap <= 0.008) continue; // gap mínimo ~0.8% da página
      if(!best || gap > best.gap){
        best = { gap, cut: (gap0 + gap1) / 2, beforeEnd: gap0, afterStart: gap1 };
      }
    }
    return best;
  }

  function splitByCut(items, axis, cut){
    const a = [], b = [];
    items.forEach(c=>{
      const mid = axis === 'y' ? (c.y + c.h/2) : (c.x + c.w/2);
      (mid < cut ? a : b).push(c);
    });
    // exige que os dois lados tenham algo
    if(!a.length || !b.length) return null;
    return [a, b];
  }

  function rowOrder(items){
    // linhas por sobreposição em Y, depois X (ou RTL)
    const sorted = items.slice().sort((a,b)=> a.y - b.y);
    const rows = [];
    sorted.forEach(c=>{
      let placed = false;
      const cy0 = c.y, cy1 = c.y + c.h;
      for(const row of rows){
        const overlap = Math.min(row.y1, cy1) - Math.max(row.y0, cy0);
        const minH = Math.min(c.h, row.y1 - row.y0);
        if(minH > 0 && overlap > minH * 0.25){
          row.items.push(c);
          row.y0 = Math.min(row.y0, cy0);
          row.y1 = Math.max(row.y1, cy1);
          placed = true;
          break;
        }
      }
      if(!placed) rows.push({ y0: cy0, y1: cy1, items: [c] });
    });
    rows.sort((a,b)=> (a.y0+a.y1) - (b.y0+b.y1));
    const out = [];
    rows.forEach(row=>{
      row.items.sort((a,b)=> rtl ? (b.xc - a.xc) : (a.xc - b.xc));
      row.items.forEach(it=> out.push(it));
    });
    return out;
  }

  function recurse(items, depth){
    if(items.length <= 1) return items.slice();
    if(depth > 8) return rowOrder(items);

    const bb = bboxOf(items);
    // preferir corte horizontal (faixas de quadros empilhados) se o gap for significativo
    const gapY = largestGap(items, 'y');
    const gapX = largestGap(items, 'x');

    // gap relativo à altura/largura do grupo
    const scoreY = gapY ? gapY.gap / Math.max(bb.h, 0.05) : 0;
    const scoreX = gapX ? gapX.gap / Math.max(bb.w, 0.05) : 0;

    // limiar: gap precisa ser razoável em relação ao grupo
    const MIN_REL = 0.04;

    if(scoreY >= MIN_REL && scoreY >= scoreX && gapY){
      const parts = splitByCut(items, 'y', gapY.cut);
      if(parts){
        return recurse(parts[0], depth+1).concat(recurse(parts[1], depth+1));
      }
    }
    if(scoreX >= MIN_REL && gapX){
      const parts = splitByCut(items, 'x', gapX.cut);
      if(parts){
        // LTR: esquerda depois direita; RTL: invertido
        const first = rtl ? parts[1] : parts[0];
        const second = rtl ? parts[0] : parts[1];
        return recurse(first, depth+1).concat(recurse(second, depth+1));
      }
    }
    return rowOrder(items);
  }

  return recurse(cands, 0);
}

async function detectBalloons(){
  if(!state.comic) return;
  const btn = $('#btnDetect');
  btn.disabled = true; const oldTxt = btn.textContent; btn.textContent='⏳';
  try{
    if(!yoloSessionPromise && !yoloModelBuffer){ toast('Carregando detector de balões…', 3000); }
    toastProgress('Carregando modelo de detecção de balões (só na primeira vez nesta sessão)…');
    const session = await getYoloSession();
    toastProgress('Detectando balões na página…');
    await new Promise(r=>setTimeout(r, 50)); // garante que a mensagem pinte na tela antes do cálculo pesado

    const img = $('#pageImg');
    const {tensor, scale} = preprocessForYolo(img);
    const inputName = session.inputNames[0] || 'images';
    console.log('YOLO input', inputName, tensor.dims, 'outputs', session.outputNames);
    let results;
    try{
      results = await session.run({ [inputName]: tensor });
    }catch(runErr){
      console.error('YOLO run failed', runErr);
      // se o modelo baixado estiver corrompido/otimizado demais, permite tentar de novo via arquivo local
      yoloSessionPromise = null;
      yoloModelBuffer = null;
      throw new Error('Falha na detecção (Concat/shape). Tente de novo — se repetir, use o .onnx local. Detalhe: ' + (runErr && runErr.message ? runErr.message : runErr));
    }
    const outputName = session.outputNames[0];
    const out = results[outputName]; // dims: [1,6,N]
    const dims = out.dims; // [1, 6, N]
    const numAttrs = dims[1], numAnchors = dims[2];
    const data = out.data;

    const CONF_TH = 0.25;
    const candidates = [];
    for(let i=0;i<numAnchors;i++){
      const cx = data[0*numAnchors+i];
      const cy = data[1*numAnchors+i];
      const w_ = data[2*numAnchors+i];
      const h_ = data[3*numAnchors+i];
      let bestCls=0, bestScore=-1;
      for(let c=4;c<numAttrs;c++){
        const s = data[c*numAnchors+i];
        if(s>bestScore){ bestScore=s; bestCls=c-4; }
      }
      if(bestScore < CONF_TH) continue;
      candidates.push({
        x0:(cx-w_/2), y0:(cy-h_/2), x1:(cx+w_/2), y1:(cy+h_/2),
        conf:bestScore, cls:bestCls
      });
    }
    const kept = nmsBoxes(candidates, 0.45);

    const W = img.naturalWidth, H = img.naturalHeight;
    const SHRINK = 0.06; // encolhe a caixa pra dentro, evitando pegar a borda/rabinho do balão
    const cands = kept.map(b=>{
      // volta da escala do modelo (1024, com letterbox) pra fração normalizada da página
      let x0 = Math.max(0, b.x0/scale), y0 = Math.max(0, b.y0/scale);
      let x1 = Math.min(W, b.x1/scale), y1 = Math.min(H, b.y1/scale);
      const insetX = (x1-x0)*SHRINK, insetY = (y1-y0)*SHRINK;
      x0 += insetX; y0 += insetY; x1 -= insetX; y1 -= insetY;
      return {
        x:x0/W, y:y0/H, w:(x1-x0)/W, h:(y1-y0)/H,
        y0:y0/H, y1:y1/H, yc:(y0+y1)/2/H, xc:(x0+x1)/2/W
      };
    });

    if(!cands.length){
      toast('O modelo não encontrou nenhum balão nesta página.', 5000);
      return;
    }

    // Ordem de leitura estilo HQ: partição espacial (cortes por "calhas" entre grupos).
    // Aproxima a ordem por quadros sem modelo de painéis: divide a página onde há
    // faixa vazia grande (horizontal = cima/baixo; vertical = esq/dir), depois LTR nas folhas.
    const ordered = orderBalloonsLikeComics(cands, false);

    const arr = state.marks[state.pageIndex] || (state.marks[state.pageIndex]=[]);
    let order = arr.length ? Math.max.apply(null, arr.map(x=>x.order)) : 0;
    ordered.forEach(c=>{
      order++;
      arr.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6), x:c.x, y:c.y, w:c.w, h:c.h, order, text:''});
    });
    await saveMarks();
    drawBalloons();
    state.lastDetectDiag = null;
    state._yoloRetried = false;
    toast(`${ordered.length} balão(ões) detectado(s) pelo modelo — revise na lista (☰).`, 5500);
    openSheetList();
  }catch(e){
    console.error('detect error', e);
    const msg = (e && e.message) ? e.message : String(e);
    // retry automático 1x (modelo baixado às vezes falha no 1º run no WASM)
    if(!state._yoloRetried && /Concat|shape|26388560|OrtRun/i.test(msg)){
      state._yoloRetried = true;
      yoloSessionPromise = null;
      // mantém yoloModelBuffer se já baixou — só recompila sessão
      toast('Detectando de novo…', 2500);
      btn.disabled = false; btn.textContent = oldTxt;
      setTimeout(()=> detectBalloons(), 400);
      return;
    }
    state._yoloRetried = false;
    toast('Erro ao detectar: '+msg, 6000);
  }finally{
    btn.disabled=false; btn.textContent=oldTxt;
  }
}

function onBalloonTap(b){
  if(state.mode==='mark'){ startAdjustBalloon(b); return; }
  // Já está editando: troca o balão alvo (salva o texto atual antes)
  if(state.paused && state.pausedBalloon){
    if(state.pausedBalloon.id === b.id) return;
    applyLiteEditTextAndOrder(state.pausedBalloon);
    saveMarks();
    pauseAndEditWhileReading(b);
    return;
  }
  // Durante a leitura (play): editar qualquer balão
  if(state.mode==='play'){
    pauseAndEditWhileReading(b);
    return;
  }
  highlightBalloon(b);
  if(state.readZoomOn) showBalloonCard(b);
  speak(b.text || '(sem texto — use OCR ou digite manualmente)');
}
function startAdjustBalloon(b){
  if(state.draft) return;
  state.draft = { x:b.x, y:b.y, w:b.w, h:b.h, editingId:b.id };

}

async function reorderPageBalloons(){
  const arr = state.marks[state.pageIndex] || [];
  if(arr.length < 2){ toast('Precisa de pelo menos 2 balões.'); return; }
  const cands = arr.map(b=>({
    x:b.x, y:b.y, w:b.w, h:b.h,
    y0:b.y, y1:b.y+b.h, yc:b.y+b.h/2, xc:b.x+b.w/2,
    _ref:b
  }));
  const ordered = orderBalloonsLikeComics(cands, false);
  ordered.forEach((c,i)=>{ c._ref.order = i+1; });
  await saveMarks();
  drawBalloons();
  openSheetList();
  toast('Ordem de leitura recalculada (geometria de HQ).', 3500);
}

async function clearPageBalloons(){
  const marks = currentMarks();
  if(!marks.length) return;
  if(!confirm(`Apagar todos os ${marks.length} balões marcados nesta página? Essa ação não pode ser desfeita.`)) return;
  state.marks[state.pageIndex] = [];
  state.lastDetectDiag = null;
  await saveMarks();
  drawBalloons();
  openSheetList();
}
async function bulkOcr(marks){
  const pending = marks.filter(b=>!b.text);
  if(!pending.length){ toast('Todos os balões desta página já têm texto.'); return; }
  const btn = $('#btnBulkOcr');
  for(let i=0;i<pending.length;i++){
    if(btn) btn.textContent = `Transcrevendo ${i+1}/${pending.length}…`;
    const text = await ocrBalloon(pending[i]);
    if(text){ pending[i].text = text; await saveMarks(); }
  }
  toast('OCR em lote concluído — revise os textos abaixo.', 4500);
  openSheetList();
}
async function setOrder(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder)){ openSheetList(); return; }
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks(); drawBalloons(); openSheetList();
}
async function setOrderQuick(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder) || newOrder===b.order) return;
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks();
  drawBalloons();
  toast(`Balão movido pra posição ${newOrder}`, 1500);
}
async function deleteBalloon(b){

const PPOCR_MODEL_CANDIDATES = [
  'latin_PP-OCRv5_rec_mobile_web.onnx',
