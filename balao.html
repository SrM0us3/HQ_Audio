<script>
// Detector de erro visível — escrito em JS bem antigo (ES5) de propósito,
// pra funcionar mesmo em navegadores muito antigos/incomuns e mostrar
// na tela qualquer erro que trave o app, em vez de falhar em silêncio.
window.onerror = function(msg, url, line, col, err) {
  try {
    var el = document.getElementById('js-error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'js-error-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#c0392b;color:#fff;font-family:monospace;font-size:12px;' +
        'padding:10px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;';
      document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
    }
    var extra = '';
    try {
      if (err && err.stack) extra = '\n' + String(err.stack).slice(0, 500);
      else if (url) extra = '\n' + String(url) + ' :' + line + ':' + (col||'');
    } catch (e2) {}
    el.textContent = 'ERRO DE JAVASCRIPT (linha ' + line + '): ' + msg + extra;
  } catch (e) {}
  return false;
};
window.addEventListener('unhandledrejection', function(ev){
  try {
    var msg = (ev.reason && (ev.reason.message || ev.reason)) || 'Promise rejeitada';
    window.onerror(String(msg), '', 0, 0, ev.reason);
  } catch (e) {}
});
</script>

<style>
  :root{
    --bg:#15171c;
    --panel:#1f222a;
    --panel-2:#262a33;
    --page-bg:#e8e3d6;
    --accent:#e4402c;
    --accent-dim:#7a2a20;
    --gold:#d9a94a;
    --text:#edeae2;
    --text-dim:#8a8f9c;
    --border:#2b2f38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;
  }
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--border);
    background:var(--panel);flex-shrink:0;z-index:20;
  }
  .brand{
    font-family:'Bangers',cursive;letter-spacing:1px;
    font-size:26px;color:var(--accent);
    text-shadow:2px 2px 0 var(--accent-dim);
  }
  .topbar .sub{color:var(--text-dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .iconbtn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;border-radius:9px;font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{background:var(--accent);border-color:var(--accent);}
  .iconbtn:disabled{opacity:.4;pointer-events:none;}
  .iconbtn.warn{position:relative;}
  .iconbtn.warn::after{
    content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Library screen ---------- */
  #screen-library{flex:1;overflow-y:auto;padding:18px;display:none;}
  .drive-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:0 0 14px;padding:10px 12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);font-size:13px;
  }
  .drive-bar .drive-status{flex:1;color:var(--text-dim);min-width:120px;}
  .drive-bar button{
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .drive-bar button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600;}

  #screen-library.active{display:block;}

  .nav-tabs{display:flex;gap:6px;margin:0 0 14px;}
  .nav-tabs button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .nav-tabs button.on{background:var(--accent);color:#fff;border-color:transparent;}
  #screen-catalog{flex:1;overflow-y:auto;padding:18px;display:none;}
  #screen-catalog.active{display:block;}
  .komga-cfg{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px;
    display:flex;flex-direction:column;gap:8px;
  }
  .komga-cfg label{font-size:12px;color:var(--text-dim);}
  .komga-cfg input{
    width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-size:14px;font-family:inherit;
  }
  .komga-cfg .row{display:flex;gap:8px;flex-wrap:wrap;}
  .komga-cfg .row > *{flex:1;min-width:120px;}
  .komga-cfg button{
    padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;
    font-weight:600;font-family:inherit;cursor:pointer;
  }
  .komga-cfg button.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
  .komga-search{display:flex;gap:8px;margin-bottom:12px;}
  .komga-search input{
    flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;
  }
  .catalog-meta{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.4;}
  .catalog-hint{
    font-size:11px;color:var(--text-dim);background:var(--panel-2);border:1px dashed var(--border);
    border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45;
  }
  .catalog-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;
  }
  .catalog-card{
    background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  .catalog-card:active{transform:scale(.97);}
  .catalog-card:hover{border-color:rgba(228,64,44,.45);box-shadow:0 6px 18px rgba(0,0,0,.32);}
  .catalog-cover{
    aspect-ratio:2/3;background:
      radial-gradient(ellipse at 30% 20%, rgba(228,64,44,.18), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(217,169,74,.12), transparent 50%),
      #12141a;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:12px;overflow:hidden;position:relative;
  }
  .catalog-cover .cat-emoji{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
  .catalog-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .catalog-info{padding:10px 11px 12px;}
  .catalog-title{font-size:13px;font-weight:600;line-height:1.3;margin:0 0 5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .catalog-sub{font-size:11px;color:var(--text-dim);line-height:1.35;}
  .catalog-empty{text-align:center;color:var(--text-dim);padding:28px 12px;font-size:14px;}
  .catalog-book-row{
    padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--border);
    display:flex;gap:12px;align-items:flex-start;
  }
  .catalog-book-cover{
    flex-shrink:0;width:72px;height:108px;border-radius:8px;overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(228,64,44,.2), transparent 55%),
      #12141a;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-weight:700;font-size:14px;
  }
  .catalog-book-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .catalog-book-body{min-width:0;flex:1;}
  .catalog-book-line1{font-weight:600;font-size:13px;line-height:1.35;margin:0 0 4px;}
  .catalog-book-line2{font-size:11px;color:var(--text-dim);line-height:1.4;margin:0 0 6px;}
  .catalog-book-row.in-saga{
    border-color: rgba(120, 90, 200, .55);
    box-shadow: inset 3px 0 0 rgba(140,100,220,.85);
  }
  .catalog-saga-badge{
    display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.3px;
    background:rgba(140,100,220,.22);color:#cbb6ff;
    border:1px solid rgba(140,100,220,.45);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
    .catalog-book-sum{font-size:12px;line-height:1.45;color:var(--text);opacity:.92;white-space:pre-wrap;}
  .catalog-crumb-bar{
    grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    margin-bottom:10px;padding:10px 12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);position:sticky;top:0;z-index:5;
  }
  .catalog-xfer{
    display:none;margin:0 0 12px;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
  }
  .catalog-xfer.on{display:block;}
  .catalog-xfer-title{font-size:13px;font-weight:600;margin:0 0 6px;}
  .catalog-xfer-sub{font-size:11px;color:var(--text-dim);margin:0 0 8px;word-break:break-all;}
  .catalog-xfer-track{height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden;}
  .catalog-xfer-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .15s ease;}
  .catalog-xfer-pct{font-size:12px;color:var(--text-dim);margin-top:6px;text-align:right;}
  .catalog-book-detail{
    grid-column:1/-1;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:16px;margin-bottom:12px;
  }
  .catalog-book-detail-cover{
    width:min(220px,55vw);aspect-ratio:2/3;margin:0 auto 14px;border-radius:12px;overflow:hidden;
    background:#12141a;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  }
  .catalog-book-detail-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .catalog-book-detail h2{margin:0 0 8px;font-size:18px;line-height:1.3;text-align:center;}
  .catalog-book-detail .meta-line{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:10px;}
  .catalog-book-detail .sum{font-size:13px;line-height:1.45;margin:12px 0;}
  .catalog-book-detail label{display:block;font-size:11px;color:var(--text-dim);margin:8px 0 4px;}
  .catalog-book-detail input,.catalog-book-detail textarea{
    width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:14px;
  }
  .catalog-book-detail textarea{min-height:110px;resize:vertical;}
  .catalog-order-tog{grid-column:1/-1;display:flex;gap:8px;margin-bottom:10px;}
  .catalog-order-tog button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;
  }
  .catalog-order-tog button.on{background:var(--accent);color:#fff;border-color:transparent;}
  .catalog-arc-group{
    border:1px solid rgba(201,164,74,.5);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(201,164,74,.12), rgba(201,164,74,.04));
    padding:10px;
    display:flex;flex-direction:column;gap:8px;
    margin:2px 0 8px;
  }
  .catalog-arc-group.no-arc{
    border-color:rgba(90,140,200,.4);
    background:linear-gradient(180deg, rgba(90,140,200,.10), rgba(90,140,200,.03));
  }
  .catalog-arc-head{
    display:flex;align-items:center;gap:8px;padding:4px 6px 8px;
    border-bottom:1px solid rgba(201,164,74,.25);
  }
  .catalog-arc-group.no-arc .catalog-arc-head{
    border-bottom-color:rgba(90,140,200,.25);
  }
  .catalog-arc-head .arc-badge{
    flex-shrink:0;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    background:var(--gold);color:#2b2205;letter-spacing:.3px;
  }
  .catalog-arc-group.no-arc .arc-badge{background:#5a8cc8;color:#fff;}
  .catalog-arc-head .arc-title{font-weight:700;font-size:14px;flex:1;min-width:0;}
  .catalog-arc-head .arc-count{font-size:12px;color:var(--text-dim);}
  .catalog-arc-body{display:flex;flex-direction:column;gap:8px;}
  .catalog-pub-cover{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Bangers', Impact, sans-serif;font-size:22px;letter-spacing:1px;
    text-align:center;padding:6px;box-sizing:border-box;
  }



  .drop{
    border:2px dashed var(--border);border-radius:16px;padding:34px 18px;
    text-align:center;color:var(--text-dim);margin-bottom:22px;
  }
  .drop b{color:var(--text);}
  .btn-primary{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;
  }
  .btn-primary:active{transform:scale(.97);}
  .lib-item{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);margin-bottom:10px;
  }
  .lib-thumb{
    width:44px;height:58px;border-radius:4px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Bangers';
    color:#2b2205;font-size:18px;flex-shrink:0;
  }
  .lib-meta{flex:1;overflow:hidden;}
  .lib-meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-meta .stat{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .lib-del{color:var(--text-dim);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:18px 0 8px;}

  /* ---------- Reader screen ---------- */
  #screen-reader{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;}
  #screen-reader.active{display:flex;}
  #stage{
    flex:1;position:relative;overflow:hidden;background:#0c0d10;
    touch-action:none;
  }
  #pageWrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1);}
  #pageImg{display:block;background:var(--page-bg);user-select:none;-webkit-user-drag:none;touch-action:none;}
  #overlay{position:absolute;inset:0;touch-action:none;}
  .balloon{
    position:absolute;border:1px solid var(--gold);border-radius:8px;
    background:rgba(217,169,74,.10);
    cursor:pointer;z-index:5;pointer-events:auto;
  }
  .balloon.active{border-color:var(--accent);border-width:1.5px;background:rgba(228,64,44,.14);z-index:6;}
  .balloon.dim{opacity:0.5;}
  .balloon .tag{
    position:absolute;top:-7px;left:-7px;width:15px;height:15px;border-radius:50%;
    background:var(--gold);color:#2b2205;font-family:'Bangers';font-size:9px;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .balloon.active .tag{background:var(--accent);color:#fff;}

  .draft-box{
    position:absolute;border:1.5px solid var(--accent);border-radius:6px;
    background:rgba(228,64,44,.12);touch-action:none;cursor:move;
  }
  .draft-handle{
    position:absolute;width:22px;height:22px;margin:-11px;
    background:transparent;touch-action:none;
    display:flex;align-items:center;justify-content:center;
  }
  .draft-handle::after{
    content:'';width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  .draft-handle.nw{left:0;top:0;} .draft-handle.ne{left:100%;top:0;}
  .draft-handle.sw{left:0;top:100%;} .draft-handle.se{left:100%;top:100%;}

  #draftToolbar{
    position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
    display:none;gap:10px;z-index:25;align-items:center;
  }
  #draftToolbar button{
    padding:11px 18px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #draftPos{
    background:rgba(0,0,0,.55);color:var(--text);font-size:12px;padding:6px 10px;border-radius:999px;
    font-family:'Bangers';letter-spacing:.5px;
  }
  #draftPos:empty{display:none;}
  #draftOrderInput{
    width:52px;height:40px;text-align:center;font-size:18px;font-family:'Bangers';
    background:var(--gold);color:#2b2205;border:none;border-radius:10px;
    -moz-appearance:textfield;
  }
  #draftOrderInput::-webkit-outer-spin-button,
  #draftOrderInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  #draftToolbar #btnDraftOk{background:var(--accent);color:#fff;}
  #draftToolbar #btnDraftText{background:var(--gold);color:#2b2205;}
  #draftToolbar #btnDraftCancel{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}

  #balloonCard{
    position:absolute;z-index:22;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.55);border:3px solid var(--gold);
    cursor:pointer;background:var(--page-bg);
    transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;
  }
  #balloonCard img{display:block;width:100%;height:100%;object-fit:contain;background:var(--page-bg);}

  #liteEditBar{
    position:fixed;left:10px;right:10px;bottom:max(76px, env(safe-area-inset-bottom, 0px));
    z-index:40;
    display:none;flex-direction:column;gap:8px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);
    max-height:min(70vh, 560px);
    box-sizing:border-box;
  }
  #liteEditPreview{
    width:100%;max-height:min(32vh, 240px);border-radius:10px;overflow:hidden;
    border:2px solid var(--gold);background:#111;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  #liteEditPreview img{
    max-width:100%;max-height:min(32vh, 240px);width:auto;height:auto;
    object-fit:contain;display:block;
  }
  #liteEditBar .lite-fields{display:flex;flex-direction:column;gap:6px;min-width:0;}
  #liteEditBar .lite-row{display:flex;gap:8px;align-items:center;}
  #liteEditBar textarea{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px;font-size:16px;font-family:inherit;resize:none;
    min-height:64px;max-height:120px;width:100%;box-sizing:border-box;
  }
  #liteEditBar button#liteEditClose{
    background:var(--accent);color:#fff;border:none;border-radius:50%;
    width:44px;height:44px;flex-shrink:0;font-size:16px;font-weight:700;cursor:pointer;
  }
  #liteEditBar .lite-hint{font-size:11px;color:var(--text-dim);}
  #liteEditBar .lite-actions{display:flex;gap:8px;margin-top:2px;}
  #liteEditBar .lite-actions button{
    flex:1;min-height:44px;border:none;border-radius:10px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;padding:10px 8px;
  }
  #liteEditOk{background:var(--accent);color:#fff;}
  #liteEditSpeak{background:var(--panel-2);color:var(--text);border:1px solid var(--border)!important;}
  #liteEditNext{background:var(--panel-2);color:var(--text);border:1px solid var(--border)!important;}
  #editScrim{
    display:none;position:fixed;inset:0;z-index:35;
    background:rgba(0,0,0,.55);pointer-events:none;
  }
  body.mobile-editing #editScrim{display:block;pointer-events:auto;}
  body.mobile-editing .ctrlbar{display:none!important;}
  body.mobile-editing #sheet{display:none!important;}
  body.mobile-editing #sheet.settings-open{display:flex!important;}

<script>
/* Configurações — self-contained (cria o modal se faltar no HTML) */
(function(){
  function ensureModal(){
    var modal = document.getElementById('settingsModal');
    if(modal) return modal;
    modal = document.createElement('div');
    modal.id = 'settingsModal';
    modal.setAttribute('style',
      'display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483646;' +
      'background:rgba(0,0,0,0.72);align-items:flex-end;justify-content:center;'
    );
    modal.innerHTML =
      '<div id="settingsPanel" style="width:100%;max-width:560px;max-height:88vh;overflow:auto;' +
      'background:#1a1c22;color:#f2f2f2;border-radius:16px 16px 0 0;border:1px solid #333;padding:0 0 24px;">' +
      '<div style="display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #333;' +
      'position:sticky;top:0;background:#1a1c22;z-index:1;">' +
      '<b style="flex:1;font-size:16px;">Configurações</b>' +
      '<button type="button" id="settingsCloseBtn" style="border:none;background:transparent;color:#f2f2f2;font-size:22px;cursor:pointer;padding:6px 10px;">✕</button>' +
      '</div><div id="settingsBody" style="padding:14px 16px;"></div></div>';
    document.body.appendChild(modal);
    return modal;
  }

  window.__closeSettings = function(){
    var modal = document.getElementById('settingsModal');
    if(modal) modal.style.display = 'none';
  };

  window.__openSettings = function(){
    try{
      var modal = ensureModal();
      var body = document.getElementById('settingsBody');
      if(!body){
        alert('settingsBody ausente');
        return;
      }
      var tts = ('speechSynthesis' in window);
      var html = '';
      if(tts){
        html += '<div style="margin-bottom:14px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:6px">Voz em português</label>';
        html += '<select id="voiceSelect" style="width:100%;padding:10px;border-radius:8px;background:#12141a;color:#f2f2f2;border:1px solid #333"></select></div>';
        html += '<div style="margin-bottom:14px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:6px">Velocidade da fala</label>';
        html += '<input type="range" id="rateRange" min="0.6" max="1.6" step="0.1" value="1" style="width:100%"></div>';
        html += '<div style="margin-bottom:14px"><button type="button" id="btnTestVoice" style="padding:10px 14px;border-radius:8px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">🔊 Testar voz agora</button></div>';
        html += '<div id="voiceCount" style="font-size:12px;color:#888;margin-bottom:10px"></div>';
      } else {
        html += '<div style="font-size:13px;color:#aaa;margin-bottom:12px">Este navegador não tem suporte a voz (Web Speech API).</div>';
      }
      html += '<hr style="border:none;border-top:1px solid #333;margin:16px 0">';
      html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">Catálogo (JSON + Drive)</div>';
      html += '<div style="font-size:12px;color:#888;margin-bottom:10px">Sincronize o catálogo e as capas entre aparelhos.</div>';
      html += '<div style="display:flex;flex-direction:column;gap:8px">';
      html += '<button type="button" id="setCatImport" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Importar catalogo.json</button>';
      html += '<button type="button" id="setCatPush" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Enviar catálogo ao Drive</button>';
      html += '<button type="button" id="setCatPull" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Baixar catálogo do Drive</button>';
      html += '<button type="button" id="setThumbsUp" style="padding:12px;border-radius:10px;border:1px solid #333;background:#2a2d38;color:#f2f2f2">Enviar thumbs ao Drive</button>';
      html += '<button type="button" id="setCatClear" style="padding:12px;border-radius:10px;border:1px solid #444;background:transparent;color:#aaa">Limpar catálogo local</button>';
      html += '</div>';
      body.innerHTML = html;

      modal.style.display = 'flex';
      modal.style.zIndex = '2147483646';

      if(tts){
        try{
          var sel = document.getElementById('voiceSelect');
          function fillVoices(){
            if(!sel) return;
            var voices = speechSynthesis.getVoices() || [];
            var pt = voices.filter(function(v){ return (v.lang||'').toLowerCase().indexOf('pt')===0; });
            var list = pt.length ? pt : voices;
            sel.innerHTML = '';
            list.forEach(function(v){
              var o = document.createElement('option');
              o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
              sel.appendChild(o);
            });
            var vc = document.getElementById('voiceCount');
            if(vc) vc.textContent = list.length ? (list.length + ' voz(es)') : 'Nenhuma voz encontrada';
          }
          fillVoices();
          if(speechSynthesis.onvoiceschanged !== undefined){
            speechSynthesis.onvoiceschanged = fillVoices;
          }
          if(typeof loadVoices === 'function') try{ loadVoices(); }catch(e){}
        }catch(e){}
        var tv = document.getElementById('btnTestVoice');
        if(tv) tv.onclick = function(){
          try{
            if(typeof speak === 'function') speak('Um, dois, três. Se você está ouvindo isso, a voz está funcionando.');
            else {
              var u = new SpeechSynthesisUtterance('Um, dois, três.');
              speechSynthesis.speak(u);
            }
          }catch(e){ alert('Voz: ' + e); }
        };
        var vs = document.getElementById('voiceSelect');
        if(vs) vs.onchange = function(){ if(window.state) window.state._voiceName = vs.value; };
      }

      function click(id, fn){
        var el = document.getElementById(id);
        if(el) el.onclick = fn;
      }
      click('settingsCloseBtn', function(){ window.__closeSettings(); });
      click('setCatImport', function(){
        var f = document.getElementById('catalogFileInput');
        if(f) f.click(); else alert('Input de catálogo não encontrado — o app ainda está carregando?');
      });
      click('setCatPush', function(){
        if(typeof catalogPushToDrive==='function') catalogPushToDrive();
        else alert('Função Drive ainda não carregou. Espere 2s e tente de novo.');
      });
      click('setCatPull', function(){
        if(typeof catalogPullFromDrive==='function') catalogPullFromDrive();
        else alert('Função Drive ainda não carregou. Espere 2s e tente de novo.');
      });
      click('setThumbsUp', function(){
        var f = document.getElementById('thumbsFileInput');
        if(f) f.click(); else alert('Input de thumbs não encontrado');
      });
      click('setCatClear', function(){
        if(typeof catalogStoreKey!=='function' || typeof storeSet!=='function'){
          alert('App ainda carregando…'); return;
        }
        if(window.state) window.state.jsonCatalog = null;
        Promise.resolve(storeSet(catalogStoreKey(), null))
          .then(function(){ return storeSet('catalogo-json-meta', null); })
          .then(function(){ if(typeof idbDelCatalog==='function') return idbDelCatalog(); })
          .then(function(){
            if(typeof renderJsonCatalog==='function') renderJsonCatalog();
            if(typeof toast==='function') toast('Catálogo local limpo', 2000);
            else alert('Catálogo local limpo');
          });
      });
      modal.onclick = function(ev){ if(ev.target === modal) window.__closeSettings(); };
    }catch(err){
      alert('Erro configurações: ' + (err && err.message ? err.message : err));
    }
  };

  // bind assim que possível
  function bindBtn(){
    var btn = document.getElementById('btnSettings');
    if(!btn || btn.__settingsBound) return;
    btn.__settingsBound = true;
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      window.__openSettings();
    }, true);
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bindBtn);
  } else {
    bindBtn();
  }
  setTimeout(bindBtn, 500);
  setTimeout(bindBtn, 2000);
})();
</script>




<script>
/* ==================== STATE ==================== */
const state = {
  screen:'library',
  comic:null,          // {id,name,pages:[{name,url,el}]}
  pageIndex:0,
  marks:{},            // {pageIndex:[{id,x,y,w,h,order,text}]}
  mode:'read',          // read | mark | play
  activeBalloon:null,
  playQueue:[],
  playTimer:null,
  playPauseIndex:null,
  drawing:null,
  voices:[],
  viewTransform:{scale:1,tx:0,ty:0},
  draft:null,
  walk:null,
  storageOk:null,
  readZoomOn:false,
  paused:false,
  pausedBalloon:null,
  lastDetectDiag:null,
};

const $ = s => document.querySelector(s);
function toast(msg,ms=2000){
  const toastEl = $('#toast');
  if(!toastEl){ console.log('[toast]', msg); return; }
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
function toastProgress(msg){
  const toastEl = $('#toast');
  if(!toastEl){ console.log('[progress]', msg); return; }
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
}

/* ==================== STORAGE HELPERS ==================== */
// Usa window.storage quando disponível (dentro do Claude); fora daqui, usa localStorage do navegador normalmente.
async function storeGet(key){
  if(window.storage){
    try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem('balao:'+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  if(window.storage){
    try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
    catch(e){ console.error('storage set fail',e); return false; }
  }
  try{ localStorage.setItem('balao:'+key, JSON.stringify(val)); return true; }
  catch(e){ console.error('localStorage set fail',e); return false; }
}
async function checkStorageAvailable(){
  try{
    const ok = await storeSet('balao-teste-storage', {ok:true, t:Date.now()});
    const back = await storeGet('balao-teste-storage');
    state.storageOk = !!(ok && back && back.ok===true);
  }catch(e){
    state.storageOk = false;
    console.warn('Salvamento automático indisponível:', e);
  }
  updateStorageBadge();
  if(!state.storageOk){

const DRIVE_CLIENT_ID = '823192253380-7j5v3scp6jae9r0r6if4jcorrng4joe7.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'Balao HQ';
const DRIVE_TOKEN_KEY = 'drive-token';

state.drive = { token: null, tokenExp: 0, folderId: null, syncing: false };

function driveUpdateUi(){
  const st = $('#driveStatus');
  const bi = $('#btnDriveLogin');
  const bo = $('#btnDriveLogout');

async function driveRestoreToken(){
  try{
    const t = await storeGet(DRIVE_TOKEN_KEY);
    if(t && t.access_token && t.expires_at && Date.now() < t.expires_at - 5000){
      state.drive.token = t.access_token;
      state.drive.tokenExp = t.expires_at;
      state.drive.folderId = t.folderId || null;
    }
  }catch(_){}
  driveUpdateUi();
}

async function driveSaveToken(access_token, expires_in){
  state.drive.token = access_token;
  state.drive.tokenExp = Date.now() + (expires_in || 3600) * 1000;
  await storeSet(DRIVE_TOKEN_KEY, {
    access_token,
    expires_at: state.drive.tokenExp,
    folderId: state.drive.folderId
  });
  driveUpdateUi();
}

function driveLogin(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    toast('Aguarde o Google carregar… ou abra o app via http/https (não file://)', 5000);
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if(resp.error){
        toast('Login Google: ' + (resp.error_description || resp.error), 5000);
        return;
      }
      await driveSaveToken(resp.access_token, resp.expires_in || 3600);
      try{
        await driveEnsureFolder();
        toast('Google Drive conectado ✓', 2500);
      }catch(e){
        console.error(e);
        toast('Conectado, mas pasta Drive falhou: ' + (e.message||e), 5000);
      }
    }
  });
  client.requestAccessToken({ prompt: '' });
}

async function driveLogout(){
  const token = state.drive.token;
  state.drive.token = null;
  state.drive.tokenExp = 0;
  state.drive.folderId = null;
  await storeSet(DRIVE_TOKEN_KEY, null);
  if(token && typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(token, ()=>{}); }catch(_){}
  }
  driveUpdateUi();
  toast('Desconectado do Drive', 2000);
}

async function driveFetch(path, options){
  if(!state.drive.token || Date.now() >= state.drive.tokenExp - 5000){
    throw new Error('Drive não conectado');
  }
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {}, {
    Authorization: 'Bearer ' + state.drive.token
  });
  const res = await fetch('https://www.googleapis.com' + path, opts);
  if(res.status === 401){
    state.drive.token = null;
    driveUpdateUi();
    throw new Error('Sessão Drive expirou — entre de novo');
  }
  return res;
}

async function driveEnsureFolder(){
  if(state.drive.folderId) return state.drive.folderId;
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + DRIVE_FOLDER_NAME + "' and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'erro ao buscar pasta');
  if(data.files && data.files.length){
    state.drive.folderId = data.files[0].id;
  } else {
    const meta = { name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' };
    const cr = await driveFetch('/drive/v3/files?fields=id,name', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(meta)
    });
    const created = await cr.json();
    if(!cr.ok) throw new Error((created.error && created.error.message) || 'erro ao criar pasta');
    state.drive.folderId = created.id;
  }
  const t = await storeGet(DRIVE_TOKEN_KEY);
  if(t){ t.folderId = state.drive.folderId; await storeSet(DRIVE_TOKEN_KEY, t); }
  return state.drive.folderId;
}

function driveProgressFileName(comicId){
  return comicId + '.balao.json';
}

async function driveFindProgressFile(comicId){
  const folderId = await driveEnsureFolder();
  const name = driveProgressFileName(comicId);
  const q = encodeURIComponent("name='" + name + "' and '" + folderId + "' in parents and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'erro busca arquivo');
  return (data.files && data.files[0]) || null;
}

async function driveUploadProgress(comicId, payload){
  const folderId = await driveEnsureFolder();
  const name = driveProgressFileName(comicId);
  const existing = await driveFindProgressFile(comicId);
  const body = JSON.stringify(payload);
  if(existing){
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=media', {
      method: 'PATCH',
      headers: {
        Authorization: 'Bearer ' + state.drive.token,
        'Content-Type': 'application/json'
      },
      body
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error((err.error && err.error.message) || 'falha ao atualizar Drive');
    }
    return existing.id;
  }
  const metadata = {
    name,
    parents: [folderId],
    mimeType: 'application/json'
  };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([body], { type: 'application/json' }));
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.drive.token },
    body: form
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'falha ao criar no Drive');
  return data.id;
}

async function driveDownloadProgress(comicId){
  const existing = await driveFindProgressFile(comicId);
  if(!existing) return null;
  const res = await driveFetch('/drive/v3/files/' + existing.id + '?alt=media');
  if(!res.ok) return null;
  return await res.json();
}

function marksTextCount(marks){
  let n = 0;
  Object.keys(marks || {}).forEach(k=>{
    (marks[k]||[]).forEach(b=>{ if((b.text||'').trim()) n++; });
  });
  return n;
}

async function pullDriveProgressForComic(comicId){
  if(!state.drive.token || Date.now() >= state.drive.tokenExp - 5000) return null;
  try{
    const remote = await driveDownloadProgress(comicId);
    if(!remote || !remote.marks) return null;
    const localMeta = (await storeGet('marks-meta:'+comicId)) || {};
    const remoteAt = remote.savedAt || 0;
    const localAt = localMeta.savedAt || 0;
    const remoteTexts = marksTextCount(remote.marks);
    const localTexts = marksTextCount(state.marks);
    // usa remoto se for mais novo, ou se local vazio e remoto tem texto
    if(remoteAt >= localAt || (localTexts === 0 && remoteTexts > 0)){
      state.marks = remote.marks;
      if(typeof remote.pageIndex === 'number'){
        state.pageIndex = remote.pageIndex;
      }
      await storeSet('marks:'+comicId, state.marks);
      await storeSet('page:'+comicId, state.pageIndex);
      await storeSet('marks-meta:'+comicId, { savedAt: remoteAt || Date.now(), page: state.pageIndex, from: 'drive' });
      return remote;
    }
  }catch(e){
    console.warn('pullDriveProgress', e);
  }
  return null;
}

let _drivePushTimer = null;
function scheduleDrivePush(){
  clearTimeout(_drivePushTimer);

async function pushDriveProgressNow(){
  if(!state.comic) return;
  if(!state.drive.token || Date.now() >= state.drive.tokenExp - 5000) return;
  if(state.drive.syncing) return;
  state.drive.syncing = true;
  try{
    const payload = {
      version: 1,
      comicId: state.comic.id,
      comicName: state.comic.name,
      pageIndex: state.pageIndex,
      marks: state.marks,
      savedAt: Date.now()
    };
    await driveUploadProgress(state.comic.id, payload);
    await storeSet('marks-meta:'+state.comic.id, { savedAt: payload.savedAt, page: state.pageIndex, from: 'drive-push' });
    const st = $('#driveStatus');

  }catch(e){
    console.warn('pushDrive', e);
    toast('Drive: ' + (e.message || e), 4000);
  }finally{
    state.drive.syncing = false;
  }
}


function slugify(name){
  return name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'comic';
}

/* ==================== IDB arquivos CBZ ==================== */
const IDB_NAME = 'balao-cbz-files';
const IDB_STORE = 'files';
const IDB_CATALOG = 'catalog';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_CATALOG)) db.createObjectStore(IDB_CATALOG);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function idbPutCatalog(data, meta){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readwrite');
      tx.objectStore(IDB_CATALOG).put({ data: data, meta: meta || null, savedAt: Date.now() }, 'catalogo');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){
    console.warn('IDB put catalog fail', e);
    return false;
  }
}

async function idbGetCatalog(){
  try{
    const db = await idbOpen();
    const rec = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readonly');
      const r = tx.objectStore(IDB_CATALOG).get('catalogo');
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    return rec;
  }catch(e){
    console.warn('IDB get catalog fail', e);
    return null;
  }
}

async function idbDelCatalog(){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_CATALOG, 'readwrite');
      tx.objectStore(IDB_CATALOG).delete('catalogo');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){}
}

async function idbPutComic(id, file){
  try{
    const buf = await file.arrayBuffer();
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({
        name: file.name,
        type: file.type || 'application/vnd.comicbook+zip',
        buf,
        savedAt: Date.now()
      }, id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){
    console.warn('IDB put comic fail', e);
    return false;
  }
}

async function idbGetComic(id){
  try{
    const db = await idbOpen();
    const rec = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(id);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    if(!rec || !rec.buf) return null;
    return new File([rec.buf], rec.name || (id+'.cbz'), {
      type: rec.type || 'application/vnd.comicbook+zip'
    });
  }catch(e){
    console.warn('IDB get comic fail', e);
    return null;
  }
}

async function idbDelComic(id){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn('IDB del comic fail', e); }
}

async function refreshLibrary(){
  const list = (await storeGet('comics-list')) || [];
  const el = $('#libList');
  if(!el) return;
  el.innerHTML='';
  if(!list.length){ el.innerHTML = '<div class="empty-hint">Nenhum quadrinho ainda. Abra um CBZ para começar — as marcações de balão ficam salvas mesmo depois de fechar o app.</div>'; return; }
  list.slice().reverse().forEach(c=>{
    const div = document.createElement('div'); div.className='lib-item';
    const meta = (typeof catalogFindBookByFilename === 'function') ? catalogFindBookByFilename(c.name) : null;
    let sub = (c.balloons||0) + ' balões marcados';
    if(meta){
      const bits = [];
      if(meta.series) bits.push(meta.series);
      if(meta.number) bits.push('#' + meta.number);
      if(meta.year) bits.push(String(meta.year));
      if(meta.title && meta.title !== c.name) bits.push(meta.title);
      if(bits.length) sub = bits.join(' · ') + ' · ' + sub;
    }
    const thumbHtml = (meta && meta.thumb)
      ? `<div class="lib-thumb" data-thumb="${meta.thumb.replace(/"/g,'')}">${c.pages}p</div>`
      : `<div class="lib-thumb">${c.pages}p</div>`;
    div.innerHTML = thumbHtml +
      `<div class="lib-meta"><div class="name">${meta && meta.title ? meta.title : c.name}</div><div class="stat">${sub}</div></div>
      <button class="lib-del" data-id="${c.id}">🗑</button>`;
    const th = div.querySelector('.lib-thumb');
    if(th && meta && meta.thumb && typeof catalogLoadThumb === 'function'){
      catalogLoadThumb(meta.thumb, th, meta.number || '');
    }
    div.addEventListener('click', async (e)=>{
      if(e.target.closest('.lib-del')) return;
      toastProgress('Abrindo '+c.name+'…');
      const file = await idbGetComic(c.id);
      if(file){
        await openCbz(file);
        return;
      }
      // fallback: arquivo nao estava no IndexedDB (sessao antiga)
      toast('Arquivo nao encontrado na biblioteca local. Selecione o CBZ de novo (so desta vez).', 5000);
      $('#fileInput').dataset.resumeId = c.id;
      $('#fileInput').click();
    });
    div.querySelector('.lib-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      const nl = list.filter(x=>x.id!==id);
      await storeSet('comics-list', nl);
      await storeSet('marks:'+id, null);
      await idbDelComic(id);
      refreshLibrary();
    });
    el.appendChild(div);
  });
}

function marksFileNameForComic(comicName){
  // Ex.: "Blackest Night #1.cbz" -> "Blackest Night #1.xml" (mesmo nome da HQ)
  const base = (comicName || 'hq').replace(/\.(cbz|zip|cbr)$/i, '');
  const safe = base.replace(/[\\/:*?"<>|]/g, '_').trim() || 'hq';
  return safe + '.xml';
}
function findMarksEntry(zip, comicName){
  const preferred = marksFileNameForComic(comicName);
  if(zip.file(preferred)) return preferred;
  // legado
  if(zip.file('balao-marks.xml')) return 'balao-marks.xml';
  const keys = Object.keys(zip.files).filter(n => {
    if(zip.files[n].dir) return false;
    const base = n.replace(/^.*\//,'').toLowerCase();
    return base.endsWith('-marks.xml') || (base.endsWith('.xml') && base !== 'comicinfo.xml');
  });
  if(keys.length){
    keys.sort((a,b)=>a.length-b.length);
    return keys[0];
  }
  return preferred;
}

function xmlFromMarks(marks){
  const doc = document.implementation.createDocument('', '', null);
  const root = doc.createElement('BalaoData'); root.setAttribute('version','1');
  Object.keys(marks).forEach(pageIdx=>{
    const arr = marks[pageIdx]||[];
    if(!arr.length) return;
    const pageEl = doc.createElement('Page'); pageEl.setAttribute('index', pageIdx);
    arr.forEach(b=>{
      const bEl = doc.createElement('Balloon');
      bEl.setAttribute('id', b.id); bEl.setAttribute('order', b.order);
      bEl.setAttribute('x', b.x); bEl.setAttribute('y', b.y);
      bEl.setAttribute('w', b.w); bEl.setAttribute('h', b.h);
      const textEl = doc.createElement('Text'); textEl.textContent = b.text||'';
      bEl.appendChild(textEl);
      pageEl.appendChild(bEl);
    });
    root.appendChild(pageEl);
  });
  doc.appendChild(root);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(doc);
}
function marksFromXml(xmlText){
  const marks={};
  try{
    const doc = new DOMParser().parseFromString(xmlText,'application/xml');
    if(doc.querySelector('parsererror')) return marks;
    doc.querySelectorAll('Page').forEach(pageEl=>{
      const idx = pageEl.getAttribute('index');
      const arr=[];
      pageEl.querySelectorAll('Balloon').forEach(bEl=>{
        arr.push({
          id: bEl.getAttribute('id') || ('b'+Math.random().toString(36).slice(2)),
          order: parseInt(bEl.getAttribute('order'),10)||1,
          x: parseFloat(bEl.getAttribute('x')), y: parseFloat(bEl.getAttribute('y')),
          w: parseFloat(bEl.getAttribute('w')), h: parseFloat(bEl.getAttribute('h')),
          text: (function(){ var te = bEl.querySelector('Text'); return te ? te.textContent : ''; })()
        });
      });
      marks[idx]=arr;
    });
  }catch(e){ console.error('parse marks xml failed', e); }
  return marks;
}
function updateZipXml(){
  if(state.comic && state.comic.zip){
    const name = state.comic.marksEntry || marksFileNameForComic(state.comic.name);
    state.comic.marksEntry = name;
    state.comic.zip.file(name, xmlFromMarks(state.marks));
    // remove legado se gravamos com nome da HQ (evita dois XMLs divergentes)
    if(name !== 'balao-marks.xml' && state.comic.zip.file('balao-marks.xml')){
      state.comic.zip.remove('balao-marks.xml');
    }
  }
}

async function openCbz(file){
  toast('Abrindo quadrinho…', 4000);
  try{
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files)
      .filter(f=>!f.dir && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
    if(!entries.length){ toast('Nenhuma imagem encontrada no arquivo.'); return; }
    const pages=[];
    for(let i=0;i<entries.length;i++){
      const entry = entries[i];
      toastProgress(`Extraindo página ${i+1}/${entries.length}`);
      const blob = await entry.async('blob');
      pages.push({name:entry.name, url:URL.createObjectURL(blob)});
    }
    const id = slugify(file.name);
    const marksEntry = findMarksEntry(zip, file.name);
    state.comic = {id, name:file.name, pages, zip, marksEntry};
    const embedded = zip.file(marksEntry);
    let fileMarks = {};
    if(embedded){
      const xmlText = await embedded.async('string');
      fileMarks = marksFromXml(xmlText);
    }
    const localMarks = (await storeGet('marks:'+id)) || null;
    // Preferir progresso local (correções no aparelho) para nao perder edição
    if(localMarks && Object.keys(localMarks).length){
      state.marks = localMarks;
      toast(fileMarks && Object.keys(fileMarks).length
        ? 'Progresso local restaurado (correções deste aparelho)'
        : 'Marcações restauradas deste aparelho');
    } else if(Object.keys(fileMarks).length){
      state.marks = fileMarks;
      toast('Marcações: ' + marksEntry);
    } else {
      state.marks = {};
    }
    const savedPage = await storeGet('page:'+id);
    state.pageIndex = Math.max(0, Math.min(
      pages.length - 1,
      (typeof savedPage === 'number' ? savedPage : parseInt(savedPage, 10) || 0)
    ));
    state.readZoomOn = !!(await storeGet('readzoom:'+id));
    state.fileHandle = state.fileHandle || null;
    // Nuvem: se Drive conectado, puxa progresso mais recente
    if(state.drive && state.drive.token){
      toastProgress('Sincronizando com Drive…');
      const remote = await pullDriveProgressForComic(id);
      if(remote){
        state.pageIndex = Math.max(0, Math.min(
          pages.length - 1,
          typeof remote.pageIndex === 'number' ? remote.pageIndex : state.pageIndex
        ));
        toast('Progresso do Drive aplicado ✓', 2500);
      }
    }
    await registerComic(id, file.name, pages.length);
    await idbPutComic(id, file);
    goReader();
  }catch(err){
    console.error(err);
    toast('Erro ao abrir: ' + (err && err.message ? err.message : err), 6000);
  }
}

async function downloadUpdatedCbz(){

/* ==================== PAGE RENDER ==================== */
function currentMarks(){
  const arr = state.marks[state.pageIndex] || [];
  return arr.slice().sort((a,b)=>a.order-b.order);
}
function updateReadProgress(){
  const el = $('#readProgress');
  if(!el || !state.comic || !state.comic.pages.length) return;
  const pct = ((state.pageIndex + 1) / state.comic.pages.length) * 100;
  el.style.width = pct.toFixed(2) + '%';
}
function fitImageToStage(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  if(!img.naturalWidth || !stage.width || !stage.height) return;
  const scale = Math.min(stage.width/img.naturalWidth, stage.height/img.naturalHeight);
  img.style.width = Math.round(img.naturalWidth*scale)+'px';
  img.style.height = Math.round(img.naturalHeight*scale)+'px';
}
function renderPage(){
  clearDraft();
  hideBalloonCard();
  closeLiteEdit(false);
  const p = state.comic.pages[state.pageIndex];
  const img = $('#pageImg');
  img.onload = ()=>{ fitImageToStage(); resetZoom(); drawBalloons(); };
  img.src = p.url;
  $('#pagePos').textContent = `${state.pageIndex+1}/${state.comic.pages.length}`;
  updateReadProgress();
  if(state.comic) storeSet('page:'+state.comic.id, state.pageIndex);
  setMode(state.mode==='play' ? state.mode : 'read');
  $('#btnReadZoom').classList.toggle('on', state.readZoomOn);
  closeSheet();
}
function drawBalloons(){
  const overlay = $('#overlay');
  overlay.innerHTML='';
  const marks = currentMarks();
  const svgNS='http://www.w3.org/2000/svg';
  if(marks.length>1 && state.mode!=='play'){
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
    svg.style.position='absolute'; svg.style.inset='0'; svg.style.pointerEvents='none';
    let d='';
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    marks.forEach((b,i)=>{
      const cx=((b.x+b.w/2)*100).toFixed(2), cy=((b.y+b.h/2)*100).toFixed(2);
      d += (i===0?'M':'L') + cx + ' ' + cy + ' ';
    });
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d',d); path.setAttribute('class','path-line');
    path.setAttribute('vector-effect','non-scaling-stroke');
    svg.appendChild(path); overlay.appendChild(svg);
  }
  marks.forEach(b=>{
    if(state.draft && state.draft.editingId===b.id) return;
    const div = document.createElement('div');
    const isActive = state.activeBalloon===b.id;
    div.className='balloon'+(isActive?' active':'')+((state.mode==='play'||state.paused)&&!isActive?' dim':'');
    div.style.left=(b.x*100)+'%'; div.style.top=(b.y*100)+'%';
    div.style.width=(b.w*100)+'%'; div.style.height=(b.h*100)+'%';
    div.innerHTML = `<div class="tag">${b.order}</div>`;
    const tap = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); onBalloonTap(b); };
    div.addEventListener('click', tap);
    // pointerup ajuda no desktop quando o overlay competia pelo evento
    div.addEventListener('pointerup', (ev)=>{
      if(ev.button!==undefined && ev.button!==0) return;
      if(state.mode==='mark') return; // no mark, arraste/criação usa outros handlers
      // evita double-fire com click
      if(div._tapLock) return;
      div._tapLock = true;
      setTimeout(()=>{ div._tapLock = false; }, 350);
      tap(ev);
    });
    overlay.appendChild(div);
  });
  if(state.draft) renderDraft();
}

/* ==================== ZOOM ==================== */
function applyViewTransform(animated){
  const wrap = $('#pageWrap');
  wrap.style.transition = animated ? '' : 'none';
  wrap.style.transformOrigin='0 0';
  const {scale,tx,ty} = state.viewTransform;
  wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
function resetZoom(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const w = img.offsetWidth||0, h = img.offsetHeight||0;
  const tx = Math.max(0, (stage.width-w)/2);
  const ty = Math.max(0, (stage.height-h)/2);
  state.viewTransform = {scale:1, tx, ty};
  applyViewTransform(true);
  state.activeBalloon=null;
}
function zoomToBalloon(b, opts){
  opts = opts || {};
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const dispW = img.offsetWidth, dispH = img.offsetHeight;
  const px=(b.x+b.w/2)*dispW, py=(b.y+b.h/2)*dispH;
  const reserve = opts.reserveBottom || 0;
  const visibleH = stage.height*(1-reserve);
  const scale = Math.min(4, Math.max(1.3, Math.min((stage.width*0.86)/(b.w*dispW), (visibleH*0.8)/(b.h*dispH))));
  const tx = stage.width/2 - px*scale;
  const ty = visibleH/2 - py*scale;
  state.viewTransform = {scale,tx,ty};
  applyViewTransform(true);
  state.activeBalloon=b.id;
  drawBalloons();
}
function highlightBalloon(b){
  state.activeBalloon = b.id;
  drawBalloons();
}

/* ==================== CARD AMPLIADO (zoom ao ler) ==================== */
function showBalloonCard(b){
  if(!state.readZoomOn || !state.comic) return;
  const img = $('#pageImg');
  const stage = $('#stage').getBoundingClientRect();
  const rect = img.getBoundingClientRect();

  // recorte em boa resolução a partir da imagem original (nao da tela pequena)
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = b.w*nw, bh = b.h*nh;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(bw));
  canvas.height = Math.max(1,Math.round(bh));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);

  // posicao/tamanho na tela: centralizado sobre o proprio balao, ampliado
  const screenX = rect.left - stage.left + b.x*rect.width;
  const screenY = rect.top - stage.top + b.y*rect.height;
  const screenW = b.w*rect.width;
  const screenH = b.h*rect.height;
  // valores anteriores (caso precise voltar): scale 1.6–2.3, alvo 190, largura 0.72, altura 0.46
  const scale = Math.min(1.7, Math.max(1.0, 143/Math.max(1,screenH)));
  let cardW = screenW*scale, cardH = screenH*scale;
  cardW = Math.min(cardW, stage.width*0.54);
  cardH = Math.min(cardH, stage.height*0.35);
  let cx = screenX + screenW/2, cy = screenY + screenH/2;
  let left = cx - cardW/2, top = cy - cardH/2;
  // mantem dentro da area visivel do stage
  left = Math.max(6, Math.min(left, stage.width - cardW - 6));
  top = Math.max(6, Math.min(top, stage.height - cardH - 6));

  const card = $('#balloonCard');
  card.style.left = left+'px';
  card.style.top = top+'px';
  card.style.width = cardW+'px';
  card.style.height = cardH+'px';
  card.innerHTML = '';
  const outImg = document.createElement('img');
  outImg.src = canvas.toDataURL('image/png');
  card.appendChild(outImg);
  card.style.display = 'block';
  card.onclick = ()=> pauseAndEditWhileReading(b);
  state.cardBalloonId = b.id;
}
function hideBalloonCard(){
  const card = $('#balloonCard');
  if(card){ card.style.display='none'; card.onclick=null; }
  state.cardBalloonId = null;
}

/* ==================== EDIÇÃO RÁPIDA DURANTE A LEITURA ==================== */
function cropBalloonToDataUrl(b){
  const img = $('#pageImg');
  if(!img || !img.naturalWidth) return '';
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = Math.max(1,b.w*nw), bh = Math.max(1,b.h*nh);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bw); canvas.height = Math.round(bh);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}
function isMobileEditLayout(){
  return window.innerWidth < 700;
}
function positionLiteEditBar(){
  const bar = $('#liteEditBar');
  if(!bar || bar.style.display==='none') return;
  const vv = window.visualViewport;
  const mobile = isMobileEditLayout();
  if(vv){
    // altura visivel real (acima do teclado)
    const visibleBottom = vv.height + vv.offsetTop;
    const fromBottom = Math.max(0, window.innerHeight - visibleBottom);
    if(mobile){
      bar.style.bottom = fromBottom + 'px';

      const maxH = Math.max(200, vv.height - 8);
      bar.style.maxHeight = maxH + 'px';

    }

  }

function applyLiteEditTextAndOrder(b){
  if(!b) return;
  b.text = $('#liteEditText').value;
  const orderInput = $('#liteEditOrder');
  if(orderInput){
    let newOrder = parseInt(orderInput.value, 10);
    if(!isNaN(newOrder) && newOrder !== b.order){
      const arr = state.marks[state.pageIndex] || [];
      const others = arr.filter(x=>x.id!==b.id).sort((a,c)=>a.order-c.order);
      newOrder = Math.max(1, Math.min(newOrder, others.length+1));
      others.splice(newOrder-1, 0, b);
      others.forEach((x,i)=>{ x.order = i+1; });
    }
  }
}
function pauseAndEditWhileReading(b){
  if(state.ttsAvailable) speechSynthesis.cancel();
  clearTimeout(state.playTimer);
  state.paused = true;
  state.pausedBalloon = b;
  if(state.mode==='play'){
    const marks = currentMarks();
    const playingId = state.activeBalloon;
    const playingIdx = marks.findIndex(x=>x.id===playingId);
    if(state.playPauseIndex==null){
      state.playPauseIndex = playingIdx>=0 ? playingIdx : marks.findIndex(x=>x.id===b.id);
    }
  }
  hideBalloonCard();
  resetZoom();
  state.activeBalloon = b.id;
  drawBalloons();

  const prev = $('#liteEditPreview');
  if(prev){
    const url = cropBalloonToDataUrl(b);
    prev.innerHTML = url ? '<img alt="balão" src="'+url+'">' : '';
  }
  const orderInput = $('#liteEditOrder');
  if(orderInput){
    const marks = currentMarks();
    orderInput.min = 1;
    orderInput.max = Math.max(1, marks.length);
    orderInput.value = b.order;
  }
  $('#liteEditText').value = b.text || '';
  const bar = $('#liteEditBar');
  bar.style.display = 'flex';
  if(isMobileEditLayout()){
    document.body.classList.add('mobile-editing');
  } else {
    document.body.classList.remove('mobile-editing');
  }
  positionLiteEditBar();
  setTimeout(()=> {
    positionLiteEditBar();
    try{ $('#liteEditText').focus({ preventScroll:true }); }catch(e){ try{ $('#liteEditText').focus(); }catch(_){} }
  }, 180);
}

async function closeLiteEdit(resume, opts){
  opts = opts || {};
  const bar = $('#liteEditBar');
  if(bar) bar.style.display = 'none';
  document.body.classList.remove('mobile-editing');
  if(bar){ bar.style.bottom = ''; bar.style.maxHeight = ''; }
  if(!state.paused) return;
  const b = state.pausedBalloon;
  state.paused = false;
  state.pausedBalloon = null;
  if(!b) return;
  if(resume===false) return;
  applyLiteEditTextAndOrder(b);
  await saveMarks();
  drawBalloons();
  if(opts.next){
    const marks = currentMarks().slice().sort((a,c)=>a.order-c.order);
    const idx = marks.findIndex(x=>x.id===b.id);
    const next = marks[idx+1];
    if(next){
      // permanece em pausa de play se estava em play
      if(state.mode==='play' && state.playPauseIndex!=null){
        state.playPauseIndex = idx+1;
      }
      pauseAndEditWhileReading(next);
      return;
    }
  }
  if(state.mode==='play'){
    const marks = currentMarks();
    let idx = state.playPauseIndex;
    if(idx==null || idx<0) idx = marks.findIndex(x=>x.id===b.id);
    if(idx<0) idx = 0;
    state.playPauseIndex = null;
    setMode('play');
    playNext(idx);
  } else {
    highlightBalloon(b);
    if(state.readZoomOn) showBalloonCard(b);
    speak(b.text);
  }
}

/* ==================== DRAWING NEW BALLOON + PINCH ZOOM/PAN ==================== */
const overlayEl = $('#overlay');
const pointers = new Map();
let pinchStart = null;
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

function normFromEvent(e){
  const rect = $('#pageImg').getBoundingClientRect();
  return { x: Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width)),
           y: Math.min(1,Math.max(0,(e.clientY-rect.top)/rect.height)) };
}

overlayEl.addEventListener('pointerdown', (e)=>{
  // Clique em balão / caixa de ajuste: NÃO capturar o ponteiro.
  // No desktop o setPointerCapture no overlay impedia o click do balão (edição no play quebrava).
  if(e.target.closest('.balloon') || e.target.closest('.draft-box') || e.target.closest('#draftBox')){
    return;
  }
  overlayEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStart = { dist:dist(pts[0],pts[1]), mid:mid(pts[0],pts[1]),
      scale:state.viewTransform.scale, tx:state.viewTransform.tx, ty:state.viewTransform.ty };
    return;
  }
  if(pointers.size!==1) return;
  // Fora de balão, em read/play: só limpa destaque se não estiver editando
  if(state.mode!=='mark'){
    if(state.paused) return;
    if(state.activeBalloon){ clearHighlight(); }
    return;
  }
  if(state.draft || state.walk) return;
  const p = normFromEvent(e);
  const w=0.18, h=0.09;
  const x = Math.min(Math.max(0,p.x-w/2),1-w), y = Math.min(Math.max(0,p.y-h/2),1-h);
  placeBalloonInstant(x,y,w,h);
});
overlayEl.addEventListener('pointermove', (e)=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinchStart){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const m = mid(pts[0],pts[1]);
    const stage = $('#stage').getBoundingClientRect();
    const newScale = Math.min(6, Math.max(0.8, pinchStart.scale * (d/pinchStart.dist)));
    const anchorX = (pinchStart.mid.x - stage.left - pinchStart.tx) / pinchStart.scale;
    const anchorY = (pinchStart.mid.y - stage.top - pinchStart.ty) / pinchStart.scale;
    state.viewTransform = {
      scale: newScale,
      tx: (m.x - stage.left) - anchorX*newScale,
      ty: (m.y - stage.top) - anchorY*newScale
    };
    applyViewTransform(false);
  }
});
overlayEl.addEventListener('pointerup', (e)=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=null; });
overlayEl.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStart=null; });

/* ---- draft box: create, resize via handles, move ---- */
function renderDraft(){
  let box = document.getElementById('draftBox');
  if(!box){
    box = document.createElement('div');
    box.id='draftBox'; box.className='draft-box';
    ['nw','ne','sw','se'].forEach(corner=>{
      const h=document.createElement('div');
      h.className='draft-handle '+corner;
      attachHandleDrag(h,corner);
      box.appendChild(h);
    });
    attachBoxMove(box);
    overlayEl.appendChild(box);
  }
  positionDraftBox();
  showDraftToolbar(true);
  if(state.walk){
    updateWalkToolbar();
  } else {
    $('#btnDraftOk').textContent = state.draft.editingId ? '✓ Salvar posição' : '✓ Usar este balão';
    $('#btnDraftText').style.display = state.draft.editingId ? 'inline-block' : 'none';
    $('#btnDraftCancel').textContent = '✕ Cancelar';
    $('#draftPos').textContent = '';
    const orderInput = $('#draftOrderInput');
    if(state.draft.editingId){
      const marks = currentMarks();
      const b = marks.find(x=>x.id===state.draft.editingId);
      orderInput.style.display = 'inline-block';
      orderInput.min = 1; orderInput.max = marks.length;
      if(document.activeElement !== orderInput){
        orderInput.value = b ? b.order : '';
      }
    } else {
      orderInput.style.display = 'none';
    }
  }
}
function positionDraftBox(){
  const box = document.getElementById('draftBox'); if(!box || !state.draft) return;
  const d = state.draft;
  box.style.left=(d.x*100)+'%'; box.style.top=(d.y*100)+'%';
  box.style.width=(d.w*100)+'%'; box.style.height=(d.h*100)+'%';
}
function attachHandleDrag(handle, corner){
  handle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const editingId = state.draft.editingId;
    const fixed = {
      x: corner.includes('w') ? state.draft.x+state.draft.w : state.draft.x,
      y: corner.includes('n') ? state.draft.y+state.draft.h : state.draft.y
    };
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const nx=Math.min(p.x,fixed.x), fx=Math.max(p.x,fixed.x);
      const ny=Math.min(p.y,fixed.y), fy=Math.max(p.y,fixed.y);
      state.draft = { x:nx, y:ny, w:Math.max(0.02,fx-nx), h:Math.max(0.02,fy-ny), editingId };
      positionDraftBox();
    };
    const onUp = ()=>{
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
}
function attachBoxMove(box){
  box.addEventListener('pointerdown', (e)=>{
    if(e.target!==box) return;
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    const start = normFromEvent(e);
    const orig = Object.assign({}, state.draft);
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const dx=p.x-start.x, dy=p.y-start.y;
      state.draft = {
        x: Math.min(Math.max(0, orig.x+dx), 1-orig.w),
        y: Math.min(Math.max(0, orig.y+dy), 1-orig.h),
        w: orig.w, h: orig.h, editingId: orig.editingId
      };
      positionDraftBox();
    };
    const onUp = ()=>{
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      box.removeEventListener('pointercancel', onUp);
    };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
    box.addEventListener('pointercancel', onUp);
  });
}

const MODEL_INPUT_SIZE = 1024;
let yoloSessionPromise = null;
let yoloModelBuffer = null;

// Release no GitHub (arquivo ~50 MB — não cabe no repo normal)
const YOLO_MODEL_URLS = [
  'https://github.com/SrM0us3/HQ_Audio/releases/download/v1/comic-speech-bubble-detector.onnx',
];
const YOLO_MODEL_SHA256 = '36b452f54f341fc8cc99b45717c4df76da45fadba60da89e4536895433c7d96a';

function pickModelFile(){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    toast('Selecione comic-speech-bubble-detector.onnx no seu PC…', 4000);
