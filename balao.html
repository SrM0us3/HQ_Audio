    };
    const PUB_ICONS = { 'Marvel': '🦸', 'DC': '🦇', 'Outras': '📚' };
    pubs.forEach(pub => {
      const pname = pub.name || 'Editora';
      addCard(pname,
        (pub.seriesCount || (pub.series||[]).length) + ' séries · ' + (pub.sagaCount || (pub.sagas||[]).length) + ' sagas',
        () => {
          state.catalogNav = { level: 'series', pub: pub, series: null, saga: null, mode: 'series' };
          renderJsonCatalog();
        },
        PUB_ICONS[pname] || '🏢',
        null,
        PUB_STYLES[pname] || { bg: '#1a1c22', text: (pname||'HQ').slice(0,8).toUpperCase(), color: '#f2f2f2' });
    });
    return;
  }

  let pub = nav.pub;
  if(!pub){ state.catalogNav.level = 'publishers'; renderJsonCatalog(); return; }

  // --- series or sagas list ---
  if(nav.level === 'series' || nav.level === 'sagas'){
    const tog = document.createElement('div');
    tog.style.cssText = 'grid-column:1/-1;display:flex;gap:8px;margin-bottom:4px;';
    [['series','Séries'],['sagas','Sagas'],['collections','Coleções']].forEach(([mode, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      const on = (nav.mode === mode) || (nav.level === mode);
      b.style.cssText = 'flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;font-family:inherit;cursor:pointer;' +
        (on ? 'background:var(--accent);color:#fff;' : 'background:var(--panel-2);color:var(--text);border:1px solid var(--border);');
      b.onclick = () => {
        state.catalogNav = { level: mode, pub: pub, series: null, saga: null, collection: null, mode: mode };
        renderJsonCatalog();
      };
      tog.appendChild(b);
    });
    grid.appendChild(tog);

    // --- COLEÇÕES ---
    if(nav.mode === 'collections' || nav.level === 'collections'){
      try{ if(state.jsonCatalog) catalogRebuildSagas(state.jsonCatalog); }catch(_){}
      if(state.catalogNav && state.catalogNav.pub && state.jsonCatalog){
        const fresh = (state.jsonCatalog.publishers||[]).find(x => x.name === state.catalogNav.pub.name);
        if(fresh){ state.catalogNav.pub = fresh; pub = fresh; }
      }
      let cols = pub.collections || [];
      if(q) cols = cols.filter(s => (s.name||'').toLowerCase().indexOf(q)>=0);
      if(countEl) countEl.textContent = cols.length + ' coleções';
      if(!cols.length){
        const empty = document.createElement('div');
        empty.style.cssText = 'grid-column:1/-1;padding:12px;color:var(--text-dim);';
        empty.textContent = 'Nenhuma coleção detectada. Use series_group/tags “coleção: Nome” ou nomes como Salvat / Edição Definitiva.';
        grid.appendChild(empty);
        return;
      }
      cols = catalogSortByFirstDate(cols, 'name');
      cols.forEach(cg => {
        const first = catalogFirstBook(cg.books || [], 'Number');
        const cover = catalogCoverSrc(first);
        const d = catalogItemSortDate(cg);
        const y = (d < 99999999) ? (' · ' + Math.floor(d/10000)) : (first && first.year ? (' · ' + first.year) : '');
        addCard(cg.name, (cg.count||(cg.books||[]).length) + ' vols' + y, () => {
          state.catalogNav = { level: 'collectionBooks', pub: pub, collection: cg, mode: 'collections', order: 'Number' };
          renderJsonCatalog();
        }, '📦', cover);
      });
      return;
    }

    if(nav.mode === 'sagas' || nav.level === 'sagas'){
      try{ if(state.jsonCatalog) catalogRebuildSagas(state.jsonCatalog); }catch(_){}
      if(state.catalogNav && state.catalogNav.pub && state.jsonCatalog){
        const fresh = (state.jsonCatalog.publishers||[]).find(x => x.name === state.catalogNav.pub.name);
        if(fresh){ state.catalogNav.pub = fresh; pub = fresh; }
      }
      let sagas = pub.sagas || [];
      if(q) sagas = sagas.filter(s => (s.name||'').toLowerCase().indexOf(q)>=0);
      if(countEl) countEl.textContent = sagas.length + ' sagas';
      if(!sagas.length){
        const empty = document.createElement('div');
        empty.style.cssText = 'grid-column:1/-1;padding:12px;color:var(--text-dim);';
        empty.textContent = 'Nenhuma saga (SeriesGroup) nos metadados desta editora.';
        grid.appendChild(empty);
        return;
      }
      // ordem: data da 1ª edição do evento, depois nome
      sagas = catalogSortByFirstDate(sagas, 'name');
      sagas.forEach(sg => {
        const first = catalogFirstBook(sg.books || [], 'AlternateNumber');
        const cover = catalogCoverSrc(first);
        const d = catalogItemSortDate(sg);
        const y = (d < 99999999) ? (' · ' + Math.floor(d/10000)) : (first && first.year ? (' · ' + first.year) : '');
        // contagem: se há ordem CBRO, usa issues; senão livros únicos
        let nShow = sg.count || (sg.books||[]).length || 0;
        try{
          const k = normSagaName(sg.name||'');
          const ord = state.sagaOrders && state.sagaOrders[k];
          if(ord && Array.isArray(ord.issues) && ord.issues.length){
            nShow = ord.issues.length;
          } else if(sg.books && sg.books.length){
            const seen = new Set();
            sg.books.forEach(b => {
              if(!b) return;
              const kk = (normSeriesKey(b.series||'')||'') + '|' + catalogNormNum(b.number);
              seen.add(kk);
            });
            nShow = seen.size || sg.books.length;
          }
        }catch(_){}
        addCard(sg.name, nShow + ' eds' + y, () => {
          state.catalogNav = { level: 'sagaBooks', pub: pub, saga: sg, mode: 'saga', order: 'AlternateNumber' };
          renderJsonCatalog();
        }, '📖', cover);
      });
      return;
    }

    // SERIES list — highlight arcs in subtitle
    let series = pub.series || [];
    if(q){
      series = series.filter(s => {
        if((s.name||'').toLowerCase().indexOf(q)>=0) return true;
        if((s.arcs||[]).some(a => (a.name||'').toLowerCase().indexOf(q)>=0)) return true;
        return (s.books||[]).some(b => ((b.title||'')+' '+(b.filename||'')).toLowerCase().indexOf(q)>=0);
      });
    }
    if(countEl) countEl.textContent = series.length + ' séries';
    // ordem: data da 1ª edição, depois nome
    series = catalogSortByFirstDate(series, 'name');
    series.forEach(s => {
      const arcs = s.arcs || [];
      let sub = (s.count||0) + ' vols';
      const first = catalogFirstBook(s.books || [], 'Number');
      const d = catalogItemSortDate(s);
      if(d < 99999999) sub += ' · desde ' + Math.floor(d/10000);
      else if(first && first.year) sub += ' · desde ' + first.year;
      if(arcs.length) sub += ' · ' + arcs.length + ' arco(s)';
      const cover = catalogCoverSrc(first);
      addCard(s.name, sub, () => {
        state.catalogNav = { level: 'books', pub: pub, series: s, mode: 'series', order: 'Number' };
        renderJsonCatalog();
      }, '📚', cover);
    });
    return;
  }

  // --- books of a series: Volume (caixa) → arcos (caixa) → edições ---
  if(nav.level === 'books' && nav.mode === 'series' && nav.series){
    const s = nav.series;
    if(countEl) countEl.textContent = (s.count||0) + ' vols' + ((s.arcs||[]).length ? (' · ' + (s.arcs||[]).length + ' arcos') : '');

    const bulkBar = document.createElement('div');
    bulkBar.style.cssText = 'grid-column:1/-1;display:flex;gap:8px;margin-bottom:8px;';
    const bulkBtn = document.createElement('button');
    bulkBtn.type = 'button';
    bulkBtn.textContent = '✎ Editar em lote';
    bulkBtn.style.cssText = 'flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;';
    bulkBtn.onclick = () => catalogShowBulkEdit(s.books || [], s.name || 'Série');
    bulkBar.appendChild(bulkBtn);
    grid.appendChild(bulkBar);

    const host = document.createElement('div');
    host.style.cssText = 'grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-bottom:24px;';

    const makeBookRow = (b) => {
      const row = document.createElement('div');
      row.className = 'catalog-book-row';
      const sagaName = String(b.series_group || b.seriesGroup || '').trim();
      if(sagaName) row.classList.add('in-saga');
      const num = b.number || b.alternate_number || '';
      const cover = document.createElement('div');
      cover.className = 'catalog-book-cover';
      cover.textContent = num ? String(num) : 'HQ';
      if(b.thumb) catalogLoadThumb(b.thumb, cover, num);
      const body = document.createElement('div');
      body.className = 'catalog-book-body';
      const line1 = document.createElement('div');
      line1.className = 'catalog-book-line1';
      line1.textContent = catalogFormatLine1(b, { insideSeries: true });
      const line2 = document.createElement('div');
      line2.className = 'catalog-book-line2';
      line2.textContent = catalogFormatLine2(b, { hideArc: true });
      body.appendChild(line1);
      body.appendChild(line2);
      const prog = catalogGetProgressForBook(b);
      const st = catalogReadingStatus(b, prog);
      if(st === 'reading') row.classList.add('is-reading');
      if(st === 'read') row.classList.add('is-read');
      if(st !== 'unread'){
        const rb = document.createElement('div');
        rb.className = 'catalog-read-badge ' + st;
        rb.textContent = catalogProgressLabel(b, prog, st);
        body.appendChild(rb);
      }
      if(sagaName){
        const badge = document.createElement('div');
        badge.className = 'catalog-saga-badge';
        badge.textContent = 'SAGA · ' + sagaName;
        badge.title = 'Também faz parte da saga/evento: ' + sagaName;
        body.appendChild(badge);
      }
      row.appendChild(cover);
      row.appendChild(body);
      row.style.cursor = 'pointer';
      row.onclick = () => catalogOpenBookDetail(b, 'Number');
      return row;
    };

    const arcKey = (b) => String(b.story_arc || '').trim();
    const volKey = (b) => String(b.volume || '').trim();
    const ordered = catalogSortBooks(s.books || [], 'Number');

    // grupos por volume (ordem já Volume→Number)
    const volGroups = [];
    ordered.forEach(b => {
      const vk = volKey(b);
      const last = volGroups[volGroups.length - 1];
      if(last && last.vol === vk) last.books.push(b);
      else volGroups.push({ vol: vk, books: [b] });
    });
    const multiVol = volGroups.length > 1 || volGroups.some(g => g.vol);

    volGroups.forEach(vg => {
      // caixa do volume (sempre se multiVol; se 1 volume sem número, pode omitir cabeçalho extra)
      const volBox = document.createElement('div');
      volBox.className = 'catalog-arc-group';
      volBox.style.background = 'linear-gradient(180deg, rgba(80,160,120,.12), rgba(80,160,120,.03))';
      volBox.style.borderColor = 'rgba(80,160,120,.45)';
      volBox.style.gap = '10px';

async function driveEnsureThumbsFolder(){
  if(state.driveThumbsFolderId) return state.driveThumbsFolderId;

    const saved = await storeGet('drive-thumbs-folder');
    if(saved && saved.id){
      state.driveThumbsFolderId = saved.id;
      return state.driveThumbsFolderId;
    }
  }catch(_){}
  const parent = await driveEnsureFolder();
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='thumbs' and '" + parent + "' in parents and trashed=false");
  const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'erro pasta thumbs');
  if(data.files && data.files.length){
    state.driveThumbsFolderId = data.files[0].id;
    try{ await storeSet('drive-thumbs-folder', { id: state.driveThumbsFolderId }); }catch(_){}
    return state.driveThumbsFolderId;
  }
  const cr = await driveFetch('/drive/v3/files?fields=id,name', {
    method: 'POST',

    body: JSON.stringify({
      name: 'thumbs',

    })
  });
  const created = await cr.json();

  state.driveThumbsFolderId = created.id;
  try{ await storeSet('drive-thumbs-folder', { id: state.driveThumbsFolderId }); }catch(_){}
  return state.driveThumbsFolderId;
}

/** Upload multipart com Blob (melhor no navegador; evita CORS do resumable) */
async function driveUploadSimpleFile(folderId, fileName, blob, mime){
  mime = mime || 'image/jpeg';
  if(!blob || !(blob.size > 0)) throw new Error('arquivo vazio: ' + fileName);

  const q = encodeURIComponent("name='" + fileName.replace(/'/g, "\\'") + "' and '" + folderId + "' in parents and trashed=false");
  const listRes = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id)&pageSize=3');
  const list = await listRes.json();
  if(!listRes.ok) throw new Error((list.error && list.error.message) || 'listar');
  const existing = list.files && list.files[0];

  const metadata = existing
    ? { name: fileName, mimeType: mime }
    : { name: fileName, mimeType: mime, parents: [folderId] };

  const boundary = 'balao_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  const metaStr = JSON.stringify(metadata);
  const body = new Blob([
    '--' + boundary + '\r\n' +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    metaStr + '\r\n' +
    '--' + boundary + '\r\n' +
    'Content-Type: ' + mime + '\r\n\r\n',
    blob,
    '\r\n--' + boundary + '--'
  ], { type: 'multipart/related; boundary=' + boundary });

  const url = existing
    ? ('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart&fields=id,name,size')
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size';
  const up = await fetch(url, {
    method: existing ? 'PATCH' : 'POST',
    headers: { 'Authorization': 'Bearer ' + state.drive.token },
    body: body
  });
  let created = null;
  try{ created = await up.json(); }catch(_){}
  if(!up.ok){
    const msg = (created && created.error && created.error.message) || ('upload HTTP ' + up.status + ' ' + fileName);
    throw new Error(msg);
  }
  if(!created || !created.id) throw new Error('upload sem id: ' + fileName);
  return created;
}

async function driveCountThumbsInFolder(folderId){
  if(!folderId) return -1;
  let total = 0, pageToken = null;
  do {
    let url = '/drive/v3/files?q=' + encodeURIComponent("'" + folderId + "' in parents and trashed=false")
      + '&fields=nextPageToken,files(id)&pageSize=1000';
    if(pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
    const res = await driveFetch(url);
    const data = await res.json();
    if(!res.ok) return total || -1;
    total += (data.files && data.files.length) || 0;
    pageToken = data.nextPageToken || null;
  } while(pageToken);
  return total;
}

function idbOpenThumbs(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('balao-thumbs', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutThumb(name, blob){
  try{
    const db = await idbOpenThumbs();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('thumbs', 'readwrite');
      tx.objectStore('thumbs').put(blob, name);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn('idb put thumb', name, e); }
}
async function idbGetThumb(name){
  try{
    const db = await idbOpenThumbs();
    const blob = await new Promise((resolve, reject)=>{
      const tx = db.transaction('thumbs', 'readonly');
      const r = tx.objectStore('thumbs').get(name);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    return blob || null;
  }catch(e){ return null; }
}

async function catalogUploadThumbs(fileList){
  const files = Array.from(fileList || []);
  if(!files.length){
    toast('Nenhuma imagem selecionada', 2500);
    return false;
  }
  const driveOk = !!(state.drive && state.drive.token);
  if(!driveOk){
    toast('Google desconectado: vou guardar as capas só neste aparelho', 4500);
  }
  // aviso ao sair no meio
  const onLeave = (e) => { e.preventDefault(); e.returnValue = 'Upload de capas em andamento…'; };
  try{
    window.addEventListener('beforeunload', onLeave);
    catalogXferShow('Preparando thumbs…', files.length + ' arquivo(s)', 0, 1);
    let folderId = null;
    if(driveOk){
      try{ folderId = await driveEnsureThumbsFolder(); }
      catch(e){
        toast('Não criou pasta no Drive: ' + (e.message||e), 7000);
      }
    }
    // Expande zip
    const toUpload = [];
    for(let fi = 0; fi < files.length; fi++){
      const f = files[fi];
      const name = (f.name || '').toLowerCase();
      catalogXferShow('Lendo arquivos…', f.name || '', fi, files.length);
      if(name.endsWith('.zip')){
        const zip = await JSZip.loadAsync(f);
        const entries = Object.keys(zip.files).filter(n => {
          const base = n.split('/').pop().toLowerCase();
          return !zip.files[n].dir && /\.(jpe?g|png|webp)$/i.test(base);
        });
        for(const entry of entries){
          const base = entry.split('/').pop();
          const blob = await zip.files[entry].async('blob');
          const mime = base.toLowerCase().endsWith('.png') ? 'image/png'
            : base.toLowerCase().endsWith('.webp') ? 'image/webp' : 'image/jpeg';
          toUpload.push({ name: base, blob, mime });
        }
      } else {
        const base = (f.name || 'thumb.jpg').split(/[/\\]/).pop();
        const mime = f.type || (base.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg');
        toUpload.push({ name: base, blob: f, mime });
      }
    }
    if(!toUpload.length){
      catalogXferHide();
      toast('Nenhuma imagem encontrada', 3500);
      return false;
    }
    // já existentes no Drive → pular (retomada)
    let already = Object.create(null);
    if(folderId){
      catalogXferShow('Conferindo o que já está no Drive…', '', 0, 1);
      try{
        await catalogBuildThumbsIndex(true);
        already = state._thumbsIndex || already;
      }catch(_){}
    }
    // progresso persistente
    const progKey = 'thumbs-upload-progress';
    let ok = 0, fail = 0, skip = 0;
    const total = toUpload.length;
    const failedNames = [];
    for(let i = 0; i < total; i++){
      const item = toUpload[i];
      catalogXferShow(
        'Enviando capas ' + (i+1) + '/' + total,
        item.name + (skip ? (' · ' + skip + ' já no Drive') : ''),
        i, total
      );
      // local sempre
      try{
        await idbPutThumb(item.name, item.blob);
        const url = URL.createObjectURL(item.blob);
        state.catalogThumbCache['thumbs/' + item.name] = url;
        state.catalogThumbCache[item.name] = url;
      }catch(_){}
      if(!folderId){ ok++; continue; }
      // já no Drive?
      const exists = catalogThumbLookupId(already, item.name);
      if(exists){ skip++; ok++; continue; }
      // upload com 1 retry
      let uploaded = false;
      for(let attempt = 0; attempt < 2 && !uploaded; attempt++){
        try{
          await driveUploadSimpleFile(folderId, item.name, item.blob, item.mime);
          uploaded = true;
          ok++;
          // marca no índice local
          already[item.name] = true;
          already[item.name.toLowerCase()] = true;
        }catch(e){
          console.warn('thumb upload', item.name, attempt, e);
          if(attempt === 1){
            fail++;
            failedNames.push(item.name);
            window._lastThumbErr = (e && e.message) ? e.message : String(e);
          } else {
            await new Promise(r => setTimeout(r, 800));
          }
        }
      }
      // salva checkpoint a cada 25
      if(i % 25 === 0){
        try{ await storeSet(progKey, { at: i, total, ok, fail, skip, t: Date.now() }); }catch(_){}
      }
    }
    let inFolder = -1;
    try{
      await catalogBuildThumbsIndex(true);
      inFolder = state._thumbsIndexCount || -1;
    }catch(_){}
    const summary = ok + ' ok · ' + skip + ' já existiam · ' + fail + ' falha(s)' +
      (inFolder >= 0 ? (' · pasta: ' + inFolder + ' arquivo(s)') : '');
    catalogXferShow(fail ? 'Envio terminou com falhas' : 'Envio concluído', summary, total, total);
    toast('Thumbs: ' + summary, 8000);
    if(fail){
      toast('Último erro: ' + (window._lastThumbErr || '?') + ' — rode de novo; as que já subiram serão puladas', 9000);
      console.warn('falhas thumbs', failedNames.slice(0, 30));
    }
    try{ await storeSet(progKey, null); }catch(_){}
    catalogXferHide(5000);
    if(state.screen === 'catalog') renderJsonCatalog();
    return ok > 0;
  }catch(e){
    console.error(e);
    catalogXferHide();
    toast('Thumbs: ' + (e.message || e) + ' — pode tentar de novo; o envio retoma o que faltou', 8000);
    return false;
  }finally{
    window.removeEventListener('beforeunload', onLeave);
  }
}

/* Fila de thumbs: 1 no celular / 2 no desktop; cancela ao sair da tela */
state._thumbQ = state._thumbQ || [];
state._thumbActive = state._thumbActive || 0;
state._thumbMax = (typeof window !== 'undefined' && window.innerWidth < 900) ? 2 : 3;
state._thumbGen = state._thumbGen || 0;
function catalogThumbCancelAll(){
  state._thumbGen = (state._thumbGen || 0) + 1;
  state._thumbQ = [];
  // active jobs terminam sozinhas e checam gen
}
function catalogThumbEnqueue(fn){
  const gen = state._thumbGen;
  return new Promise((resolve, reject) => {
    if(gen !== state._thumbGen){ resolve(null); return; }
    state._thumbQ.push({ fn, resolve, reject, gen });
    catalogThumbPump();
  });
}
function catalogThumbPump(){
  const max = state._thumbMax || 1;
  while(state._thumbActive < max && state._thumbQ.length){
    const job = state._thumbQ.shift();
    if(job.gen !== state._thumbGen){ job.resolve(null); continue; }
    state._thumbActive++;
    Promise.resolve()
      .then(() => job.fn())
      .then(job.resolve, job.reject)
      .finally(() => {
        state._thumbActive--;
        catalogThumbPump();
      });
  }
}
/* Só baixa quando a capa fica visível na tela */
state._thumbObserver = state._thumbObserver || null;
function catalogObserveThumb(coverEl, startLoad){
  if(!coverEl || typeof startLoad !== 'function') return;
  if(typeof IntersectionObserver === 'undefined'){
    startLoad();
    return;
  }
  if(!state._thumbObserver){
    state._thumbObserver = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if(!en.isIntersecting) return;
        const el = en.target;
        try{ state._thumbObserver.unobserve(el); }catch(_){}
        if(typeof el._thumbStart === 'function'){
          const fn = el._thumbStart;
          el._thumbStart = null;
          fn();
        }
      });
    }, { root: null, rootMargin: '400px 0px', threshold: 0.01 });
  }
  coverEl._thumbStart = startLoad;
  state._thumbObserver.observe(coverEl);
  // se já está (quase) visível, dispara logo
  try{
    const r = coverEl.getBoundingClientRect();
    if(r.top < window.innerHeight + 400 && r.bottom > -200){
      // leave to observer; also schedule microtask fallback
      setTimeout(() => {
        if(coverEl._thumbStart){
          const fn = coverEl._thumbStart;
          coverEl._thumbStart = null;
          try{ state._thumbObserver.unobserve(coverEl); }catch(_){}
          fn();
        }
      }, 50);
    }
  }catch(_){}
}

/** Índice nome→id dos arquivos na pasta thumbs do Drive (cache ~2 min) */
async function catalogBuildThumbsIndex(force){
  if(!force && state._thumbsIndex && state._thumbsIndexAt && (Date.now() - state._thumbsIndexAt) < 120000){
    return state._thumbsIndex;
  }
  const map = Object.create(null);
  if(!state.drive || !state.drive.token){
    state._thumbsIndex = map;
    state._thumbsIndexCount = 0;
    return map;
  }
  const thumbsId = await driveEnsureThumbsFolder();
  let pageToken = null;
  let count = 0;
  do {
    let url = '/drive/v3/files?q=' + encodeURIComponent("'" + thumbsId + "' in parents and trashed=false")
      + '&fields=nextPageToken,files(id,name)&pageSize=1000';
    if(pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
    const res = await driveFetch(url);
    const data = await res.json();
    if(!res.ok){
      console.warn('thumbs index', data);
      break;
    }
    (data.files || []).forEach(f => {
      if(!f || !f.name || !f.id) return;
      count++;
      const name = f.name;
      const lower = name.toLowerCase();
      map[name] = f.id;
      map[lower] = f.id;
      const stem = lower.replace(/\.[a-z0-9]+$/i, '');
      map[stem] = f.id;
      map[stem + '.jpg'] = f.id;
      map[stem + '.jpeg'] = f.id;
      map[stem + '.png'] = f.id;
      map[stem + '.webp'] = f.id;
      // chave normalizada (sem acento/pontuação)
      const norm = stem.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');
      if(norm) map['~' + norm] = f.id;
    });
    pageToken = data.nextPageToken || null;
  } while(pageToken);
  state._thumbsIndex = map;
  state._thumbsIndexAt = Date.now();
  state._thumbsIndexCount = count;
  console.log('[thumbs] index:', count, 'arquivos na pasta Drive');
  return map;
}

function catalogThumbLookupId(index, baseName){
  if(!index || !baseName) return null;
  if(index[baseName]) return index[baseName];
  const lower = baseName.toLowerCase();
  if(index[lower]) return index[lower];
  const stem = lower.replace(/\.[a-z0-9]+$/i, '');
  if(index[stem]) return index[stem];
  if(index[stem + '.jpg']) return index[stem + '.jpg'];
  const norm = stem.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');
  if(norm && index['~' + norm]) return index['~' + norm];
  return null;
}

/** Baixa 1 thumb do Drive → IDB (sem precisar do elemento na tela) */
async function catalogFetchOneThumb(thumbPath, index){
  if(!thumbPath) return false;
  const baseName = String(thumbPath).split('/').pop();
  if(!baseName) return false;
  if(state.catalogThumbCache[thumbPath] || state.catalogThumbCache[baseName]) return true;
  try{
    const local = await idbGetThumb(baseName);
    if(local){
      const url = URL.createObjectURL(local);
      state.catalogThumbCache[thumbPath] = url;
      state.catalogThumbCache[baseName] = url;
      return true;
    }
  }catch(_){}
  if(!state.drive || !state.drive.token) return false;
  return catalogThumbEnqueue(async () => {
    if(state.catalogThumbCache[baseName]) return true;
    let idx = index || state._thumbsIndex;
    if(!idx) idx = await catalogBuildThumbsIndex();
    let fileId = catalogThumbLookupId(idx, baseName);
    // fallback: busca direta por nome
    if(!fileId){
      try{
        const thumbsId = await driveEnsureThumbsFolder();
        const q1 = encodeURIComponent("name='" + baseName.replace(/'/g, "\\'") + "' and '" + thumbsId + "' in parents and trashed=false");
        const r1 = await driveFetch('/drive/v3/files?q=' + q1 + '&fields=files(id,name)&pageSize=5');
        const d1 = await r1.json();
        if(r1.ok && d1.files && d1.files[0]) fileId = d1.files[0].id;
      }catch(_){}
    }
    if(!fileId) return false;
    const dl = await driveFetch('/drive/v3/files/' + fileId + '?alt=media');
    if(!dl.ok) return false;
    const blob = await dl.blob();
    try{ await idbPutThumb(baseName, blob); }catch(_){}
    const url = URL.createObjectURL(blob);
    state.catalogThumbCache[thumbPath] = url;
    state.catalogThumbCache[baseName] = url;
    return true;
  });
}

async function catalogDownloadCoversForBooks(list, btn){
  const books = (list || []).filter(b => b && b.thumb);
  if(!books.length){
    toast('Nenhuma capa cadastrada nesta lista', 2500);
    return;
  }
  if(!state.drive || !state.drive.token){
    toast('Entre no Google Drive para baixar capas', 3500);
    return;
  }
  if(state._coverDlBusy){
    toast('Já há um download de capas em andamento…', 2500);
    return;
  }
  state._coverDlBusy = true;
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  const total = books.length;
  let done = 0, ok = 0, fail = 0;
  catalogXferShow('Indexando pasta thumbs…', 'Drive', 0, total);
  try{
    const index = await catalogBuildThumbsIndex(true);
    const inDrive = state._thumbsIndexCount || 0;
    if(inDrive === 0){
      catalogXferHide();
      toast('Pasta thumbs no Drive está vazia (para este app). Envie as capas em ⚙ → Enviar thumbs ao Drive.', 6000);
      return;
    }
    catalogXferShow('Baixando capas', '0 / ' + total + ' · ' + inDrive + ' no Drive', 0, total);
    // amostra de diagnóstico no console
    try{
      const sample = books.slice(0, 3).map(b => String(b.thumb).split('/').pop());
      console.log('[thumbs] procurando ex:', sample, 'achou?', sample.map(n => !!catalogThumbLookupId(index, n)));
    }catch(_){}
    for(const b of books){
      try{
        const got = await catalogFetchOneThumb(b.thumb, index);
        if(got) ok++; else fail++;
      }catch(_){ fail++; }
      done++;
      catalogXferShow('Baixando capas', done + ' / ' + total + ' · ok ' + ok + (fail ? (' · falha ' + fail) : ''), done, total);
    }
    catalogXferShow('Capas prontas', ok + ' ok' + (fail ? (' · ' + fail + ' sem arquivo') : ''), total, total);
    catalogXferHide(1500);
    let msg = 'Capas: ' + ok + ' salvas neste aparelho';
    if(fail){
      msg += ' · ' + fail + ' não encontradas';
      if(ok === 0) msg += ' (Drive tem ' + inDrive + ' arquivos — nomes podem não bater com o JSON. Reenvie thumbs pelo app ⚙)';
    }
    toast(msg, ok === 0 ? 7000 : 4000);
    try{ renderJsonCatalog(); }catch(_){}
  }catch(e){
    console.error(e);
    catalogXferHide();
    toast('Erro ao baixar capas: ' + (e.message||e), 5000);
  }finally{
    state._coverDlBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = '⬇ Capas'; }
  }
}

async function catalogLoadThumb(thumbPath, coverEl, fallbackNum, onDone){
  if(!thumbPath || !coverEl) return;
  const baseName = String(thumbPath).split('/').pop();
  const finish = () => { if(typeof onDone === 'function') try{ onDone(baseName || thumbPath); }catch(_){} };
  const applyBlob = (blob) => {
    if(!blob || !coverEl.isConnected) return false;
    const url = URL.createObjectURL(blob);
    state.catalogThumbCache[thumbPath] = url;
    state.catalogThumbCache[baseName] = url;
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.src = url;
    coverEl.textContent = '';
    coverEl.appendChild(img);
    return true;
  };
  // já em memória?
  if(state.catalogThumbCache[thumbPath] || state.catalogThumbCache[baseName]){
    const img = document.createElement('img');
    img.alt = '';
    img.src = state.catalogThumbCache[thumbPath] || state.catalogThumbCache[baseName];
    coverEl.textContent = '';
    coverEl.appendChild(img);
    finish();
    return;
  }
  // só inicia download quando visível
  catalogObserveThumb(coverEl, async () => {
    try{
      const local = await idbGetThumb(baseName);
      if(local && applyBlob(local)){ finish(); return; }
      if(!state.drive || !state.drive.token || !baseName){ finish(); return; }
      const gen = state._thumbGen;
      await catalogThumbEnqueue(async () => {
        if(gen !== state._thumbGen) return;
        if(state.catalogThumbCache[baseName]){
          if(coverEl.isConnected) applyBlob(null) || (function(){
            const img = document.createElement('img');
            img.src = state.catalogThumbCache[baseName];
            coverEl.textContent = '';
            coverEl.appendChild(img);
          })();
          return;
        }
        let fileId = null;
        try{
          const thumbsId = await driveEnsureThumbsFolder();
          const q1 = encodeURIComponent("name='" + baseName.replace(/'/g, "\\'") + "' and '" + thumbsId + "' in parents and trashed=false");
          const r1 = await driveFetch('/drive/v3/files?q=' + q1 + '&fields=files(id)&pageSize=2');
          const d1 = await r1.json();
          if(r1.ok && d1.files && d1.files[0]) fileId = d1.files[0].id;
        }catch(_){}
        if(!fileId){
          try{
            const q = encodeURIComponent("name='" + baseName.replace(/'/g, "\\'") + "' and trashed=false");
            const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=3');
            const data = await res.json();
            if(res.ok && data.files && data.files[0]) fileId = data.files[0].id;
          }catch(_){}
        }
        if(!fileId || gen !== state._thumbGen) return;
        const dl = await driveFetch('/drive/v3/files/' + fileId + '?alt=media');
        if(!dl.ok || gen !== state._thumbGen) return;
        const blob = await dl.blob();
        try{ await idbPutThumb(baseName, blob); }catch(_){}
        if(coverEl.isConnected) applyBlob(blob);
      });
      finish();
    }catch(e){
      console.warn('thumb', thumbPath, e);
      if(coverEl && fallbackNum != null && fallbackNum !== '') coverEl.textContent = String(fallbackNum);
      finish();
    }
  });
}

async function catalogImportFile(file){

  if(!data.series || !Array.isArray(data.series)){

  await catalogSaveLocal(data);
  state.catalogNav = { level: 'publishers', pub: null, series: null, saga: null, mode: 'series' };

    }catch(e){ console.warn('auto push catalog', e); }

async function catalogPullFromDrive(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  if(!state.drive || !state.drive.token){
    if(!silent) toast('Entre no Google Drive primeiro (aba Biblioteca)', 4000);
    return false;
  }
  try{
    if(!silent) toastProgress('Buscando catalogo.json no Drive…');
    const folderId = await driveEnsureFolder();
    const q = encodeURIComponent("name='catalogo.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&pageSize=10');
    const data = await res.json();
    if(!res.ok) throw new Error((data.error && data.error.message) || 'erro Drive');
    const f = data.files && data.files[0];
    if(!f){
      if(!silent){
        toast('Nenhum catalogo.json visível no Drive do app. O Google só permite ver arquivos enviados pelo próprio Balão — importe o JSON e toque em “Enviar ao Drive” (não basta subir manualmente pela web).', 8000);
      }
      return false;
    }
    const prevMeta = await storeGet('catalogo-json-meta');
    const local = state.jsonCatalog || (await catalogLoadLocal());
    if(local && prevMeta && prevMeta.modifiedTime === f.modifiedTime && prevMeta.id === f.id){
      state.jsonCatalog = local;
      if(!silent) toast('Catálogo já sincronizado', 2000);
      return true;
    }
    const dl = await driveFetch('/drive/v3/files/' + f.id + '?alt=media');
    if(!dl.ok) throw new Error('Falha ao baixar catalogo.json');
    const json = await dl.json();
    if(!json.series && !json.publishers) throw new Error('JSON inválido');
    await storeSet('catalogo-json-meta', { id: f.id, modifiedTime: f.modifiedTime, name: f.name });
    await catalogSaveLocal(json);
    try{ await catalogPullOverridesFromDrive({ silent: true }); }catch(_){}
    try{ await catalogApplyOverrides(state.jsonCatalog || json); }catch(_){}
    state.catalogNav = { level: 'publishers', pub: null, series: null, saga: null, mode: 'series' };
    if(state.screen === 'catalog') renderJsonCatalog();
    if(!silent) toast('Catálogo do Drive atualizado ✓', 3000);
    return true;
  }catch(e){
    console.error(e);
    if(!silent) toast('Drive: ' + (e.message || e), 5000);
    return false;
  }
}

async function catalogPushToDrive(){
  if(!state.jsonCatalog){
    toast('Importe um catalogo.json antes', 3000);
    return false;
  }
  if(!state.drive || !state.drive.token){
    toast('Entre no Google Drive primeiro', 4000);
    return false;
  }
  try{
    toastProgress('Enviando catalogo.json ao Drive…');
    const folderId = await driveEnsureFolder();
    const content = JSON.stringify(state.jsonCatalog);
    const q = encodeURIComponent("name='catalogo.json' and '" + folderId + "' in parents and trashed=false");
    const res = await driveFetch('/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5');
    const list = await res.json();
    if(!res.ok) throw new Error((list.error && list.error.message) || 'erro listar');
    const existing = list.files && list.files[0];

    const meta = { name: 'catalogo.json', mimeType: 'application/json' };
    if(!existing) meta.parents = [folderId];
    const boundary = 'balao_boundary_' + Date.now();
    const metaPart = JSON.stringify(meta);
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      metaPart + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      content + '\r\n' +
      '--' + boundary + '--';

    const url = existing
      ? ('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart&fields=id,name,modifiedTime')
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime';
    const up = await fetch(url, {
      method: existing ? 'PATCH' : 'POST',
      headers: {
        'Authorization': 'Bearer ' + state.drive.token,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    });
    const created = await up.json();
    if(!up.ok) throw new Error((created.error && created.error.message) || 'upload falhou');
    await storeSet('catalogo-json-meta', { id: created.id, modifiedTime: created.modifiedTime, name: created.name });
    toast('catalogo.json no Drive ✓', 3500);
    return true;
  }catch(e){
    console.error(e);
    toast('Upload: ' + (e.message || e), 5000);
    return false;
  }
}

async function catalogAutoSync(){
  try{
    if(!state.jsonCatalog) await catalogLoadLocal();
    if(state.jsonCatalog && state.screen === 'catalog') renderJsonCatalog();
    if(!state.drive || !state.drive.token) return;
    await catalogPullFromDrive({ silent: true });
    await catalogPullOverridesFromDrive({ silent: true });
    if(state.jsonCatalog){
      await catalogApplyOverrides(state.jsonCatalog);
      if(state.screen === 'catalog') renderJsonCatalog();
    }
  }catch(e){ console.warn('catalog auto sync', e); }
}

function komgaAuthHeaders(){
  const h = { 'Accept': 'application/json' };
  if(state.komga.key){
    h['X-API-Key'] = state.komga.key;
  } else if(state.komga.user){
    h['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(state.komga.user + ':' + (state.komga.pass||''))));
  }
  return h;
}

async function komgaFetch(path, options){
  if(!state.komga.url) throw new Error('Informe a URL do Komga');
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, komgaAuthHeaders(), opts.headers || {});
  // credentials omit: Basic/API key no header (evita cookie cross-site)
  opts.credentials = 'omit';
  const res = await fetch(state.komga.url + path, opts);
  if(res.status === 401) throw new Error('Não autorizado — confira usuário/senha ou API Key');
  if(res.status === 0 || res.type === 'opaque') throw new Error('Falha de rede/CORS');
  return res;
}

async function komgaLoadSeries(reset){
  const status = $('#komgaStatus');
  const grid = $('#catalogGrid');
  const count = $('#komgaCount');
  const more = $('#btnKomgaMore');
  if(!state.komga.url){
    if(status) status.textContent = 'Configure a URL do Komga e conecte.';
    return;
  }
  if(state.komga.loading) return;
  state.komga.loading = true;
  if(status) status.textContent = 'Carregando catálogo…';
  try{
    if(reset){
      state.komga.page = 0;
      if(grid) grid.innerHTML = '';
    }
    const q = state.komga.search || '';
    let data = null;
    // API nova: POST /api/v1/series/list
    try{
      const body = {};
      if(q) body.fullTextSearch = q;
      const res = await komgaFetch(
        '/api/v1/series/list?page=' + state.komga.page + '&size=30&sort=metadata.titleSort,asc',
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      );
      if(res.ok) data = await res.json();
    }catch(e){ console.warn('series/list', e); }
    // Fallback GET antigo
    if(!data){
      let path = '/api/v1/series?page=' + state.komga.page + '&size=30&sort=metadata.titleSort,asc';
      if(q) path += '&search=' + encodeURIComponent(q);
      const res = await komgaFetch(path);
      if(!res.ok){
        const t = await res.text().catch(()=> '');
        throw new Error('HTTP ' + res.status + (t ? (': ' + t.slice(0,120)) : ''));
      }
      data = await res.json();
    }
    const items = data.content || data || [];
    state.komga.total = data.totalElements != null ? data.totalElements : items.length;
    state.komga.last = data.last === true || (items.length < 30);
    if(count) count.textContent = state.komga.total
      ? (items.length ? 'Mostrando página ' + (state.komga.page+1) + ' · ' + state.komga.total + ' séries' : 'Nenhuma série')
      : (items.length + ' séries');
    if(status) status.textContent = 'Conectado a ' + state.komga.url;
    if(!items.length && state.komga.page === 0){
      if(grid) grid.innerHTML = '<div class="catalog-empty">Nenhuma série encontrada.</div>';
    } else {
      for(const s of items){
        grid.appendChild(komgaCard(s));
      }
    }
    if(more) more.style.display = state.komga.last ? 'none' : '';
  }catch(e){
    console.error(e);
    const msg = (e && e.message) ? e.message : String(e);
    if(status) status.textContent = 'Erro: ' + msg;
    if(msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('CORS') >= 0 || msg.indexOf('NetworkError') >= 0){
      if(status) status.innerHTML = 'Erro de rede/CORS. No Komga, libere o domínio do Balão ou use na mesma rede/ZeroTier.<br><span style="opacity:.85">URL atual: ' + (state.komga.url||'') + '</span>';
    }
    toast('Komga: ' + msg, 5000);
  }finally{
    state.komga.loading = false;
  }
}

function komgaCard(s){
  const meta = s.metadata || {};
  const title = meta.title || s.name || s.id || 'Sem título';
  const books = (s.booksCount != null ? s.booksCount : (s.booksMetadata && s.booksMetadata.booksCount));
  const status = meta.status || '';
  const year = meta.year || '';
  const el = document.createElement('div');
  el.className = 'catalog-card';
  el.innerHTML =
    '<div class="catalog-cover" data-id="' + s.id + '">…</div>' +
    '<div class="catalog-info">' +
      '<div class="catalog-title"></div>' +
      '<div class="catalog-sub"></div>' +
    '</div>';
  el.querySelector('.catalog-title').textContent = title;
  const bits = [];
  if(books != null) bits.push(books + (books === 1 ? ' volume' : ' volumes'));
  if(year) bits.push(String(year));
  if(status) bits.push(String(status));
  el.querySelector('.catalog-sub').textContent = bits.join(' · ');
  // capa async
  const cover = el.querySelector('.catalog-cover');
  komgaLoadCover(s.id, cover);
  return el;
}

function speak(text, onend, opts){
  opts = opts || {};
  if(!state.ttsAvailable){
    if(!state._ttsWarned){ state._ttsWarned=true; toast('Este navegador não tem suporte a voz — mostrando só o texto.', 4000); }
    if(onend) setTimeout(onend, 400);
    return;
  }
  text = (text == null ? '' : String(text)).trim();
  if(!text){
    // sem texto: pausa curta e segue (não parece "pulo instantâneo" sem motivo)
    if(onend) setTimeout(onend, 500);
    return;
  }

  if(!state.voices || !state.voices.length){
    try{ state.voices = speechSynthesis.getVoices() || []; }catch(_){ state.voices = []; }
  }

  // cancela fala anterior só quando pedido (pause/stop/troca manual).
  // No play automático, cancelar entre balões quebra o áudio no Android/iOS.
  if(opts.cancel !== false){
    try{ speechSynthesis.cancel(); }catch(_){}
  }

  let finished = false;
  let resumer = null;
  let safety = null;
  const done = function(){
    if(finished) return;
    finished = true;
    if(safety) clearTimeout(safety);
    if(resumer) clearInterval(resumer);
    if(onend) onend();
  };

  const isMobile = window.innerWidth < 700 || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');
  const delay = (opts.cancel === false) ? 40 : (isMobile ? 320 : 100);

  setTimeout(function(){
    if(finished) return;
    // se o usuário pausou para editar, não fala
    if(state.paused && opts.fromPlay){ done(); return; }

    const u = new SpeechSynthesisUtterance(text);
    const chosenName = localStorage_voice();
    const voices = state.voices || [];
    const v = voices.find(function(x){ return x.name === chosenName; })
      || voices.find(function(x){ return /pt-BR/i.test(x.lang); })
      || voices.find(function(x){ return /^pt/i.test(x.lang); })
      || null;
    if(v) u.voice = v;
    u.lang = v ? v.lang : 'pt-BR';
    const rateEl = $('#rateRange');
    let rate = parseFloat(rateEl ? rateEl.value : '1');
    if(isNaN(rate) || rate < 0.6) rate = 1;
    if(rate > 1.35) rate = 1.35;
    u.rate = rate;
    u.pitch = 1;
    u.volume = 1;

    u.onend = function(){ done(); };
    u.onerror = function(ev){
      const err = (ev && ev.error) ? String(ev.error) : '';
      if(err === 'interrupted' || err === 'canceled' || err === 'cancelled'){
        done();
        return;
      }
      console.error('Erro de fala', err, ev);
      // uma retentativa simples (comum no mobile)
      if(!opts._retried){
        opts._retried = true;
        setTimeout(function(){
          try{
            const u2 = new SpeechSynthesisUtterance(text);
            u2.lang = 'pt-BR';
            u2.rate = 1;
            u2.onend = function(){ done(); };
            u2.onerror = function(){ done(); };
            speechSynthesis.speak(u2);
          }catch(e){ done(); }
        }, 200);
        return;
      }
      if(!state._ttsFailToast){
        state._ttsFailToast = true;
        toast('Áudio bloqueado neste navegador. Toque ▶ de novo ou teste outra voz em ⚙', 4500);
        setTimeout(function(){ state._ttsFailToast = false; }, 8000);
      }
      done();
    };

    try{
      speechSynthesis.speak(u);
      // desbloqueio: alguns Androids ficam em paused
      try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(_){}
    }catch(e){
      console.error(e);
      done();
      return;
    }

    resumer = setInterval(function(){
      if(finished){ clearInterval(resumer); return; }
      try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(_){}
    }, 500);
  }, delay);

  safety = setTimeout(done, Math.max(8000, text.length * 220));
}

/* ==================== PLAY MODE ==================== */
$('#btnPlay').addEventListener('click', ()=>{
  if(state.mode==='play'){ pausePlay(); return; }
  startPlay();
});
function startPlay(){
  const marks = currentMarks();
  if(!marks.length){ toast('Nenhum balão marcado nesta página.'); return; }
  setMode('play');
  state.playQueue = marks.slice();
  const startIdx = (state.playPauseIndex!=null && state.playPauseIndex < marks.length) ? state.playPauseIndex : 0;
  state.playPauseIndex = null;
  if(window.innerWidth >= 700 && !state.readZoomOn){
    resetZoom();
  }
  // Desbloqueia áudio no mobile (precisa nascer do toque do usuário)
  if(state.ttsAvailable){
    try{
      speechSynthesis.cancel();
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0.01;
      warm.rate = 1;
      warm.lang = 'pt-BR';
      speechSynthesis.speak(warm);
      speechSynthesis.cancel();
    }catch(_){}
  }
  // pequeno atraso para o unlock assentar no Android
  setTimeout(function(){ playNext(startIdx); }, 180);
}
function playNext(i){
  if(state.mode!=='play') return;
  const marks = currentMarks();
  if(i>=marks.length){
    if(state.pageIndex < state.comic.pages.length-1){
      state.pageIndex++; renderPage();
      setTimeout(()=>{ setMode('play'); const m2=currentMarks(); if(m2.length) playNext(0); else stopPlay(); }, 450);
    } else { stopPlay(); toast('Fim do quadrinho.'); }
    return;
  }
  const b = marks[i];
  highlightBalloon(b);
  // Zoom no balão ativo (PC e celular) quando a opção 🔍 estiver ligada.
  // Sem zoom: no celular aproxima a página; no PC mantém visão geral.
  const isNarrow = window.innerWidth < 700;
  if(state.readZoomOn){
    showBalloonCard(b);
  } else if(isNarrow){
    hideBalloonCard();
    zoomToBalloon(b, { reserveBottom: 0.15 });
  } else {
    hideBalloonCard();
    if(state.viewTransform && state.viewTransform.scale > 1.05){
      resetZoom();
      state.activeBalloon = b.id;
      drawBalloons();
    }
  }
  speak(b.text || '', ()=>{
    if(state.paused) return; // pausado pra edição — não avança sozinho
    state.playTimer = setTimeout(()=>playNext(i+1), 280);
  }, { cancel: false, fromPlay: true });
}
function pausePlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  const marks = currentMarks();
  const idx = marks.findIndex(x=>x.id===state.activeBalloon);
  state.playPauseIndex = idx>=0 ? idx : 0;
  setMode('read');
}
function stopPlay(){
  clearTimeout(state.playTimer);
  if(state.ttsAvailable) speechSynthesis.cancel();
  state.playPauseIndex = null;
  if(state.mode==='play') setMode('read');
  hideBalloonCard();
}

$('#stage').addEventListener('wheel', (e)=>{
  if(!state.comic) return;
  e.preventDefault();
  const stage = $('#stage').getBoundingClientRect();
  if(e.ctrlKey || e.metaKey){
    const factor = Math.exp(-e.deltaY*0.01);
    const newScale = Math.min(6, Math.max(0.5, state.viewTransform.scale*factor));
    const anchorX = (e.clientX - stage.left - state.viewTransform.tx)/state.viewTransform.scale;
    const anchorY = (e.clientY - stage.top - state.viewTransform.ty)/state.viewTransform.scale;
    state.viewTransform = {
      scale:newScale,
      tx:(e.clientX-stage.left) - anchorX*newScale,
      ty:(e.clientY-stage.top) - anchorY*newScale
    };
  } else {
    state.viewTransform.tx -= e.deltaX;
    state.viewTransform.ty -= e.deltaY;
  }
  applyViewTransform(false);
}, {passive:false});

(function(){

  window.addEventListener('popstate', function(ev){
    try{
      if(state.screen === 'reader'){
        goLibrary({ fromPop: true });

        try{ history.pushState({ app:'balao', screen:'library' }, ''); }catch(_){}
        return;
      }
      if(state.screen === 'catalog'){
        const n = state.catalogNav || { level: 'publishers' };

          catalogBack();

        goLibrary({ fromPop: true });
        try{ history.pushState({ app:'balao', screen:'library' }, ''); }catch(_){}

})();

    fin.addEventListener('change', async (e)=>{
      const f = e.target.files && e.target.files[0];

  const soIn = $('#sagaOrderFileInput');
  if(soIn){

      const files = Array.from((e.target.files) || []);
      e.target.value = '';
      if(!files.length) return;
      let ok = 0, fail = 0;
      for(const f of files){
        try{ await sagaOrdersImportFile(f); ok++; }
        catch(err){ fail++; console.warn(f.name, err); toast('Ordem ' + f.name + ': ' + (err.message||err), 4000); }
      }
      if(ok) toast(ok + ' ordem(ns) importada(s)' + (fail ? (' · ' + fail + ' falha(s)') : ''), 3500);
    });

  const fromD = $('#btnCatalogFromDrive');

  const pushD = $('#btnCatalogPushDrive');
