<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
// Detector de erro visível — escrito em JS bem antigo (ES5) de propósito,
// pra funcionar mesmo em navegadores muito antigos/incomuns e mostrar
// na tela qualquer erro que trave o app, em vez de falhar em silêncio.
window.onerror = function(msg, url, line, col, err) {
  try {
    var el = document.getElementById('js-error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'js-error-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#c0392b;color:#fff;font-family:monospace;font-size:12px;' +
        'padding:10px;white-space:pre-wrap;word-break:break-word;';
      document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
    }
    el.textContent = 'ERRO DE JAVASCRIPT (linha ' + line + '): ' + msg;
  } catch (e) {}
  return false;
};
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balão — quadrinho com voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- tesseract.js removido — OCR agora usa PP-OCRv5 via ONNX -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#15171c;
    --panel:#1f222a;
    --panel-2:#262a33;
    --page-bg:#e8e3d6;
    --accent:#e4402c;
    --accent-dim:#7a2a20;
    --gold:#d9a94a;
    --text:#edeae2;
    --text-dim:#8a8f9c;
    --border:#2b2f38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;
  }
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--border);
    background:var(--panel);flex-shrink:0;z-index:20;
  }
  .brand{
    font-family:'Bangers',cursive;letter-spacing:1px;
    font-size:26px;color:var(--accent);
    text-shadow:2px 2px 0 var(--accent-dim);
  }
  .topbar .sub{color:var(--text-dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .iconbtn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;border-radius:9px;font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{background:var(--accent);border-color:var(--accent);}
  .iconbtn:disabled{opacity:.4;pointer-events:none;}
  .iconbtn.warn{position:relative;}
  .iconbtn.warn::after{
    content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Library screen ---------- */
  #screen-library{flex:1;overflow-y:auto;padding:18px;display:none;}
  #screen-library.active{display:block;}
  .drop{
    border:2px dashed var(--border);border-radius:16px;padding:34px 18px;
    text-align:center;color:var(--text-dim);margin-bottom:22px;
  }
  .drop b{color:var(--text);}
  .btn-primary{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;
  }
  .btn-primary:active{transform:scale(.97);}
  .lib-item{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);margin-bottom:10px;
  }
  .lib-thumb{
    width:44px;height:58px;border-radius:4px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Bangers';
    color:#2b2205;font-size:18px;flex-shrink:0;
  }
  .lib-meta{flex:1;overflow:hidden;}
  .lib-meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-meta .stat{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .lib-del{color:var(--text-dim);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:18px 0 8px;}

  /* ---------- Reader screen ---------- */
  #screen-reader{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;}
  #screen-reader.active{display:flex;}
  #stage{
    flex:1;position:relative;overflow:hidden;background:#0c0d10;
    touch-action:none;
  }
  #pageWrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1);}
  #pageImg{display:block;background:var(--page-bg);user-select:none;-webkit-user-drag:none;touch-action:none;}
  #overlay{position:absolute;inset:0;touch-action:none;}
  .balloon{
    position:absolute;border:1px solid var(--gold);border-radius:8px;
    background:rgba(217,169,74,.10);
    cursor:pointer;z-index:5;pointer-events:auto;
  }
  .balloon.active{border-color:var(--accent);border-width:1.5px;background:rgba(228,64,44,.14);z-index:6;}
  .balloon.dim{opacity:0.5;}
  .balloon .tag{
    position:absolute;top:-7px;left:-7px;width:15px;height:15px;border-radius:50%;
    background:var(--gold);color:#2b2205;font-family:'Bangers';font-size:9px;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .balloon.active .tag{background:var(--accent);color:#fff;}

  .draft-box{
    position:absolute;border:1.5px solid var(--accent);border-radius:6px;
    background:rgba(228,64,44,.12);touch-action:none;cursor:move;
  }
  .draft-handle{
    position:absolute;width:22px;height:22px;margin:-11px;
    background:transparent;touch-action:none;
    display:flex;align-items:center;justify-content:center;
  }
  .draft-handle::after{
    content:'';width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  .draft-handle.nw{left:0;top:0;} .draft-handle.ne{left:100%;top:0;}
  .draft-handle.sw{left:0;top:100%;} .draft-handle.se{left:100%;top:100%;}

  #draftToolbar{
    position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
    display:none;gap:10px;z-index:25;align-items:center;
  }
  #draftToolbar button{
    padding:11px 18px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #draftPos{
    background:rgba(0,0,0,.55);color:var(--text);font-size:12px;padding:6px 10px;border-radius:999px;
    font-family:'Bangers';letter-spacing:.5px;
  }
  #draftPos:empty{display:none;}
  #draftOrderInput{
    width:52px;height:40px;text-align:center;font-size:18px;font-family:'Bangers';
    background:var(--gold);color:#2b2205;border:none;border-radius:10px;
    -moz-appearance:textfield;
  }
  #draftOrderInput::-webkit-outer-spin-button,
  #draftOrderInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  #draftToolbar #btnDraftOk{background:var(--accent);color:#fff;}
  #draftToolbar #btnDraftText{background:var(--gold);color:#2b2205;}
  #draftToolbar #btnDraftCancel{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}

  #balloonCard{
    position:absolute;z-index:22;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.55);border:3px solid var(--gold);
    cursor:pointer;background:var(--page-bg);
    transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;
  }
  #balloonCard img{display:block;width:100%;height:100%;object-fit:contain;background:var(--page-bg);}

  #liteEditBar{
    position:fixed;left:10px;right:10px;bottom:max(76px, env(safe-area-inset-bottom, 0px));
    z-index:40;
    display:none;flex-direction:column;gap:8px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);
    max-height:min(70vh, 560px);
    box-sizing:border-box;
  }
  #liteEditPreview{
    width:100%;max-height:min(32vh, 240px);border-radius:10px;overflow:hidden;
    border:2px solid var(--gold);background:#111;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  #liteEditPreview img{
    max-width:100%;max-height:min(32vh, 240px);width:auto;height:auto;
    object-fit:contain;display:block;
  }
  #liteEditBar .lite-fields{display:flex;flex-direction:column;gap:6px;min-width:0;}
  #liteEditBar .lite-row{display:flex;gap:8px;align-items:center;}
  #liteEditBar textarea{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px;font-size:16px;font-family:inherit;resize:none;
    min-height:64px;max-height:120px;width:100%;box-sizing:border-box;
  }
  #liteEditBar button#liteEditClose{
    background:var(--accent);color:#fff;border:none;border-radius:50%;
    width:44px;height:44px;flex-shrink:0;font-size:16px;font-weight:700;cursor:pointer;
  }
  #liteEditBar .lite-hint{font-size:11px;color:var(--text-dim);}
  #liteEditBar .lite-actions{display:flex;gap:8px;margin-top:2px;}
  #liteEditBar .lite-actions button{
    flex:1;min-height:44px;border:none;border-radius:10px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;padding:10px 8px;
  }
  #liteEditOk{background:var(--accent);color:#fff;}
  #liteEditSpeak{background:var(--panel-2);color:var(--text);border:1px solid var(--border)!important;}
  #liteEditNext{background:var(--panel-2);color:var(--text);border:1px solid var(--border)!important;}
  #editScrim{
    display:none;position:fixed;inset:0;z-index:35;
    background:rgba(0,0,0,.55);pointer-events:none;
  }
  body.mobile-editing #editScrim{display:block;pointer-events:auto;}
  body.mobile-editing .ctrlbar{display:none!important;}
  body.mobile-editing #sheet{display:none!important;}
  body.mobile-editing .balloon .tag{
    font-size:10px!important;min-width:16px!important;height:16px!important;
    line-height:16px!important;padding:0 3px!important;opacity:.8;
  }
  @media (max-width:700px){
    body.mobile-editing #liteEditBar{
      left:0;right:0;bottom:0;border-radius:16px 16px 0 0;
      max-height:none;padding:12px 12px max(12px, env(safe-area-inset-bottom));
      border-left:none;border-right:none;border-bottom:none;
    }
    body.mobile-editing #liteEditPreview{
      max-height:min(38vh, 280px);
    }
    body.mobile-editing #liteEditPreview img{
      max-height:min(38vh, 280px);
    }
    body.mobile-editing #liteEditBar textarea{
      font-size:17px;min-height:72px;max-height:28vh;
    }
    body.mobile-editing #liteEditBar .lite-order-row{display:none;}
    body.mobile-editing #liteEditClose{display:none;}
  }

  .path-line{position:absolute;pointer-events:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;fill:none;opacity:.4;}

  /* ---------- Bottom controls ---------- */
  .ctrlbar{
    display:flex;align-items:center;gap:5px;padding:8px 8px;
    border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;z-index:20;
    overflow-x:auto;
  }
  .ctrlbar .iconbtn{flex-shrink:0;}
  .ctrlbar .spacer{flex:1;min-width:4px;}
  .pagepos{font-size:12px;color:var(--text-dim);min-width:40px;text-align:center;}
  .mode-pill{
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    padding:6px 10px;border-radius:999px;background:var(--panel-2);color:var(--text-dim);
  }
  .mode-pill.marking{background:var(--gold);color:#2b2205;}
  .mode-pill.playing{background:var(--accent);color:#fff;}

  /* ---------- Balloon sheet ---------- */
  #sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    border-top:1px solid var(--border);border-radius:16px 16px 0 0;
    max-height:60%;transform:translateY(105%);transition:transform .25s ease;
    z-index:30;display:flex;flex-direction:column;
  }
  #sheet.open{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .sheet-head b{flex:1;}
  .sheet-body{padding:14px 16px;overflow-y:auto;}
  .balloon-item{
    display:flex;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;
  }
  .balloon-item .num-input{
    width:34px;height:30px;border-radius:8px;background:var(--gold);color:#2b2205;
    font-family:'Bangers';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;
    border:none;text-align:center;padding:0;-moz-appearance:textfield;
  }
  .balloon-item .num-input::-webkit-outer-spin-button,
  .balloon-item .num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .balloon-item .txt{flex:1;font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .balloon-item button{background:none;border:none;color:var(--text-dim);font-size:15px;padding:4px;cursor:pointer;}
  textarea.edit-text{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;
  }
  .row{display:flex;gap:8px;margin-top:10px;}
  .row button{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);font-weight:600;font-size:13px;cursor:pointer;
  }
  .row button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .row button.ocr{background:var(--gold);border-color:var(--gold);color:#2b2205;}
  .row button:disabled{opacity:.5;pointer-events:none;}
  .empty-hint{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 6px;}

  select, input[type=range]{width:100%;}
  .settings-row{margin-bottom:16px;}
  .settings-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:10px;font-size:14px;
  }
  .toast{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:12px;z-index:50;opacity:0;transition:opacity .25s;
    pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .toast.show{opacity:1;}
  #fileInput{display:none;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <button class="iconbtn" id="btnBack" title="Biblioteca" style="display:none">🏠</button>
    <div class="brand">BALÃO</div>
    <div class="sub" id="topSub">leitor de quadrinho com voz</div>
    <button class="iconbtn" id="btnDownload" title="Baixar CBZ com marcações" style="display:none">⬇</button>

  <!-- LIBRARY -->
  <div id="screen-library" class="active">

  <!-- READER -->
  <div id="screen-reader">
    <div id="stage">
      <div id="pageWrap">
        <img id="pageImg" draggable="false">

    <div id="editScrim"></div>
    <div id="liteEditBar" style="display:none">
      <div id="liteEditPreview" title="Recorte do balão"></div>
      <div class="lite-fields">
        <div class="lite-row lite-order-row">
          <label class="lite-hint">Ordem</label>
          <input type="number" id="liteEditOrder" min="1" inputmode="numeric" style="width:52px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 6px;font-size:15px;text-align:center">
          <span class="lite-hint" style="flex:1">Toque outro balão para trocar</span>
          <button id="liteEditClose" title="Salvar e continuar">✕</button>
        </div>
        <textarea id="liteEditText" placeholder="Texto do balão…" rows="3"></textarea>
        <div class="lite-actions">
          <button type="button" id="liteEditSpeak" title="Ouvir este">▶ Ouvir</button>
          <button type="button" id="liteEditNext" title="Salvar e próximo">Próximo</button>
          <button type="button" id="liteEditOk" title="Salvar e voltar">OK</button>
        </div>
      </div>
    </div>

    <div class="ctrlbar">
      <button class="iconbtn" id="btnPrev">‹</button>
      <div class="pagepos" id="pagePos">1/1</div>
      <button class="iconbtn" id="btnNext">›</button>
      <div class="spacer"></div>
      <button class="iconbtn" id="btnFit" title="Ajustar à tela" style="display:none">⤢</button>
      <button class="iconbtn" id="btnDetect" title="Detectar balões automaticamente" style="display:none">🪄</button>
      <button class="iconbtn" id="btnWalk" title="Ajustar tamanhos em sequência" style="display:none">🧭</button>
      <button class="iconbtn" id="btnMark" title="Marcar balões">✎</button>
      <button class="iconbtn" id="btnReadZoom" title="Ampliar balão ao ler">🔍</button>
      <button class="iconbtn" id="btnPlay" title="Reproduzir">▶</button>
      <button class="iconbtn" id="btnList" title="Balões">☰</button>
    </div>

    <div id="sheet">
      <div class="sheet-head">
        <b id="sheetTitle">Balões desta página</b>
        <button class="iconbtn" id="btnCloseSheet">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== STATE ==================== */
const state = {
  screen:'library',
  comic:null,          // {id,name,pages:[{name,url,el}]}
  pageIndex:0,
  marks:{},            // {pageIndex:[{id,x,y,w,h,order,text}]}
  mode:'read',          // read | mark | play
  activeBalloon:null,
  playQueue:[],
  playTimer:null,
  playPauseIndex:null,
  drawing:null,
  voices:[],
  viewTransform:{scale:1,tx:0,ty:0},
  draft:null,
  walk:null,
  storageOk:null,
  readZoomOn:false,
  paused:false,
  pausedBalloon:null,
  lastDetectDiag:null,
};

const $ = s => document.querySelector(s);
const toastEl = $('#toast');
function toast(msg,ms=2000){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
function toastProgress(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
}

/* ==================== STORAGE HELPERS ==================== */
// Usa window.storage quando disponível (dentro do Claude); fora daqui, usa localStorage do navegador normalmente.
async function storeGet(key){
  if(window.storage){
    try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem('balao:'+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  if(window.storage){
    try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
    catch(e){ console.error('storage set fail',e); return false; }
  }
  try{ localStorage.setItem('balao:'+key, JSON.stringify(val)); return true; }
  catch(e){ console.error('localStorage set fail',e); return false; }
}
async function checkStorageAvailable(){
  try{
    const ok = await storeSet('balao-teste-storage', {ok:true, t:Date.now()});
    const back = await storeGet('balao-teste-storage');
    state.storageOk = !!(ok && back && back.ok===true);
  }catch(e){
    state.storageOk = false;
    console.warn('Salvamento automático indisponível:', e);
  }
  updateStorageBadge();
  if(!state.storageOk){
    toast('⚠ Salvamento automático indisponível nesta sessão. Depois de marcar, toque em ⬇ pra baixar o CBZ — senão as marcações se perdem ao fechar.', 8000);
  }
}
function updateStorageBadge(){
  const b = $('#btnDownload');
  if(!b) return;
  b.classList.toggle('warn', state.storageOk===false);
}
function slugify(name){
  return name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'comic';
}

/* ==================== IDB arquivos CBZ ==================== */
const IDB_NAME = 'balao-cbz-files';
const IDB_STORE = 'files';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function idbPutComic(id, file){
  try{
    const buf = await file.arrayBuffer();
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({
        name: file.name,
        type: file.type || 'application/vnd.comicbook+zip',
        buf,
        savedAt: Date.now()
      }, id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){
    console.warn('IDB put comic fail', e);
    return false;
  }
}

async function idbGetComic(id){
  try{
    const db = await idbOpen();
    const rec = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(id);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
    db.close();
    if(!rec || !rec.buf) return null;
    return new File([rec.buf], rec.name || (id+'.cbz'), {
      type: rec.type || 'application/vnd.comicbook+zip'
    });
  }catch(e){
    console.warn('IDB get comic fail', e);
    return null;
  }
}

async function idbDelComic(id){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn('IDB del comic fail', e); }
}

function marksFileNameForComic(comicName){
  // Ex.: "Blackest Night #1.cbz" -> "Blackest Night #1.xml" (mesmo nome da HQ)
  const base = (comicName || 'hq').replace(/\.(cbz|zip|cbr)$/i, '');
  const safe = base.replace(/[\\/:*?"<>|]/g, '_').trim() || 'hq';
  return safe + '.xml';
}
function findMarksEntry(zip, comicName){
  const preferred = marksFileNameForComic(comicName);
  if(zip.file(preferred)) return preferred;
  // legado
  if(zip.file('balao-marks.xml')) return 'balao-marks.xml';
  const keys = Object.keys(zip.files).filter(n => {
    if(zip.files[n].dir) return false;
    const base = n.replace(/^.*\//,'').toLowerCase();
    return base.endsWith('-marks.xml') || (base.endsWith('.xml') && base !== 'comicinfo.xml');
  });
  if(keys.length){
    keys.sort((a,b)=>a.length-b.length);
    return keys[0];
  }
  return preferred;
}

function xmlFromMarks(marks){
  const doc = document.implementation.createDocument('', '', null);
  const root = doc.createElement('BalaoData'); root.setAttribute('version','1');
  Object.keys(marks).forEach(pageIdx=>{
    const arr = marks[pageIdx]||[];
    if(!arr.length) return;
    const pageEl = doc.createElement('Page'); pageEl.setAttribute('index', pageIdx);
    arr.forEach(b=>{
      const bEl = doc.createElement('Balloon');
      bEl.setAttribute('id', b.id); bEl.setAttribute('order', b.order);
      bEl.setAttribute('x', b.x); bEl.setAttribute('y', b.y);
      bEl.setAttribute('w', b.w); bEl.setAttribute('h', b.h);
      const textEl = doc.createElement('Text'); textEl.textContent = b.text||'';
      bEl.appendChild(textEl);
      pageEl.appendChild(bEl);
    });
    root.appendChild(pageEl);
  });
  doc.appendChild(root);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(doc);
}
function marksFromXml(xmlText){
  const marks={};
  try{
    const doc = new DOMParser().parseFromString(xmlText,'application/xml');
    if(doc.querySelector('parsererror')) return marks;
    doc.querySelectorAll('Page').forEach(pageEl=>{
      const idx = pageEl.getAttribute('index');
      const arr=[];
      pageEl.querySelectorAll('Balloon').forEach(bEl=>{
        arr.push({
          id: bEl.getAttribute('id') || ('b'+Math.random().toString(36).slice(2)),
          order: parseInt(bEl.getAttribute('order'),10)||1,
          x: parseFloat(bEl.getAttribute('x')), y: parseFloat(bEl.getAttribute('y')),
          w: parseFloat(bEl.getAttribute('w')), h: parseFloat(bEl.getAttribute('h')),
          text: (function(){ var te = bEl.querySelector('Text'); return te ? te.textContent : ''; })()
        });
      });
      marks[idx]=arr;
    });
  }catch(e){ console.error('parse marks xml failed', e); }
  return marks;
}
function updateZipXml(){
  if(state.comic && state.comic.zip){
    const name = state.comic.marksEntry || marksFileNameForComic(state.comic.name);
    state.comic.marksEntry = name;
    state.comic.zip.file(name, xmlFromMarks(state.marks));
    // remove legado se gravamos com nome da HQ (evita dois XMLs divergentes)
    if(name !== 'balao-marks.xml' && state.comic.zip.file('balao-marks.xml')){
      state.comic.zip.remove('balao-marks.xml');
    }
  }
}

async function openCbz(file){
  toast('Abrindo quadrinho…', 4000);
  try{
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files)
      .filter(f=>!f.dir && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
    if(!entries.length){ toast('Nenhuma imagem encontrada no arquivo.'); return; }
    const pages=[];
    for(let i=0;i<entries.length;i++){
      const entry = entries[i];
      toastProgress(`Extraindo página ${i+1}/${entries.length}`);
      const blob = await entry.async('blob');
      pages.push({name:entry.name, url:URL.createObjectURL(blob)});
    }
    const id = slugify(file.name);
    const marksEntry = findMarksEntry(zip, file.name);
    state.comic = {id, name:file.name, pages, zip, marksEntry};
    const embedded = zip.file(marksEntry);
    if(embedded){
      const xmlText = await embedded.async('string');
      state.marks = marksFromXml(xmlText);
      toast('Marcações: ' + marksEntry);
    } else {
      state.marks = (await storeGet('marks:'+id)) || {};
      if(Object.keys(state.marks).length) toast('Marcações restauradas da nuvem do app.');
    }
    state.pageIndex = 0;
    state.readZoomOn = !!(await storeGet('readzoom:'+id));
    await registerComic(id, file.name, pages.length);
    // guarda o CBZ no IndexedDB para reabrir da biblioteca sem seletor
    await idbPutComic(id, file);
    goReader();
  }catch(err){
    console.error(err);
    toast('Erro ao abrir: ' + (err && err.message ? err.message : err), 6000);
  }
}

async function downloadUpdatedCbz(){
  if(!state.comic || !state.comic.zip){ toast('Abra um quadrinho primeiro.'); return; }
  const btn = $('#btnDownload');
  if(btn.disabled) return;
  btn.disabled = true;
  updateZipXml();
  toastProgress('Gerando arquivo… 0%');
  try{
    const blob = await state.comic.zip.generateAsync(
      {type:'blob', compression:'DEFLATE', compressionOptions:{level:4}},
      (metadata)=>{ toastProgress(`Gerando arquivo… ${Math.round(metadata.percent)}%`); }
    );
    const baseName = state.comic.name.replace(/\.(cbz|zip)$/i,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = baseName + '-balao.cbz';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CBZ com marcações baixado ✓');
  }catch(e){
    console.error(e); toast('Erro ao gerar: ' + (e && e.message ? e.message : e), 6000);
  }finally{
    btn.disabled = false;
  }
}

/* ==================== PAGE RENDER ==================== */
function currentMarks(){
  const arr = state.marks[state.pageIndex] || [];
  return arr.slice().sort((a,b)=>a.order-b.order);
}
function fitImageToStage(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  if(!img.naturalWidth || !stage.width || !stage.height) return;
  const scale = Math.min(stage.width/img.naturalWidth, stage.height/img.naturalHeight);
  img.style.width = Math.round(img.naturalWidth*scale)+'px';
  img.style.height = Math.round(img.naturalHeight*scale)+'px';
}
function renderPage(){
  clearDraft();
  hideBalloonCard();
  closeLiteEdit(false);
  const p = state.comic.pages[state.pageIndex];
  const img = $('#pageImg');
  img.onload = ()=>{ fitImageToStage(); resetZoom(); drawBalloons(); };
  img.src = p.url;
  $('#pagePos').textContent = `${state.pageIndex+1}/${state.comic.pages.length}`;
  setMode(state.mode==='play' ? state.mode : 'read');
  $('#btnReadZoom').classList.toggle('on', state.readZoomOn);
  closeSheet();
}
function drawBalloons(){
  const overlay = $('#overlay');
  overlay.innerHTML='';
  const marks = currentMarks();
  const svgNS='http://www.w3.org/2000/svg';
  if(marks.length>1 && state.mode!=='play'){
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
    svg.style.position='absolute'; svg.style.inset='0'; svg.style.pointerEvents='none';
    let d='';
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    marks.forEach((b,i)=>{
      const cx=((b.x+b.w/2)*100).toFixed(2), cy=((b.y+b.h/2)*100).toFixed(2);
      d += (i===0?'M':'L') + cx + ' ' + cy + ' ';
    });
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d',d); path.setAttribute('class','path-line');
    path.setAttribute('vector-effect','non-scaling-stroke');
    svg.appendChild(path); overlay.appendChild(svg);
  }
  marks.forEach(b=>{
    if(state.draft && state.draft.editingId===b.id) return;
    const div = document.createElement('div');
    const isActive = state.activeBalloon===b.id;
    div.className='balloon'+(isActive?' active':'')+((state.mode==='play'||state.paused)&&!isActive?' dim':'');
    div.style.left=(b.x*100)+'%'; div.style.top=(b.y*100)+'%';
    div.style.width=(b.w*100)+'%'; div.style.height=(b.h*100)+'%';
    div.innerHTML = `<div class="tag">${b.order}</div>`;
    const tap = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); onBalloonTap(b); };
    div.addEventListener('click', tap);
    // pointerup ajuda no desktop quando o overlay competia pelo evento
    div.addEventListener('pointerup', (ev)=>{
      if(ev.button!==undefined && ev.button!==0) return;
      if(state.mode==='mark') return; // no mark, arraste/criação usa outros handlers
      // evita double-fire com click
      if(div._tapLock) return;
      div._tapLock = true;
      setTimeout(()=>{ div._tapLock = false; }, 350);
      tap(ev);
    });
    overlay.appendChild(div);
  });
  if(state.draft) renderDraft();
}

/* ==================== ZOOM ==================== */
function applyViewTransform(animated){
  const wrap = $('#pageWrap');
  wrap.style.transition = animated ? '' : 'none';
  wrap.style.transformOrigin='0 0';
  const {scale,tx,ty} = state.viewTransform;
  wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
function resetZoom(){
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const w = img.offsetWidth||0, h = img.offsetHeight||0;
  const tx = Math.max(0, (stage.width-w)/2);
  const ty = Math.max(0, (stage.height-h)/2);
  state.viewTransform = {scale:1, tx, ty};
  applyViewTransform(true);
  state.activeBalloon=null;
}
function zoomToBalloon(b, opts){
  opts = opts || {};
  const stage = $('#stage').getBoundingClientRect();
  const img = $('#pageImg');
  const dispW = img.offsetWidth, dispH = img.offsetHeight;
  const px=(b.x+b.w/2)*dispW, py=(b.y+b.h/2)*dispH;
  const reserve = opts.reserveBottom || 0;
  const visibleH = stage.height*(1-reserve);
  const scale = Math.min(4, Math.max(1.3, Math.min((stage.width*0.86)/(b.w*dispW), (visibleH*0.8)/(b.h*dispH))));
  const tx = stage.width/2 - px*scale;
  const ty = visibleH/2 - py*scale;
  state.viewTransform = {scale,tx,ty};
  applyViewTransform(true);
  state.activeBalloon=b.id;
  drawBalloons();
}
function highlightBalloon(b){
  state.activeBalloon = b.id;
  drawBalloons();
}

/* ==================== CARD AMPLIADO (zoom ao ler) ==================== */
function showBalloonCard(b){
  if(!state.readZoomOn || !state.comic) return;
  const img = $('#pageImg');
  const stage = $('#stage').getBoundingClientRect();
  const rect = img.getBoundingClientRect();

  // recorte em boa resolução a partir da imagem original (nao da tela pequena)
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = b.w*nw, bh = b.h*nh;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(bw));
  canvas.height = Math.max(1,Math.round(bh));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);

  // posicao/tamanho na tela: centralizado sobre o proprio balao, ampliado
  const screenX = rect.left - stage.left + b.x*rect.width;
  const screenY = rect.top - stage.top + b.y*rect.height;
  const screenW = b.w*rect.width;
  const screenH = b.h*rect.height;
  // valores anteriores (caso precise voltar): scale 1.6–2.3, alvo 190, largura 0.72, altura 0.46
  const scale = Math.min(1.7, Math.max(1.0, 143/Math.max(1,screenH)));
  let cardW = screenW*scale, cardH = screenH*scale;
  cardW = Math.min(cardW, stage.width*0.54);
  cardH = Math.min(cardH, stage.height*0.35);
  let cx = screenX + screenW/2, cy = screenY + screenH/2;
  let left = cx - cardW/2, top = cy - cardH/2;
  // mantem dentro da area visivel do stage
  left = Math.max(6, Math.min(left, stage.width - cardW - 6));
  top = Math.max(6, Math.min(top, stage.height - cardH - 6));

  const card = $('#balloonCard');
  card.style.left = left+'px';
  card.style.top = top+'px';
  card.style.width = cardW+'px';
  card.style.height = cardH+'px';
  card.innerHTML = '';
  const outImg = document.createElement('img');
  outImg.src = canvas.toDataURL('image/png');
  card.appendChild(outImg);
  card.style.display = 'block';
  card.onclick = ()=> pauseAndEditWhileReading(b);
  state.cardBalloonId = b.id;
}
function hideBalloonCard(){
  const card = $('#balloonCard');
  if(card){ card.style.display='none'; card.onclick=null; }
  state.cardBalloonId = null;
}

/* ==================== EDIÇÃO RÁPIDA DURANTE A LEITURA ==================== */
function cropBalloonToDataUrl(b){
  const img = $('#pageImg');
  if(!img || !img.naturalWidth) return '';
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const bx = b.x*nw, by = b.y*nh, bw = Math.max(1,b.w*nw), bh = Math.max(1,b.h*nh);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bw); canvas.height = Math.round(bh);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}
function isMobileEditLayout(){
  return window.innerWidth < 700;
}
function positionLiteEditBar(){
  const bar = $('#liteEditBar');
  if(!bar || bar.style.display==='none') return;
  const vv = window.visualViewport;
  const mobile = isMobileEditLayout();
  if(vv){
    // altura visivel real (acima do teclado)
    const visibleBottom = vv.height + vv.offsetTop;
    const fromBottom = Math.max(0, window.innerHeight - visibleBottom);
    if(mobile){
      bar.style.bottom = fromBottom + 'px';
      // limita altura da barra ao viewport visivel
      const maxH = Math.max(200, vv.height - 8);
      bar.style.maxHeight = maxH + 'px';
    } else {
      bar.style.bottom = (12 + fromBottom) + 'px';
      bar.style.maxHeight = '';
    }
  } else {
    bar.style.bottom = mobile ? '0px' : '76px';
  }
}
function applyLiteEditTextAndOrder(b){
  if(!b) return;
  b.text = $('#liteEditText').value;
  const orderInput = $('#liteEditOrder');
  if(orderInput){
    let newOrder = parseInt(orderInput.value, 10);
    if(!isNaN(newOrder) && newOrder !== b.order){
      const arr = state.marks[state.pageIndex] || [];
      const others = arr.filter(x=>x.id!==b.id).sort((a,c)=>a.order-c.order);
      newOrder = Math.max(1, Math.min(newOrder, others.length+1));
      others.splice(newOrder-1, 0, b);
      others.forEach((x,i)=>{ x.order = i+1; });
    }
  }
}
function pauseAndEditWhileReading(b){
  if(state.ttsAvailable) speechSynthesis.cancel();
  clearTimeout(state.playTimer);
  state.paused = true;
  state.pausedBalloon = b;
  if(state.mode==='play'){
    const marks = currentMarks();
    const playingId = state.activeBalloon;
    const playingIdx = marks.findIndex(x=>x.id===playingId);
    if(state.playPauseIndex==null){
      state.playPauseIndex = playingIdx>=0 ? playingIdx : marks.findIndex(x=>x.id===b.id);
    }
  }
  hideBalloonCard();
  resetZoom();
  state.activeBalloon = b.id;
  drawBalloons();

  const prev = $('#liteEditPreview');
  if(prev){
    const url = cropBalloonToDataUrl(b);
    prev.innerHTML = url ? '<img alt="balão" src="'+url+'">' : '';
  }
  const orderInput = $('#liteEditOrder');
  if(orderInput){
    const marks = currentMarks();
    orderInput.min = 1;
    orderInput.max = Math.max(1, marks.length);
    orderInput.value = b.order;
  }
  $('#liteEditText').value = b.text || '';
  const bar = $('#liteEditBar');
  bar.style.display = 'flex';
  if(isMobileEditLayout()){
    document.body.classList.add('mobile-editing');
  } else {
    document.body.classList.remove('mobile-editing');
  }
  positionLiteEditBar();
  setTimeout(()=> {
    positionLiteEditBar();
    try{ $('#liteEditText').focus({ preventScroll:true }); }catch(e){ try{ $('#liteEditText').focus(); }catch(_){} }
  }, 180);
}

async function closeLiteEdit(resume, opts){
  opts = opts || {};
  const bar = $('#liteEditBar');
  if(bar) bar.style.display = 'none';
  document.body.classList.remove('mobile-editing');
  if(bar){ bar.style.bottom = ''; bar.style.maxHeight = ''; }
  if(!state.paused) return;
  const b = state.pausedBalloon;
  state.paused = false;
  state.pausedBalloon = null;
  if(!b) return;
  if(resume===false) return;
  applyLiteEditTextAndOrder(b);
  await saveMarks();
  drawBalloons();
  if(opts.next){
    const marks = currentMarks().slice().sort((a,c)=>a.order-c.order);
    const idx = marks.findIndex(x=>x.id===b.id);
    const next = marks[idx+1];
    if(next){
      // permanece em pausa de play se estava em play
      if(state.mode==='play' && state.playPauseIndex!=null){
        state.playPauseIndex = idx+1;
      }
      pauseAndEditWhileReading(next);
      return;
    }
  }
  if(state.mode==='play'){
    const marks = currentMarks();
    let idx = state.playPauseIndex;

  } else {

}

/* ==================== DRAWING NEW BALLOON + PINCH ZOOM/PAN ==================== */
const overlayEl = $('#overlay');
const pointers = new Map();
let pinchStart = null;
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

function normFromEvent(e){
  const rect = $('#pageImg').getBoundingClientRect();
  return { x: Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width)),
           y: Math.min(1,Math.max(0,(e.clientY-rect.top)/rect.height)) };
}

overlayEl.addEventListener('pointerdown', (e)=>{
  // Clique em balão / caixa de ajuste: NÃO capturar o ponteiro.
  // No desktop o setPointerCapture no overlay impedia o click do balão (edição no play quebrava).
  if(e.target.closest('.balloon') || e.target.closest('.draft-box') || e.target.closest('#draftBox')){
    return;
  }
  overlayEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStart = { dist:dist(pts[0],pts[1]), mid:mid(pts[0],pts[1]),
      scale:state.viewTransform.scale, tx:state.viewTransform.tx, ty:state.viewTransform.ty };
    return;
  }
  if(pointers.size!==1) return;
  // Fora de balão, em read/play: só limpa destaque se não estiver editando
  if(state.mode!=='mark'){
    if(state.paused) return;
    if(state.activeBalloon){ clearHighlight(); }
    return;
  }
  if(state.draft || state.walk) return;
  const p = normFromEvent(e);
  const w=0.18, h=0.09;
  const x = Math.min(Math.max(0,p.x-w/2),1-w), y = Math.min(Math.max(0,p.y-h/2),1-h);
  placeBalloonInstant(x,y,w,h);
});
overlayEl.addEventListener('pointermove', (e)=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinchStart){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const m = mid(pts[0],pts[1]);
    const stage = $('#stage').getBoundingClientRect();
    const newScale = Math.min(6, Math.max(0.8, pinchStart.scale * (d/pinchStart.dist)));
    const anchorX = (pinchStart.mid.x - stage.left - pinchStart.tx) / pinchStart.scale;
    const anchorY = (pinchStart.mid.y - stage.top - pinchStart.ty) / pinchStart.scale;
    state.viewTransform = {
      scale: newScale,
      tx: (m.x - stage.left) - anchorX*newScale,
      ty: (m.y - stage.top) - anchorY*newScale
    };
    applyViewTransform(false);
  }
});
overlayEl.addEventListener('pointerup', (e)=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=null; });
overlayEl.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStart=null; });

function renderDraft(){
  let box = document.getElementById('draftBox');
  if(!box){
    box = document.createElement('div');

    ['nw','ne','sw','se'].forEach(corner=>{
      const h=document.createElement('div');
      h.className='draft-handle '+corner;
      attachHandleDrag(h,corner);
      box.appendChild(h);
    });
    attachBoxMove(box);
    overlayEl.appendChild(box);
  }
  positionDraftBox();
  showDraftToolbar(true);
  if(state.walk){
    updateWalkToolbar();
  } else {
    $('#btnDraftOk').textContent = state.draft.editingId ? '✓ Salvar posição' : '✓ Usar este balão';
    $('#btnDraftText').style.display = state.draft.editingId ? 'inline-block' : 'none';
    $('#btnDraftCancel').textContent = '✕ Cancelar';
    $('#draftPos').textContent = '';
    const orderInput = $('#draftOrderInput');
    if(state.draft.editingId){
      const marks = currentMarks();
      const b = marks.find(x=>x.id===state.draft.editingId);
      orderInput.style.display = 'inline-block';
      orderInput.min = 1; orderInput.max = marks.length;
      if(document.activeElement !== orderInput){
        orderInput.value = b ? b.order : '';
      }
    } else {
      orderInput.style.display = 'none';
    }
  }
}
function positionDraftBox(){
  const box = document.getElementById('draftBox'); if(!box || !state.draft) return;
  const d = state.draft;
  box.style.left=(d.x*100)+'%'; box.style.top=(d.y*100)+'%';
  box.style.width=(d.w*100)+'%'; box.style.height=(d.h*100)+'%';
}
function attachHandleDrag(handle, corner){
  handle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const editingId = state.draft.editingId;
    const fixed = {
      x: corner.includes('w') ? state.draft.x+state.draft.w : state.draft.x,
      y: corner.includes('n') ? state.draft.y+state.draft.h : state.draft.y
    };
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const nx=Math.min(p.x,fixed.x), fx=Math.max(p.x,fixed.x);
      const ny=Math.min(p.y,fixed.y), fy=Math.max(p.y,fixed.y);
      state.draft = { x:nx, y:ny, w:Math.max(0.02,fx-nx), h:Math.max(0.02,fy-ny), editingId };
      positionDraftBox();
    };
    const onUp = ()=>{
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
}
function attachBoxMove(box){
  box.addEventListener('pointerdown', (e)=>{
    if(e.target!==box) return;
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    const start = normFromEvent(e);
    const orig = Object.assign({}, state.draft);
    const onMove = (ev)=>{
      const p = normFromEvent(ev);
      const dx=p.x-start.x, dy=p.y-start.y;
      state.draft = {
        x: Math.min(Math.max(0, orig.x+dx), 1-orig.w),
        y: Math.min(Math.max(0, orig.y+dy), 1-orig.h),
        w: orig.w, h: orig.h, editingId: orig.editingId
      };
      positionDraftBox();
    };
    const onUp = ()=>{
      box.removeEventListener('pointermove', onMove);
      box.removeEventListener('pointerup', onUp);
      box.removeEventListener('pointercancel', onUp);
    };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
    box.addEventListener('pointercancel', onUp);
  });
}

const MODEL_INPUT_SIZE = 1024;
let yoloSessionPromise = null;
let yoloModelBuffer = null;

// Release no GitHub (arquivo ~50 MB — não cabe no repo normal)
const YOLO_MODEL_URLS = [
  'https://github.com/SrM0us3/HQ_Audio/releases/download/v1/comic-speech-bubble-detector.onnx',
];
const YOLO_MODEL_SHA256 = '36b452f54f341fc8cc99b45717c4df76da45fadba60da89e4536895433c7d96a';

function pickModelFile(){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    toast('Selecione comic-speech-bubble-detector.onnx no seu PC…', 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo detector (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    input.click();
  });
}

async function sha256Hex(buffer){
  if(!window.crypto || !crypto.subtle) return null;
  const hash = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function fetchYoloModelBuffer(){
  for(const url of YOLO_MODEL_URLS){
    try{
      toastProgress('Baixando detector de balões (~50 MB)…');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok){
        console.warn('fetch YOLO status', res.status, url);
        continue;
      }
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 1_000_000){
        console.warn('arquivo YOLO muito pequeno', buf.byteLength);
        continue;
      }
      toastProgress('Verificando integridade do modelo…');
      const hex = await sha256Hex(buf);
      if(hex && hex !== YOLO_MODEL_SHA256){
        console.warn('SHA-256 não confere', hex);
        toast('Aviso: hash do detector diferente do esperado. Continuando mesmo assim…', 4000);
      }
      toastProgress('Detector baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      // CORS costuma cair aqui em alguns ambientes
      console.warn('fetch YOLO falhou', url, e);
    }
  }
  return null;
}

function getYoloSession(){
  if(yoloSessionPromise) return yoloSessionPromise;

  yoloSessionPromise = (async ()=>{
    try{
      setupOrtWasm();
      let buffer = yoloModelBuffer;
      if(!buffer){
        buffer = await fetchYoloModelBuffer();
      }
      if(!buffer){
        // Fallback: seletor de arquivo (precisa de clique do usuário)
        buffer = await pickModelFile();
      }
      yoloModelBuffer = buffer;
      toastProgress('Compilando detector de balões (pode levar uns segundos)…');
      await new Promise(r => setTimeout(r, 40));
      const session = await ort.InferenceSession.create(buffer, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'disabled'
      });
      toast('Detector de balões pronto ✓', 2500);
      return session;
    }catch(err){
      yoloSessionPromise = null;
      throw err;
    }
  })();

  return yoloSessionPromise;
}

function preprocessForYolo(img){
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const SZ = MODEL_INPUT_SIZE; // 1024 — tem que ser múltiplo de 32
  if(!W0 || !H0) throw new Error('Imagem da página sem dimensões (naturalWidth=0)');
  const scale = Math.min(SZ / W0, SZ / H0);
  const nw = Math.max(1, Math.round(W0 * scale));
  const nh = Math.max(1, Math.round(H0 * scale));
  const canvas = document.createElement('canvas');
  canvas.width = SZ;
  canvas.height = SZ;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  // letterbox cinza YOLOv8 padrão
  ctx.fillStyle = 'rgb(114,114,114)';
  ctx.fillRect(0, 0, SZ, SZ);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, W0, H0, 0, 0, nw, nh);
  const imgData = ctx.getImageData(0, 0, SZ, SZ).data;
  const plane = SZ * SZ;
  const chw = new Float32Array(3 * plane);
  for(let p = 0; p < plane; p++){
    chw[p]            = imgData[p * 4] / 255;
    chw[plane + p]    = imgData[p * 4 + 1] / 255;
    chw[2 * plane + p]= imgData[p * 4 + 2] / 255;
  }
  const tensor = new ort.Tensor('float32', chw, [1, 3, SZ, SZ]);
  return { tensor, scale };
}

function nmsBoxes(items, iouTh){
  items.sort((a,b)=> b.conf-a.conf);
  const keep = [];
  const used = new Array(items.length).fill(false);
  for(let i=0;i<items.length;i++){
    if(used[i]) continue;
    const a = items[i]; keep.push(a);
    for(let j=i+1;j<items.length;j++){
      if(used[j]) continue;
      const b = items[j];
      const xx0=Math.max(a.x0,b.x0), yy0=Math.max(a.y0,b.y0);
      const xx1=Math.min(a.x1,b.x1), yy1=Math.min(a.y1,b.y1);
      const inter = Math.max(0,xx1-xx0)*Math.max(0,yy1-yy0);
      const areaA=(a.x1-a.x0)*(a.y1-a.y0), areaB=(b.x1-b.x0)*(b.y1-b.y0);
      const iou = inter/(areaA+areaB-inter);
      if(iou > iouTh) used[j]=true;
    }
  }
  return keep;
}

/**
 * Ordena balões como em HQ (aproximando quadros).
 * 1) Procura faixa vazia horizontal (entre faixas de balões) → lê cima, depois baixo.
 * 2) Senão, faixa vazia vertical → lê esquerda, depois direita (ou RTL se rtl=true).
 * 3) Senão, ordena por linhas de leitura (y) e dentro da linha por x.
 */
function orderBalloonsLikeComics(cands, rtl){
  if(!cands || !cands.length) return [];
  if(cands.length === 1) return cands.slice();

  function bboxOf(items){
    let x0=1, y0=1, x1=0, y1=0;
    items.forEach(c=>{
      x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y);
      x1 = Math.max(x1, c.x + c.w); y1 = Math.max(y1, c.y + c.h);
    });
    return { x0, y0, x1, y1, w:x1-x0, h:y1-y0 };
  }

  // Maior "buraco" no eixo: projeta intervalos e acha gap entre eles
  function largestGap(items, axis){
    // axis 'y' → gaps horizontais (separando faixas de cima/baixo)
    // axis 'x' → gaps verticais (separando colunas esq/dir)
    const intervals = items.map(c=>{
      if(axis === 'y') return [c.y, c.y + c.h];
      return [c.x, c.x + c.w];
    }).sort((a,b)=> a[0]-b[0]);

    // merge overlapping
    const merged = [intervals[0].slice()];
    for(let i=1;i<intervals.length;i++){
      const last = merged[merged.length-1];
      if(intervals[i][0] <= last[1] + 0.002){
        last[1] = Math.max(last[1], intervals[i][1]);
      } else {
        merged.push(intervals[i].slice());
      }
    }
    if(merged.length < 2) return null;

    let best = null;
    for(let i=0;i<merged.length-1;i++){
      const gap0 = merged[i][1];
      const gap1 = merged[i+1][0];
      const gap = gap1 - gap0;
      if(gap <= 0.008) continue; // gap mínimo ~0.8% da página
      if(!best || gap > best.gap){
        best = { gap, cut: (gap0 + gap1) / 2, beforeEnd: gap0, afterStart: gap1 };
      }
    }
    return best;
  }

  function splitByCut(items, axis, cut){
    const a = [], b = [];
    items.forEach(c=>{
      const mid = axis === 'y' ? (c.y + c.h/2) : (c.x + c.w/2);
      (mid < cut ? a : b).push(c);
    });
    // exige que os dois lados tenham algo
    if(!a.length || !b.length) return null;
    return [a, b];
  }

  function rowOrder(items){
    // linhas por sobreposição em Y, depois X (ou RTL)
    const sorted = items.slice().sort((a,b)=> a.y - b.y);
    const rows = [];
    sorted.forEach(c=>{
      let placed = false;
      const cy0 = c.y, cy1 = c.y + c.h;
      for(const row of rows){
        const overlap = Math.min(row.y1, cy1) - Math.max(row.y0, cy0);
        const minH = Math.min(c.h, row.y1 - row.y0);
        if(minH > 0 && overlap > minH * 0.25){
          row.items.push(c);
          row.y0 = Math.min(row.y0, cy0);
          row.y1 = Math.max(row.y1, cy1);
          placed = true;
          break;
        }
      }
      if(!placed) rows.push({ y0: cy0, y1: cy1, items: [c] });
    });
    rows.sort((a,b)=> (a.y0+a.y1) - (b.y0+b.y1));
    const out = [];
    rows.forEach(row=>{
      row.items.sort((a,b)=> rtl ? (b.xc - a.xc) : (a.xc - b.xc));
      row.items.forEach(it=> out.push(it));
    });
    return out;
  }

  function recurse(items, depth){
    if(items.length <= 1) return items.slice();
    if(depth > 8) return rowOrder(items);

    const bb = bboxOf(items);
    // preferir corte horizontal (faixas de quadros empilhados) se o gap for significativo
    const gapY = largestGap(items, 'y');
    const gapX = largestGap(items, 'x');

    // gap relativo à altura/largura do grupo
    const scoreY = gapY ? gapY.gap / Math.max(bb.h, 0.05) : 0;
    const scoreX = gapX ? gapX.gap / Math.max(bb.w, 0.05) : 0;

    // limiar: gap precisa ser razoável em relação ao grupo
    const MIN_REL = 0.04;

    if(scoreY >= MIN_REL && scoreY >= scoreX && gapY){
      const parts = splitByCut(items, 'y', gapY.cut);
      if(parts){
        return recurse(parts[0], depth+1).concat(recurse(parts[1], depth+1));
      }
    }
    if(scoreX >= MIN_REL && gapX){
      const parts = splitByCut(items, 'x', gapX.cut);
      if(parts){
        // LTR: esquerda depois direita; RTL: invertido
        const first = rtl ? parts[1] : parts[0];
        const second = rtl ? parts[0] : parts[1];
        return recurse(first, depth+1).concat(recurse(second, depth+1));
      }
    }
    return rowOrder(items);
  }

  return recurse(cands, 0);
}

async function detectBalloons(){
  if(!state.comic) return;
  const btn = $('#btnDetect');
  btn.disabled = true; const oldTxt = btn.textContent; btn.textContent='⏳';
  try{
    if(!yoloSessionPromise && !yoloModelBuffer){ toast('Carregando detector de balões…', 3000); }
    toastProgress('Carregando modelo de detecção de balões (só na primeira vez nesta sessão)…');
    const session = await getYoloSession();
    toastProgress('Detectando balões na página…');
    await new Promise(r=>setTimeout(r, 50)); // garante que a mensagem pinte na tela antes do cálculo pesado

    const img = $('#pageImg');
    const {tensor, scale} = preprocessForYolo(img);
    const inputName = session.inputNames[0] || 'images';
    console.log('YOLO input', inputName, tensor.dims, 'outputs', session.outputNames);
    let results;
    try{
      results = await session.run({ [inputName]: tensor });
    }catch(runErr){
      console.error('YOLO run failed', runErr);
      // se o modelo baixado estiver corrompido/otimizado demais, permite tentar de novo via arquivo local
      yoloSessionPromise = null;
      yoloModelBuffer = null;
      throw new Error('Falha na detecção (Concat/shape). Tente de novo — se repetir, use o .onnx local. Detalhe: ' + (runErr && runErr.message ? runErr.message : runErr));
    }
    const outputName = session.outputNames[0];
    const out = results[outputName]; // dims: [1,6,N]
    const dims = out.dims; // [1, 6, N]
    const numAttrs = dims[1], numAnchors = dims[2];
    const data = out.data;

    const CONF_TH = 0.25;
    const candidates = [];
    for(let i=0;i<numAnchors;i++){
      const cx = data[0*numAnchors+i];
      const cy = data[1*numAnchors+i];
      const w_ = data[2*numAnchors+i];
      const h_ = data[3*numAnchors+i];
      let bestCls=0, bestScore=-1;
      for(let c=4;c<numAttrs;c++){
        const s = data[c*numAnchors+i];
        if(s>bestScore){ bestScore=s; bestCls=c-4; }
      }
      if(bestScore < CONF_TH) continue;
      candidates.push({
        x0:(cx-w_/2), y0:(cy-h_/2), x1:(cx+w_/2), y1:(cy+h_/2),
        conf:bestScore, cls:bestCls
      });
    }
    const kept = nmsBoxes(candidates, 0.45);

    const W = img.naturalWidth, H = img.naturalHeight;
    const SHRINK = 0.06; // encolhe a caixa pra dentro, evitando pegar a borda/rabinho do balão
    const cands = kept.map(b=>{
      // volta da escala do modelo (1024, com letterbox) pra fração normalizada da página
      let x0 = Math.max(0, b.x0/scale), y0 = Math.max(0, b.y0/scale);
      let x1 = Math.min(W, b.x1/scale), y1 = Math.min(H, b.y1/scale);
      const insetX = (x1-x0)*SHRINK, insetY = (y1-y0)*SHRINK;
      x0 += insetX; y0 += insetY; x1 -= insetX; y1 -= insetY;
      return {
        x:x0/W, y:y0/H, w:(x1-x0)/W, h:(y1-y0)/H,
        y0:y0/H, y1:y1/H, yc:(y0+y1)/2/H, xc:(x0+x1)/2/W
      };
    });

    if(!cands.length){
      toast('O modelo não encontrou nenhum balão nesta página.', 5000);
      return;
    }

    // Ordem de leitura estilo HQ: partição espacial (cortes por "calhas" entre grupos).
    // Aproxima a ordem por quadros sem modelo de painéis: divide a página onde há
    // faixa vazia grande (horizontal = cima/baixo; vertical = esq/dir), depois LTR nas folhas.
    const ordered = orderBalloonsLikeComics(cands, false);

    const arr = state.marks[state.pageIndex] || (state.marks[state.pageIndex]=[]);
    let order = arr.length ? Math.max.apply(null, arr.map(x=>x.order)) : 0;
    ordered.forEach(c=>{
      order++;
      arr.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6), x:c.x, y:c.y, w:c.w, h:c.h, order, text:''});
    });
    await saveMarks();
    drawBalloons();
    state.lastDetectDiag = null;
    state._yoloRetried = false;
    toast(`${ordered.length} balão(ões) detectado(s) pelo modelo — revise na lista (☰).`, 5500);
    openSheetList();
  }catch(e){
    console.error('detect error', e);
    const msg = (e && e.message) ? e.message : String(e);
    // retry automático 1x (modelo baixado às vezes falha no 1º run no WASM)
    if(!state._yoloRetried && /Concat|shape|26388560|OrtRun/i.test(msg)){
      state._yoloRetried = true;
      yoloSessionPromise = null;
      // mantém yoloModelBuffer se já baixou — só recompila sessão
      toast('Detectando de novo…', 2500);
      btn.disabled = false; btn.textContent = oldTxt;
      setTimeout(()=> detectBalloons(), 400);
      return;
    }
    state._yoloRetried = false;
    toast('Erro ao detectar: '+msg, 6000);
  }finally{
    btn.disabled=false; btn.textContent=oldTxt;
  }
}

function onBalloonTap(b){
  if(state.mode==='mark'){ startAdjustBalloon(b); return; }
  // Já está editando: troca o balão alvo (salva o texto atual antes)
  if(state.paused && state.pausedBalloon){
    if(state.pausedBalloon.id === b.id) return;
    applyLiteEditTextAndOrder(state.pausedBalloon);
    saveMarks();
    pauseAndEditWhileReading(b);
    return;
  }
  // Durante a leitura (play): editar qualquer balão
  if(state.mode==='play'){
    pauseAndEditWhileReading(b);
    return;
  }
  highlightBalloon(b);
  if(state.readZoomOn) showBalloonCard(b);
  speak(b.text || '(sem texto — use OCR ou digite manualmente)');
}
function startAdjustBalloon(b){
  if(state.draft) return;
  state.draft = { x:b.x, y:b.y, w:b.w, h:b.h, editingId:b.id };
  drawBalloons();
}

    };
    bulkRow.querySelector('#btnBulkOcr').onclick = async ()=>{
      // garante modelo carregado com gesto do usuário antes do loop
      if(!ppocrSessionPromise && !ppocrModelBuffer){

        if(!ok) return;

async function reorderPageBalloons(){
  const arr = state.marks[state.pageIndex] || [];
  if(arr.length < 2){ toast('Precisa de pelo menos 2 balões.'); return; }
  const cands = arr.map(b=>({
    x:b.x, y:b.y, w:b.w, h:b.h,
    y0:b.y, y1:b.y+b.h, yc:b.y+b.h/2, xc:b.x+b.w/2,
    _ref:b
  }));
  const ordered = orderBalloonsLikeComics(cands, false);
  ordered.forEach((c,i)=>{ c._ref.order = i+1; });
  await saveMarks();
  drawBalloons();
  openSheetList();
  toast('Ordem de leitura recalculada (geometria de HQ).', 3500);
}

async function clearPageBalloons(){
  const marks = currentMarks();
  if(!marks.length) return;
  if(!confirm(`Apagar todos os ${marks.length} balões marcados nesta página? Essa ação não pode ser desfeita.`)) return;
  state.marks[state.pageIndex] = [];
  state.lastDetectDiag = null;
  await saveMarks();
  drawBalloons();
  openSheetList();
}
async function bulkOcr(marks){
  const pending = marks.filter(b=>!b.text);
  if(!pending.length){ toast('Todos os balões desta página já têm texto.'); return; }
  const btn = $('#btnBulkOcr');
  for(let i=0;i<pending.length;i++){
    if(btn) btn.textContent = `Transcrevendo ${i+1}/${pending.length}…`;
    const text = await ocrBalloon(pending[i]);
    if(text){ pending[i].text = text; await saveMarks(); }
  }
  toast('OCR em lote concluído — revise os textos abaixo.', 4500);
  openSheetList();
}
async function setOrder(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder)){ openSheetList(); return; }
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks(); drawBalloons(); openSheetList();
}
async function setOrderQuick(b, newOrderRaw){
  const marks = currentMarks();
  let newOrder = parseInt(newOrderRaw,10);
  if(isNaN(newOrder) || newOrder===b.order) return;
  newOrder = Math.max(1, Math.min(marks.length, newOrder));
  const others = marks.filter(x=>x.id!==b.id);
  others.splice(newOrder-1, 0, b);
  others.forEach((x,i)=>{ x.order = i+1; });
  await saveMarks();
  drawBalloons();
  toast(`Balão movido pra posição ${newOrder}`, 1500);
}
async function deleteBalloon(b){
  state.marks[state.pageIndex] = (state.marks[state.pageIndex]||[]).filter(x=>x.id!==b.id);
  await saveMarks(); resetZoom(); drawBalloons(); openSheetList();
}

let ppocrLoading = false;

// Caminhos relativos (mesmo diretório do HTML no GitHub Pages) e nomes comuns
const PPOCR_MODEL_CANDIDATES = [
  'latin_PP-OCRv5_rec_mobile_web.onnx',
  './latin_PP-OCRv5_rec_mobile_web.onnx',
  'models/latin_PP-OCRv5_rec_mobile_web.onnx',
  'latin_PP-OCRv5_rec_mobile.onnx',
  './latin_PP-OCRv5_rec_mobile.onnx',
  'models/latin_PP-OCRv5_rec_mobile.onnx'
];

function setupOrtWasm(){
  if(typeof ort === 'undefined' || !ort.env || !ort.env.wasm) return;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  try { ort.env.wasm.numThreads = 1; } catch(e){}
  try { ort.env.wasm.proxy = false; } catch(e){}
  try { ort.env.wasm.simd = true; } catch(e){}
}

function pickOnnxFile(hint){
  return new Promise((resolve, reject)=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.onnx,application/octet-stream';
    if(hint) toast(hint, 4000);
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file){ reject(new Error('Nenhum arquivo selecionado')); return; }
      toastProgress('Lendo ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)…');
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
      reader.readAsArrayBuffer(file);
    };
    // NÃO usar focus/cancel — isso rejeitava a Promise no meio da leitura
    input.click();
  });
}

async function fetchPpocrModelBuffer(){
  for(const url of PPOCR_MODEL_CANDIDATES){
    try{
      toastProgress('Baixando modelo OCR: ' + url + ' …');
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      if(buf.byteLength < 100000) continue; // muito pequeno, não é o modelo
      toastProgress('Modelo baixado (' + (buf.byteLength/1024/1024).toFixed(1) + ' MB). Compilando…');
      return buf;
    }catch(e){
      console.warn('fetch modelo falhou', url, e);
    }
  }
  return null;
}

async function createPpocrSessionFromBuffer(buffer){
  setupOrtWasm();
  toastProgress('Compilando modelo OCR no WASM (15–60s na 1ª vez, aguarde)…');
  await new Promise(r => setTimeout(r, 50));
  try{
    const session = await ort.InferenceSession.create(buffer, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'basic'
    });
    return session;
  }catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    console.error('InferenceSession.create falhou', e);
    throw new Error('Falha ao compilar modelo ONNX: ' + msg + ' — use o arquivo latin_PP-OCRv5_rec_mobile_web.onnx');
  }
}

function getPpocrSession(){
  if(ppocrSessionPromise) return ppocrSessionPromise;

  ppocrSessionPromise = (async ()=>{
    try{
      let buffer = ppocrModelBuffer;
      if(!buffer){
        buffer = await fetchPpocrModelBuffer();
      }
      if(!buffer){
        // fallback: file picker (só funciona com clique do usuário)
        buffer = await pickOnnxFile('Modelo não encontrado no site. Selecione latin_PP-OCRv5_rec_mobile_web.onnx');
      }
      ppocrModelBuffer = buffer;
      const session = await createPpocrSessionFromBuffer(buffer);
      toast('Modelo OCR pronto ✓', 2500);
      return session;
    }catch(err){
      ppocrSessionPromise = null;
      throw err;
    }
  })();

  return ppocrSessionPromise;
}

async function preloadPpocrModel(){
  if(ppocrLoading){
    toast('Já está carregando o modelo… aguarde.', 3000);
    return false;
  }
  if(ppocrSessionPromise){
    try{
      await ppocrSessionPromise;
      toast('Modelo OCR já está pronto ✓', 2000);
      return true;
    }catch(e){
      ppocrSessionPromise = null;
    }
  }
  ppocrLoading = true;
  try{
    await getPpocrSession();
    return true;
  }catch(e){
    console.error('preload OCR', e);
    const msg = (e && e.message) ? e.message : String(e);
    toast('Não carregou o modelo: ' + msg, 8000);
    return false;
  }finally{
    ppocrLoading = false;
  }
}

/** Preprocess single text-line crop → CHW float32 [-1,1], height=48
 *  mode: 'normal' | 'invert' | 'contrast'
 */
function preprocessLineForPpocr(canvasSrc, sx, sy, sw, sh, mode){
  mode = mode || 'normal';
  const H = PPOCR_REC_H;
  let targetW = Math.round(sw * (H / Math.max(1, sh)));
  if(targetW < 16) targetW = 16;
  if(targetW > PPOCR_MAX_W) targetW = PPOCR_MAX_W;
  const padW = Math.ceil(targetW / 8) * 8;

  const canvas = document.createElement('canvas');
  canvas.width = padW;
  canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, padW, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvasSrc, sx, sy, sw, sh, 0, 0, targetW, H);

  const imgData = ctx.getImageData(0, 0, padW, H);
  const d = imgData.data;
  for(let i = 0; i < d.length; i += 4){
    let r = d[i], g = d[i+1], b = d[i+2];
    let gray = 0.299*r + 0.587*g + 0.114*b;
    if(mode === 'invert'){
      gray = 255 - gray;
    } else if(mode === 'contrast'){
      // estica contraste + leve binarização suave
      gray = gray < 128 ? gray * 0.55 : Math.min(255, gray * 1.25 + 20);
    }
    d[i] = d[i+1] = d[i+2] = gray;
  }
  ctx.putImageData(imgData, 0, 0);

  const out = ctx.getImageData(0, 0, padW, H).data;
  const chw = new Float32Array(3 * H * padW);
  const plane = H * padW;
  for(let p = 0; p < plane; p++){
    const v = out[p*4] / 255;
    const n = (v - 0.5) / 0.5;
    chw[p] = n;
    chw[plane + p] = n;
    chw[2*plane + p] = n;
  }
  return new ort.Tensor('float32', chw, [1, 3, H, padW]);
}

/** CTC greedy decode — blank=0, chars=1..len(dict), space=len+1 */
function decodePpocrOutput(data, dims){
  // Aceita [1,T,C] ou [1,C,T]
  let T, C, layout;
  if(dims.length === 3){
    if(dims[2] === 504 || dims[2] === PPOCR_DICT.length + 2){
      T = dims[1]; C = dims[2]; layout = 'btc';
    } else if(dims[1] === 504 || dims[1] === PPOCR_DICT.length + 2){
      C = dims[1]; T = dims[2]; layout = 'bct';
    } else {
      T = dims[1]; C = dims[2]; layout = 'btc';
    }
  } else {
    console.warn('OCR dims inesperados', dims);
    return '';
  }

  const chars = [];
  let prev = -1;
  const topIdx = [];
  for(let t = 0; t < T; t++){
    let bestIdx = 0, bestVal = -Infinity;
    for(let c = 0; c < C; c++){
      const v = layout === 'btc' ? data[t * C + c] : data[c * T + t];
      if(v > bestVal){ bestVal = v; bestIdx = c; }
    }
    if(t < 12) topIdx.push(bestIdx);
    if(bestIdx === prev) continue;
    if(bestIdx === PPOCR_BLANK){ prev = bestIdx; continue; }
    if(bestIdx === PPOCR_SPACE_IDX){
      chars.push(' ');
    } else if(bestIdx >= 1 && bestIdx <= PPOCR_DICT.length){
      chars.push(PPOCR_DICT[bestIdx - 1]);
    }
    prev = bestIdx;
  }
  const text = chars.join('').replace(/\s+/g, ' ').trim();
  if(!text){
    console.warn('OCR vazio. dims=', dims, 'layout=', layout, 'topIdx=', topIdx);
  } else {
    console.log('OCR ok:', text, 'dims=', dims);
  }
  return text;
}

/** Divide o recorte do balão em linhas de texto (projeção horizontal) */
/** Aperta o recorte na tinta real (ajuda balões redondos). */
function tightInkCrop(canvas, x, y, w, h){
  try{
    x = Math.max(0, Math.floor(x));
    y = Math.max(0, Math.floor(y));
    w = Math.max(1, Math.floor(w));
    h = Math.max(1, Math.floor(h));
    if(x + w > canvas.width) w = canvas.width - x;
    if(y + h > canvas.height) h = canvas.height - y;
    if(w < 8 || h < 8) return { x, y, w, h };

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(x, y, w, h);
    const d = id.data;
    let sum = 0, n = w * h;
    for(let i = 0; i < d.length; i += 4){
      sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    }
    const mean = sum / n;
    const darkInk = mean >= 130;
    const thr = darkInk ? (mean - 25) : (mean + 25);

    let minX = w, minY = h, maxX = 0, maxY = 0, count = 0;
    for(let row = 0; row < h; row++){
      for(let col = 0; col < w; col++){
        const i = (row * w + col) * 4;
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        const isInk = darkInk ? (g < thr) : (g > thr);
        if(isInk){
          count++;
          if(col < minX) minX = col;
          if(col > maxX) maxX = col;
          if(row < minY) minY = row;
          if(row > maxY) maxY = row;
        }
      }
    }
    if(count < n * 0.005) return { x, y, w, h };

    const padX = Math.max(2, Math.floor((maxX - minX) * 0.05));
    const padY = Math.max(2, Math.floor((maxY - minY) * 0.05));
    let nx = Math.max(0, minX - padX);
    let ny = Math.max(0, minY - padY);
    let nx2 = Math.min(w - 1, maxX + padX);
    let ny2 = Math.min(h - 1, maxY + padY);
    let nw = nx2 - nx + 1;
    let nh = ny2 - ny + 1;
    const areaRatio = (nw * nh) / (w * h);
    if(areaRatio < 0.15){
      // muito agressivo: usa pelo menos 50% do centro
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      nw = Math.max(nw, Math.floor(w * 0.5));
      nh = Math.max(nh, Math.floor(h * 0.5));
      nx = Math.max(0, Math.floor(cx - nw / 2));
      ny = Math.max(0, Math.floor(cy - nh / 2));
      nw = Math.min(w - nx, nw);
      nh = Math.min(h - ny, nh);
    }
    if(nw < 6 || nh < 6) return { x, y, w, h };
    return { x: x + nx, y: y + ny, w: nw, h: nh };
  }catch(e){
    return { x, y, w, h };
  }
}

function splitBalloonLines(imgEl, bx, by, bw, bh){
  const nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
  const sx = Math.max(0, Math.round(bx * nw));
  const sy = Math.max(0, Math.round(by * nh));
  const sw = Math.max(1, Math.round(bw * nw));
  const sh = Math.max(1, Math.round(bh * nh));

  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  tctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
  const idata = tctx.getImageData(0, 0, sw, sh);
  const d = idata.data;

  const proj = new Float32Array(sh);
  for(let y = 0; y < sh; y++){
    let dark = 0;
    for(let x = 0; x < sw; x++){
      const i = (y * sw + x) * 4;
      const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(gray < 180) dark++;
    }
    proj[y] = dark / sw;
  }
  let maxP = 0;
  for(let y = 0; y < sh; y++) if(proj[y] > maxP) maxP = proj[y];
  const th = Math.max(0.015, maxP * 0.12);

  const ranges = [];
  let start = -1;
  for(let y = 0; y < sh; y++){
    if(proj[y] > th){
      if(start < 0) start = y;
    } else if(start >= 0){
      if(y - start >= 2) ranges.push([start, y]);
      start = -1;
    }
  }
  if(start >= 0 && sh - start >= 2) ranges.push([start, sh]);

  const merged = [];
  for(let i = 0; i < ranges.length; i++){
    if(!merged.length){ merged.push(ranges[i]); continue; }
    const last = merged[merged.length - 1];
    if(ranges[i][0] - last[1] < 5) last[1] = ranges[i][1];
    else merged.push(ranges[i]);
  }

  // sempre inclui o crop inteiro como fallback no final da lista de tentativas
  const lineCrops = merged.map(([a, b])=>{
    const pa = Math.max(0, a - 2);
    const pb = Math.min(sh, b + 2);
    return { canvas: tmp, x: 0, y: pa, w: sw, h: Math.max(1, pb - pa) };
  }).filter(r => r.h >= 4);

  return {
    full: { canvas: tmp, x: 0, y: 0, w: sw, h: sh },
    lines: lineCrops.length ? lineCrops : [{ canvas: tmp, x: 0, y: 0, w: sw, h: sh }]
  };
}

/* ==================== Pós-correção PT (confusões típicas de HQ) ==================== */
const OCR_CONFUSIONS = [
  ['f', 't'], ['t', 'f'],
  ['F', 'T'], ['T', 'F'],
  ['n', 'u'], ['u', 'n'],
  ['rn', 'm'], ['m', 'rn'],
  ['cl', 'd'], ['vv', 'w'],
  ['0', 'o'], ['1', 'l'], ['1', 'i'],
];
